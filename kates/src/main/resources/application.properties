# Kafka cluster (Strimzi krafter)
kates.kafka.bootstrap-servers=krafter-kafka-bootstrap.kafka.svc:9092
kates.kafka.client-rack=${KATES_KAFKA_CLIENT_RACK:}
kates.kafka.dlq-topic=kates-dlq

# Trogdor Coordinator
kates.trogdor.coordinator-url=http://trogdor-coordinator:8889

# Benchmark engine (native | trogdor)
kates.engine.default-backend=native

# External integrations
kates.webhooks.default-url=
kates.reports.default-directory=/tmp/kates-reports

# Internal Event Bus
mp.messaging.outgoing.test-events-out.connector=smallrye-kafka
mp.messaging.outgoing.test-events-out.topic=kates-test-events
mp.messaging.incoming.test-events-in.connector=smallrye-kafka
mp.messaging.incoming.test-events-in.topic=kates-test-events

# Global test defaults (fallback for any test type)
kates.defaults.replication-factor=3
kates.defaults.partitions=3
kates.defaults.min-insync-replicas=2
kates.defaults.acks=all
kates.defaults.batch-size=65536
kates.defaults.linger-ms=5
kates.defaults.compression-type=lz4
kates.defaults.record-size=1024
kates.defaults.num-records=1000000
kates.defaults.throughput=-1
kates.defaults.duration-ms=600000
kates.defaults.num-producers=1
kates.defaults.num-consumers=1

# Per-type overrides: STRESS — high concurrency, large batches
kates.tests.stress.partitions=6
kates.tests.stress.batch-size=131072
kates.tests.stress.linger-ms=10
kates.tests.stress.num-records=5000000
kates.tests.stress.duration-ms=900000
kates.tests.stress.num-producers=3

# Per-type overrides: SPIKE — burst traffic, low-latency settings
kates.tests.spike.acks=1
kates.tests.spike.batch-size=131072
kates.tests.spike.linger-ms=0
kates.tests.spike.compression-type=none
kates.tests.spike.num-records=2000000
kates.tests.spike.duration-ms=300000

# Per-type overrides: ENDURANCE — long-running, rate-limited
kates.tests.endurance.num-records=10000000
kates.tests.endurance.throughput=5000
kates.tests.endurance.duration-ms=3600000

# Per-type overrides: VOLUME — large records, high batch size
kates.tests.volume.partitions=6
kates.tests.volume.batch-size=262144
kates.tests.volume.linger-ms=50
kates.tests.volume.record-size=10240
kates.tests.volume.num-records=2000000

# Per-type overrides: CAPACITY — max parallelism
kates.tests.capacity.partitions=12
kates.tests.capacity.batch-size=131072
kates.tests.capacity.linger-ms=10
kates.tests.capacity.num-records=10000000
kates.tests.capacity.duration-ms=1200000
kates.tests.capacity.num-producers=5

# Per-type overrides: ROUND_TRIP — latency-focused
kates.tests.roundtrip.batch-size=16384
kates.tests.roundtrip.linger-ms=0
kates.tests.roundtrip.compression-type=none
kates.tests.roundtrip.num-records=500000
kates.tests.roundtrip.throughput=10000

# REST Client config
quarkus.rest-client."com.bmscomp.kates.trogdor.TrogdorClient".url=${kates.trogdor.coordinator-url}
quarkus.rest-client."com.bmscomp.kates.trogdor.TrogdorClient".connect-timeout=5000
quarkus.rest-client."com.bmscomp.kates.trogdor.TrogdorClient".read-timeout=30000

# HTTP
quarkus.http.port=8080
# CORS is intentionally NOT enabled. To enable it, set quarkus.http.cors=true
# AND quarkus.http.cors.origins to an explicit origin list — never '*'.
quarkus.http.enable-compression=true

# API Security
kates.api.security-enabled=true
# No default on purpose: startup fails (SecurityStartupValidator) when security
# is enabled and the key is unset or 'changeme'. Inject KATES_API_KEY from a
# Kubernetes Secret (see k8s/secret.yaml.example).
kates.api.key=${KATES_API_KEY:}

# Webhook SSRF policy (see WebhookUrlValidator). Loopback targets are only
# legitimate for local development and tests.
kates.webhooks.allowed-schemes=http,https
kates.webhooks.block-private-addresses=false
%dev.kates.webhooks.allow-loopback=true
%test.kates.webhooks.allow-loopback=true

# Health probes
# Kafka reachability is refreshed on a schedule and read from cache by the
# readiness probe, so a kubelet check never blocks on a broker round-trip.
kates.health.kafka-refresh-interval=10s
# Kafka does NOT gate readiness by default: most endpoints work without a
# broker, and flapping the pod out of the Service on a transient blip took down
# the whole API for no benefit. Set to true to gate on it anyway (then it only
# fails after kafka-failure-threshold consecutive failed refreshes).
kates.health.readiness.require-kafka=false
kates.health.readiness.kafka-failure-threshold=3
# No broker in unit tests — the refresh would only log noise.
%test.kates.health.kafka-refresh-interval=off
#
# quarkus-messaging-kafka registers its OWN startup, readiness and liveness
# contributors for every mp.messaging channel, and they aggregate into
# /q/health/started, /q/health/ready and /q/health/live alongside the checks
# above. When the broker is unreachable those channels report DOWN, so
# /q/health/live goes DOWN and the kubelet restarts the pod — repeatedly. That
# silently overrode every policy decision in this file: the pod died in a
# restart loop for a condition the checks above deliberately treat as non-fatal.
#
# For a Kafka TESTING tool an unreachable broker is a first-class state to
# report, never a reason to be killed — the target cluster is the thing under
# test, and it is routinely down, partitioned, or mid-chaos-experiment. So the
# connector's health reporting is off and the checks above are the only voters;
# Kafka status stays visible in their response data (kafka,
# kafkaConsecutiveFailures) and via kates' own metrics.
#
# Both halves are set on purpose. The first is build-time (it decides whether
# the contributors are registered at all, so it needs a rebuilt image); the
# per-channel attributes are runtime, so a running pod can be rescued via env
# (MP_MESSAGING_*_HEALTH_ENABLED) without waiting for a new image.
quarkus.messaging.health.enabled=false
mp.messaging.outgoing.test-events-out.health-enabled=false
mp.messaging.incoming.test-events-in.health-enabled=false

# Disruption orphan recovery (faults abandoned by a killed pod)
kates.chaos.orphan-recovery.enabled=true
kates.chaos.orphan-recovery.min-age-sec=900
%test.kates.chaos.orphan-recovery.enabled=false
%dev.kates.chaos.orphan-recovery.enabled=false

# OpenAPI
quarkus.smallrye-openapi.info-title=Kates API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Kafka Advanced Testing \& Engineering Suite

# Micrometer → Prometheus
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.netty.enabled=false
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true

# OpenTelemetry Distributed Tracing
quarkus.otel.enabled=true
quarkus.otel.service.name=kates
quarkus.otel.exporter.otlp.endpoint=http://jaeger-collector.monitoring.svc:4317
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.otel.traces.sampler=parentbased_traceidratio

# gRPC server (unified with REST on port 8080)
quarkus.grpc.server.use-separate-server=false
quarkus.grpc.server.port=9000
# Reflection exposes full service schemas — dev convenience only.
quarkus.grpc.server.enable-reflection-service=false
%dev.quarkus.grpc.server.enable-reflection-service=true
%dev.quarkus.grpc.server.port=9000
%test.quarkus.grpc.server.port=0
quarkus.otel.traces.sampler.arg=0.1
%dev.quarkus.otel.traces.sampler.arg=1.0
%dev.quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
quarkus.otel.metrics.exporter=none
quarkus.otel.logs.exporter=none
# Environment tag on traces. Overridable per deployment; dev/test no longer
# get mislabeled "production" (the previous unconditional default).
quarkus.otel.resource.attributes=deployment.environment=${KATES_DEPLOYMENT_ENVIRONMENT:production}
%dev.quarkus.otel.resource.attributes=deployment.environment=development
%test.quarkus.otel.resource.attributes=deployment.environment=test

# Structured JSON logging
quarkus.log.console.json.enabled=true
quarkus.log.console.json.additional-field."service".value=kates
quarkus.log.console.json.additional-field."version".value=1.0.0

# Production log levels
quarkus.log.level=INFO
quarkus.log.category."com.bmscomp.kates".level=INFO
quarkus.log.category."org.apache.kafka".level=WARN
quarkus.log.category."org.apache.kafka.clients.admin.AdminClientConfig".level=WARN
quarkus.log.category."org.apache.kafka.clients.producer.ProducerConfig".level=WARN
quarkus.log.category."org.apache.kafka.clients.consumer.ConsumerConfig".level=WARN
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."org.flywaydb".level=WARN
quarkus.log.category."io.quarkus".level=INFO
quarkus.log.category."io.quarkus.opentelemetry".level=WARN
quarkus.log.category."io.smallrye".level=WARN
quarkus.log.category."io.strimzi".level=WARN
quarkus.log.category."io.fabric8.kubernetes".level=WARN

# Dev profile — verbose for application, normal for Kafka
%dev.quarkus.log.console.json.enabled=false
%dev.quarkus.log.category."com.bmscomp.kates".level=DEBUG
%dev.quarkus.log.category."org.apache.kafka".level=INFO
%dev.kates.api.security-enabled=false
%test.kates.api.security-enabled=false

# Chaos coordination (noop | litmus-crd)
kates.chaos.provider=litmus-crd

# Kubernetes client (auto-configured when running in-cluster)
quarkus.kubernetes-client.trust-certs=true
quarkus.kubernetes-client.devservices.enabled=false

# PostgreSQL datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://postgres.kates.svc:5432/kates
# Local-dev defaults only. In Kubernetes these are overridden by the
# QUARKUS_DATASOURCE_USERNAME / QUARKUS_DATASOURCE_PASSWORD environment
# variables injected from a Secret (see k8s/secret.yaml.example) — never
# from a ConfigMap.
quarkus.datasource.username=${KATES_DB_USERNAME:kates}
quarkus.datasource.password=${KATES_DB_PASSWORD:kates}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.idle-removal-interval=PT5M
quarkus.datasource.jdbc.max-lifetime=PT30M
quarkus.datasource.jdbc.telemetry=false

# Hibernate ORM
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.cache."com.bmscomp.kates.persistence.TestRunEntity".expiration.max-idle=300

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# Prometheus server (for disruption metrics capture)
kates.prometheus.url=http://prometheus.monitoring.svc:9090

# Engine timeout (mark stuck tests as FAILED after this duration)
kates.engine.max-duration-ms=1800000

# How many test runs may execute at once. A run holds its slot for its whole
# lifetime, so this is a real cap on load against the target cluster; requests
# beyond it get 429 with Retry-After rather than being queued.
kates.engine.max-concurrent-tests=3

# How often the reconciler drives active runs to their terminal state without
# waiting for a client to poll. Shorter means fresher status and more DB reads.
kates.engine.reconcile-interval=5s

# Transactional outbox
# How often published events are drained to Kafka.
kates.outbox.poll-interval=2s
# Publish attempts before an event is moved to outbox_dead_letters. At the poll
# interval above this is roughly ten minutes of retrying a transient broker
# problem; without a limit one unpublishable row is retried forever and holds a
# slot in every poll window.
kates.outbox.max-attempts=10
# How often the consumer-side idempotency ledger (processed_events) is pruned,
# and how long its rows are kept. Keys older than the window cannot match a
# redelivery that is still in flight.
kates.outbox.retention-sweep-interval=1h
kates.outbox.processed-events-retention-days=7

# The Kafka cluster chaos acts on. namespace/cluster is also the key the
# disruption concurrency lease is taken against, so only one plan at a time runs
# against a given cluster.
kates.chaos.kafka.namespace=kafka
kates.chaos.kafka.cluster=krafter
kates.chaos.kafka.label=strimzi.io/component-type=kafka

# Test data cleanup (archive runs older than this many days)
kates.cleanup.retention-days=90

# Auto-rollback safety thresholds
kates.chaos.rollback.max-recovery-sec=300
kates.chaos.rollback.min-isr-depth=1
kates.chaos.rollback.max-lag-spike=1000000

# Kafka security (PLAINTEXT | SASL_PLAINTEXT | SSL | SASL_SSL)
kates.kafka.security.protocol=SASL_PLAINTEXT
kates.kafka.sasl.mechanism=SCRAM-SHA-512
kates.kafka.sasl.username=kates-backend
kates.kafka.sasl.password=${KATES_KAFKA_SASL_PASSWORD:}

# Native image: include compression native libraries (zstd, lz4, snappy)
# db/migration/*.conf: Flyway script config sidecars (V20 runs outside a
# transaction). Migration .sql files are registered by the Flyway extension;
# the .conf sidecars are not, so a native build would silently lose the setting
# and CREATE INDEX CONCURRENTLY would fail inside a transaction.
# playbooks/*.yaml: DisruptionPlaybookCatalog reads them from the classpath at
# startup. A native image ships only the resources matched here, so without this
# the catalog is silently EMPTY in native mode — the playbook endpoints 404 while
# the JVM build works perfectly.
quarkus.native.resources.includes=linux/**/*.so,darwin/**/*.dylib,org/xerial/snappy/native/**,net/jpountz/**,com/github/luben/zstd/**,db/migration/*.conf,playbooks/*.yaml

# Native image: defer classes with static native-lib loading / SecureRandom init to runtime
quarkus.native.additional-build-args=--initialize-at-run-time=org.apache.kafka.common.security\\,com.github.luben.zstd\\,net.jpountz.lz4.LZ4JNI\\,net.jpountz.lz4.LZ4Factory\\,net.jpountz.xxhash.XXHashJNI\\,net.jpountz.xxhash.XXHashFactory\\,org.xerial.snappy.Snappy\\,org.xerial.snappy.SnappyNative\\,org.xerial.snappy.SnappyInputStream\\,org.xerial.snappy.SnappyOutputStream

# Fault Tolerance — configurable timeouts (ms)
# TopicService
com.bmscomp.kates.service.TopicService/createTopic/Timeout/value=35000
com.bmscomp.kates.service.TopicService/deleteTopic/Timeout/value=35000
com.bmscomp.kates.service.TopicService/alterTopicConfig/Timeout/value=35000
com.bmscomp.kates.service.TopicService/listTopics/Timeout/value=35000
com.bmscomp.kates.service.TopicService/describeTopics/Timeout/value=35000
com.bmscomp.kates.service.TopicService/describeTopicDetail/Timeout/value=35000

# ClusterHealthService
com.bmscomp.kates.service.ClusterHealthService/describeCluster/Timeout/value=35000
com.bmscomp.kates.service.ClusterHealthService/isReachable/Timeout/value=10000
com.bmscomp.kates.service.ClusterHealthService/describeBrokerConfigs/Timeout/value=35000
com.bmscomp.kates.service.ClusterHealthService/captureSnapshot/Timeout/value=35000
com.bmscomp.kates.service.ClusterHealthService/clusterHealthCheck/Timeout/value=60000

# ConsumerGroupService
com.bmscomp.kates.service.ConsumerGroupService/listConsumerGroups/Timeout/value=35000
com.bmscomp.kates.service.ConsumerGroupService/describeConsumerGroup/Timeout/value=35000
quarkus.kafka.devservices.image-name=docker.redpanda.com/redpandadata/redpanda:v24.1.2

# Flyway validation checks
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.clean-disabled=true
quarkus.flyway.out-of-order=false
