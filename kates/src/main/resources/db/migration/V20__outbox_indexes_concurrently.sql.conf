# Script config for V20__outbox_indexes_concurrently.sql.
#
# CREATE INDEX CONCURRENTLY cannot run inside a transaction block, and Flyway
# wraps every migration in one by default. This sidecar is the mechanism that
# actually disables it: the `-- flyway executeInTransaction=false` comment in
# the .sql file is documentation only — Flyway 11 reads script settings from
# this .conf file, never from the SQL body.
executeInTransaction=false
