# Docker Engine 29+ rejects Docker API clients older than v1.44. Testcontainers
# 1.20.x bundles a docker-java that negotiates down to API 1.32, so the daemon
# answers /info with HTTP 400 ("client version 1.32 is too old") before any
# container starts — even though the docker CLI and curl work fine.
#
# Pinning the API version docker-java uses to 1.44 (within Docker 29's
# supported range) is the documented workaround for the Testcontainers 1.x
# line, which will not receive a compatibility fix (that lands in 2.x only).
# Test-scope only; does not affect the application runtime.
api.version=1.44
