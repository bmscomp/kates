apiVersion: apps/v1
kind: Deployment
metadata:
  name: kates
  namespace: kates
  labels:
    app: kates
    app.kubernetes.io/name: kates
    app.kubernetes.io/part-of: kates
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kates
  template:
    metadata:
      labels:
        app: kates
    spec:
      serviceAccountName: kates
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kates
        image: ghcr.io/bmscomp/kates:1.22.0
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: kates-config
        # API key + DB credentials — create from secret.yaml.example first.
        - secretRef:
            name: kates-secrets
        env:
        - name: KATES_KAFKA_SASL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kates-backend
              key: password
        - name: JAVA_TOOL_OPTIONS
          value: "-Xms512m -Xmx2560m -XX:+UseZGC -XX:+ZGenerational"
        # Writable scratch space — required with readOnlyRootFilesystem
        # (JVM tmpdir, Vert.x cache, compression JNI extraction).
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2"
        # Same probe rules as the Helm chart, which these manifests drifted from.
        # /api/health is a Kafka reachability report: it makes a blocking
        # AdminClient round-trip per request, so a cluster whose brokers are
        # still coming up — or deliberately down, which is normal for a chaos
        # tool — never goes Ready. /q/health/ready reads a cached value instead.
        startupProbe:
          httpGet:
            path: /q/health/started
            port: 8080
          failureThreshold: 60
          periodSeconds: 2
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 8080
          initialDelaySeconds: 5
          timeoutSeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 8080
          initialDelaySeconds: 10
          timeoutSeconds: 5
          periodSeconds: 30
      volumes:
      - name: tmp
        emptyDir: {}
