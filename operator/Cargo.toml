[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
k8s-openapi = { version = "0.29", features = ["schemars", "v1_34"] }
kube = { version = "5.0", default-features = false, features = ["client", "runtime", "derive", "cel", "rustls-tls", "aws-lc-rs"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = "1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
