# The Kates operator. A Kates resource installs one Kates backend, and with
# replicas 3 or 5 a quorum of them.

global:
  # -- Registry prepended to the image, with a slash, for clusters that pull
  # from a mirror.
  imageRegistry: ""
  # -- Pull secrets for that registry, as names or {name: …}.
  imagePullSecrets: []

image:
  repository: ghcr.io/bmscomp/kates-operator
  # -- Empty: the chart's appVersion.
  tag: ""
  # -- sha256:… pins by content and wins over the tag.
  digest: ""
  pullPolicy: IfNotPresent

# -- Pull secrets of this chart's pods.
imagePullSecrets: []

# -- Namespaces whose resources this release reconciles. Empty: its own.
watchNamespaces: []
# -- Reconcile every namespace, with a ClusterRoleBinding.
watchAnyNamespace: false

rbac:
  clusterRoles:
    # -- false renders nothing cluster-scoped, for a namespace admin: apply the
    # CRDs and aggregate-roles.yaml once as a cluster admin, and install with
    # --skip-crds. Not with watchNamespaces or watchAnyNamespace.
    create: true
  aggregateRoles:
    # -- Fold the kinds into the built-in view, edit and admin roles.
    create: true
  # -- Namespaces whose Kates pods get the backend's cluster role, for faults,
  # topology and compliance reads. Empty: none, and faults are off. Name only
  # namespaces where you trust everyone who can run a pod with that role in
  # every namespace: any pod there can run as a Kates pod's ServiceAccount.
  backendNamespaces: []
  # -- Let Kates pods make the writes the direct Kubernetes chaos provider makes
  # itself (KATES_CHAOS_PROVIDER=kubernetes, or hybrid without Litmus):
  # StatefulSet scaling, for SCALE_DOWN on a Kafka Strimzi does not manage, and
  # pod ephemeral containers, for CPU_STRESS and IO_STRESS. The Kates chart's
  # rbac.directChaos. Needs rbac.clusterRoles.create.
  backendDirectChaos: false

crdUpgrade:
  # -- Apply the CRDs from a pre-install and pre-upgrade hook, never over a
  # newer version. Off with rbac.clusterRoles.create=false.
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# -- 2 only shortens the gap after a crash: one pod holds the Lease.
replicas: 1

resources:
  requests:
    cpu: 25m
    memory: 48Mi
  limits:
    memory: 128Mi

# -- text or json.
logFormat: json

tracing:
  # -- OTLP endpoint; empty sends no traces.
  endpoint: ""

networkPolicy:
  enabled: true
  # -- Namespace allowed to scrape metrics on 8080.
  monitoringNamespace: monitoring
  # -- Extra egress rules, for a Kates URL on a port other than 8080 or 443.
  egressRules: []

monitoring:
  # -- Render a PodMonitor. Needs the Prometheus Operator's CRDs.
  enabled: false

# -- Labels added to the pods; the chart's own win on a clash.
podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
