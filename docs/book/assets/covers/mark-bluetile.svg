<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Kates">
  <!-- The cover's helm (paths from docs/assets/kates-logo.svg) in white and pale sky on the
       brand-blue tile the old mark used, so one opaque file reads the same on
       the light and dark sidebars and in light and dark tab strips.
       Navy parts -> #ffffff; bright-blue parts (C-arrow, streams, tail) -> #9dd0ff.
       Small-size changes: the thin inner ring and the two rim dashes between the
       streams are dropped; the rim is thickened by a 6-unit stroke and the seven
       handles by a 10-unit stroke (1024-unit space) so they survive 16px. -->
  <defs>
    <linearGradient id="kates-mark-tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2e7ae5"/>
      <stop offset="1" stop-color="#1a5bcc"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#kates-mark-tile)"/>
