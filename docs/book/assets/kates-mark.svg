      <path d="M683.5 531.5L705.1 509A55 55 0 0 1 744.8 492.1L835.7 492.1L835.7 468.8L893.9 511.8L835.7 555L835.7 531.5Z"/>
      <!-- tail over the lower-right tooth, with the leaf -->
