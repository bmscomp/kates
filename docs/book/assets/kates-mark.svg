<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Kates">
  <!-- The cover's broker ring and recovery arc (assets/cover.svg) in white on
       the blue of its title band, so the one file reads on light and dark
       backgrounds and still holds together as a 16px favicon. -->
  <defs>
    <linearGradient id="kates-mark-tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2e7ae5"/>
      <stop offset="1" stop-color="#1a5bcc"/>
    </linearGradient>
    <linearGradient id="kates-mark-arc" x1="-19" y1="11" x2="20" y2="-7" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bfe0ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <marker id="kates-mark-head" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#kates-mark-tile)"/>
  <g transform="translate(32 37)" fill="none">
    <!-- three brokers on the ring; the one under test carries a halo -->
    <circle r="13" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.4"/>
    <circle cy="-13" r="5.4" stroke="#bfe0ff" stroke-width="1.4"/>
    <g fill="#ffffff">
      <circle cy="-13" r="3.8"/>
      <circle cx="11.26" cy="6.50" r="3.8"/>
      <circle cx="-11.26" cy="6.50" r="3.8"/>
    </g>
    <!-- recovery arc -->
    <circle cx="-18.62" cy="10.75" r="1.9" fill="#bfe0ff"/>
    <path d="M -18.62 10.75 A 21.5 21.5 0 1 1 20.20 -7.35" stroke="url(#kates-mark-arc)" stroke-width="2.8" stroke-linecap="round" marker-end="url(#kates-mark-head)"/>
  </g>
</svg>
