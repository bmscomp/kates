  <text x="556" y="472" class="mono fg-secondary">Throughput</text>
  <rect x="684" y="459" width="136" height="15" rx="2" fill="#34d399"/>
  <rect x="820" y="459" width="18" height="15" rx="2" fill="#334155"/>
