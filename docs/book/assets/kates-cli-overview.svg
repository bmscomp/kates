<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540">
  <defs>
    <style>
      .mono {
        font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', monospace;
        font-size: 13px;
        white-space: pre;
      }
      .mono-sm {
        font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', monospace;
        font-size: 11.5px;
        white-space: pre;
      }
      .mono-title {
        font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', monospace;
        font-size: 13.5px;
        font-weight: 700;
        white-space: pre;
      }
      .bold { font-weight: 700; }
      .fg-text { fill: #e2e8f0; }
      .fg-muted { fill: #94a3b8; }
      .fg-dim { fill: #64748b; }
      .fg-primary { fill: #60a5fa; }
      .fg-secondary { fill: #c4b5fd; }
      .fg-focus { fill: #fb923c; }
      .fg-cyan { fill: #38bdf8; }
      .fg-success { fill: #34d399; }
      .fg-error { fill: #f87171; }
      .fg-on-color { fill: #f8fafc; }
    </style>
  </defs>

  <!-- Outer Terminal Window -->
  <rect x="2" y="2" width="1076" height="536" rx="12" ry="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <!-- macOS Window Title Bar -->
  <path d="M 2 14 Q 2 2 14 2 L 1066 2 Q 1078 2 1078 14 L 1078 40 L 2 40 Z" fill="#1e293b"/>
  <line x1="2" y1="40" x2="1078" y2="40" stroke="#334155" stroke-width="1"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="6" fill="#22c55e"/>
  <text x="540" y="25" text-anchor="middle" class="mono-sm fg-muted">kates — CLI &amp; Automated Test Runner — zsh</text>

  <!-- Vertical Split Divider -->
  <line x1="520" y1="40" x2="520" y2="538" stroke="#1e293b" stroke-width="2"/>

  <!-- ================= LEFT PANE: kates CLI Banner & Commands ================= -->
  <text x="24" y="68" class="mono fg-success bold">❯</text>
  <text x="40" y="68" class="mono fg-text bold">kates --help</text>

  <!-- ASCII Art Banner from cli/cmd/root.go -->
  <text x="24" y="96"   xml:space="preserve" class="mono fg-secondary bold">██╗  ██╗ █████╗ ████████╗███████╗███████╗</text>
  <text x="24" y="113" xml:space="preserve" class="mono fg-secondary bold">██║ ██╔╝██╔══██╗╚══██╔══╝██╔════╝██╔════╝</text>
  <text x="24" y="130" xml:space="preserve" class="mono fg-secondary bold">█████╔╝ ███████║   ██║   █████╗  ███████╗</text>
  <text x="24" y="147" xml:space="preserve" class="mono fg-secondary bold">██╔═██╗ ██╔══██║   ██║   ██╔══╝  ╚════██║</text>
  <text x="24" y="164" xml:space="preserve" class="mono fg-secondary bold">██║  ██╗██║  ██║   ██║   ███████╗███████║</text>
  <text x="24" y="181" xml:space="preserve" class="mono fg-secondary bold">╚═╝  ╚═╝╚═╝  ╚═╝   ╚═╝   ╚══════╝╚══════╝</text>

  <text x="24" y="206" class="mono fg-cyan">Kafka Performance Testing &amp; Chaos Engineering CLI</text>
  <line x1="24" y1="218" x2="490" y2="218" stroke="#334155" stroke-width="1"/>

  <!-- Usage & Command Groups -->
  <text x="24" y="244" class="mono fg-primary bold">▸ Core Commands</text>
  <text x="36" y="266" class="mono fg-secondary bold">test</text>
  <text x="172" y="266" class="mono fg-text">Create, watch, diff, and manage test runs</text>
  <text x="36" y="286" class="mono fg-secondary bold">chaos</text>
  <text x="172" y="286" class="mono fg-text">Inject faults and run resilience scenarios</text>
  <text x="36" y="306" class="mono fg-secondary bold">lab</text>
  <text x="172" y="306" class="mono fg-text">Interactive TUI for producer tuning</text>
  <text x="36" y="326" class="mono fg-secondary bold">export</text>
  <text x="172" y="326" class="mono fg-text">Export run reports (JSON, CSV, Markdown)</text>

  <text x="24" y="356" class="mono fg-primary bold">▸ Cluster &amp; Diagnostics</text>
  <text x="36" y="378" class="mono fg-secondary bold">health</text>
  <text x="172" y="378" class="mono fg-text">Show engine health and Kafka connectivity</text>
  <text x="36" y="398" class="mono fg-secondary bold">status</text>
  <text x="172" y="398" class="mono fg-text">Live cluster, topic, and partition summary</text>
  <text x="36" y="418" class="mono fg-secondary bold">doctor</text>
  <text x="172" y="418" class="mono fg-text">Run pre-test environment &amp; broker checks</text>
  <text x="36" y="438" class="mono fg-secondary bold">broker</text>
  <text x="172" y="438" class="mono fg-text">Inspect broker configs &amp; partition leaders</text>
  <text x="36" y="458" class="mono fg-secondary bold">consumer-groups</text>
  <text x="172" y="458" class="mono fg-text">Monitor consumer lag &amp; member assignments</text>
  <text x="36" y="478" class="mono fg-secondary bold">dlq</text>
  <text x="172" y="478" class="mono fg-text">Inspect, replay, and purge DLQ messages</text>

  <text x="24" y="512" class="mono-sm fg-muted">Flags: <tspan class="fg-primary">--url</tspan> string · <tspan class="fg-primary">-o, --output</tspan> text|json · <tspan class="fg-primary">--plain</tspan></text>

  <!-- ================= RIGHT PANE: kates test create ================= -->
  <text x="544" y="68" class="mono fg-success bold">❯</text>
  <text x="560" y="68" class="mono fg-text bold">kates test create --type LOAD --records 100000 --wait</text>

  <!-- output.Banner("Test Run", "LOAD · 8f42a91c") -->
  <rect x="544" y="84" width="310" height="50" rx="6" ry="6" fill="#0f172a" stroke="#c4b5fd" stroke-width="1.4"/>
  <text x="564" y="105" class="mono-title fg-secondary">Test Run</text>
  <text x="564" y="123" class="mono fg-cyan">LOAD · 8f42a91c</text>

  <!-- output.SubHeader("Details") -->
  <text x="544" y="158" class="mono fg-primary bold">▸ Details</text>
  <text x="556" y="178" class="mono fg-secondary">ID</text>
  <text x="716" y="178" class="mono fg-text">8f42a91c-3b7e-4e90-a12d-9c04e51f7b2a</text>
  <text x="556" y="196" class="mono fg-secondary">Type</text>
  <text x="716" y="196" class="mono fg-text">LOAD</text>
  <text x="556" y="214" class="mono fg-secondary">Status</text>
  <text x="716" y="214" class="mono fg-success bold">● COMPLETED</text>
  <text x="556" y="232" class="mono fg-secondary">Backend</text>
  <text x="716" y="232" class="mono fg-text">native-java</text>

  <!-- output.SubHeader("Configuration") -->
  <text x="544" y="262" class="mono fg-primary bold">▸ Configuration</text>
  <text x="556" y="282" class="mono fg-secondary">Records</text>
  <text x="716" y="282" class="mono fg-text">100,000</text>
  <text x="556" y="300" class="mono fg-secondary">Producers</text>
  <text x="716" y="300" class="mono fg-text">4</text>
  <text x="556" y="318" class="mono fg-secondary">Acks / Compression</text>
  <text x="716" y="318" class="mono fg-text">all · lz4</text>
  <text x="556" y="336" class="mono fg-secondary">Batch / Linger</text>
  <text x="716" y="336" class="mono fg-text">65,536 B · 5 ms</text>
  <text x="556" y="354" class="mono fg-secondary">Partitions / RF</text>
  <text x="716" y="354" class="mono fg-text">6 · 3</text>

