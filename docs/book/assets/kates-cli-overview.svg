  <text x="616" y="406" class="mono fg-secondary bold">Status</text>
  <text x="684" y="406" class="mono fg-secondary bold">Records</text>
  <text x="764" y="406" class="mono fg-secondary bold">Throughput</text>
  <text x="864" y="406" class="mono fg-secondary bold">Avg Lat.</text>
  <text x="954" y="406" class="mono fg-secondary bold">P99 Lat.</text>

  <line x1="556" y1="414" x2="600" y2="414" stroke="#475569" stroke-width="1.2"/>
  <line x1="616" y1="414" x2="668" y2="414" stroke="#475569" stroke-width="1.2"/>
  <line x1="684" y1="414" x2="746" y2="414" stroke="#475569" stroke-width="1.2"/>
  <line x1="764" y1="414" x2="848" y2="414" stroke="#475569" stroke-width="1.2"/>
  <line x1="864" y1="414" x2="936" y2="414" stroke="#475569" stroke-width="1.2"/>
  <line x1="954" y1="414" x2="1026" y2="414" stroke="#475569" stroke-width="1.2"/>

  <!-- Table Row -->
  <text x="556" y="434" class="mono fg-text">main</text>
  <text x="616" y="434" class="mono fg-success bold">DONE</text>
  <text x="684" y="434" class="mono fg-text">100,000</text>
  <text x="764" y="434" class="mono fg-primary">54,280.4/s</text>
  <text x="864" y="434" class="mono fg-text">4.12 ms</text>
  <text x="954" y="434" class="mono fg-success">8.40 ms</text>

