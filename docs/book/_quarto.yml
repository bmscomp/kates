project:
  type: book
  output-dir: _book

book:
  title: "Kates — The Definitive Guide"
  subtitle: "Kafka Advanced Testing & Engineering Suite"
  description: |
    A comprehensive guide to performance testing, chaos engineering,
    and operational resilience for Apache Kafka — from theory to practice.
  author: "The Kates Team"
  date: today
  date-format: "MMMM YYYY"
  cover-image: assets/cover.svg
  repo-url: https://github.com/bmscomp/kates
  repo-subdir: docs/book
  repo-actions: [edit, issue]
  search: true
  sidebar:
    logo: assets/kates-wordmark.svg
  downloads: [pdf]

  # Filenames are stable identifiers, not ordering — reading order lives
  # here and only here. Never renumber files; new chapters get slug names.
  chapters:
    - index.qmd
    - part: "Part I — Foundations"
      chapters:
        - 01-introduction.md
        - 02-architecture.md
        - 03-cluster.md

    - part: "Part II — Performance Testing"
      chapters:
        - 04-performance-theory.md
        - 05-test-types.md
        - 13-scenario-files.md
        - 10b-lab.md

    - part: "Part III — Chaos & Integrity"
      chapters:
        - 06-chaos-theory.md
        - 07-chaos-practice.md
        - 08-data-integrity.md

    - part: "Part IV — Observability"
      chapters:
        - 09-observability.md

    - part: "Part V — Deployment & Operations"
      chapters:
        - 20-installation-guide.md
        - 15-kafka-deployment.md
        - 12-deployment.md
        - 17-security.md
        - 19-multi-tenancy.md
        - 18-upgrade-playbook.md
        - 21-kafka-connect.md
        - operating-kafka-connect.md
        - 14-recipes.md

    - part: "Part VI — Reference"
      chapters:
        - 10-cli-reference.md
        - 11-api-reference.md
        - 16-grpc-api.md

  appendices:
    - appendix-a-glossary.md
    - appendix-b-troubleshooting.md
    - appendix-c-cicd.md
    - appendix-d-versions.md

format:
  html:
    theme:
      - cosmo
      - custom.scss
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    mermaid:
      theme: neutral
  pdf:
    output-file: kates-definitive-guide
    documentclass: scrbook
    papersize: a4
    fontsize: 11pt
    colorlinks: true
    linkcolor: "NavyBlue"
    urlcolor: "NavyBlue"
    toc: true
    toc-depth: 2
    number-sections: true
    top-level-division: chapter
    fig-pos: "H"
    geometry:
      - top=30mm
      - bottom=30mm
      - left=25mm
      - right=25mm
    pdf-engine: xelatex
