<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440" role="img" aria-label="Kates YouTube channel banner — the logo emits three event streams across a light field">
  <!-- Kates YouTube banner, "Brand Streams" (light).
       One idea: the three streams that leave the Kates mark on its right keep going,
       as event-stream lines carrying records, to the right edge of the canvas.
       Around them a faint ruled field of other streams on the same 36px pitch fills the TV view.
       Device crops (all centred): TV 2560x1440, desktop strip y 508..931,
       phone / safe area x 507..2053 y 508..931. Text and logo stay in x 537..2023, y 538..901. -->
  <defs>
    <!-- paper: the website's cream, a touch lighter behind the lockup -->
    <radialGradient id="paper" cx="1280" cy="720" r="1500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="0.55" stop-color="#f7f5ef"/>
      <stop offset="1" stop-color="#efece3"/>
    </radialGradient>

    <!-- emitted streams fade as they travel away from the mark -->
    <linearGradient id="stream-fade" x1="860" y1="0" x2="2560" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3092f8" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#3092f8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#3092f8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- field tile: twelve partitions on the logo's 36px stream pitch, each a hairline with a few sparse records;
         one tile spans the full width so nothing repeats side to side -->
    <pattern id="field" x="0" y="-16" width="2560" height="432" patternUnits="userSpaceOnUse">
      <g stroke="#102a66" stroke-width="2" stroke-opacity="0.06">
        <line x1="0" y1="18" x2="2560" y2="18"/>
        <line x1="0" y1="54" x2="2560" y2="54"/>
        <line x1="0" y1="90" x2="2560" y2="90"/>
        <line x1="0" y1="126" x2="2560" y2="126"/>
        <line x1="0" y1="162" x2="2560" y2="162"/>
        <line x1="0" y1="198" x2="2560" y2="198"/>
        <line x1="0" y1="234" x2="2560" y2="234"/>
        <line x1="0" y1="270" x2="2560" y2="270"/>
        <line x1="0" y1="306" x2="2560" y2="306"/>
        <line x1="0" y1="342" x2="2560" y2="342"/>
        <line x1="0" y1="378" x2="2560" y2="378"/>
        <line x1="0" y1="414" x2="2560" y2="414"/>
      </g>
      <g fill="#3092f8" fill-opacity="0.14">
        <rect x="140" y="12" width="36" height="12" rx="6"/><rect x="1210" y="12" width="52" height="12" rx="6"/><rect x="2230" y="12" width="28" height="12" rx="6"/>
        <rect x="520" y="48" width="24" height="12" rx="6"/><rect x="556" y="48" width="44" height="12" rx="6"/><rect x="1730" y="48" width="36" height="12" rx="6"/>
        <rect x="860" y="120" width="36" height="12" rx="6"/><rect x="1990" y="120" width="24" height="12" rx="6"/><rect x="2026" y="120" width="48" height="12" rx="6"/>
        <rect x="90" y="156" width="28" height="12" rx="6"/><rect x="1150" y="156" width="60" height="12" rx="6"/><rect x="2290" y="156" width="32" height="12" rx="6"/>
        <rect x="640" y="192" width="44" height="12" rx="6"/><rect x="1620" y="192" width="30" height="12" rx="6"/><rect x="1662" y="192" width="22" height="12" rx="6"/>
        <rect x="380" y="228" width="26" height="12" rx="6"/><rect x="1340" y="228" width="40" height="12" rx="6"/><rect x="2120" y="228" width="56" height="12" rx="6"/>
        <rect x="30" y="264" width="48" height="12" rx="6"/><rect x="960" y="264" width="28" height="12" rx="6"/><rect x="1880" y="264" width="36" height="12" rx="6"/>
        <rect x="720" y="300" width="60" height="12" rx="6"/><rect x="1460" y="300" width="24" height="12" rx="6"/><rect x="2480" y="300" width="30" height="12" rx="6"/>
        <rect x="230" y="336" width="32" height="12" rx="6"/><rect x="274" y="336" width="22" height="12" rx="6"/><rect x="1070" y="336" width="44" height="12" rx="6"/><rect x="2190" y="336" width="26" height="12" rx="6"/>
        <rect x="560" y="372" width="36" height="12" rx="6"/><rect x="1780" y="372" width="52" height="12" rx="6"/>
        <rect x="100" y="408" width="24" height="12" rx="6"/><rect x="1290" y="408" width="30" height="12" rx="6"/><rect x="2340" y="408" width="44" height="12" rx="6"/>
      </g>
    </pattern>

    <!-- field strength: full at the strip, softer towards the top and bottom of the TV canvas -->
    <linearGradient id="field-strength" x1="0" y1="0" x2="0" y2="1440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#707070"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#707070"/>
    </linearGradient>

    <!-- keep the field away from the lockup (a feathered clearing over the safe area)
         and off the three lit partitions, which the emitted streams own -->
    <filter id="feather" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <mask id="clearing" maskUnits="userSpaceOnUse" x="0" y="0" width="2560" height="1440">
      <rect width="2560" height="1440" fill="url(#field-strength)"/>
      <rect x="460" y="500" width="1640" height="440" rx="90" fill="#000" filter="url(#feather)"/>
      <rect x="860" y="672" width="1700" height="100" fill="#000"/>
    </mask>
  </defs>

  <!-- =====================================================================
       1. TV canvas: cream paper and the faint field of streams
       ===================================================================== -->
  <rect width="2560" height="1440" fill="url(#paper)"/>
  <rect width="2560" height="1440" fill="url(#field)" mask="url(#clearing)"/>

  <!-- =====================================================================
       2. The three emitted streams: from the logo's arrowheads to the right edge
          (stream centres y 686 / 722 / 758, the arrow tips of the logo below)
       ===================================================================== -->
  <g stroke="url(#stream-fade)" stroke-width="3" stroke-linecap="round">
    <line x1="868" y1="686" x2="2560" y2="686"/>
    <line x1="887" y1="722" x2="2560" y2="722"/>
    <line x1="868" y1="758" x2="2560" y2="758"/>
  </g>
  <!-- records travelling on them: denser near the mark, thinning out towards the edge -->
  <g fill="#3092f8">
    <!-- upper stream -->
    <rect x="1010" y="679" width="40" height="14" rx="7"/>
    <rect x="1262" y="679" width="24" height="14" rx="7"/>
    <rect x="1300" y="679" width="56" height="14" rx="7" fill-opacity="0.9"/>
    <rect x="1716" y="679" width="32" height="14" rx="7" fill-opacity="0.8"/>
    <rect x="2140" y="679" width="48" height="14" rx="7" fill-opacity="0.6"/>
    <rect x="2440" y="679" width="40" height="14" rx="7" fill-opacity="0.4"/>
    <!-- middle stream -->
    <rect x="930" y="715" width="64" height="14" rx="7"/>
    <rect x="1180" y="715" width="32" height="14" rx="7"/>
    <rect x="1490" y="715" width="44" height="14" rx="7" fill-opacity="0.9"/>
    <rect x="1546" y="715" width="24" height="14" rx="7" fill-opacity="0.9"/>
    <rect x="1900" y="715" width="56" height="14" rx="7" fill-opacity="0.75"/>
    <rect x="2250" y="715" width="32" height="14" rx="7" fill-opacity="0.55"/>
    <!-- lower stream -->
    <rect x="1080" y="751" width="28" height="14" rx="7"/>
    <rect x="1330" y="751" width="48" height="14" rx="7" fill-opacity="0.9"/>
    <rect x="1630" y="751" width="36" height="14" rx="7" fill-opacity="0.85"/>
    <rect x="2010" y="751" width="24" height="14" rx="7" fill-opacity="0.7"/>
    <rect x="2048" y="751" width="40" height="14" rx="7" fill-opacity="0.7"/>
    <rect x="2360" y="751" width="56" height="14" rx="7" fill-opacity="0.45"/>
  </g>

  <!-- =====================================================================
       3. Safe area (x 537..2023, y 538..901): the mark, the wordmark, one line, the site
       ===================================================================== -->
