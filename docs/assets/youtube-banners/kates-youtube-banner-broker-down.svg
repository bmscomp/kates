<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440" role="img" aria-label="Kates YouTube channel banner: Break your Kafka cluster before production does.">
  <!--
    Broker Down. A Kafka cluster across three zones fills the whole canvas;
    one broker is hit and its partition leaders move to the survivors.
    Device crops (all centred): TV 2560x1440, desktop strip y 508..931,
    phone / safe area x 507..2053 y 508..931. Text and logo stay inside
    x 537..2023, y 538..901; everything outside that is wordless decoration.
    The diagram is illustrative: no numbers, no measured values.
  -->
  <defs>
    <!-- Fault glow around the broken broker -->
    <radialGradient id="fault-glow" cx="1830" cy="712" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5B4F" stop-opacity="0.26"/>
      <stop offset="0.45" stop-color="#FF5B4F" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FF5B4F" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft blue light under a survivor that just took leadership -->
    <radialGradient id="live-glow">
      <stop offset="0" stop-color="#4FA3F0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4FA3F0" stop-opacity="0"/>
    </radialGradient>
    <!-- Arrowhead for the leader hand-off arrows -->
    <marker id="head" viewBox="0 0 12 12" refX="4" refY="6" markerWidth="4.2" markerHeight="4.2" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#4FA3F0"/>
    </marker>

    <!-- A broker the fault did not touch: three partition replicas, one of them a leader -->
    <g id="broker-dim">
      <circle r="46" fill="#0d1526" stroke="#26365a" stroke-width="4"/>
      <rect x="-27" y="-9" width="16" height="18" rx="3" fill="#26365a"/>
      <rect x="-8" y="-9" width="16" height="18" rx="3" fill="none" stroke="#26365a" stroke-width="3"/>
      <rect x="11" y="-9" width="16" height="18" rx="3" fill="none" stroke="#26365a" stroke-width="3"/>
    </g>
    <!-- A survivor: it now leads the partition that moved to it -->
    <g id="broker-live">
      <circle r="120" fill="url(#live-glow)"/>
      <circle r="50" fill="#0d1a33" stroke="#4FA3F0" stroke-width="6"/>
      <rect x="-29" y="-10" width="17" height="20" rx="3" fill="#4FA3F0"/>
      <rect x="-8.5" y="-10" width="17" height="20" rx="3" fill="#4FA3F0"/>
      <rect x="12" y="-10" width="17" height="20" rx="3" fill="none" stroke="#4FA3F0" stroke-width="3"/>
    </g>

    <!-- The two halves of the broken broker, split along the crack -->
    <clipPath id="half-a"><path d="M1690 560L1800 560L1826 640L1806 684L1843 702L1841 724L1820 764L1864 860L1690 860Z"/></clipPath>
    <clipPath id="half-b"><path d="M1800 560L1980 560L1980 860L1864 860L1820 764L1841 724L1843 702L1806 684L1826 640Z"/></clipPath>
    <g id="dead-core">
      <circle cx="1830" cy="712" r="80" fill="#1b0e15" stroke="#FF5B4F" stroke-width="7"/>
      <rect x="1784" y="700" width="20" height="24" rx="4" fill="#FF5B4F" fill-opacity="0.55"/>
      <rect x="1815" y="700" width="20" height="24" rx="4" fill="none" stroke="#FF5B4F" stroke-opacity="0.55" stroke-width="3.5"/>
      <rect x="1851" y="700" width="20" height="24" rx="4" fill="none" stroke="#FF5B4F" stroke-opacity="0.55" stroke-width="3.5"/>
    </g>
  </defs>

  <!-- 1. Canvas -->
  <rect width="2560" height="1440" fill="#070b15"/>

  <!-- 2. Three zones: tall panels across the TV canvas; the desktop strip shows their gutters -->
  <g fill="#0b1222" stroke="#18233c" stroke-width="2">
    <rect x="30" y="40" width="436" height="1360" rx="40"/>
    <rect x="496" y="40" width="1568" height="1360" rx="40"/>
    <rect x="2094" y="40" width="436" height="1360" rx="40"/>
  </g>
  <!-- Wordless zone markers: one, two and three pips at the top of each zone (TV only) -->
  <g fill="#22314f">
    <circle cx="248" cy="96" r="8"/>
    <circle cx="1268" cy="96" r="8"/><circle cx="1292" cy="96" r="8"/>
    <circle cx="2288" cy="96" r="8"/><circle cx="2312" cy="96" r="8"/><circle cx="2336" cy="96" r="8"/>
  </g>

  <!-- 3. Fault glow, under everything else -->
  <rect width="2560" height="1440" fill="url(#fault-glow)"/>

  <!-- 4. Replication links between brokers (kept clear of the text block) -->
  <g stroke="#17243f" stroke-width="3" fill="none">
    <path d="M300 300L170 640L340 830L180 1120"/>
    <path d="M300 300L760 250L1180 330L1600 220L1960 360L2330 290"/>
    <path d="M180 1120L820 1170L1250 1090L1790 1150L2260 1150"/>
    <path d="M2330 290L2220 600L2390 840L2260 1150"/>
    <path d="M1960 360L2220 600"/>
  </g>

  <!-- 5. Brokers the fault left alone -->
  <use href="#broker-dim" x="300" y="300"/>
  <use href="#broker-dim" x="170" y="640"/>
  <use href="#broker-dim" x="340" y="830"/>
  <use href="#broker-dim" x="180" y="1120"/>
  <use href="#broker-dim" x="760" y="250"/>
  <use href="#broker-dim" x="1180" y="330"/>
  <use href="#broker-dim" x="1600" y="220"/>
  <use href="#broker-dim" x="820" y="1170"/>
  <use href="#broker-dim" x="1250" y="1090"/>
  <use href="#broker-dim" x="2330" y="290"/>
  <use href="#broker-dim" x="2260" y="1150"/>

  <!-- 6. Survivors that take over the leaders -->
  <use href="#broker-live" x="1960" y="360"/>
  <use href="#broker-live" x="2220" y="600"/>
  <use href="#broker-live" x="2390" y="840"/>
  <use href="#broker-live" x="1790" y="1150"/>

  <!-- 7. Leader hand-off: each arrow carries one partition to a survivor -->
  <g fill="none" stroke="#4FA3F0" stroke-width="7" stroke-linecap="round" marker-end="url(#head)">
    <path d="M1880 596Q1930 500 1938 428"/>
    <path d="M1952 676Q2060 610 2152 612"/>
    <path d="M1954 742Q2150 800 2318 822"/>
    <path d="M1830 838Q1850 960 1798 1078"/>
  </g>
  <g fill="#4FA3F0">
    <rect x="1906" y="497" width="28" height="28" rx="5" transform="rotate(-62 1920 511)"/>
    <rect x="2040" y="618" width="28" height="28" rx="5" transform="rotate(-14 2054 632)"/>
    <rect x="2128" y="774" width="28" height="28" rx="5" transform="rotate(12 2142 788)"/>
    <rect x="1820" y="947" width="28" height="28" rx="5" transform="rotate(94 1834 961)"/>
  </g>

  <!-- 8. The broken broker: fault rings, then the fractured node -->
  <g fill="none" stroke="#FF5B4F">
    <circle cx="1830" cy="712" r="118" stroke-width="4" stroke-dasharray="14 12" stroke-opacity="0.8"/>
    <circle cx="1830" cy="712" r="162" stroke-width="3" stroke-opacity="0.32"/>
    <circle cx="1830" cy="712" r="206" stroke-width="2" stroke-opacity="0.14"/>
  </g>
  <!-- Each half moves with its own clip, so the crack opens as a clean gap -->
  <g transform="translate(-13 3)"><g clip-path="url(#half-a)"><use href="#dead-core"/></g></g>
  <g transform="translate(13 -3)"><g clip-path="url(#half-b)"><use href="#dead-core"/></g></g>

