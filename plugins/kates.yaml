apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kates
spec:
  version: v1.36.0
  homepage: https://github.com/bmscomp/kates
  shortDescription: Benchmark, fault-test, and audit Kafka clusters
  description: |
    Kates deploys and tests Apache Kafka clusters on Kubernetes. It runs
    eight benchmark workload types (LOAD, STRESS, SPIKE, ENDURANCE, VOLUME,
    CAPACITY, ROUND_TRIP, and INTEGRITY for zero-loss and sequence-gap
    verification), orchestrates thirteen broker and network fault types
    through LitmusChaos or the Kubernetes API with blast-radius safety
    guards, and audits broker security configuration against CIS, SOC 2,
    and PCI DSS with A-F SLA and security quality gates.
  caveats: |
    Signed Helm chart deployments verify signatures with Cosign.
    Ensure cosign is installed in your PATH to deploy signed charts:
      brew install cosign
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.36.0/kates-darwin-amd64.tar.gz
      sha256: d3e5f45f2e7da86843da8cfe27b3864c4e2ddf7b9792623450d7062904b59177
      bin: kates
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.36.0/kates-darwin-arm64.tar.gz
      sha256: e4861dd481b302a722e8f0587e5383e89f494b8c43d49bed3aee864dbe2cf08c
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.36.0/kates-linux-amd64.tar.gz
      sha256: e34856f698c9ea49210873394a3811c509373cbee1eba350b9d5984d0f1f1571
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.36.0/kates-linux-arm64.tar.gz
      sha256: 2baec1a07fa5cfeebd92eaa085477b9646a09dc99d01ea684891d356474bad15
      bin: kates
