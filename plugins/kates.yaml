apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kates
spec:
  version: v1.39.1
  homepage: https://github.com/bmscomp/kates
  shortDescription: Benchmark, fault-test, and audit Kafka clusters
  description: |
    Kates deploys and tests Apache Kafka clusters on Kubernetes. It runs
    eight benchmark workload types (LOAD, STRESS, SPIKE, ENDURANCE, VOLUME,
    CAPACITY, ROUND_TRIP, and INTEGRITY for zero-loss and sequence-gap
    verification), orchestrates thirteen broker and network fault types
    through LitmusChaos or the Kubernetes API with blast-radius safety
    guards, and audits broker security configuration against CIS, SOC 2,
    and PCI DSS with A-F SLA and security quality gates.
  caveats: |
    Signed Helm chart deployments verify signatures with Cosign.
    Ensure cosign is installed in your PATH to deploy signed charts:
      brew install cosign
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.39.1/kates-darwin-amd64.tar.gz
      sha256: 0b6e4214dde76d3c07960bc8731e0c806298eb1d8e4715a47ca62e62173d95c6
      bin: kates
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.39.1/kates-darwin-arm64.tar.gz
      sha256: 5e2e62752b8f59aa0e5dbd347d353bd3366583c24a8a641abdbd9afb2b5eede8
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.39.1/kates-linux-amd64.tar.gz
      sha256: 1a9f63a70314e88ce794031e0e0ace57a19099b8879ca283e1fbcc427bfc6eb2
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.39.1/kates-linux-arm64.tar.gz
      sha256: 2bab2a979f1e6b0abbca66312de0799bd7b1df9c04147d6e12ba2c1117d3392a
      bin: kates
