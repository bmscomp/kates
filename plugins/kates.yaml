apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kates
spec:
  version: v1.41.2
  homepage: https://github.com/bmscomp/kates
  shortDescription: Benchmark, fault-test, and audit Kafka clusters
  description: |
    Kates deploys and tests Apache Kafka clusters on Kubernetes. It runs
    eight benchmark workload types (LOAD, STRESS, SPIKE, ENDURANCE, VOLUME,
    CAPACITY, ROUND_TRIP, and INTEGRITY for zero-loss and sequence-gap
    verification), orchestrates thirteen broker and network fault types
    through LitmusChaos or the Kubernetes API with blast-radius safety
    guards, and audits broker security configuration against CIS, SOC 2,
    and PCI DSS with A-F SLA and security quality gates.
  caveats: |
    Signed Helm chart deployments verify signatures with Cosign.
    Ensure cosign is installed in your PATH to deploy signed charts:
      brew install cosign
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.41.2/kates-darwin-amd64.tar.gz
      sha256: 5e5a38c38d6f865ae8753c3f3459cca84a94f5752ca5c91583ca668b9db275d1
      bin: kates
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.41.2/kates-darwin-arm64.tar.gz
      sha256: 1e17b179380f347960b85943f0fd51d5e727f8f8b77c925ee068d9245f3c96e8
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.41.2/kates-linux-amd64.tar.gz
      sha256: abb2d73db689ec101a9fc80e4ab3c0751e0c1f1c7367868942becb57d694b5f7
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.41.2/kates-linux-arm64.tar.gz
      sha256: f2963cf6e1e52490865997289b9601ac197ae10a7c277bb753cf049b85ed216c
      bin: kates
