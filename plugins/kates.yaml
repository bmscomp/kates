apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kates
spec:
  version: v1.34.1
  homepage: https://github.com/bmscomp/kates
  shortDescription: Benchmark, fault-test, and audit Kafka clusters
  description: |
    Kates deploys and tests Apache Kafka clusters on Kubernetes. It runs
    eight benchmark workload types (LOAD, STRESS, SPIKE, ENDURANCE, VOLUME,
    CAPACITY, ROUND_TRIP, and INTEGRITY for zero-loss and sequence-gap
    verification), orchestrates thirteen broker and network fault types
    through LitmusChaos or the Kubernetes API with blast-radius safety
    guards, and audits broker security configuration against CIS, SOC 2,
    and PCI DSS with A-F SLA and security quality gates.
  caveats: |
    Signed Helm chart deployments verify signatures with Cosign.
    Ensure cosign is installed in your PATH to deploy signed charts:
      brew install cosign
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.34.1/kates-darwin-amd64.tar.gz
      sha256: b8deb0a2c9eb8f6308efdace741c5769a74f445d00bdd807cabb75cb4e735109
      bin: kates
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.34.1/kates-darwin-arm64.tar.gz
      sha256: 68f9a640d716fc0ceae6de91cae87240eafbf7fb6bd9a6a82379f74f82073af1
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.34.1/kates-linux-amd64.tar.gz
      sha256: 68273a2f91605c673279417463030a32c6c0b904617b7f2e2d9b2a25bc9d567d
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.34.1/kates-linux-arm64.tar.gz
      sha256: 75ef991657cb1518203a7c7ed1850b49670b8d687018ba52cc76dcc55ec71b9e
      bin: kates
