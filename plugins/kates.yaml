apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kates
spec:
  version: v1.39.0
  homepage: https://github.com/bmscomp/kates
  shortDescription: Benchmark, fault-test, and audit Kafka clusters
  description: |
    Kates deploys and tests Apache Kafka clusters on Kubernetes. It runs
    eight benchmark workload types (LOAD, STRESS, SPIKE, ENDURANCE, VOLUME,
    CAPACITY, ROUND_TRIP, and INTEGRITY for zero-loss and sequence-gap
    verification), orchestrates thirteen broker and network fault types
    through LitmusChaos or the Kubernetes API with blast-radius safety
    guards, and audits broker security configuration against CIS, SOC 2,
    and PCI DSS with A-F SLA and security quality gates.
  caveats: |
    Signed Helm chart deployments verify signatures with Cosign.
    Ensure cosign is installed in your PATH to deploy signed charts:
      brew install cosign
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.39.0/kates-darwin-amd64.tar.gz
      sha256: 62912d54507df10dd32bc41d1ed4c11cae4da04f378bfb7bc0c2c1b01aff92f8
      bin: kates
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.39.0/kates-darwin-arm64.tar.gz
      sha256: 77c2f660295a5cb1f70e6e9ced1fc19c975cb3cd1bd68b270d80c80f97dc283a
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.39.0/kates-linux-amd64.tar.gz
      sha256: 7c06e4748dafb49863a6f628404bc2318359d274ac121372e271972b62a65562
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.39.0/kates-linux-arm64.tar.gz
      sha256: 91c7222d4b37e3b5536eea5acf503d8ea7550c77573cf2fac12ad9c842223030
      bin: kates
