apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kates
spec:
  version: v1.35.0
  homepage: https://github.com/bmscomp/kates
  shortDescription: Benchmark, fault-test, and audit Kafka clusters
  description: |
    Kates deploys and tests Apache Kafka clusters on Kubernetes. It runs
    eight benchmark workload types (LOAD, STRESS, SPIKE, ENDURANCE, VOLUME,
    CAPACITY, ROUND_TRIP, and INTEGRITY for zero-loss and sequence-gap
    verification), orchestrates thirteen broker and network fault types
    through LitmusChaos or the Kubernetes API with blast-radius safety
    guards, and audits broker security configuration against CIS, SOC 2,
    and PCI DSS with A-F SLA and security quality gates.
  caveats: |
    Signed Helm chart deployments verify signatures with Cosign.
    Ensure cosign is installed in your PATH to deploy signed charts:
      brew install cosign
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.35.0/kates-darwin-amd64.tar.gz
      sha256: fddbf857b3479782ad3abd92ee7751bf43447f569df210d3ecfd6231fa4792ce
      bin: kates
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.35.0/kates-darwin-arm64.tar.gz
      sha256: 881e166fbe580239942397aadd0a4bf65e396fd2409316d8996dba6d98327a5b
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.35.0/kates-linux-amd64.tar.gz
      sha256: 8515ac27ad53874893ced7bfd772fad2bf0ec57eb42af0ae8100c60ece448f6c
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.35.0/kates-linux-arm64.tar.gz
      sha256: bf065fbf6c90ef40cb00a1c3f3fd9103fc2867f78a5741d796bb4bb48a9bcc0e
      bin: kates
