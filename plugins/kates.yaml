apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kates
spec:
  version: v1.41.3
  homepage: https://github.com/bmscomp/kates
  shortDescription: Benchmark, fault-test, and audit Kafka clusters
  description: |
    Kates deploys and tests Apache Kafka clusters on Kubernetes. It runs
    eight benchmark workload types (LOAD, STRESS, SPIKE, ENDURANCE, VOLUME,
    CAPACITY, ROUND_TRIP, and INTEGRITY for zero-loss and sequence-gap
    verification), orchestrates thirteen broker and network fault types
    through LitmusChaos or the Kubernetes API with blast-radius safety
    guards, and audits broker security configuration against CIS, SOC 2,
    and PCI DSS with A-F SLA and security quality gates.
  caveats: |
    Signed Helm chart deployments verify signatures with Cosign.
    Ensure cosign is installed in your PATH to deploy signed charts:
      brew install cosign
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.41.3/kates-darwin-amd64.tar.gz
      sha256: f361ca23bc9cb771ca1337c3dd2c546c6561f8f1c73b1f87a14e865b67b63425
      bin: kates
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.41.3/kates-darwin-arm64.tar.gz
      sha256: f810cbe15a42da5a6df510d56e8443c4384d33a96b9a5c425683e691d269f865
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.41.3/kates-linux-amd64.tar.gz
      sha256: e5b0fad7bada93c80cf5dead746e282ca7044e5d4e4bf7ed78aabbbe45fc89b7
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.41.3/kates-linux-arm64.tar.gz
      sha256: 039ded08604260a208ab326872a7d6bca49327f9cf9bd6db21f784d994edb041
      bin: kates
