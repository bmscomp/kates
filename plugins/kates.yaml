apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kates
spec:
  version: v1.37.0
  homepage: https://github.com/bmscomp/kates
  shortDescription: Benchmark, fault-test, and audit Kafka clusters
  description: |
    Kates deploys and tests Apache Kafka clusters on Kubernetes. It runs
    eight benchmark workload types (LOAD, STRESS, SPIKE, ENDURANCE, VOLUME,
    CAPACITY, ROUND_TRIP, and INTEGRITY for zero-loss and sequence-gap
    verification), orchestrates thirteen broker and network fault types
    through LitmusChaos or the Kubernetes API with blast-radius safety
    guards, and audits broker security configuration against CIS, SOC 2,
    and PCI DSS with A-F SLA and security quality gates.
  caveats: |
    Signed Helm chart deployments verify signatures with Cosign.
    Ensure cosign is installed in your PATH to deploy signed charts:
      brew install cosign
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.37.0/kates-darwin-amd64.tar.gz
      sha256: 06f65ad8797ffe8f58406ca05d69b60a11fb8d435eecf3baee076dde49cd20a6
      bin: kates
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.37.0/kates-darwin-arm64.tar.gz
      sha256: 7fb9214a69a54e376f505b879cd5e990c87b7a180549ab8bb1865c101a4152a1
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.37.0/kates-linux-amd64.tar.gz
      sha256: 80f26d4665b4c3d70170ec4b3299b14c61e6d6278837f888d8cabaade224280b
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.37.0/kates-linux-arm64.tar.gz
      sha256: 3115d905419d806ce2f0ae088de147a177e549218ea86ac5ba0333b17ce9a899
      bin: kates
