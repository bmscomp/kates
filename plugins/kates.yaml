apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kates
spec:
  version: v1.41.1
  homepage: https://github.com/bmscomp/kates
  shortDescription: Benchmark, fault-test, and audit Kafka clusters
  description: |
    Kates deploys and tests Apache Kafka clusters on Kubernetes. It runs
    eight benchmark workload types (LOAD, STRESS, SPIKE, ENDURANCE, VOLUME,
    CAPACITY, ROUND_TRIP, and INTEGRITY for zero-loss and sequence-gap
    verification), orchestrates thirteen broker and network fault types
    through LitmusChaos or the Kubernetes API with blast-radius safety
    guards, and audits broker security configuration against CIS, SOC 2,
    and PCI DSS with A-F SLA and security quality gates.
  caveats: |
    Signed Helm chart deployments verify signatures with Cosign.
    Ensure cosign is installed in your PATH to deploy signed charts:
      brew install cosign
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.41.1/kates-darwin-amd64.tar.gz
      sha256: 3f3af375c337e78cf6943ee7e07f641f55fa53136eba0067746083a9d0b95157
      bin: kates
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.41.1/kates-darwin-arm64.tar.gz
      sha256: df294847950fa9c5175e36c7c638ae70a8dcc8ae0559a05921fa706ac83e009c
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.41.1/kates-linux-amd64.tar.gz
      sha256: b73b57503274eaa5fc93afacfc813f4de577c3d71234a2d87ae00f64f9903c92
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.41.1/kates-linux-arm64.tar.gz
      sha256: 26a81be265c4f36fa7cbdfd6e201519ee52ae91605249accc44735e8b53243cb
      bin: kates
