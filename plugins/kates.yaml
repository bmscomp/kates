apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kates
spec:
  version: v1.40.0
  homepage: https://github.com/bmscomp/kates
  shortDescription: Benchmark, fault-test, and audit Kafka clusters
  description: |
    Kates deploys and tests Apache Kafka clusters on Kubernetes. It runs
    eight benchmark workload types (LOAD, STRESS, SPIKE, ENDURANCE, VOLUME,
    CAPACITY, ROUND_TRIP, and INTEGRITY for zero-loss and sequence-gap
    verification), orchestrates thirteen broker and network fault types
    through LitmusChaos or the Kubernetes API with blast-radius safety
    guards, and audits broker security configuration against CIS, SOC 2,
    and PCI DSS with A-F SLA and security quality gates.
  caveats: |
    Signed Helm chart deployments verify signatures with Cosign.
    Ensure cosign is installed in your PATH to deploy signed charts:
      brew install cosign
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.40.0/kates-darwin-amd64.tar.gz
      sha256: f22a31665c4d16a0a379abf778f776135aa62aeb5fdd1a0f99ead16dab035c0d
      bin: kates
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.40.0/kates-darwin-arm64.tar.gz
      sha256: c861e59133eb14f3801a04c9566ec85820b1794a877c572f25389627ec4042ef
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.40.0/kates-linux-amd64.tar.gz
      sha256: 5a6fec725a9d2393dce145e9ab5342f164554f8dccba692e2aec4196a3bfd8e6
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.40.0/kates-linux-arm64.tar.gz
      sha256: 82606ac571a76ecf8ee0056b09738361015ceab4df426e6560fed1c645f4e4d9
      bin: kates
