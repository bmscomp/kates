apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kates
spec:
  version: v1.33.0
  homepage: https://github.com/bmscomp/kates
  shortDescription: Benchmark, fault-test, and audit Kafka clusters
  description: |
    Kates deploys and tests Apache Kafka clusters on Kubernetes. It runs
    eight benchmark workload types (LOAD, STRESS, SPIKE, ENDURANCE, VOLUME,
    CAPACITY, ROUND_TRIP, and INTEGRITY for zero-loss and sequence-gap
    verification), orchestrates thirteen broker and network fault types
    through LitmusChaos or the Kubernetes API with blast-radius safety
    guards, and audits broker security configuration against CIS, SOC 2,
    and PCI DSS with A-F SLA and security quality gates.
  caveats: |
    Signed Helm chart deployments verify signatures with Cosign.
    Ensure cosign is installed in your PATH to deploy signed charts:
      brew install cosign
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.33.0/kates-darwin-amd64.tar.gz
      sha256: d04b8db8fd69147734d91f007849d24c214655f230181f29cd99be9dd2dbdfaa
      bin: kates
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.33.0/kates-darwin-arm64.tar.gz
      sha256: 868df58824cf3982e6ccbe32bcf891a747a0aca94991d2c357de3a86825754b1
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.33.0/kates-linux-amd64.tar.gz
      sha256: b4e66b15f95b1b3801c5aa19469983e9d08d331f96cb37cecc1c236cd07ebbf4
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.33.0/kates-linux-arm64.tar.gz
      sha256: 667a2663c258294a13378d25b2e6ea9e6b0c41fff7c58518cfc74a28ed37c0b3
      bin: kates
