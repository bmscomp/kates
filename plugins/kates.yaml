apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kates
spec:
  version: v1.41.0
  homepage: https://github.com/bmscomp/kates
  shortDescription: Benchmark, fault-test, and audit Kafka clusters
  description: |
    Kates deploys and tests Apache Kafka clusters on Kubernetes. It runs
    eight benchmark workload types (LOAD, STRESS, SPIKE, ENDURANCE, VOLUME,
    CAPACITY, ROUND_TRIP, and INTEGRITY for zero-loss and sequence-gap
    verification), orchestrates thirteen broker and network fault types
    through LitmusChaos or the Kubernetes API with blast-radius safety
    guards, and audits broker security configuration against CIS, SOC 2,
    and PCI DSS with A-F SLA and security quality gates.
  caveats: |
    Signed Helm chart deployments verify signatures with Cosign.
    Ensure cosign is installed in your PATH to deploy signed charts:
      brew install cosign
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.41.0/kates-darwin-amd64.tar.gz
      sha256: 3a95b1df33bc31476c42447bf7b2c0f345c614903995f4254355a9c2b6d7d22c
      bin: kates
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.41.0/kates-darwin-arm64.tar.gz
      sha256: c8c4fbc059d28d64601f58f14db88956f7125c94388618fc0fa37fdb1ce91044
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.41.0/kates-linux-amd64.tar.gz
      sha256: 9f4d1bd12aa97da0db8d7c287118897d664ae8f000c7387a5bdfea0c20fba756
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.41.0/kates-linux-arm64.tar.gz
      sha256: 6c44221b00d8bd36d9587696d961351518bb75db13779c92da293f7c155cb18c
      bin: kates
