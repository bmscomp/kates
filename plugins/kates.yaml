apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kates
spec:
  version: v1.34.0
  homepage: https://github.com/bmscomp/kates
  shortDescription: Benchmark, fault-test, and audit Kafka clusters
  description: |
    Kates deploys and tests Apache Kafka clusters on Kubernetes. It runs
    eight benchmark workload types (LOAD, STRESS, SPIKE, ENDURANCE, VOLUME,
    CAPACITY, ROUND_TRIP, and INTEGRITY for zero-loss and sequence-gap
    verification), orchestrates thirteen broker and network fault types
    through LitmusChaos or the Kubernetes API with blast-radius safety
    guards, and audits broker security configuration against CIS, SOC 2,
    and PCI DSS with A-F SLA and security quality gates.
  caveats: |
    Signed Helm chart deployments verify signatures with Cosign.
    Ensure cosign is installed in your PATH to deploy signed charts:
      brew install cosign
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.34.0/kates-darwin-amd64.tar.gz
      sha256: bef846ba9b63922af554cdc80b997a6a32880051b3fb2bb460452d8adbedc9a8
      bin: kates
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.34.0/kates-darwin-arm64.tar.gz
      sha256: 6af069da8ccfdbc6d4c4d85aae6a74010739ebc62bc16e57c74369b8692a5621
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/bmscomp/kates/releases/download/v1.34.0/kates-linux-amd64.tar.gz
      sha256: ab9ec49d2045a144a128b57432871c33dfa49cef44f1be432cd8fd93c255fad4
      bin: kates
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/bmscomp/kates/releases/download/v1.34.0/kates-linux-arm64.tar.gz
      sha256: d4c7707f6953d78d3f759262e1572eb1e7a2c3269d3462ac7b008e51cdde72d8
      bin: kates
