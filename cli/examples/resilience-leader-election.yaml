# ─────────────────────────────────────────────────────────────────────────────
# Resilience Test: LEADER_ELECTION — Forced Partition Leader Re-election
# ─────────────────────────────────────────────────────────────────────────────
# Force-deletes one broker pod, picked at random, so that every partition it
# leads elects a new leader on another broker. On litmus-crd, the default chaos
# provider, pod-delete deletes it again until chaosDurationSec ends. Tests that
# the producer and the consumer handle the metadata refresh and reconnection
# correctly.
#
# A resilience run doesn't aim at a partition's leader: only a disruption plan
# (kates disruption run) reads targetTopic and targetPartition, and deletes the
# pod of the broker that leads that partition.
#
# Hypothesis:
#   Leader election takes < 5s per partition on a healthy 3-broker cluster.
#   The producer, with acks=all, sees a brief latency spike while the deleted
#   broker's partitions re-elect. No data loss. The consumer group continues
#   without triggering a full rebalance.
#
# Usage:
#   kates resilience run -f cli/examples/resilience-leader-election.yaml
# ─────────────────────────────────────────────────────────────────────────────

testRequest:
  type: LOAD
  spec:
    topic: kates-events
    partitions: 6
    replicationFactor: 3
    minInsyncReplicas: 2
    numRecords: 300000
    recordSize: 1024
    throughput: 3000
    consumerGroup: leader-election-cg
    acks: "all"
    enableIdempotence: true
    batchSize: 65536
    lingerMs: 5
    compressionType: lz4

chaosSpec:
  experimentName: forced-leader-election
  disruptionType: LEADER_ELECTION
  targetNamespace: kafka
  # strimzi.io/cluster alone matches every pod Strimzi runs for the cluster,
  # the KRaft controllers among them.
  targetLabel: "strimzi.io/cluster=krafter,strimzi.io/broker-role=true"
  chaosDurationSec: 30
  delayBeforeSec: 0

steadyStateSec: 20
maxRecoveryWaitSec: 60


