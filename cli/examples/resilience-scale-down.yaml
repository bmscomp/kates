# ─────────────────────────────────────────────────────────────────────────────
# Resilience Test: SCALE_DOWN — Broker Pool Contraction
# ─────────────────────────────────────────────────────────────────────────────
# Scales the sigma broker pool from 1 replica to 0, simulating the loss of a
# broker for good. Kates lowers spec.replicas of the brokers-sigma
# KafkaNodePool, and the Strimzi Cluster Operator removes the broker.
#
# Strimzi holds back the removal of a broker that still hosts partition
# replicas. The remove-brokers auto-rebalance of the krafter cluster would
# move them off first, but with three brokers and RF=3 there is nowhere to
# move them. Without the annotation below, the step fails after
# chaosDurationSec and Kates puts the pool back to 1 replica. To remove the
# broker together with its replicas, first run:
#
#   kubectl annotate kafka krafter -n kafka strimzi.io/skip-broker-scaledown-check=true
#
# Hypothesis:
#   With RF=3 and 2 brokers left, every partition keeps 2 in-sync replicas,
#   so min.isr=2 is still satisfied. Producers with acks=all see no errors.
#
# A resilience test does not bring the broker back. Kates orphan recovery
# does, if Kates restarts 15 minutes or more after the test. To restore it
# yourself:
#
#   kubectl patch kafkanodepool brokers-sigma -n kafka --type merge -p '{"spec":{"replicas":1}}'
#   kubectl annotate kafkanodepool brokers-sigma -n kafka kates.io/original-replicas- kates.io/scaled-down-at-
#   kubectl annotate kafka krafter -n kafka strimzi.io/skip-broker-scaledown-check-
#
# Usage:
#   kates resilience run -f cli/examples/resilience-scale-down.yaml
# ─────────────────────────────────────────────────────────────────────────────

testRequest:
  type: ENDURANCE
  spec:
    topic: kates-metrics
    partitions: 6
    replicationFactor: 3
    minInsyncReplicas: 2
    durationMs: 300000        # 5 min — covers steady state, the removal budget and recovery
    numRecords: 900000
    recordSize: 1024
    throughput: 3000
    numProducers: 3
    numConsumers: 2
    consumerGroup: scale-down-cg
    acks: "all"
    enableIdempotence: true
    batchSize: 65536
    lingerMs: 5
    compressionType: lz4

chaosSpec:
  experimentName: scale-down-sigma
  disruptionType: SCALE_DOWN
  targetNamespace: kafka
  targetLabel: "strimzi.io/pool-name=brokers-sigma"
  chaosDurationSec: 120       # budget for the operator to remove the broker
  delayBeforeSec: 0

steadyStateSec: 30
maxRecoveryWaitSec: 120

probes:
  - name: isr-health-check
    type: cmdProbe
    mode: Continuous
    command: "kafka-topics.sh --bootstrap-server localhost:9092 --describe --under-replicated-partitions 2>/dev/null | grep -c 'Topic:' || echo '0'"
    expectedOutput: "50"
    comparator: "<="
    intervalSec: 10
    timeoutSec: 30

  - name: cluster-ready
    type: k8sProbe
    mode: Edge
    command: "kafka Ready"
    expectedOutput: "Ready"
    comparator: contains
    intervalSec: 15
    timeoutSec: 30
