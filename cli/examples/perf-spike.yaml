# ─────────────────────────────────────────────────────────────────────────────
# Performance Test: SPIKE — Burst After Idle
# ─────────────────────────────────────────────────────────────────────────────
# A SPIKE run starts one producer and runs it unthrottled: the Kates API
# refuses any rate but -1 for it. So the idle baseline and the recovery, which
# run at a set rate, are LOAD runs, each with one producer and one consumer.
#
# Usage:  kates test apply -f cli/examples/perf-spike.yaml --wait
# ─────────────────────────────────────────────────────────────────────────────
scenarios:
  - name: "Spike — idle baseline"
    type: LOAD
    spec:
      topic: kates-events
      partitions: 6
      replicationFactor: 3
      minInsyncReplicas: 2
      records: 30000
      recordSizeBytes: 512
      targetThroughput: 500
      acks: "all"
      enableIdempotence: true
      batchSize: 65536
      lingerMs: 5
      compressionType: lz4
    validate:
      maxP99LatencyMs: 100

  - name: "Spike — unlimited burst"
    type: SPIKE
    spec:
      topic: kates-events
      partitions: 6
      replicationFactor: 3
      minInsyncReplicas: 2
      records: 300000
      recordSizeBytes: 512
      targetThroughput: -1      # maximum burst
      acks: "all"
      enableIdempotence: true
      batchSize: 65536
      lingerMs: 5
      compressionType: lz4
    validate:
      maxP99LatencyMs: 1000     # spikes tolerate higher latency

  - name: "Spike — post-burst recovery"
    type: LOAD
    spec:
      topic: kates-events
      partitions: 6
      replicationFactor: 3
      minInsyncReplicas: 2
      records: 180000
      recordSizeBytes: 512
      targetThroughput: 3000
      acks: "all"
      enableIdempotence: true
      batchSize: 65536
      lingerMs: 5
      compressionType: lz4
    validate:
      maxP99LatencyMs: 200
      minThroughputRecPerSec: 2500
