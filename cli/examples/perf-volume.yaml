# ─────────────────────────────────────────────────────────────────────────────
# Performance Test: VOLUME — Large Message Payload Throughput
# ─────────────────────────────────────────────────────────────────────────────
# A VOLUME run starts one producer and no consumer.
#
# Usage:  kates test apply -f cli/examples/perf-volume.yaml --wait
# ─────────────────────────────────────────────────────────────────────────────
scenarios:
  - name: "Volume — 64 KB payloads, snappy"
    type: VOLUME
    spec:
      topic: kates-audit
      partitions: 3
      replicationFactor: 3
      minInsyncReplicas: 2
      records: 100000
      recordSizeBytes: 65536    # 64 KB
      targetThroughput: 500     # 500 × 64 KB ≈ 32 MB/s
      acks: "all"
      enableIdempotence: true
      batchSize: 1048576        # 1 MB — must be ≥ recordSizeBytes
      lingerMs: 20
      compressionType: snappy
    validate:
      maxP99LatencyMs: 2000
      maxAvgLatencyMs: 500
      minThroughputRecPerSec: 400
