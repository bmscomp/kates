# ─────────────────────────────────────────────────────────────────────────────
# Resilience Test: NODE_DRAIN — Kubernetes Node Maintenance
# ─────────────────────────────────────────────────────────────────────────────
# Drains gamma, the Kubernetes node that runs the brokers-gamma pool on the
# Kind lab (config/cluster.yaml), and evicts every pod on it, not only the
# broker. The Strimzi Drain Cleaner intercepts the eviction webhook and
# triggers a controlled Kafka shutdown before the pod is evicted, ensuring zero
# partition downtime during node maintenance windows. brokers-gamma is pinned
# to gamma (a required node affinity and a local volume), so its pod stays
# Pending until node-drain uncordons gamma, when chaosDurationSec ends.
#
# Litmus's node-drain drains the node named in TARGET_NODE. Kates sets none,
# and passes node-drain no pods from targetLabel, so envOverrides names the
# node. On another cluster, name the node that runs the broker to drain.
#
# Hypothesis:
#   Drain Cleaner intercepts eviction → triggers controlled shutdown →
#   partition leaders transferred off gamma → pod evicted → rescheduled.
#   Zero partition unavailability. Producer errors = 0.
#
# Usage:
#   kates resilience run -f cli/examples/resilience-node-drain.yaml
# ─────────────────────────────────────────────────────────────────────────────

testRequest:
  type: ENDURANCE
  spec:
    topic: kates-results
    partitions: 6
    replicationFactor: 3
    minInsyncReplicas: 2
    durationMs: 300000
    numRecords: 900000
    recordSize: 1024
    throughput: 3000
    consumerGroup: drain-test-cg
    acks: "all"
    enableIdempotence: true
    batchSize: 65536
    lingerMs: 5
    compressionType: lz4

chaosSpec:
  experimentName: node-drain-gamma
  disruptionType: NODE_DRAIN
  targetNamespace: kafka
  targetLabel: "strimzi.io/pool-name=brokers-gamma"
  chaosDurationSec: 60
  delayBeforeSec: 0
  envOverrides:
    TARGET_NODE: gamma

steadyStateSec: 30
maxRecoveryWaitSec: 180      # rescheduling takes longer than pod restart

probes:
  - name: isr-health-check
    type: cmdProbe
    mode: Continuous
    command: "kafka-topics.sh --bootstrap-server localhost:9092 --describe --under-replicated-partitions 2>/dev/null | grep -c 'Topic:' || echo '0'"
    expectedOutput: "50"
    comparator: "<="
    intervalSec: 10
    timeoutSec: 30

  - name: partition-availability
    type: cmdProbe
    mode: Continuous
    command: "kafka-topics.sh --bootstrap-server localhost:9092 --describe --unavailable-partitions 2>/dev/null | grep -c 'Topic:' || echo '0'"
    expectedOutput: "0"
    comparator: "<="          # 0 or fewer; the probe executor has no ==
    intervalSec: 10
    timeoutSec: 30
