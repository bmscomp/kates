# ─────────────────────────────────────────────────────────────────────────────
# Performance Test: ENDURANCE — Long-Running Soak
# ─────────────────────────────────────────────────────────────────────────────
# An ENDURANCE run starts one producer and one consumer.
#
# Usage:  kates test apply -f cli/examples/perf-endurance.yaml --wait
# ─────────────────────────────────────────────────────────────────────────────
scenarios:
  - name: "Endurance Soak — 10 min at 6k msg/s"
    type: ENDURANCE
    spec:
      topic: kates-metrics
      partitions: 6
      replicationFactor: 3
      minInsyncReplicas: 2
      durationSeconds: 600      # 10 min; kates test apply sends it as durationMs
      records: 3600000
      recordSizeBytes: 1024
      targetThroughput: 6000
      consumerGroup: soak-cg
      acks: "all"
      enableIdempotence: true
      batchSize: 65536
      lingerMs: 5
      compressionType: lz4
      fetchMinBytes: 65536
      fetchMaxWaitMs: 500
    validate:
      maxP99LatencyMs: 300
      maxAvgLatencyMs: 75
      minThroughputRecPerSec: 5500
