# ─────────────────────────────────────────────────────────────────────────────
# Resilience Test: ROLLING_RESTART — Strimzi Rolling Update
# ─────────────────────────────────────────────────────────────────────────────
# Annotates every Kafka pod of the cluster with strimzi.io/manual-rolling-update
# and lets the Strimzi Cluster Operator roll them, one pod at a time, exactly
# as it does for a version upgrade or config change. Pods the selector matches
# that no StrimziPodSet runs (entity operator, exporter) are skipped.
#
# Hypothesis:
#   Each broker restart triggers a brief leader transfer. The operator waits
#   for each broker to be ready before the next, so with acks=all producers
#   survive the full rolling restart with 0 errors. ISR never drops below 2/3
#   (min.insync.replicas satisfied).
#
# Usage:
#   kates resilience run -f cli/examples/resilience-rolling-restart.yaml
# ─────────────────────────────────────────────────────────────────────────────

testRequest:
  type: ENDURANCE
  spec:
    topic: kates-results
    partitions: 6
    replicationFactor: 3
    minInsyncReplicas: 2
    durationMs: 300000        # 5 min — covers the full 3-broker rolling restart
    numRecords: 900000
    recordSize: 1024
    throughput: 3000
    numProducers: 3
    numConsumers: 3
    consumerGroup: rolling-restart-cg
    acks: "all"
    enableIdempotence: true
    batchSize: 65536
    lingerMs: 5
    compressionType: lz4

chaosSpec:
  experimentName: rolling-restart-all-pools
  disruptionType: ROLLING_RESTART
  targetNamespace: kafka
  targetLabel: "strimzi.io/cluster=krafter"
  chaosDurationSec: 300      # wait for the roll: next reconciliation (≤2 min) + restarts
  delayBeforeSec: 0

steadyStateSec: 30
maxRecoveryWaitSec: 120

probes:
  - name: isr-health-check
    type: cmdProbe
    mode: Continuous
    command: "kafka-topics.sh --bootstrap-server localhost:9092 --describe --under-replicated-partitions 2>/dev/null | grep -c 'Topic:' || echo '0'"
    expectedOutput: "50"
    comparator: "<="
    intervalSec: 10
    timeoutSec: 30

  - name: cluster-ready
    type: k8sProbe
    mode: Edge
    command: "kafka Ready"
    expectedOutput: "Ready"
    comparator: contains
    intervalSec: 15
    timeoutSec: 30
