# ─────────────────────────────────────────────────────────────────────────────
# Resilience Test: POD_KILL — Hard Broker Crash (SIGKILL)
# ─────────────────────────────────────────────────────────────────────────────
# Simulates a kernel panic or OOM kill. The broker receives no SIGTERM and has
# no time to flush logs or transfer partition leadership before termination:
# POD_KILL deletes the pod with no grace period on either chaos provider.
#
# Hypothesis:
#   Leader re-election completes within 15s (controller.quorum.fetch.timeout.ms).
#   Idempotent producer with acks=all stalls, then retries successfully.
#   ISR recovers to 3/3 within 120s. Zero data loss.
#
# A resilience run checks no SLA: compare its report with the hypothesis. Only
# an INTEGRITY test measures data loss.
#
# Usage:
#   kates resilience run -f cli/examples/resilience-test.yaml
# ─────────────────────────────────────────────────────────────────────────────

testRequest:
  type: LOAD
  spec:
    topic: kates-events
    partitions: 6
    replicationFactor: 3
    minInsyncReplicas: 2
    numRecords: 500000
    recordSize: 1024
    throughput: 5000
    consumerGroup: resilience-pod-kill-cg
    acks: "all"
    enableIdempotence: true
    batchSize: 65536
    lingerMs: 5
    compressionType: lz4

chaosSpec:
  experimentName: broker-hard-crash
  disruptionType: POD_KILL
  targetNamespace: kafka
  targetLabel: "strimzi.io/pool-name=brokers-alpha"
  chaosDurationSec: 30      # kill window — Kubernetes restarts the pod
  delayBeforeSec: 0

steadyStateSec: 30
maxRecoveryWaitSec: 120

probes:
  - name: isr-health-check
    type: kafkaProbe
    mode: Continuous
    command: under-replicated-partitions
    expectedOutput: "50"
    comparator: "<="
    intervalSec: 10
    timeoutSec: 30

  - name: cluster-ready
    type: k8sProbe
    mode: Edge
    command: "kafka Ready"
    expectedOutput: "Ready=True"
    comparator: equal
    intervalSec: 15
    timeoutSec: 30
