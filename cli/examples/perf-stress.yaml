# ─────────────────────────────────────────────────────────────────────────────
# Performance Test: STRESS — Throughput Saturation Curve
# ─────────────────────────────────────────────────────────────────────────────
# Runs 4 sequential scenarios at increasing throughput to find the knee of the
# latency curve. Each step increases load until SLA is breached.
#
# A STRESS run starts parallelProducers producers, and each one sends `records`
# records at up to targetThroughput msg/s: a step's rate is parallelProducers ×
# targetThroughput. kates test apply --wait checks each gate against every
# producer.
#
# Usage:  kates test apply -f cli/examples/perf-stress.yaml --wait
# ─────────────────────────────────────────────────────────────────────────────
scenarios:
  - name: "Stress — 5k msg/s"
    type: STRESS
    spec:
      topic: kates-results
      partitions: 6
      replicationFactor: 3
      minInsyncReplicas: 2
      records: 500000
      recordSizeBytes: 1024
      targetThroughput: 1667    # per producer: 3 × 1667 ≈ 5k msg/s
      parallelProducers: 3
      acks: "all"
      enableIdempotence: true
      batchSize: 131072
      lingerMs: 10
      compressionType: snappy
    validate:
      maxP99LatencyMs: 200

  - name: "Stress — 15k msg/s"
    type: STRESS
    spec:
      topic: kates-results
      partitions: 6
      replicationFactor: 3
      minInsyncReplicas: 2
      records: 500000
      recordSizeBytes: 1024
      targetThroughput: 5000    # per producer: 3 × 5000 = 15k msg/s
      parallelProducers: 3
      acks: "all"
      enableIdempotence: true
      batchSize: 131072
      lingerMs: 10
      compressionType: snappy
    validate:
      maxP99LatencyMs: 300

  - name: "Stress — 30k msg/s"
    type: STRESS
    spec:
      topic: kates-results
      partitions: 6
      replicationFactor: 3
      minInsyncReplicas: 2
      records: 500000
      recordSizeBytes: 1024
      targetThroughput: 7500    # per producer: 4 × 7500 = 30k msg/s
      parallelProducers: 4
      acks: "all"
      enableIdempotence: true
      batchSize: 131072
      lingerMs: 10
      compressionType: snappy
    validate:
      maxP99LatencyMs: 500

  - name: "Stress — unlimited (find ceiling)"
    type: STRESS
    spec:
      topic: kates-results
      partitions: 6
      replicationFactor: 3
      minInsyncReplicas: 2
      records: 500000
      recordSizeBytes: 1024
      targetThroughput: -1      # no cap — saturate the cluster
      parallelProducers: 6
      acks: "all"
      enableIdempotence: true
      batchSize: 131072
      lingerMs: 10
      compressionType: snappy
    validate:
      minThroughputRecPerSec: 834   # per producer, 6 × 834 ≈ 5k msg/s: fail only if below that even uncapped
