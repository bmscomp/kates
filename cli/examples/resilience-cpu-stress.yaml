# ─────────────────────────────────────────────────────────────────────────────
# Resilience Test: CPU_STRESS — Broker CPU Saturation
# ─────────────────────────────────────────────────────────────────────────────
# Loads 1 CPU core of the gamma broker fully while a producer writes 8 KB
# records at 1000 rec/s. For more producers, make it a STRESS run: a LOAD run
# starts one producer and one consumer, whatever numProducers says.
# Observes ISR shrink/expand cycle caused by replication lag under CPU pressure.
#
# Hypothesis:
#   CPU-starved follower replication lag rises above replica.lag.time.max.ms (30s).
#   gamma is evicted from ISR. The producer stalls with acks=all until ISR recovers.
#   ISR returns to 3/3 within 90s of chaos ending.
#
# Usage:
#   kates resilience run -f cli/examples/resilience-cpu-stress.yaml
# ─────────────────────────────────────────────────────────────────────────────

testRequest:
  type: LOAD
  spec:
    topic: kates-results
    partitions: 6
    replicationFactor: 3
    minInsyncReplicas: 2
    numRecords: 300000
    recordSize: 8192          # 8 KB — large records amplify CPU pressure
    throughput: 1000
    acks: "all"
    enableIdempotence: true
    batchSize: 131072
    lingerMs: 10
    compressionType: snappy   # snappy is CPU-bound — adds to broker pressure

chaosSpec:
  experimentName: cpu-saturation-gamma
  disruptionType: CPU_STRESS
  targetNamespace: kafka
  targetLabel: "strimzi.io/pool-name=brokers-gamma"
  chaosDurationSec: 120
  delayBeforeSec: 0
  cpuCores: 1                 # hog 1 core

steadyStateSec: 20
maxRecoveryWaitSec: 90

probes:
  - name: isr-health-check
    type: kafkaProbe
    mode: Continuous
    command: under-replicated-partitions
    expectedOutput: "50"
    comparator: "<="
    intervalSec: 10
    timeoutSec: 30

  - name: producer-throughput
    type: kafkaProbe
    mode: Continuous
    command: produce kates-probe-topic
    expectedOutput: "0"
    comparator: ">"
    intervalSec: 15
    timeoutSec: 30
