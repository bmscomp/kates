- name: cluster alerts
  category: Cluster
  synopsis: "kates cluster alerts [flags]"
  short: "Show critical Kafka health alerts from PrometheusRules"
  description: |
    Reads PrometheusRule CRDs from the cluster and displays
    critical and warning alerts that affect Kafka health.
    Alerts are sorted by severity (critical first), showing
    name, group, firing threshold, PromQL expression, and
    description.

    Returns exit code 2 when critical alerts are configured,
    making it suitable for CI/CD health gates.

    Covers 16 alert rules across 8 groups: cluster health,
    consumer lag, KRaft stability, network latency, operator
    availability, replication, performance, Cruise Control,
    and certificate expiry.
  flags:
    - name: "--severity"
      type: string
      desc: "Filter by severity: critical or warning"
    - name: "--group"
      type: string
      desc: "Filter by alert group (e.g. kafka.cluster, kafka.kraft)"
  examples:
    - "kates cluster alerts"
    - "kates cluster alerts --severity critical"
    - "kates cluster alerts --group kafka.kraft"
    - "kates cluster alerts -o json"
    - "kates cluster alerts --severity critical && echo 'safe'"
  see_also:
    - cluster topology
    - cluster check

