    - name: "--metric"
      type: string
      default: "p99LatencyMs"
      desc: "Metric to track"
    - name: "--days"
      type: int
      default: "30"
      desc: "Lookback period in days"
    - name: "--baseline-window"
      type: int
      default: "5"
      desc: "Number of runs for baseline calculation"
    - name: "--phase"
      type: string
      desc: "Filter to a specific test phase"
  examples:
    - "kates trend"
    - "kates trend --type STRESS --metric avgThroughputRecPerSec"
    - "kates trend --days 14 --phase spike"
  see_also:
    - benchmark
    - test summary

- name: benchmark
  category: Analysis
  synopsis: "kates benchmark [flags]"
  short: "Run a full test battery with letter-grade scorecard"
  description: |
    Executes LOAD → STRESS → SPIKE tests in sequence and produces
    a letter-grade scorecard (A through F) based on throughput,
    latency, and error rate thresholds.
  flags:
    - name: "--records"
      type: int
      default: "50000"
      desc: "Records per test"
    - name: "--backend"
      type: string
      desc: "Test backend to use"
  examples:
    - "kates benchmark"
    - "kates benchmark --records 100000"
  see_also:
    - gate
    - test create

- name: gate
  category: Analysis
  synopsis: "kates gate [flags]"
  short: "CI quality gate — exit non-zero if grade is below threshold"
  description: |
    Runs a test and assigns a letter grade. Exits with code 1 if
    the grade is below the specified minimum. Designed for CI/CD
    pipeline integration.
  flags:
    - name: "--min-grade"
      type: string
      default: "C"
      desc: "Minimum passing grade (A, B, C, D, F)"
    - name: "--type"
      type: string
      default: "LOAD"
      desc: "Test type to run"
    - name: "--records"
      type: int
      default: "50000"
      desc: "Number of records"
    - name: "--backend"
      type: string
      desc: "Benchmark backend"
    - name: "--timeout"
      type: int
      default: "180"
      desc: "Timeout in seconds"
  examples:
    - "kates gate --min-grade B --type STRESS"
    - "kates gate --min-grade A --records 100000 --timeout 300"
  see_also:
    - benchmark
    - test create

- name: explain
  category: Analysis
  synopsis: "kates explain <id>"
  short: "Plain-English summary and verdict for a test run"
  description: |
    Generates a human-readable narrative explaining what happened
    during a test run, including performance highlights, anomalies,
    and a final verdict.
  examples:
    - "kates explain abc123"
  see_also:
    - report show
    - test get

- name: replay
  category: Analysis
  synopsis: "kates replay <id>"
  short: "Re-run a previous test with the same parameters"
  description: |
    Creates a new test run using the exact same configuration
    as a previous run. Useful for reproducibility testing.
  examples:
    - "kates replay abc123"
  see_also:
    - test create
    - test get

- name: diff
  category: Analysis
  synopsis: "kates diff <id1> <id2>"
  short: "Side-by-side comparison of two test run reports"
  examples:
    - "kates diff abc123 def456"
  see_also:
    - test compare
    - report compare

- name: scenario-diff
  category: Analysis
  synopsis: "kates scenario-diff <id> [flags]"
  short: "Compare a scenario YAML against actual test results"
  description: |
    Loads a YAML scenario and compares its expected SLA thresholds
    against the actual results of a completed test run.
  examples:
    - "kates scenario-diff abc123 -f scenario.yaml"
  see_also:
    - test apply
    - diff

- name: disruption run
  category: Disruption
  synopsis: "kates disruption run [flags]"
  short: "Execute a disruption plan from a JSON config file"
  description: |
    Runs chaos engineering experiments against the Kafka cluster
    using LitmusChaos. Supports dry-run mode, SLA breach detection,
    and JUnit output for CI/CD integration.
  flags:
    - name: "--config"
      type: string
      desc: "Path to disruption plan JSON config (required)"
    - name: "--dry-run"
      type: bool
      desc: "Validate plan without executing"
    - name: "--fail-on-sla-breach"
      type: bool
      desc: "Exit code 1 if SLA is violated"
    - name: "--output-junit"
      type: string
      desc: "Write JUnit XML report to file"
  examples:
    - "kates disruption run --config plan.json"
    - "kates disruption run --config plan.json --dry-run"
    - "kates disruption run --config plan.json --fail-on-sla-breach --output-junit report.xml"
  see_also:
    - disruption types
    - disruption playbook list

- name: disruption list
  category: Disruption
  synopsis: "kates disruption list"
  short: "List recent disruption test reports"
  examples:
    - "kates disruption list"
  see_also:
    - disruption status

- name: disruption status
  category: Disruption
  synopsis: "kates disruption status <id>"
  short: "Show disruption test report"
  examples:
    - "kates disruption status abc123"
  see_also:
    - disruption list
    - disruption timeline

- name: disruption timeline
  category: Disruption
  synopsis: "kates disruption timeline <id>"
  short: "Show pod event timeline for a disruption test"
  examples:
    - "kates disruption timeline abc123"
  see_also:
    - disruption status

- name: disruption types
  category: Disruption
  synopsis: "kates disruption types"
  short: "List available disruption types"
  examples:
    - "kates disruption types"
  see_also:
    - disruption run

- name: disruption kafka-metrics
  category: Disruption
  synopsis: "kates disruption kafka-metrics <id>"
  short: "Show Kafka intelligence metrics for a disruption test"
  description: |
    Displays ISR tracking, consumer lag, and leader targeting
    metrics collected during a disruption experiment.
  examples:
    - "kates disruption kafka-metrics abc123"
  see_also:
    - disruption status

- name: disruption watch
  category: Disruption
  synopsis: "kates disruption watch <id>"
  short: "Stream real-time progress events from a running disruption"
  examples:
    - "kates disruption watch abc123"
  see_also:
    - disruption status

- name: disruption playbook list
  category: Disruption
  synopsis: "kates disruption playbook list"
  short: "List available disruption playbooks"
  examples:
    - "kates disruption playbook list"
  see_also:
    - disruption playbook run

- name: disruption playbook run
  category: Disruption
  synopsis: "kates disruption playbook run <name>"
  short: "Execute a pre-built disruption playbook"
  examples:
    - "kates disruption playbook run broker-kill"
  see_also:
    - disruption playbook list
    - disruption run

- name: disruption schedule list
  category: Disruption
  synopsis: "kates disruption schedule list"
  short: "List disruption schedules"
  examples:
    - "kates disruption schedule list"
  see_also:
    - disruption schedule create

- name: disruption schedule create
  category: Disruption
  synopsis: "kates disruption schedule create <name> [flags]"
  short: "Create a new disruption schedule"
  flags:
    - name: "--playbook"
      type: string
      desc: "Playbook name"
    - name: "--cron"
      type: string
      desc: "Cron expression (5-field)"
  examples:
    - "kates disruption schedule create nightly-chaos --playbook broker-kill --cron '0 3 * * *'"
  see_also:
    - disruption schedule list

- name: disruption schedule delete
  category: Disruption
  synopsis: "kates disruption schedule delete <id>"
  short: "Delete a disruption schedule"
  examples:
    - "kates disruption schedule delete abc123"
  see_also:
    - disruption schedule list

- name: schedule list
  category: Scheduling
  synopsis: "kates schedule list"
  short: "List all scheduled tests"
  examples:
    - "kates schedule list"
  see_also:
    - schedule get
    - schedule create

- name: schedule get
  category: Scheduling
  synopsis: "kates schedule get <id>"
  short: "Show details of a scheduled test"
  examples:
    - "kates schedule get s1"
  see_also:
    - schedule list

- name: schedule create
  category: Scheduling
  synopsis: "kates schedule create [flags]"
  short: "Create a new scheduled test"
  description: |
    Creates a recurring test schedule using a cron expression.
    The scheduled test runs automatically at the specified interval.
  flags:
    - name: "--name"
      type: string
      desc: "Schedule name (required)"
    - name: "--cron"
      type: string
      desc: "Cron expression (required)"
    - name: "--type"
      type: string
      desc: "Test type"
    - name: "--enabled"
      type: bool
      default: "true"
      desc: "Whether the schedule is active"
  examples:
    - "kates schedule create --name nightly-load --cron '0 0 * * *' --type LOAD"
  see_also:
    - schedule list
    - schedule delete

- name: schedule delete
  category: Scheduling
  synopsis: "kates schedule delete <id>"
  short: "Delete a scheduled test"
  examples:
    - "kates schedule delete s1"
  see_also:
    - schedule list

- name: resilience run
  category: Resilience
  synopsis: "kates resilience run [flags]"
  short: "Run combined performance + chaos resilience tests"
  description: |
    Executes a combined performance and chaos resilience test
    using a JSON configuration file. Measures impact deltas
    between baseline and chaos states.
  flags:
    - name: "--config"
      type: string
      desc: "Path to resilience test config JSON (required)"
  examples:
    - "kates resilience run --config resilience.json"
  see_also:
    - disruption run
    - benchmark

- name: ctx show
  category: Config
  synopsis: "kates ctx show"
  short: "Show all contexts and current selection"
  examples:
    - "kates ctx show"
  see_also:
    - ctx set
    - ctx use

- name: ctx set
  category: Config
  synopsis: "kates ctx set <name> [flags]"
  short: "Create or update a context"
  flags:
    - name: "--url"
      type: string
      desc: "Kates API base URL (required)"
    - name: "--output"
      type: string
      desc: "Default output format for this context"
  examples:
    - "kates ctx set local --url http://localhost:30083"
    - "kates ctx set staging --url https://kates.staging.internal --output json"
  see_also:
    - ctx use
    - ctx show

- name: ctx use
  category: Config
  synopsis: "kates ctx use <name>"
  short: "Switch to a context"
  examples:
    - "kates ctx use local"
    - "kates ctx use staging"
  see_also:
    - ctx set
    - ctx show

- name: ctx delete
  category: Config
  synopsis: "kates ctx delete <name>"
  short: "Remove a context"
  examples:
    - "kates ctx delete old-server"
  see_also:
    - ctx show

- name: ctx current
  category: Config
  synopsis: "kates ctx current"
  short: "Print the active context name and URL"
  examples:
    - "kates ctx current"
  see_also:
    - ctx show
    - ctx use

- name: dashboard
  category: Observability
  synopsis: "kates dashboard [flags]"
  short: "Full-screen monitoring dashboard with live metrics"
  description: |
    Launches a full-screen terminal dashboard showing live
    system health, running tests, recent results, and cluster
    metrics. Refreshes automatically.
  flags:
    - name: "--interval"
      type: int
      default: "3"
      desc: "Refresh interval in seconds"
  examples:
    - "kates dashboard"
    - "kates dash"
    - "kates dashboard --interval 10"
  see_also:
    - top
    - cluster watch

- name: top
  category: Observability
  synopsis: "kates top"
  short: "Live view of running tests (like kubectl top)"
  description: |
    Displays a continuously refreshing view of active test runs
    with real-time progress and metrics.
  examples:
    - "kates top"
  see_also:
    - dashboard
    - test list

- name: webhook list
  category: Observability
  synopsis: "kates webhook list"
  short: "List registered webhooks"
  examples:
    - "kates webhook list"
  see_also:
    - webhook register
    - webhook delete

- name: webhook register
  category: Observability
  synopsis: "kates webhook register <name> --url <url>"
  short: "Register a webhook for test completion events"
  flags:
    - name: "--url"
      type: string
      desc: "Webhook endpoint URL (required)"
  examples:
    - "kates webhook register slack-notify --url https://hooks.slack.com/services/xxx"
  see_also:
    - webhook list
    - webhook delete

- name: webhook delete
  category: Observability
  synopsis: "kates webhook delete <name>"
  short: "Remove a registered webhook"
  examples:
    - "kates webhook delete slack-notify"
  see_also:
    - webhook list

- name: test scaffold
  category: Toolbox
  synopsis: "kates test scaffold [subcommand]"
  short: "Browse and export built-in test scenario templates"
  description: |
    The scenario library ships 7 curated YAML templates embedded
    in the CLI binary via embed.FS. Use 'list' to browse, 'show'
    for a syntax-highlighted preview, and 'export' to write to disk.
  examples:
    - "kates test scaffold list"
    - "kates test scaffold show quick-load"
    - "kates test scaffold export ci-gate"
    - "kates test scaffold export --all"
  see_also:
    - test apply
    - init

- name: test scaffold list
  category: Toolbox
  synopsis: "kates test scaffold list"
  short: "List all 7 built-in scenario templates"
  description: |
    Displays a table of all embedded scenario templates with
    name, test type, and description. Templates cover quick-load,
    production-load, stress-test, endurance-soak, exactly-once,
    spike-test, and ci-gate scenarios.
  examples:
    - "kates test scaffold list"
  see_also:
    - test scaffold show
    - test scaffold export

- name: test scaffold show
  category: Toolbox
  synopsis: "kates test scaffold show <name>"
  short: "Preview a scenario template with syntax highlighting"
  description: |
    Renders the YAML content of a built-in scenario template
    with syntax-highlighted keys. Shows export and run hints.
  examples:
    - "kates test scaffold show quick-load"
    - "kates test scaffold show production-load"
  see_also:
    - test scaffold list
    - test scaffold export

- name: test scaffold export
  category: Toolbox
  synopsis: "kates test scaffold export [name] [flags]"
  short: "Export scenario template(s) to the file system"
  description: |
    Writes one or all scenario templates from the embedded
    library to the current directory (or --dir). Skips files
    that already exist.
  flags:
    - name: "--all"
      type: bool
      desc: "Export all 7 templates"
    - name: "--dir"
      short: "-d"
      type: string
      desc: "Output directory (default: current)"
  examples:
    - "kates test scaffold export quick-load"
    - "kates test scaffold export --all"
    - "kates test scaffold export production-load --dir ./scenarios/"
  see_also:
    - test scaffold list
    - test apply

- name: init
  category: Toolbox
  synopsis: "kates init [flags]"
  short: "Initialize a new Kates workspace with config, scenarios, and CI gate"
  description: |
    Sets up a complete Kates project in the current directory:
    1) Creates ~/.kates.yaml with a named context.
    2) Exports all 7 built-in scenario templates to scenarios/.
    3) Generates kates-ci.sh — a CI pipeline gate script with
       KATES_URL env var support and exit code propagation.
  flags:
    - name: "--name"
      type: string
      default: "default"
      desc: "Context name"
    - name: "--url"
      type: string
      default: "http://localhost:8080"
      desc: "Kates API URL"
    - name: "--dir"
      type: string
      default: "."
      desc: "Project directory to scaffold into"
    - name: "--no-scenarios"
      type: bool
      desc: "Skip scenario template export"
    - name: "--no-ci"
      type: bool
      desc: "Skip CI gate script generation"
  examples:
    - "kates init"
    - "kates init --url http://kates.internal:8080 --name production"
    - "kates init --no-scenarios --no-ci"
  see_also:
    - test scaffold list
    - ctx set

- name: audit
  category: Observability
  synopsis: "kates audit [flags]"
  short: "Show audit log of all mutating operations"
  description: |
    Displays a chronological log of all mutations (test creates/deletes,
    topic changes, disruption runs) with timestamps, action types,
    and details. Supports filtering by event type and time range.
    Action badges: green "+ CREATE", red "- DELETE", cyan "~ UPDATE".
  flags:
    - name: "--limit"
      type: int
      default: "50"
      desc: "Maximum number of events to show"
    - name: "--type"
      type: string
      desc: "Filter by event type (test, topic, disruption, resilience)"
    - name: "--since"
      type: string
      desc: "Show events after this ISO-8601 timestamp"
  examples:
    - "kates audit"
    - "kates audit --limit 20 --type test"
    - "kates audit --type topic --since 2024-01-01T00:00:00Z"
    - "kates audit -o json"
  see_also:
    - test list
    - dashboard

- name: cluster diff
  category: Analysis
  synopsis: "kates cluster diff --from <ctx> --to <ctx>"
  short: "Compare Kafka cluster state between two contexts"
  description: |
    Compares topics, consumer groups, and configurations between
    two named contexts. Shows added, removed, and changed resources
    in a colour-coded diff table.
  flags:
    - name: "--from"
      type: string
      desc: "Source context name (required)"
    - name: "--to"
      type: string
      desc: "Target context name (required)"
  examples:
    - "kates cluster diff --from local --to staging"
    - "kates cluster diff --from dev --to production"
  see_also:
    - ctx show
    - cluster info

- name: ctx export
  category: Config
  synopsis: "kates ctx export [name]"
  short: "Export context(s) as YAML for team sharing"
  description: |
    Marshals the specified context (or all contexts if no name given)
    to YAML on stdout. Compatible with 'kates ctx import'.
  examples:
    - "kates ctx export staging > kates-staging.yaml"
    - "kates ctx export > all-contexts.yaml"
  see_also:
    - ctx import
    - ctx show

- name: ctx import
  category: Config
  synopsis: "kates ctx import [flags]"
  short: "Import contexts from YAML file or stdin"
  description: |
    Reads context definitions from a YAML file (or stdin) and
    merges them into ~/.kates.yaml. Existing contexts with the
    same name are overwritten.
  flags:
    - name: "--file"
      short: "-f"
      type: string
      desc: "Path to YAML file (default: stdin)"
  examples:
    - "kates ctx import -f kates-staging.yaml"
    - "cat contexts.yaml | kates ctx import"
  see_also:
    - ctx export
    - ctx show

- name: plugin list
  category: Toolbox
  synopsis: "kates plugin list"
  short: "List discovered plugin commands"
  description: |
    Scans ~/.kates/plugins/ and $PATH for executables prefixed
    with 'kates-' and displays them with their full paths.
    Plugins are invoked as 'kates <name>' (e.g., kates-hello → kates hello).
  examples:
    - "kates plugin list"
  see_also:
    - init
