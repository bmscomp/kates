      default: "p99LatencyMs"
      desc: "Metric to track"
    - name: "--days"
      type: int
      default: "30"
      desc: "Lookback period in days"
    - name: "--baseline-window"
      type: int
      default: "5"
      desc: "Number of runs for baseline calculation"
    - name: "--phase"
      type: string
      desc: "Filter to a specific test phase"
  examples:
    - "kates trend"
    - "kates trend --type STRESS --metric avgThroughputRecPerSec"
    - "kates trend --days 14 --phase spike"
  see_also:
    - benchmark
    - test summary

- name: benchmark
  category: Analysis
  synopsis: "kates benchmark [flags]"
  short: "Run a full test battery with letter-grade scorecard"
  description: |
    Executes LOAD → STRESS → SPIKE tests in sequence and produces
    a letter-grade scorecard (A through F) based on throughput,
    latency, and error rate thresholds.
  flags:
    - name: "--records"
      type: int
      default: "50000"
      desc: "Records per test"
    - name: "--backend"
      type: string
      desc: "Test backend to use"
  examples:
    - "kates benchmark"
    - "kates benchmark --records 100000"
  see_also:
    - gate
    - test create

- name: gate
  category: Analysis
  synopsis: "kates gate [flags]"
  short: "CI quality gate — exit non-zero if grade is below threshold"
  description: |
    Runs a test and assigns a letter grade. Exits with code 1 if
    the grade is below the specified minimum. Designed for CI/CD
    pipeline integration.
  flags:
    - name: "--min-grade"
      type: string
      default: "C"
      desc: "Minimum passing grade (A, B, C, D, F)"
    - name: "--type"
      type: string
      default: "LOAD"
      desc: "Test type to run"
    - name: "--records"
      type: int
      default: "50000"
      desc: "Number of records"
    - name: "--backend"
      type: string
      desc: "Benchmark backend"
    - name: "--timeout"
      type: int
      default: "180"
      desc: "Timeout in seconds"
  examples:
    - "kates gate --min-grade B --type STRESS"
    - "kates gate --min-grade A --records 100000 --timeout 300"
  see_also:
    - benchmark
    - test create

- name: explain
  category: Analysis
  synopsis: "kates explain <id>"
  short: "Plain-English summary and verdict for a test run"
  description: |
    Generates a human-readable narrative explaining what happened
    during a test run, including performance highlights, anomalies,
    and a final verdict.
  examples:
    - "kates explain abc123"
  see_also:
    - report show
    - test get

- name: replay
  category: Analysis
  synopsis: "kates replay <id>"
  short: "Re-run a previous test with the same parameters"
  description: |
    Creates a new test run using the exact same configuration
    as a previous run. Useful for reproducibility testing.
  examples:
    - "kates replay abc123"
  see_also:
    - test create
    - test get

- name: diff
  category: Analysis
  synopsis: "kates diff <id1> <id2>"
  short: "Side-by-side comparison of two test run reports"
  examples:
    - "kates diff abc123 def456"
  see_also:
    - test compare
    - report compare

- name: scenario-diff
  category: Analysis
  synopsis: "kates scenario-diff <id> [flags]"
  short: "Compare a scenario YAML against actual test results"
  description: |
    Loads a YAML scenario and compares its expected SLA thresholds
    against the actual results of a completed test run.
  examples:
    - "kates scenario-diff abc123 -f scenario.yaml"
  see_also:
    - test apply
    - diff

- name: disruption run
  category: Disruption
  synopsis: "kates disruption run [flags]"
  short: "Execute a disruption plan from a JSON config file"
  description: |
    Runs chaos engineering experiments against the Kafka cluster
    using LitmusChaos. Supports dry-run mode, SLA breach detection,
    and JUnit output for CI/CD integration.
  flags:
    - name: "--config"
      type: string
      desc: "Path to disruption plan JSON config (required)"
    - name: "--dry-run"
      type: bool
      desc: "Validate plan without executing"
    - name: "--fail-on-sla-breach"
      type: bool
      desc: "Exit code 1 if SLA is violated"
    - name: "--output-junit"
      type: string
      desc: "Write JUnit XML report to file"
  examples:
    - "kates disruption run --config plan.json"
    - "kates disruption run --config plan.json --dry-run"
    - "kates disruption run --config plan.json --fail-on-sla-breach --output-junit report.xml"
  see_also:
    - disruption types
    - disruption playbook list

- name: disruption list
  category: Disruption
  synopsis: "kates disruption list"
  short: "List recent disruption test reports"
  examples:
