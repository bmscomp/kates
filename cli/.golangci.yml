# golangci-lint configuration for the Kates CLI (v2 schema)
# https://golangci-lint.run/usage/configuration/
#
# CI lints the whole tree with this file and fails on any finding: the
# backlog that waves 1-5 of plans/cli-enhancement.md paid down is at zero, so
# there is no waiver list and no --new-from-rev. A function over the funlen
# or gocyclo limit is split, an error is handled or discarded with `_ =` and
# a reason, and a //nolint needs a reason a reviewer accepts. cli/README.md
# (Lint as CI does) says how to run the same check locally.
version: "2"
run:
  timeout: 5m
  tests: true
linters:
  enable:
    - errcheck
    - funlen
    - gocyclo
  settings:
    funlen:
      lines: 100
      statements: 60
    gocyclo:
      min-complexity: 30
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    # Tests may be long: a table of cases is clearer in one function.
    rules:
      - linters:
          - funlen
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
