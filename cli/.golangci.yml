# golangci-lint configuration for the Kates CLI (v2 schema)
# https://golangci-lint.run/usage/configuration/
#
# CI runs this with --new-from-merge-base so only issues introduced by a PR are
# reported: the codebase carries a backlog (errcheck/staticcheck/funlen) that
# is paid down file by file rather than gated all at once.
version: "2"
run:
  timeout: 5m
  tests: true
linters:
  enable:
    - funlen
    - gocyclo
  settings:
    funlen:
      lines: 100
      statements: 60
    gocyclo:
      min-complexity: 30
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - funlen
        path: _test\.go
      - linters:
          - funlen
        path: deploy\.go
      - linters:
          - funlen
        path: security\.go
      - linters:
          - funlen
        path: cluster\.go
      - linters:
          - funlen
        path: clean\.go
      - linters:
          - funlen
        path: deploy_status\.go
      - linters:
          - funlen
        path: helm_test_cmd\.go
      - linters:
          - funlen
        path: kafka\.go
      - linters:
          - funlen
        path: connect\.go
      - linters:
          - funlen
        path: test\.go
      - linters:
          - funlen
        path: doctor_network\.go
      - linters:
          - funlen
        path: disruption\.go
      - linters:
          - funlen
        path: portforward\.go
      - linters:
          - funlen
        path: watch\.go
      - linters:
          - funlen
        path: deploy_dashboard\.go
      - linters:
          - funlen
        path: upgrade\.go
      - linters:
          - funlen
        path: kyverno\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
