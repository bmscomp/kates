# Apicurio Registry — fully offline deploy values (image pulled from the local
# registry mirror). KafkaSQL against the Strimzi krafter cluster; credentials
# read by the chart from the Strimzi-managed Secret (no password injected).

replicaCount: 1

image:
  # Local registry mirror of quay.io/apicurio/apicurio-registry:3.3.0
  registry: "localhost:5001"
  repository: apicurio/apicurio-registry
  pullPolicy: Never

global:
  kafka:
    bootstrapServers:
      - "krafter-kafka-bootstrap.kafka.svc:9092"
    securityProtocol: "SASL_PLAINTEXT"
    saslMechanism: "SCRAM-SHA-512"
    saslJaasConfigSecretName: "apicurio-registry"

service:
  type: NodePort
  nodePort: 30082
