# Apicurio Registry — cluster deploy values (KafkaSQL against the Strimzi
# krafter cluster). Image, probes, and topic provisioning come from the chart
# defaults (Registry 3.x on quay.io, health/metrics on management port 9000).

replicaCount: 1

# External Kafka connection. Credentials are read by the chart from the
# Strimzi-managed Secret named below (key sasl.jaas.config) — no password is
# injected at deploy time.
global:
  kafka:
    bootstrapServers:
      - "krafter-kafka-bootstrap.kafka.svc:9092"
    securityProtocol: "SASL_PLAINTEXT"
    saslMechanism: "SCRAM-SHA-512"
    saslJaasConfigSecretName: "apicurio-registry"

# Expose the REST API on the documented NodePort (30082).
service:
  type: NodePort
  nodePort: 30082
