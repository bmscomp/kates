# Offline Velero Configuration
image:
  repository: docker.io/velero/velero
  tag: v1.17.1
  pullPolicy: IfNotPresent

initContainers:
  - name: velero-plugin-for-aws
    image: docker.io/velero/velero-plugin-for-aws:v1.10.0
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

configuration:
  backupStorageLocation:
  - name: default
    provider: aws
    bucket: velero
    # The SeaweedFS of config/velero/seaweedfs.yaml, in the namespace
    # deploy-velero.sh installs both into.
    config:
      region: us-east-1
      s3ForcePathStyle: "true"
      s3Url: http://velero-seaweedfs.kafka.svc:8333
  volumeSnapshotLocation:
  - name: default
    provider: aws
    config:
      region: us-east-1

credentials:
  useSecret: true
  secretContents:
    cloud: |
      [default]
      aws_access_key_id = velero
      aws_secret_access_key = velero123

# Disable snapshots for now as we are focusing on config backup
snapshotsEnabled: false

deployNodeAgent: false

rbac:
  create: true
  clusterAdministrator: true

# Backup Kafka related resources
schedules:
  kafka-daily:
    disabled: false
    schedule: "0 0 * * *"
    template:
      includedNamespaces:
      - kafka
      - apicurio
      includedResources:
      - kafkatopics
      - kafkausers
      - kafkanodepools
      - kafkas
      - configmaps
      - secrets
      ttl: "720h"
