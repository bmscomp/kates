# Velero Configuration
image:
  repository: docker.io/velero/velero
  tag: v1.17.1
  pullPolicy: IfNotPresent

initContainers:
  - name: velero-plugin-for-aws
    image: docker.io/velero/velero-plugin-for-aws:v1.10.0
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins
    # The chart's defaults cover its own containers only: without these the
    # Restricted Pod Security Standard refuses the Velero pod.
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

configuration:
  backupStorageLocation:
  - name: default
    provider: aws
    bucket: velero
    # The SeaweedFS of config/velero/seaweedfs.yaml, in the namespace
    # deploy-velero.sh installs both into.
    config:
      region: us-east-1
      s3ForcePathStyle: "true"
      s3Url: http://velero-seaweedfs.kafka.svc:8333
  volumeSnapshotLocation:
  - name: default
    provider: aws
    config:
      region: us-east-1

credentials:
  useSecret: true
  secretContents:
    cloud: |
      [default]
      aws_access_key_id = velero
      aws_secret_access_key = velero123

snapshotsEnabled: false

deployNodeAgent: false

rbac:
  create: true
  clusterAdministrator: true

schedules:
  kafka-daily:
    disabled: false
    schedule: "0 0 * * *"
    template:
      includedNamespaces:
      - kafka
      - apicurio
      includedResources:
      - kafkatopics
      - kafkausers
      - kafkanodepools
      - kafkas
      - configmaps
      - secrets
      ttl: "720h"
