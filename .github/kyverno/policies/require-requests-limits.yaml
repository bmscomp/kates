# CPU and memory requests and a memory limit on every container and init
# container. No CPU limit is required: one throttles a pod even when the node
# has CPU to spare.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-requests-limits
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: requests-and-memory-limit
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "Every container and init container needs CPU and memory requests and a memory limit."
        pattern:
          spec:
            =(initContainers):
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
            containers:
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
