name: CI · Backend

# Every job is path-filtered by the `changes` job below rather than by a
# workflow-level `paths:` block. The difference matters for branch protection:
# a workflow that never starts never reports a check, and a required check that
# never reports blocks the merge forever. A job that starts and skips itself
# counts as passed. `gate` is the only job the ruleset requires.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      helm: ${{ steps.filter.outputs.helm }}
      yaml: ${{ steps.filter.outputs.yaml }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'kates/**'
              - 'cli/**'
              - 'images.env'
              - 'versions.env'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            helm:
              - 'charts/**'
              - 'versions.env'
              - '.github/kyverno/**'
              - 'scripts/check-chart-policies.sh'
              - 'scripts/check-versions.sh'
              # check-versions.sh now also asserts the kind node image tags in
              # this file against versions.env, so editing it has to run it.
              - 'config/cluster.yaml'
              # ...and that the CLI's embedded copy of this one matches it.
              - 'Dockerfile.legacy-kafka'
              # ...and the tester's Kafka CLI and jar overrides against it.
              - 'tester/**'
            yaml:
              - 'config/**'

  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write # action-junit-report publishes a check run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/load-versions

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build and test
        working-directory: kates
        run: ./mvnw verify -q -B -ntp

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          # `mvnw verify` runs surefire (*Test) AND failsafe (*IT). Globbing
          # only surefire meant every integration-test result — including
          # failures — was invisible in the checks UI; the job still went red,
          # but with no indication of which test broke.
          report_paths: |
            kates/target/surefire-reports/TEST-*.xml
            kates/target/failsafe-reports/TEST-*.xml
          check_name: "JUnit Tests"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: kates/target/jacoco-report/
          if-no-files-found: ignore

      # The floor is enforced by jacoco:check in the pom; this puts the number
      # where a reviewer sees it without downloading the artifact.
      - name: Coverage summary
        if: always()
        run: |
          xml=kates/target/jacoco-report/jacoco.xml
          if [ ! -f "${xml}" ]; then
            echo "no coverage report produced" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "${xml}" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          print("### JaCoCo coverage\n")
          print("| Counter | Covered | Missed | Ratio |")
          print("|---|---:|---:|---:|")
          for c in root.findall("counter"):
              cov, mis = int(c.get("covered")), int(c.get("missed"))
              total = cov + mis
              print(f"| {c.get('type').title()} | {cov} | {mis} | {cov/total:.1%} |" if total else f"| {c.get('type').title()} | 0 | 0 | n/a |")
          PY

  # Dependency CVE scan — the pom manually pins kafka-clients/netty for
  # named CVEs; this catches the next ones instead of relying on memory.
  # CRITICAL fails the build; HIGH and below are reported only. Its own job
  # rather than a tail step of the test job, so a new CVE and a failing test
  # are two different red checks, and the scan does not wait six minutes for
  # a build it does not need.
  dependency-scan:
    name: Dependency CVE scan
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Maven dependencies (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: kates
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          # Named explicitly rather than relying on Trivy finding a
          # .trivyignore beside the scan target: scan-ref is `kates`, the file
          # lives at the repository root, and an ignore file that is silently
          # not loaded is the worst of both worlds — the build stays red and
          # the reasoning goes unread. Every entry in it carries an expiry.
          trivyignores: .trivyignore.yaml

      # govulncheck rather than a second Trivy pass for the CLI: it reports
      # only vulnerabilities in functions the binary actually reaches, so a
      # finding here is a finding, not a transitive module nobody calls.
      # Installed at the versions.env pin rather than @latest: x/vuln's
      # newest release already requires a Go the CLI does not build with.
      - uses: ./.github/actions/load-versions

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Go modules (govulncheck)
        working-directory: cli
        run: |
          set -euo pipefail
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

  helm-lint:
    name: Helm Lint
    needs: changes
    if: needs.changes.outputs.helm == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/load-versions

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint kates chart
        run: helm lint charts/kates/

      - name: Template validation
        run: helm template kates charts/kates/ > /dev/null

      # The backup CronJob dumps only the bundled PostgreSQL. values-prod.yaml
      # set backup.enabled with externalDatabase and rendered no backup,
      # silently. Assert the prod overlay renders and that the combination is
      # refused.
      - name: Assert backup needs the bundled database
        run: |
          helm template kates charts/kates/ \
            -f charts/kates/values-prod.yaml \
            --set externalDatabase.existingSecret=ci > /dev/null
          if out=$(helm template kates charts/kates/ \
               --set backup.enabled=true \
               --set postgresql.enabled=false \
               --set externalDatabase.enabled=true \
               --set externalDatabase.host=db \
               --set externalDatabase.password=x 2>&1); then
            echo "::error::backup.enabled with postgresql.enabled=false rendered; it must fail"
            exit 1
          fi
          # Any other failure would pass the check above without testing it.
          if ! grep -q 'backup.enabled: the backup CronJob dumps the bundled PostgreSQL' <<< "$out"; then
            echo "::error::the render failed, but not on the backup check: $out"
            exit 1
          fi
          echo "OK: backup without the bundled database is refused"

      # An existingSecret used to be loaded with envFrom, so its documented
      # key, password, became a variable named password that Quarkus never
      # reads, and optional: true hid a wrong Secret name: the API crash-looped
      # on the default credentials. Assert both credentials are explicit and
      # the Secret is required.
      - name: Assert an existing database Secret reaches the Kates API
        run: |
          dep=$(helm template kates charts/kates/ \
                  -f charts/kates/values-prod.yaml \
                  --set externalDatabase.host=db \
                  --set externalDatabase.username=app \
                  --set externalDatabase.existingSecret=my-db \
                  --show-only templates/deployment.yaml)
          want=$'- name: QUARKUS_DATASOURCE_USERNAME\n          value: "app"\n        - name: QUARKUS_DATASOURCE_PASSWORD\n          valueFrom:\n            secretKeyRef:\n              name: my-db\n              key: password'
          if [[ "$dep" != *"$want"* ]]; then
            echo "::error::the API does not read the password from my-db/password and the username from values"
            exit 1
          fi
          if grep -q 'optional: true' <<< "$(grep -A3 'secretKeyRef:' <<< "$dep" | grep -A2 'name: my-db')"; then
            echo "::error::the database Secret is optional"
            exit 1
          fi
          pg=$(helm template kates charts/kates/ \
                 --set postgresql.auth.existingSecret=pg \
                 --set postgresql.auth.passwordKey=pw \
                 --set backup.enabled=true \
                 --show-only templates/postgresql.yaml --show-only templates/backup-cronjob.yaml)
          if [ "$(grep -c 'key: pw' <<< "$pg")" != 2 ] || grep -q 'QUARKUS_DATASOURCE' <<< "$pg"; then
            echo "::error::PostgreSQL and the backup do not read passwordKey from the existing Secret"
            exit 1
          fi
          echo "OK: an existing database Secret reaches the API, PostgreSQL and the backup"

      # networkPolicy.kafka.namespace went unread for releases: the policy
      # always allowed `kafka`, kept Trogdor's 8889 to `monitoring` and had no
      # Kubernetes API rule, and nothing rendered it to notice.
      - name: Assert kates NetworkPolicy egress follows its values
        run: |
          np=$(helm template kates charts/kates/ \
                 --show-only templates/networkpolicy.yaml \
                 --set networkPolicy.kafka.namespace=kates-stack)
          fail() { echo "::error::kates NetworkPolicy: $1"; exit 1; }
          grep -q 'kubernetes.io/metadata.name: "kates-stack"' <<<"${np}" \
            || fail "no egress to networkPolicy.kafka.namespace"
          if grep -qE 'kubernetes.io/metadata.name: "?kafka"?$' <<<"${np}"; then
            fail "egress still names the kafka namespace"
          fi
          grep -q 'port: 6443' <<<"${np}" || fail "no Kubernetes API egress"
          trogdor=$(awk '/kubernetes.io\/metadata.name:/ {ns=$2} /port: 8889/ {print ns}' <<<"${np}")
          [ "${trogdor}" = '"kates-stack"' ] \
            || fail "8889 must be open once, to the Kafka namespace (got: ${trogdor:-none})"
          echo "OK: the egress follows networkPolicy.kafka.namespace"

      # kates deploy --with-chaos=false sets chaos.provider=noop; empty must
      # leave the backend on its own default, litmus-crd.
      - name: Assert chaos.provider renders KATES_CHAOS_PROVIDER only when set
        run: |
          fail() { echo "::error::kates configmap: $1"; exit 1; }
          cm=$(helm template kates charts/kates/ --show-only templates/configmap.yaml)
          if grep -q 'KATES_CHAOS_PROVIDER' <<<"${cm}"; then
            fail "KATES_CHAOS_PROVIDER rendered with chaos.provider empty"
          fi
          cm=$(helm template kates charts/kates/ --show-only templates/configmap.yaml \
                 --set chaos.provider=noop)
          grep -q 'KATES_CHAOS_PROVIDER: "noop"' <<<"${cm}" || fail "chaos.provider=noop not rendered"
          if helm template kates charts/kates/ --set chaos.provider=litmus > /dev/null 2>&1; then
            fail "values.schema.json accepted chaos.provider=litmus"
          fi
          echo "OK: chaos.provider renders KATES_CHAOS_PROVIDER only when set"

      # The release signs keyless with cosign 3, which only an
      # ImageValidatingPolicy reads on GHCR; an enabled check is refused,
      # never skipped, on a Kyverno without one.
      - name: Assert kyvernoPolicy.cosign renders the keyless check or refuses
        run: |
          fail() { echo "::error::kates kyvernoPolicy.cosign: $1"; exit 1; }
          on=(--set kyvernoPolicy.enabled=true --set kyvernoPolicy.cosign.enabled=true
              --api-versions kyverno.io/v1 --show-only templates/kyverno-image-verification.yaml)
          ivp=(--api-versions policies.kyverno.io/v1/ImageValidatingPolicy)
          pol=$(helm template kates charts/kates/ "${on[@]}" "${ivp[@]}" --set kyvernoPolicy.action=Enforce)
          grep -q '^kind: ImageValidatingPolicy$' <<<"${pol}" || fail "no ImageValidatingPolicy without publicKey"
          grep -q 'validationActions: \[Deny\]' <<<"${pol}" || fail "action Enforce is not Deny"
          grep -qF ".filter(i, i.matches(r'^ghcr\.io/bmscomp/.*\$') || i.matches(r'^docker\.io/bmscomp/.*\$'))" <<<"${pol}" \
            || fail "the check does not filter on the anchored imagePatterns"
          grep -qF "expression: \"ref.matches(r'^ghcr\\\\.io/bmscomp/.*\$')\"" <<<"${pol}" \
            || fail "matchImageReferences does not use the same expression"
          grep -qF 'publish-(docker|connect)\\.yml@refs/tags/v.+$' <<<"${pol}" || fail "the release identity is not the default subject"
          helm template kates charts/kates/ "${on[@]}" "${ivp[@]}" | grep -q 'validationActions: \[Audit\]' \
            || fail "the default action is not Audit"
          helm template kates charts/kates/ "${on[@]}" "${ivp[@]}" --set 'kyvernoPolicy.cosign.imagePatterns={reg.example/k?tes*}' \
            | grep -qF "i.matches(r'^reg\.example/k.tes.*\$')" || fail "? and * are not the wildcards"
          out=$(helm template kates charts/kates/ "${on[@]}" 2>&1) && fail "rendered without policies.kyverno.io/v1"
          grep -q 'needs Kyverno 1.17 or newer' <<<"${out}" || fail "the refusal on an old Kyverno does not say why"
          out=$(helm template kates charts/kates/ "${on[@]}" "${ivp[@]}" --set 'kyvernoPolicy.cosign.imagePatterns=null' 2>&1) \
            && fail "rendered with no imagePatterns"
          helm template kates charts/kates/ "${on[@]}" --set kyvernoPolicy.cosign.publicKey=key \
            | grep -q '^kind: ClusterPolicy$' || fail "publicKey does not render the key ClusterPolicy"
          echo "OK: kyvernoPolicy.cosign renders the keyless check, or refuses"

      # rbac.scope=namespace is for an account with only edit in the release
      # namespace: anything cluster-scoped would fail its install.
      - name: Assert rbac.scope=namespace renders nothing cluster-scoped
        run: |
          fail() { echo "::error::kates rbac.scope=namespace: $1"; exit 1; }
          all=$(helm template kates charts/kates/ -n team --set rbac.scope=namespace \
                  --set networkPolicy.kafka.namespace=kafka-ns)
          if grep -E '^kind: (Cluster[A-Za-z]*|Namespace|PriorityClass|CustomResourceDefinition|StorageClass)$' <<<"${all}"; then
            fail "a cluster-scoped object is rendered"
          fi
          rbac=$(helm template kates charts/kates/ -n team --set rbac.scope=namespace \
                   --set networkPolicy.kafka.namespace=kafka-ns --show-only templates/rbac.yaml)
          [ "$(grep -c '^  namespace: kafka-ns$' <<<"${rbac}")" = 2 ] \
            || fail "the Role and RoleBinding are not both in networkPolicy.kafka.namespace"
          grep -q 'name: kates-kafka-reader-team' <<<"${rbac}" || fail "Role not named after the release namespace"
          for rule in 'resources: \["kafkas"\]' 'resources: \["kafkanodepools"\]' \
                      'resources: \["pods", "persistentvolumeclaims"\]' 'resources: \["podmonitors"\]' \
                      'resources: \["endpointslices"\]'; do
            grep -q "${rule}" <<<"${rbac}" || fail "missing rule ${rule}"
          done
          [ "$(grep -c -- '- apiGroups:' <<<"${rbac}")" = 5 ] || fail "the Kafka-namespace Role has other than its 5 rules"
          if grep -E '^ +verbs:' <<<"${rbac}" | grep -vqE 'verbs: \["(get|list)"\]$'; then
            fail "the Kafka-namespace Role grants more than get and list"
          fi
          out=$(helm template kates charts/kates/ --set rbac.scope=namespace \
                  --set rbac.kafkaNamespaceRole=false --show-only templates/rbac.yaml 2>&1) || true
          grep -q 'could not find template' <<<"${out}" || fail "rbac.kafkaNamespaceRole=false still renders the Role"
          # helm upgrade --reuse-values from 0.11.6 has neither value: that is scope cluster.
          helm template kates charts/kates/ --set rbac.scope=null --set rbac.kafkaNamespaceRole=null \
              --show-only templates/rbac.yaml | grep -q '^kind: ClusterRole$' \
            || fail "a missing rbac.scope does not render the ClusterRole"
          cm=$(helm template kates charts/kates/ --set rbac.scope=namespace \
                 --set networkPolicy.kafka.namespace=kafka-ns --show-only templates/configmap.yaml)
          grep -q 'KATES_CHAOS_PROVIDER: "noop"' <<<"${cm}" || fail "chaos not off by default"
          grep -q 'KATES_TOPOLOGY_KAFKA_NAMESPACE: "kafka-ns"' <<<"${cm}" \
            || fail "the check does not read the namespace its Role is in"
          # kates-platform passes {{ .Release.Namespace }}, which goes through tpl.
          tpl=$(helm template kates charts/kates/ -n team --set rbac.scope=namespace \
                  --set-json 'networkPolicy.kafka.namespace="{{ .Release.Namespace }}"' \
                  --show-only templates/rbac.yaml --show-only templates/configmap.yaml)
          [ "$(grep -c '^  namespace: team$' <<<"${tpl}")" -ge 2 ] \
            || fail "the Role does not follow a templated networkPolicy.kafka.namespace"
          grep -q 'KATES_TOPOLOGY_KAFKA_NAMESPACE: "team"' <<<"${tpl}" \
            || fail "KATES_TOPOLOGY_KAFKA_NAMESPACE does not follow a templated namespace"
          cm=$(helm template kates charts/kates/ --set rbac.scope=namespace \
                 --set chaos.provider=kubernetes --show-only templates/configmap.yaml)
          grep -q 'KATES_CHAOS_PROVIDER: "kubernetes"' <<<"${cm}" || fail "chaos.provider not honoured"
          # rbac.nodeReads: one ClusterRole, get and list on nodes only, bound to the ServiceAccount.
          nodes=$(helm template kates charts/kates/ -n team --set rbac.scope=namespace \
                    --set rbac.kafkaNamespaceRole=false --set rbac.nodeReads=true --show-only templates/rbac.yaml)
          [ "$(grep -cE '^kind: ClusterRole(Binding)?$' <<<"${nodes}")" = 2 ] \
            || fail "rbac.nodeReads does not render one ClusterRole and its binding"
          grep -q 'name: kates-node-reader-team' <<<"${nodes}" || fail "node ClusterRole not named after the release namespace"
          [ "$(grep -c -- '- apiGroups:' <<<"${nodes}")" = 1 ] || fail "the node ClusterRole has other than its 1 rule"
          grep -q 'resources: \["nodes"\]' <<<"${nodes}" || fail "the node ClusterRole is not on nodes"
          grep -q 'verbs: \["get", "list"\]' <<<"${nodes}" || fail "the node ClusterRole grants other than get and list"
          [ "$(helm template kates charts/kates/ --set rbac.nodeReads=true --show-only templates/rbac.yaml \
                 | grep -c '^kind: ClusterRole$')" = 1 ] || fail "rbac.nodeReads adds a ClusterRole to scope cluster"
          if helm template kates charts/kates/ --set rbac.scope=team > /dev/null 2>&1; then
            fail "values.schema.json accepted rbac.scope=team"
          fi
          echo "OK: rbac.scope=namespace renders only namespaced RBAC, with chaos off"

      # The Strimzi version is declared in five places. If values.yaml's
      # strimziVersion drifts from the Chart.yaml dependency version, the CRD
      # hook applies CRDs for a different operator than the one installed —
      # silently. This is the only thing that catches that.
      #
      # It also asserts the local-cluster toolchain: versions.env against the
      # kindest/node tags in config/cluster.yaml, which kind reads literally and
      # so cannot be generated from the pin.
      - name: Check version pins agree
        run: bash scripts/check-versions.sh

      # A chart test that calls a 404 exits 0 and reports success, so `helm
      # test` passing proves nothing. This compares the paths against the
      # JAX-RS resources; test-kafka asked for /api/cluster, which has no
      # method at its root, for the whole life of that test.
      - name: Check chart test endpoints exist
        run: bash scripts/check-chart-test-paths.sh

      # The wrapper chart does not render until its subchart is fetched.
      # `build` resolves from Chart.lock so the pinned version cannot drift.
      - name: Fetch strimzi-operator chart dependencies
        run: scripts/retry.sh 5 helm dependency build charts/strimzi-operator/

      - name: Lint strimzi-operator chart
        run: helm lint charts/strimzi-operator/

      - name: Template validation (strimzi-operator, all overlays)
        run: |
          helm template strimzi-operator charts/strimzi-operator/ \
            -n strimzi-operator > /dev/null
          for overlay in kind dev prod generic; do
            echo "  values-${overlay}.yaml"
            helm template strimzi-operator charts/strimzi-operator/ \
              -n strimzi-operator \
              -f "charts/strimzi-operator/values-${overlay}.yaml" > /dev/null
          done

      # The chart's reason to exist is that a typo'd key fails loudly instead of
      # being silently ignored (as leaderElection.enabled was for the lifetime
      # of the old release). Assert the schema actually rejects one.
      - name: Assert values schema rejects unknown keys
        run: |
          if helm template strimzi-operator charts/strimzi-operator/ \
               -n strimzi-operator \
               --set 'strimzi-kafka-operator.leaderElection.enabled=false' \
               > /dev/null 2>&1; then
            echo "::error::values.schema.json accepted a misspelled key (leaderElection.enabled)"
            exit 1
          fi
          echo "OK: schema rejected the misspelled key"

      # Charts whose dependency tgzs are gitignored (charts/*/charts/) must be
      # fetched before the render loop. seaweedfs (kafka-cluster), litmus-core
      # (kates-chaos) and kube-prometheus-stack (monitoring) come from classic
      # Helm repos; kates-platform resolves local file:// deps.
      # mirror-maker2 and connect-cluster come before kates-platform: the
      # umbrella packages its file:// subcharts as they are on disk.
      - name: Build chart dependencies
        uses: ./.github/actions/helm-deps
        with:
          charts: kafka-cluster kates-chaos monitoring mirror-maker2 connect-cluster kates-platform

      - name: Lint and template all charts
        run: |
          rc=0
          for chart in charts/*/; do
            name=$(basename "${chart}")
            echo "==> ${name}"
            helm lint "${chart}" || rc=1
            # A library chart (kafka-common) is not installable; its harness
            # is rendered by ci-kafka-charts.yml instead.
            grep -q '^type: library' "${chart}/Chart.yaml" && continue
            helm template "${name}" "${chart}" > /dev/null || rc=1
          done
          exit ${rc}

      # Helm installs whatever sits in charts/; the umbrella's own guard holds
      # it to Chart.yaml's ranges. kates 0.10.7 is the last chart whose
      # ClusterRole read every Secret in the cluster.
      - name: Check kates-platform refuses a stale subchart
        run: |
          tmp=$(mktemp -d)
          cp -R charts/kates-platform "${tmp}/"
          rm "${tmp}"/kates-platform/charts/kates-*.tgz
          helm package charts/kates --version 0.10.7 --destination "${tmp}/kates-platform/charts" > /dev/null
          if out=$(helm template p "${tmp}/kates-platform" 2>&1); then
            echo "::error::kates-platform rendered with kates 0.10.7 in charts/"
            exit 1
          fi
          echo "${out}" | grep -q 'charts/ holds kates 0.10.7' || { echo "${out}"; exit 1; }
          echo "OK: kates-platform refused kates 0.10.7"

      # The umbrella installs Kafka in its release namespace, while the kates
      # chart's defaults and the platform profile's kates grant name namespaces
      # kafka and kates. Render it in a third one.
      - name: Check kates-platform wires Kates to its own Kafka
        run: |
          fail() { echo "::error::kates-platform in namespace platform: $1"; exit 1; }
          show() { helm template p charts/kates-platform -n platform --show-only "charts/$1"; }
          cm=$(show kates/templates/configmap.yaml)
          grep -q 'KATES_KAFKA_BOOTSTRAP_SERVERS: "krafter-kafka-bootstrap.platform.svc:9092"' <<<"${cm}" \
            || fail "Kates bootstraps from another namespace"
          for v in CHAOS_KAFKA_NAMESPACE TOPOLOGY_KAFKA_NAMESPACE; do
            grep -q "KATES_${v}: \"platform\"" <<<"${cm}" || fail "KATES_${v} names another namespace"
          done
          np=$(show kates/templates/networkpolicy.yaml)
          grep -q 'kubernetes.io/metadata.name: "platform"' <<<"${np}" || fail "no Kates egress to the release namespace"
          if grep -q 'kubernetes.io/metadata.name: "kafka"' <<<"${np}"; then fail "Kates egress still names kafka"; fi
          if grep -B3 'app.kubernetes.io/name: kates$' <<<"$(show kafka-cluster/templates/networkpolicies.yaml)" \
               | grep -q kubernetes.io/metadata.name; then
            fail "the brokers admit Kates only from another namespace"
          fi
          echo "OK: Kates reaches the Kafka in its own release namespace"

      - name: Install kubeconform
        uses: ./.github/actions/install-tools
        with:
          kubeconform: "true"

      # Rendered manifests must satisfy the Kubernetes OpenAPI schemas and,
      # for CRs (Strimzi, Litmus, Velero, Kyverno, monitoring), the community
      # CRD schema catalog. -ignore-missing-schemas keeps CRs without a
      # published schema from failing the build.
      - name: Validate rendered manifests (kubeconform)
        run: |
          rc=0
          for chart in charts/*/; do
            name=$(basename "${chart}")
            grep -q '^type: library' "${chart}/Chart.yaml" && continue
            echo "==> ${name}"
            helm template "${name}" "${chart}" \
              | kubeconform -strict -summary -ignore-missing-schemas \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              || rc=1
          done
          exit ${rc}

      # Root README chart table must stay in sync with charts/*/Chart.yaml.
      - name: Check README chart table
        run: ./scripts/gen-chart-table.sh --check

  kyverno-policy-test:
    name: Kyverno Policy Validation
    needs: changes
    if: needs.changes.outputs.helm == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/load-versions

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install Kyverno CLI
        uses: ./.github/actions/install-tools
        with:
          kyverno: "true"

      # Every chart with dependencies from a repository. The Helm repositories
      # (litmus-core, kube-prometheus-stack, seaweedfs) are added here;
      # Strimzi's operator chart is an OCI chart and needs none. Not
      # kates-platform: its Chart.lock pins its file:// subcharts' versions and
      # is stale after any bump of one, so `helm dependency build` refuses it.
      # The script updates it in a copy, after the subcharts, and builds no
      # chart this step left current, so nothing is downloaded twice.
      - name: Fetch chart dependencies
        uses: ./.github/actions/helm-deps
        with:
          charts: connect-cluster kafka-cluster kates-chaos mirror-maker2 monitoring strimzi-operator

      # Every chart, with its defaults and with its optional workloads on, held
      # to PSS restricted, requests and a memory limit, and pinned images, with
      # only the host-level workloads in .github/kyverno/exceptions/ excepted.
      - name: Check charts against the cluster policies
        run: scripts/check-chart-policies.sh

      # The policies kates, kafka-cluster and kates-chaos ship (kyvernoPolicy),
      # applied to the workloads of the same render. They match the release
      # namespace only, and Helm installs a template that names no namespace
      # into it, so the workloads get it here: before, the kates step applied
      # its policies to kates/k8s/deployment.yaml and matched nothing. A run
      # where no rule matched anything fails too. yq ships on GitHub's Ubuntu
      # runners.
      - name: Apply each chart's own policies to its workloads
        run: |
          rc=0
          for chart in kates kafka-cluster kates-chaos; do
            echo "==> ${chart}"
            out="${RUNNER_TEMP}/${chart}"
            if ! helm template "${chart}" "charts/${chart}" -n "${chart}" \
                 --set kyvernoPolicy.enabled=true --api-versions kyverno.io/v1 > "${out}.yaml"; then
              rc=1; continue
            fi
            yq 'select(.kind == "ClusterPolicy" or .kind == "Policy")' "${out}.yaml" > "${out}-policies.yaml"
            NS="${chart}" yq 'select(.kind == "Pod" or .kind == "Deployment" or .kind == "StatefulSet" or .kind == "DaemonSet" or .kind == "Job" or .kind == "CronJob")
              | .metadata.namespace |= (. // strenv(NS))' "${out}.yaml" > "${out}-workloads.yaml"
            # A directory: with more than one mutated resource the CLI writes one file each.
            mkdir -p "${out}-mutated"
            kyverno apply "${out}-policies.yaml" --resource "${out}-workloads.yaml" \
              -o "${out}-mutated" > "${out}.log" 2>&1 || rc=1
            cat "${out}.log"
            if grep -q '^pass: 0, fail: 0,' "${out}.log"; then
              echo "::error::${chart}: its own policies matched none of its workloads"; rc=1
            fi
          done
          exit ${rc}

  yaml-validation:
    name: YAML Validation
    needs: changes
    if: needs.changes.outputs.yaml == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Validate all config YAML files
        run: |
          FAILED=0
          for f in $(find config -name '*.yaml' -o -name '*.yml' | sort); do
            if python3 -c "
          import yaml, sys
          try:
              list(yaml.safe_load_all(open('$f')))
          except Exception as e:
              print(f'❌ $f: {e}')
              sys.exit(1)
          print(f'✅ $f')
          " 2>&1; then
              true
            else
              FAILED=1
            fi
          done
          exit $FAILED

  go-tests:
    name: CLI Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Run Go tests
        working-directory: cli
        run: go test -p 1 ./... -v -race -count=1 -coverprofile=coverage.out

      # The config lock and the port-forward process code are per platform;
      # the Linux build does not notice when the Windows or macOS one breaks.
      - name: Cross-compile for Windows and macOS
        working-directory: cli
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...

      - name: Coverage summary
        if: always()
        working-directory: cli
        run: |
          [ -f coverage.out ] || exit 0
          {
            echo "### Go coverage"
            echo
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Runs the REAL binary under the conditions scripts and CI use it in:
      # piped stdout, NO_COLOR, TERM=dumb, --plain, KATES_ASCII, unset locale,
      # and TUI commands with no TTY. This is what catches "escape codes in
      # CI logs" class regressions — unit tests never see the raw bytes.
      - name: CLI terminal-compatibility checks
        run: bash scripts/check-cli-compat.sh

      # Static companion to the compat harness: no hardcoded hex colors
      # outside the theme, no raw escape literals outside cli/output/.
      - name: CLI style checks
        run: bash scripts/check-cli-style.sh
        env:
          GOMEMLIMIT: 2GiB
          GOGC: 50

  gate:
    name: Gate · Backend
    if: always()
    needs: [changes, build-and-test, dependency-scan, helm-lint, kyverno-policy-test, yaml-validation, go-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci-gate
        with:
          needs: ${{ toJSON(needs) }}
