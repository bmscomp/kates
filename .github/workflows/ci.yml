name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "kates/**"
      - "cli/**"
      - "charts/**"
      - "config/**"
      - "images.env"
      - "versions.env"
      - "scripts/check-versions.sh"
      - ".github/workflows/ci.yml"
      - "!**/*.md"
  pull_request:
    branches: [main]
    paths:
      - "kates/**"
      - "cli/**"
      - "charts/**"
      - "config/**"
      - "images.env"
      - "versions.env"
      - "scripts/check-versions.sh"
      - ".github/workflows/ci.yml"
      - "!**/*.md"

permissions:
  contents: read
  checks: write

env:
  JAVA_VERSION: "21"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      helm: ${{ steps.filter.outputs.helm }}
      yaml: ${{ steps.filter.outputs.yaml }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'kates/**'
              - 'cli/**'
              - 'images.env'
              - 'versions.env'
              - '.github/workflows/ci.yml'
            helm:
              - 'charts/**'
              - 'versions.env'
              - 'scripts/check-versions.sh'
            yaml:
              - 'config/**'

  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build and test
        working-directory: kates
        run: ./mvnw verify -q -B -ntp

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: kates/target/surefire-reports/TEST-*.xml
          check_name: "JUnit Tests"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: kates/target/jacoco-report/
          if-no-files-found: ignore

      # Dependency CVE scan — the pom manually pins kafka-clients/netty for
      # named CVEs; this catches the next ones instead of relying on memory.
      # CRITICAL fails the build; HIGH and below are reported only.
      - name: Dependency CVE scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: kates
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  helm-lint:
    name: Helm Lint
    needs: changes
    if: needs.changes.outputs.helm == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v5
        with:
          version: v3.17.0

      - name: Lint kates chart
        run: helm lint charts/kates/

      - name: Template validation
        run: helm template kates charts/kates/ > /dev/null

      # The Strimzi version is declared in five places. If values.yaml's
      # strimziVersion drifts from the Chart.yaml dependency version, the CRD
      # hook applies CRDs for a different operator than the one installed —
      # silently. This is the only thing that catches that.
      - name: Check Strimzi version pins agree
        run: bash scripts/check-versions.sh

      # A chart test that calls a 404 exits 0 and reports success, so `helm
      # test` passing proves nothing. This compares the paths against the
      # JAX-RS resources; test-kafka asked for /api/cluster, which has no
      # method at its root, for the whole life of that test.
      - name: Check chart test endpoints exist
        run: bash scripts/check-chart-test-paths.sh

      # The wrapper chart does not render until its subchart is fetched.
      # `build` resolves from Chart.lock so the pinned version cannot drift.
      - name: Fetch strimzi-operator chart dependencies
        run: helm dependency build charts/strimzi-operator/

      - name: Lint strimzi-operator chart
        run: helm lint charts/strimzi-operator/

      - name: Template validation (strimzi-operator, all overlays)
        run: |
          helm template strimzi-operator charts/strimzi-operator/ \
            -n strimzi-operator > /dev/null
          for overlay in kind dev prod generic; do
            echo "  values-${overlay}.yaml"
            helm template strimzi-operator charts/strimzi-operator/ \
              -n strimzi-operator \
              -f "charts/strimzi-operator/values-${overlay}.yaml" > /dev/null
          done

      # The chart's reason to exist is that a typo'd key fails loudly instead of
      # being silently ignored (as leaderElection.enabled was for the lifetime
      # of the old release). Assert the schema actually rejects one.
      - name: Assert values schema rejects unknown keys
        run: |
          if helm template strimzi-operator charts/strimzi-operator/ \
               -n strimzi-operator \
               --set 'strimzi-kafka-operator.leaderElection.enabled=false' \
               > /dev/null 2>&1; then
            echo "::error::values.schema.json accepted a misspelled key (leaderElection.enabled)"
            exit 1
          fi
          echo "OK: schema rejected the misspelled key"

      # Charts whose dependency tgzs are gitignored (charts/*/charts/) must be
      # fetched before the render loop. seaweedfs (kafka-cluster), litmus-core
      # (kates-chaos) and kube-prometheus-stack (monitoring) come from classic
      # Helm repos; kates-platform resolves local file:// deps. minio and
      # apicurio-registry vendor their dependencies in-tree, so they are left
      # untouched (their upstream Bitnami repo is deprecated).
      - name: Build chart dependencies
        run: |
          helm repo add seaweedfs https://seaweedfs.github.io/seaweedfs/helm
          helm repo add litmuschaos https://litmuschaos.github.io/litmus-helm/
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          for chart in kafka-cluster kates-chaos monitoring kates-platform; do
            echo "==> helm dependency build charts/${chart}/"
            helm dependency build "charts/${chart}/"
          done

      - name: Lint and template all charts
        run: |
          rc=0
          for chart in charts/*/; do
            name=$(basename "${chart}")
            echo "==> ${name}"
            helm lint "${chart}" || rc=1
            helm template "${name}" "${chart}" > /dev/null || rc=1
          done
          exit ${rc}

      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kubeconform.tgz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tgz -C /tmp kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/

      # Rendered manifests must satisfy the Kubernetes OpenAPI schemas and,
      # for CRs (Strimzi, Litmus, Velero, Kyverno, monitoring), the community
      # CRD schema catalog. -ignore-missing-schemas keeps CRs without a
      # published schema from failing the build.
      - name: Validate rendered manifests (kubeconform)
        run: |
          rc=0
          for chart in charts/*/; do
            name=$(basename "${chart}")
            echo "==> ${name}"
            helm template "${name}" "${chart}" \
              | kubeconform -strict -summary -ignore-missing-schemas \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              || rc=1
          done
          exit ${rc}

      # Root README chart table must stay in sync with charts/*/Chart.yaml.
      - name: Check README chart table
        run: ./scripts/gen-chart-table.sh --check

  kyverno-policy-test:
    name: Kyverno Policy Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v5
        with:
          version: v3.17.0

      - name: Install Kyverno CLI
        run: |
          curl -sLO "https://github.com/kyverno/kyverno/releases/download/v1.13.0/kyverno-cli_v1.13.0_linux_x86_64.tar.gz"
          tar -xzf kyverno-cli_*.tar.gz
          sudo mv kyverno /usr/local/bin/
          kyverno version

      - name: Fetch chart dependencies
        run: helm dependency build charts/kates/

      - name: Validate kates policies
        run: |
          helm template kates charts/kates/ \
            --set kyvernoPolicy.enabled=true \
            --api-versions kyverno.io/v1 \
            --show-only templates/kyverno-policies.yaml \
            > /tmp/kates-policies.yaml
          echo "--- Rendered kates policies ---"
          head -5 /tmp/kates-policies.yaml
          kyverno apply /tmp/kates-policies.yaml \
            --resource kates/k8s/deployment.yaml 2>&1 || true

      - name: Validate kates workload policies
        run: |
          helm template kates charts/kates/ \
            --set kyvernoPolicy.enabled=true \
            --api-versions kyverno.io/v1 \
            --show-only templates/kyverno-policies.yaml \
            > /tmp/kates-workload-policies.yaml
          echo "✅ Kates workload policies render successfully"

      - name: Validate kafka policies
        run: |
          helm dependency build charts/kafka-cluster/ 2>/dev/null || true
          helm template kafka charts/kafka-cluster/ \
            --set podSecurityPolicy.enabled=true \
            --set strimziOperator.enabled=false \
            --api-versions kyverno.io/v1 \
            --show-only templates/pod-security-policy.yaml \
            > /tmp/kafka-policies.yaml
          echo "✅ Kafka policies render successfully"

      - name: Validate chaos policies
        run: |
          helm dependency build charts/kates-chaos/
          helm template chaos charts/kates-chaos/ \
            --set kyvernoPolicy.enabled=true \
            --api-versions kyverno.io/v1 \
            --show-only templates/kyverno-policies.yaml \
            > /tmp/chaos-policies.yaml
          echo "✅ Chaos policies render successfully"

  yaml-validation:
    name: YAML Validation
    needs: changes
    if: needs.changes.outputs.yaml == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Validate all config YAML files
        run: |
          FAILED=0
          for f in $(find config -name '*.yaml' -o -name '*.yml' | sort); do
            if python3 -c "
          import yaml, sys
          try:
              list(yaml.safe_load_all(open('$f')))
          except Exception as e:
              print(f'❌ $f: {e}')
              sys.exit(1)
          print(f'✅ $f')
          " 2>&1; then
              true
            else
              FAILED=1
            fi
          done
          exit $FAILED

  go-tests:
    name: CLI Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: cli/go.sum

      - name: Run Go tests
        working-directory: cli
        run: go test -p 1 ./... -v -race -count=1

      # Runs the REAL binary under the conditions scripts and CI use it in:
      # piped stdout, NO_COLOR, TERM=dumb, --plain, KATES_ASCII, unset locale,
      # and TUI commands with no TTY. This is what catches "escape codes in
      # CI logs" class regressions — unit tests never see the raw bytes.
      - name: CLI terminal-compatibility checks
        run: bash scripts/check-cli-compat.sh

      # Static companion to the compat harness: no hardcoded hex colors
      # outside the theme, no raw escape literals outside cli/output/.
      - name: CLI style checks
        run: bash scripts/check-cli-style.sh
        env:
          GOMEMLIMIT: 2GiB
          GOGC: 50
