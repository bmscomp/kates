name: CI · Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            image:
              - 'kates/**'
              - '!kates/**/*.md'
              - 'cli/**'
              - '!cli/**/*.md'
              - 'images.env'
              - 'versions.env'
              - '.github/workflows/ci-docker.yml'

  build-validation:
    name: Build ${{ matrix.variant }} (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- amd64 builds (fast, native runner) ---
          - variant: jvm
            arch: amd64
            platform: linux/amd64
            dockerfile: kates/Dockerfile
            runner: ubuntu-latest
            qemu: false

          # --- arm64 build (native ARM runner, JVM only) ---
          # native builds (amd64 + arm64) are excluded: GraalVM native-image
          # is too slow for PR CI (~7-12 min) — validated at release time.
          - variant: jvm
            arch: arm64
            platform: linux/arm64
            dockerfile: kates/Dockerfile
            runner: ubuntu-24.04-arm
            qemu: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          tags: kates:ci-${{ matrix.variant }}-${{ matrix.arch }}
          cache-from: type=gha,scope=ci-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.variant }}-${{ matrix.arch }}

  gate:
    name: Gate · Docker
    if: always()
    needs: [changes, build-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/ci-gate
        with:
          needs: ${{ toJSON(needs) }}
