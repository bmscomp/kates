name: Docs · Book

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/book/**"
      - "scripts/prepare-book-render.sh"
      - "scripts/check-book-fragments.py"
      - ".github/workflows/book.yml"
  push:
    branches: [main]
    paths:
      - "docs/book/**"
      - "scripts/prepare-book-render.sh"
      - "scripts/check-book-fragments.py"
      - ".github/workflows/book.yml"
  # The PDF half of the build job runs on everything except a pull request
  # (a pull request gets the pdf job instead), so a manual run is how the
  # publish path gets exercised without pushing to main. It renders the PDF
  # but publishes nothing: the upload and deploy stay on push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Render Book
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        # tinytex is NOT installed through the action's input: that runs inside
        # the setup step, so a hiccup fetching it fails the whole job before a
        # single page is rendered. It is installed below instead, where it can
        # fail without taking the site down with it.

      # Both tools serve the PDF and nothing else, so they are best-effort like
      # the render they feed.
      #
      # `quarto install` resolves the latest release through the GitHub API
      # (getLatestRelease in quarto-cli's src/tools/github.ts), unauthenticated
      # unless GH_TOKEN is set — and the API answers a shared runner IP with
      # `403 - Forbidden` often enough to matter: that is what failed the Book
      # run on main for 4035f59, in the setup step, before the HTML render that
      # needs none of this. The token moves the call onto this repository's own
      # rate limit; the retry covers the rest.
      #
      # The fonts and rsvg-convert are the ones the pdf job installs, so the
      # published PDF is set the way that job checked it; see there for what
      # each is for.
      - name: Install the PDF toolchain — fonts, TinyTeX and Chromium (best-effort)
        id: pdf-toolchain
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scripts/retry.sh 3 sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            fonts-inter fonts-jetbrains-mono fonts-noto-core fonts-symbola librsvg2-bin
          scripts/retry.sh 3 quarto install tool tinytex --no-prompt --log-level warning
          # What the setup action does after installing TinyTeX on Linux, and
          # the reason this step cannot just call quarto: without it lualatex
          # and tlmgr are installed but not on PATH for the render below.
          echo "$HOME/bin" >> "$GITHUB_PATH"
          # The book's text face. Ubuntu's fonts-ebgaramond is the older
          # "EB Garamond 12", with a bold but no semibold or bold italic.
          # tlmgr is in TinyTeX's own tree: quarto installs TinyTeX in
          # ~/.TinyTeX, and links its tools into a bin directory only when
          # given --update-path, so there is no ~/bin/tlmgr.
          tlmgr=("$HOME"/.TinyTeX/bin/*/tlmgr)
          # The TinyTeX quarto installs can hold a tlmgr older than its package
          # repository requires, and that tlmgr installs nothing ("tlmgr itself
          # needs to be updated") until it updates itself. On 2026-10-06 that
          # failed the Render PDF job before anything rendered. When tlmgr is
          # current, the update does nothing. Quarto installs the LaTeX packages
          # a render lacks with this tlmgr too.
          scripts/retry.sh 3 "${tlmgr[0]}" update --self
          scripts/retry.sh 3 "${tlmgr[0]}" install ebgaramond
          scripts/retry.sh 3 quarto install chromium --no-prompt

      - name: Note a degraded PDF build
        if: github.event_name != 'pull_request' && steps.pdf-toolchain.outcome != 'success'
        run: |
          echo "::warning::The PDF toolchain would not install, so the site is published without the PDF and its download link will 404 until the next successful run. The HTML site is unaffected."

      # Sources are GitHub-flavored .md so chapters render in the repo file
      # view; Quarto executes mermaid only in .qmd. The script converts
      # fences, links, filenames, and the chapter list — build-time only,
      # never committed.
      - name: Prepare sources for Quarto
        run: ./scripts/prepare-book-render.sh

      # The PDF (102 chromium-rendered diagrams + lualatex) is best-effort:
      # a slow or wedged PDF build must never block publishing the site.
      # On failure the site's PDF download link 404s until the next
      # successful run — acceptable degradation. The PDF is stashed
      # outside _book because the HTML render cleans the output dir
      # (observed: run 29367138974 built the PDF, then lost it).
      - name: Render PDF (best-effort)
        # Skipped outright when the toolchain above did not install, rather
        # than spending 25 minutes on a render that cannot succeed.
        if: github.event_name != 'pull_request' && steps.pdf-toolchain.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 25
        run: |
          quarto render docs/book --to pdf
          mv docs/book/_book/kates-definitive-guide.pdf "$RUNNER_TEMP/"

      - name: Render HTML
        run: quarto render docs/book --to html

      # The Markdown link check (lychee, in docs.yml) computes heading anchors
      # the way GitHub does, and Quarto computes them differently, so a
      # #fragment can pass that check and still miss on the site. This one
      # reads the rendered pages and fails on any link whose fragment is not
      # an id on its target page, and on any link Quarto could not resolve
      # and left pointing at a .md or .qmd file, which the render lets through.
      - name: Check fragment links
        run: python3 scripts/check-book-fragments.py docs/book/_book

      - name: Attach PDF to site
        if: github.event_name != 'pull_request'
        run: |
          if [ -f "$RUNNER_TEMP/kates-definitive-guide.pdf" ]; then
            mv "$RUNNER_TEMP/kates-definitive-guide.pdf" docs/book/_book/
            echo "PDF attached to site output"
          else
            echo "No PDF this run (best-effort render failed) — download link will 404"
          fi

      - name: Upload site artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book/_book

  # The build job skips the PDF on a pull request, so until this job a PDF
  # problem surfaced only after merge, if at all: LaTeX drops a character no
  # font has and says so only in its log (that is how the Scenario Files
  # "Required" column once printed empty), and a diagram wider than the page
  # is cut off at its edge. This job renders the PDF with the publish step's
  # toolchain and fails on either. The publish step stays best-effort until
  # this job has proved reliable.
  pdf:
    name: Render PDF
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

      # docs/book/theme/pdf-header.tex sets EB Garamond for text and headings,
      # JetBrains Mono for code and Inter for a few labels, as on the web, and
      # takes the characters they lack (check marks, triangles, warning signs,
      # emoji) from Noto Sans Symbols 2, Noto Sans Symbols, Noto Sans Math and
      # Symbola. EB Garamond comes from TeX Live (next step). rsvg-convert
      # draws the cover page (docs/book/theme/pdf-cover.lua).
      - name: Install fonts and rsvg-convert
        run: |
          set -euo pipefail
          scripts/retry.sh 3 sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            fonts-inter fonts-jetbrains-mono fonts-noto-core fonts-symbola librsvg2-bin

      # See the build job for why GH_TOKEN, the retries and the PATH line.
      - name: Install TinyTeX and Chromium
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scripts/retry.sh 3 quarto install tool tinytex --no-prompt --log-level warning
          echo "$HOME/bin" >> "$GITHUB_PATH"
          # See the build job for why TeX Live's EB Garamond, not Ubuntu's,
          # why tlmgr is found this way, and why it updates itself first.
          tlmgr=("$HOME"/.TinyTeX/bin/*/tlmgr)
          scripts/retry.sh 3 "${tlmgr[0]}" update --self
          scripts/retry.sh 3 "${tlmgr[0]}" install ebgaramond
          scripts/retry.sh 3 quarto install chromium --no-prompt

      - name: Prepare sources for Quarto
        run: ./scripts/prepare-book-render.sh

      # keep-tex and latex-clean:false leave the .tex and the LaTeX log in
      # docs/book for the check below. A render can wedge rather than fail:
      # the first run of this workflow on main did (#62). So each attempt has
      # its own 12-minute limit, and a wedged first attempt still leaves the
      # second one time to run inside the step's 30. The retry is for a
      # transient failure, such as a download that fails while Quarto installs
      # a LaTeX package TinyTeX lacks.
      - name: Render PDF
        timeout-minutes: 30
        run: scripts/retry.sh 2 timeout -k 1m 12m quarto render docs/book --to pdf -M keep-tex:true -M latex-clean:false

      - name: Check for dropped characters and overfull diagrams
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          book = pathlib.Path("docs/book")
          log = (book / "index.log").read_text(encoding="utf-8", errors="replace").splitlines()
          tex = (book / "kates-definitive-guide.tex").read_text(encoding="utf-8").splitlines()
          bad = False

          # LaTeX leaves out a character none of the fonts has, and says so
          # only in the log.
          missing = {}
          for line in log:
              m = re.search(r"Missing character: There is no (.+?) \((U\+[0-9A-F]+)\)", line)
              if m:
                  missing[m.group(2)] = m.group(1)
          for code, char in sorted(missing.items()):
              print(f"::error::The PDF leaves out {char} ({code}): none of its fonts has it")
              bad = True

          # A diagram wider than the text overflows its line. The log gives the
          # paragraph's line numbers in the .tex, which show whether it was an
          # image; a point or less over is rounding, not a cut-off diagram.
          for line in log:
              m = re.match(r"Overfull \\hbox \(([\d.]+)pt too wide\) in paragraph at lines (\d+)--(\d+)", line)
              if not m or float(m.group(1)) <= 1:
                  continue
              for src in tex[int(m.group(2)) - 1:int(m.group(3))]:
                  g = re.search(r"\\includegraphics(?:\[[^]]*\])?\{([^}]+)\}", src)
                  if g:
                      print(f"::error::{g.group(1)} runs {m.group(1)}pt past the right margin")
                      bad = True

          print("PDF check: " + ("failed" if bad else "no missing characters, no overfull diagrams"))
          sys.exit(1 if bad else 0)
          PY

      - name: Upload the PDF and its LaTeX log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kates-definitive-guide-pdf
          path: |
            docs/book/_book/kates-definitive-guide.pdf
            docs/book/index.log
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
