name: Publish · Connect image

# ──────────────────────────────────────────────────────────────────────────────
# Builds and publishes the enterprise Kafka Connect image to:
#   - ghcr.io/bmscomp/connect:<version>
#   - bmscomp/connect:<version>
#
# Tags follow the convention: <debezium-version> (e.g., 3.0.2)
# The image includes: Debezium CDC, Apicurio converters, Aiven JDBC and S3.
#
# Called by release.yml on every `v*` tag (one run page for the whole
# release), or run by hand. It no longer triggers on the tag itself.
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      debezium_version:
        description: "Debezium version override (blank = use Dockerfile.connect)"
        type: string
        default: ""
      platforms:
        description: "Target platforms"
        type: string
        default: linux/amd64,linux/arm64
  workflow_dispatch:
    inputs:
      debezium_version:
        # Empty = read the version from Dockerfile.connect (the source of
        # truth). A hardcoded default here silently overrode the Dockerfile on
        # manual dispatches and produced wrongly-versioned image tags.
        description: "Debezium version override (blank = use Dockerfile.connect)"
        type: string
        default: ""
      platforms:
        description: "Target platforms"
        type: choice
        options:
          - linux/amd64,linux/arm64
          - linux/amd64
          - linux/arm64
        default: linux/amd64,linux/arm64

permissions:
  contents: write # update-charts commits the image pin
  packages: write
  id-token: write # cosign keyless signing, build provenance

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_REPO: bmscomp/connect
  GHCR_REPO: ghcr.io/bmscomp/connect

jobs:
  meta:
    name: Compute Build Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      image_tag: ${{ steps.version.outputs.image_tag }}
      debezium_version: ${{ steps.version.outputs.debezium_version }}
      platforms: ${{ steps.set.outputs.platforms }}
      platform_matrix: ${{ steps.set.outputs.platform_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Determine version
        id: version
        env:
          DBZ_OVERRIDE: ${{ inputs.debezium_version || '' }}
        run: |
          # Extract Debezium version from Dockerfile ARG
          DBZ_VERSION="${DBZ_OVERRIDE}"
          if [[ -z "${DBZ_VERSION}" ]]; then
            DBZ_VERSION=$(grep '^ARG DEBEZIUM_VERSION=' Dockerfile.connect | head -n 1 | cut -d= -f2)
          fi
          echo "debezium_version=${DBZ_VERSION}" >> "$GITHUB_OUTPUT"

          # Clean Debezium version (drop .Final): appVersion + moving alias tag.
          DBZ_CLEAN="${DBZ_VERSION%.Final}"
          echo "version=${DBZ_CLEAN}" >> "$GITHUB_OUTPUT"

          # The image's identity is (Debezium, Kafka base). Tagging by Debezium
          # ALONE meant a base bump (e.g. #74's Kafka 4.2.0 -> 4.3.0) did not
          # move the tag, so connect:<debezium> silently changed content under a
          # fixed name. Fold the Kafka base version into the tag.
          KAFKA_VERSION=$(grep -m1 '^FROM quay.io/strimzi/kafka:' Dockerfile.connect \
            | sed -E 's/.*-kafka-([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          if [[ -z "${KAFKA_VERSION}" || "${KAFKA_VERSION}" == *FROM* ]]; then
            echo "::error::could not parse Kafka version from the base FROM line"
            exit 1
          fi
          IMAGE_TAG="${DBZ_CLEAN}-kafka-${KAFKA_VERSION}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "connect image tag: ${IMAGE_TAG} (Debezium ${DBZ_CLEAN} on Kafka ${KAFKA_VERSION})"

      - name: Set build matrix
        id: set
        env:
          PLATFORMS: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
        run: |
          echo "platforms=${PLATFORMS}" >> "$GITHUB_OUTPUT"

          MATRIX="["
          FIRST=true
          IFS=',' read -ra PLATS <<< "${PLATFORMS}"
          for p in "${PLATS[@]}"; do
            p="$(echo "$p" | xargs)"
            case "$p" in
              linux/amd64) RUNNER="ubuntu-latest" ; ARCH="amd64" ;;
              linux/arm64) RUNNER="ubuntu-24.04-arm" ; ARCH="arm64" ;;
            esac
            if [ "$FIRST" = true ]; then FIRST=false; else MATRIX+=","; fi
            MATRIX+="{\"platform\":\"${p}\",\"runner\":\"${RUNNER}\",\"arch\":\"${ARCH}\"}"
          done
          MATRIX+="]"
          echo "platform_matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  build-per-platform:
    name: Build Connect (${{ matrix.platform.arch }})
    needs: meta
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.meta.outputs.platform_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: ./.github/actions/registry-login
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (single arch)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.connect
          platforms: ${{ matrix.platform.platform }}
          push: true
          build-args: |
            DEBEZIUM_VERSION=${{ needs.meta.outputs.debezium_version }}
          tags: |
            ${{ env.DOCKERHUB_REPO }}:sha-${{ github.sha }}-${{ matrix.platform.arch }}
            ${{ env.GHCR_REPO }}:sha-${{ github.sha }}-${{ matrix.platform.arch }}
          cache-from: type=gha,scope=connect-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=connect-${{ matrix.platform.arch }}
          # SLSA provenance and an SPDX SBOM ride along as attestation
          # manifests; imagetools create folds them into the merged index and
          # `verify` asserts every platform survived (see publish-docker.yml).
          provenance: mode=max
          sbom: true

  merge-manifests:
    name: Merge Multi-Arch Manifests
    needs: [meta, build-per-platform]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/registry-login
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        # Required by `docker buildx imagetools create` below.
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Compute Docker metadata
        id: docker-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        env:
          # GHCR reads a multi-arch image's description from the INDEX's
          # annotations. Dockerfile.connect already carries a complete LABEL
          # block, but labels live in the per-platform image config and an
          # index has no labels — nothing propagates, which is why this page
          # has been blank despite the labels being correct all along.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: |
            ${{ env.DOCKERHUB_REPO }}
            ${{ env.GHCR_REPO }}
          tags: |
            type=raw,value=${{ needs.meta.outputs.image_tag }}
            type=raw,value=${{ needs.meta.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
          # `annotations`, not `labels`: this job merges manifests rather than
          # building images, so a `labels:` block here was never consumed.
          # Kept in sync with the LABEL block in Dockerfile.connect.
          annotations: |
            org.opencontainers.image.title=connect
            org.opencontainers.image.description=Kafka Connect — fully open-source Debezium CDC for PostgreSQL, MySQL, MongoDB and SQL Server; Apicurio Registry converters for Avro, JSON Schema and Protobuf; Debezium JDBC sink, Aiven JDBC source/sink and Aiven S3 sink/source. Built on Strimzi Kafka 4.3.1.
            org.opencontainers.image.vendor=bmscomp
            org.opencontainers.image.licenses=Apache-2.0 AND MIT AND BSD-2-Clause AND BSD-3-Clause AND LGPL-2.1-or-later AND CDDL-1.0 AND CDDL-1.1 AND EPL-2.0 AND (GPL-2.0-only WITH Universal-FOSS-exception-1.0)
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            io.debezium.version=${{ needs.meta.outputs.debezium_version }}

      - name: Create and push multi-arch manifests
        env:
          ANNOTATIONS: ${{ steps.docker-meta.outputs.annotations }}
          TAGS: ${{ steps.docker-meta.outputs.tags }}
          PLATFORMS: ${{ needs.meta.outputs.platforms }}
        run: |
          set -euo pipefail

          # metadata-action emits one "index:key=value" per line; imagetools
          # wants each as its own --annotation flag.
          ANNOTATION_ARGS=()
          while IFS= read -r a; do
            [ -n "${a}" ] && ANNOTATION_ARGS+=(--annotation "${a}")
          done <<< "${ANNOTATIONS}"
          echo "Applying ${#ANNOTATION_ARGS[@]} index annotations"

          IFS=',' read -ra PLATS <<< "${PLATFORMS}"
          for REPO in "${DOCKERHUB_REPO}" "${GHCR_REPO}"; do
            SOURCES=()
            for p in "${PLATS[@]}"; do
              p="$(echo "$p" | xargs)"
              ARCH="${p#*/}"
              SOURCES+=("${REPO}:sha-${GITHUB_SHA}-${ARCH}")
            done

            while IFS= read -r TAG; do
              if [[ "${TAG}" == "${REPO}:"* ]]; then
                echo "Creating manifest: ${TAG}"
                # `docker manifest create` cannot write annotations — only
                # --amend and --insecure. imagetools can, and pushes in the
                # same command.
                docker buildx imagetools create \
                  "${ANNOTATION_ARGS[@]}" \
                  -t "${TAG}" "${SOURCES[@]}"
              fi
            done <<< "${TAGS}"
          done

  sign:
    name: Sign Images
    needs: [meta, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - uses: ./.github/actions/registry-login
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign images
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          # imagetools prints the INDEX digest. The previous `docker manifest
          # inspect -v | jq .digest` returned an array for a multi-arch image,
          # jq failed, and every connect image was "skipped" with a warning in
          # a green job. See publish-docker.yml.
          for REPO in "${DOCKERHUB_REPO}" "${GHCR_REPO}"; do
            IMAGE="${REPO}:${VERSION}"
            DIGEST=$(docker buildx imagetools inspect "${IMAGE}" --format '{{.Manifest.Digest}}')
            if [[ -z "${DIGEST}" ]]; then
              echo "::error::could not resolve the digest of ${IMAGE}"
              exit 1
            fi
            echo "signing ${REPO}@${DIGEST} (${IMAGE})"
            cosign sign --yes "${REPO}@${DIGEST}"
          done

  verify:
    name: Verify Published Images
    needs: [meta, merge-manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Every platform is in the index
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          PLATFORMS: ${{ needs.meta.outputs.platforms }}
        run: |
          set -euo pipefail
          for REPO in "${DOCKERHUB_REPO}" "${GHCR_REPO}"; do
            IMAGE="${REPO}:${VERSION}"
            echo "==> ${IMAGE}"
            docker buildx imagetools inspect "${IMAGE}" | tee /tmp/inspect.txt
            IFS=',' read -ra PLATS <<< "${PLATFORMS}"
            for p in "${PLATS[@]}"; do
              p="$(echo "$p" | xargs)"
              grep -qE "^\s*Platform:\s+${p}$" /tmp/inspect.txt \
                || { echo "::error::${IMAGE} is missing platform ${p}"; exit 1; }
            done
          done

      - name: Pull and verify plugins
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          IMAGE="${GHCR_REPO}:${VERSION}"
          echo "Pulling ${IMAGE}..."
          docker pull "${IMAGE}"

          echo ""
          echo "=== Image Info ==="
          docker inspect "${IMAGE}" --format '{{range $k,$v := .Config.Labels}}{{$k}}={{$v}}{{println}}{{end}}'

          echo ""
          echo "=== Connector Plugins ==="
          docker run --rm --entrypoint sh "${IMAGE}" -c \
            'for d in /opt/kafka/plugins/*/; do echo "✅ $(basename "$d") ($(ls "$d"/*.jar 2>/dev/null | wc -l) JARs)"; done'

          echo ""
          echo "=== Image Size ==="
          docker images "${IMAGE}" --format "{{.Size}}"

      - name: Scan the published image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.GHCR_REPO }}:${{ needs.meta.outputs.version }}
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

  update-charts:
    name: Update Helm Charts
    needs: [meta, verify, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Chart versions
        env:
          # connect-cluster 2.0: appVersion is the Kafka line (like
          # mirror-maker2's) and stays with the Kafka pin; the image pin and
          # the kates.io/connect-image annotation carry the build identity.
          IMAGE_TAG: ${{ needs.meta.outputs.image_tag }}
        run: |
          # Anchored to ^ (and the annotation's indent) so comments are left alone.
          sed -i "s|^image: .*|image: \"ghcr.io/bmscomp/connect:${IMAGE_TAG}\"|" charts/connect-cluster/values.yaml
          sed -i "s|^  kates.io/connect-image: .*|  kates.io/connect-image: \"ghcr.io/bmscomp/connect:${IMAGE_TAG}\"|" charts/connect-cluster/Chart.yaml

      - name: Commit and Push
        env:
          # Was only set on the step above, so the commit message read
          # "connect: [skip ci]" with no tag in it.
          IMAGE_TAG: ${{ needs.meta.outputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: pin connect-cluster to connect:${IMAGE_TAG} [skip ci]"
            git push
          fi
