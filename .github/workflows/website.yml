name: Website · katesplatform.io

on:
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate HTML and links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/load-versions
        with:
          keys: NODE_VERSION
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate HTML
        run: npx --yes html-validate@9 website/index.html

      - name: Check that every local asset the page references exists
        run: |
          set -euo pipefail
          cd website
          missing=0
          while IFS= read -r ref; do
            [ -e "$ref" ] || { echo "missing: $ref"; missing=1; }
          done < <(grep -oE '(src|href)="[^"#:]+"' index.html | sed -E 's/^[a-z]+="//; s/"$//' | sort -u)
          exit "$missing"

  deploy:
    name: Deploy to Cloudflare Pages
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: website
      url: https://katesplatform.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the Cloudflare secrets are present
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the website folder
        if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website --project-name=kates-website --branch=main --commit-dirty=true

  # GitHub Pages serves one site per repository and this repository's slot is
  # the book, so the website goes to a second repository, bmscomp/katesplatform.io,
  # whose Pages site is https://bmscomp.github.io/katesplatform.io/. This job
  # pushes the website folder to that repository's main branch, the branch
  # its Pages site is configured to serve. The
  # workflow's own GITHUB_TOKEN cannot write to another repository, so it
  # needs a secret: KATESPLATFORM_PAGES_TOKEN, a fine-grained personal access
  # token with Contents: read and write on bmscomp/katesplatform.io only.
  deploy-github-pages:
    name: Deploy to GitHub Pages (bmscomp/katesplatform.io)
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: website-github-pages
      url: https://katesplatform.io/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the GitHub Pages token is present
        id: secrets
        env:
          TOKEN: ${{ secrets.KATESPLATFORM_PAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "KATESPLATFORM_PAGES_TOKEN is not set; skipping the GitHub Pages deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the website folder to bmscomp/katesplatform.io (main)
        if: steps.secrets.outputs.ready == 'true'
        uses: peaceiris/actions-gh-pages@47f197a2200bb9de68ba5f48fad1c088eb1c4a32 # v4.0.0
        with:
          personal_token: ${{ secrets.KATESPLATFORM_PAGES_TOKEN }}
          external_repository: bmscomp/katesplatform.io
          publish_branch: main
          publish_dir: website
          exclude_assets: ""
          keep_files: false
          commit_message: "deploy: ${{ github.sha }}"
