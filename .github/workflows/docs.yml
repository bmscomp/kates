name: CI · Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docs:
              - 'README.md'
              - 'docs/**'
              - 'charts/*/Chart.yaml'
              - 'charts/**/*.md'
              - 'versions.env'
              - 'scripts/gen-chart-table.sh'
              - 'scripts/gen-version-matrix.sh'
              - 'scripts/check-book-style.sh'
              - 'scripts/check-mermaid.sh'
              - '.github/workflows/docs.yml'

  readme-chart-table:
    name: README Chart Table Sync
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify chart table matches charts/*/Chart.yaml
        run: ./scripts/gen-chart-table.sh --check

      - name: Verify book version matrix matches repo pins
        run: ./scripts/gen-version-matrix.sh --check

      - name: Verify book style rules
        run: ./scripts/check-book-style.sh

  mermaid:
    name: Mermaid Diagrams Parse
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/load-versions
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # A broken diagram used to surface only as a failed PDF render in the
      # Book workflow, naming no file — and not at all for the diagrams in
      # charts/, which never reach Quarto and simply render as an error box on
      # GitHub. mermaid.parse() is the same validation the renderer runs first.
      - name: Every mermaid diagram parses
        run: ./scripts/check-mermaid.sh --quiet

  link-check:
    name: Markdown Link Check
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check relative links in README and top-level docs
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Offline mode validates only local file links (the drift we care
          # about) and never fails on external outages or localhost URLs.
          args: --offline --no-progress --include-fragments README.md "docs/**/*.md"
          fail: true

  gate:
    name: Gate · Docs
    if: always()
    needs: [changes, readme-chart-table, mermaid, link-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci-gate
        with:
          needs: ${{ toJSON(needs) }}
