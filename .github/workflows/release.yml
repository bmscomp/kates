name: Release

# The one workflow a `v*` tag starts. Everything a release consists of — the
# CLI binaries, the three images, the GitHub Release, the Homebrew tap — is a
# job on this run, in dependency order, so a failure anywhere is one red run
# rather than one of four green-looking workflows quietly missing. The image
# pipelines are the publish-*.yml workflows, called rather than triggered.
#
# Order: the Release and the tap are only published once every image is up
# and verified, so `brew install` can never hand out a version whose image
# does not exist.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # softprops/action-gh-release, update-charts commits
  packages: write # image pushes in the called workflows
  id-token: write # cosign keyless signing, build provenance attestations
  attestations: write # actions/attest-build-provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MODULE: "github.com/bmscomp/kates/cli/cmd"

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build binary
        working-directory: cli
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          go build -trimpath \
            -ldflags="-s -w \
              -X ${MODULE}.Version=${VERSION} \
              -X ${MODULE}.Commit=${COMMIT} \
              -X ${MODULE}.BuildDate=${BUILD_DATE}" \
            -o kates .

      - name: Package tarball
        working-directory: cli
        run: |
          ARCHIVE="kates-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          tar -czf "${ARCHIVE}" kates
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"

      # SLSA build provenance for each tarball, verifiable with
      # `gh attestation verify kates-<os>-<arch>.tar.gz --repo bmscomp/kates`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: cli/kates-${{ matrix.os }}-${{ matrix.arch }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kates-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            cli/kates-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            cli/kates-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256

  kates-image:
    name: Kates image
    uses: ./.github/workflows/publish-docker.yml
    secrets: inherit

  connect-image:
    name: Connect image
    uses: ./.github/workflows/publish-connect.yml
    secrets: inherit

  tester-image:
    name: Tester image
    uses: ./.github/workflows/publish-tester.yml
    secrets: inherit

  release:
    name: Create GitHub Release
    needs: [build, kates-image, connect-image, tester-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Aggregate checksums
        run: cat dist/*.sha256 > dist/checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/kates-*.tar.gz
            dist/checksums.txt

  homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download darwin artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Compute SHAs and update formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          SHA_DARWIN_ARM64=$(shasum -a 256 dist/kates-darwin-arm64.tar.gz | cut -d' ' -f1)
          SHA_DARWIN_AMD64=$(shasum -a 256 dist/kates-darwin-amd64.tar.gz | cut -d' ' -f1)
          SHA_LINUX_AMD64=$(shasum -a 256 dist/kates-linux-amd64.tar.gz | cut -d' ' -f1)
          SHA_LINUX_ARM64=$(shasum -a 256 dist/kates-linux-arm64.tar.gz | cut -d' ' -f1)
          VERSION="${TAG#v}"
          REPO="bmscomp/kates"

          cat > kates.rb <<'EOF'
          class Kates < Formula
            desc "CLI for Kafka Advanced Testing & Engineering Suite"
            homepage "https://github.com/__REPO__"
            version "__VERSION__"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/__REPO__/releases/download/__TAG__/kates-darwin-arm64.tar.gz"
                sha256 "__SHA_DARWIN_ARM64__"
              else
                url "https://github.com/__REPO__/releases/download/__TAG__/kates-darwin-amd64.tar.gz"
                sha256 "__SHA_DARWIN_AMD64__"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/__REPO__/releases/download/__TAG__/kates-linux-arm64.tar.gz"
                sha256 "__SHA_LINUX_ARM64__"
              else
                url "https://github.com/__REPO__/releases/download/__TAG__/kates-linux-amd64.tar.gz"
                sha256 "__SHA_LINUX_AMD64__"
              end
            end

            def install
              bin.install "kates"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/kates version")
            end
          end
          EOF

          sed -i 's/^          //' kates.rb
          sed -i "s|__REPO__|${REPO}|g"                     kates.rb
          sed -i "s|__VERSION__|${VERSION}|g"                kates.rb
          sed -i "s|__TAG__|${TAG}|g"                        kates.rb
          sed -i "s|__SHA_DARWIN_ARM64__|${SHA_DARWIN_ARM64}|g" kates.rb
          sed -i "s|__SHA_DARWIN_AMD64__|${SHA_DARWIN_AMD64}|g" kates.rb
          sed -i "s|__SHA_LINUX_ARM64__|${SHA_LINUX_ARM64}|g"  kates.rb
          sed -i "s|__SHA_LINUX_AMD64__|${SHA_LINUX_AMD64}|g"  kates.rb

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/bmscomp/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp kates.rb tap/Formula/kates.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/kates.rb
          git commit -m "kates ${TAG}"
          git push

  # The formula's own `test do` block runs `kates version`, but only when
  # someone runs `brew test`. This installs from the tap the way a user does,
  # on the OS most users are on, and checks the binary reports the tag.
  brew-smoke:
    name: brew install smoke test
    needs: homebrew
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Install from the tap and run it
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          brew install bmscomp/tap/kates
          out=$(kates version)
          echo "${out}"
          echo "${out}" | grep -F -- "${TAG#v}" \
            || { echo "::error::kates version does not report ${TAG#v}"; exit 1; }
