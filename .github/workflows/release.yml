name: Release

# The one workflow a `v*` tag starts. Everything a release consists of — the
# CLI binaries, the three images, the Helm charts, the GitHub Release, the
# Homebrew tap — is a job on this run, in dependency order, so a failure
# anywhere is one red run rather than one of five green-looking workflows
# quietly missing. The image and chart pipelines are the publish-*.yml
# workflows, called rather than triggered.
#
# Order: the charts publish only once every image is up and verified, since
# they pin those images; the Release and the tap only once the charts are
# out, so `brew install` can never hand out a version whose image or chart
# does not exist.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # softprops/action-gh-release, update-charts commits
  packages: write # image pushes in the called workflows
  id-token: write # cosign keyless signing, build provenance attestations
  attestations: write # actions/attest-build-provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MODULE: "github.com/bmscomp/kates/cli/cmd"

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build binary
        working-directory: cli
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # name=version of every chart at this tag, read as publish-charts.yml
          # reads them: the versions this release publishes, which `kates
          # deploy` pulls (cli/cmd/deploy_charts.go).
          CHART_VERSIONS=""
          for chart in $(git -C .. ls-files ':(glob)charts/*/Chart.yaml'); do
            name=$(sed -nE 's/^name:[[:space:]]*"?([^"[:space:]]+)"?.*$/\1/p' "../${chart}")
            version=$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?.*$/\1/p' "../${chart}")
            CHART_VERSIONS="${CHART_VERSIONS:+${CHART_VERSIONS},}${name}=${version}"
          done
          # The versions.env pins kates migrate reads (cli/cmd/migrate_charts.go),
          # resolved as a shell sourcing the file resolves them.
          MIGRATE_PINS=$(set -a && . ../versions.env && printf 'STRIMZI_VERSION=%s,STRIMZI_KAFKA_VERSION=%s,KAFKA_IMAGE=%s' \
            "${STRIMZI_VERSION}" "${STRIMZI_KAFKA_VERSION}" "${KAFKA_IMAGE}")

          go build -trimpath \
            -ldflags="-s -w \
              -X ${MODULE}.Version=${VERSION} \
              -X ${MODULE}.Commit=${COMMIT} \
              -X ${MODULE}.BuildDate=${BUILD_DATE} \
              -X ${MODULE}.ChartVersions=${CHART_VERSIONS} \
              -X ${MODULE}.MigratePins=${MIGRATE_PINS}" \
            -o kates .

      # scripts/install-kates.sh unpacks this layout, krew/kates.yaml extracts
      # kates and LICENSE from it, and scripts/check-install-kates.sh packs its
      # stand-in the same way: change them together.
      - name: Package tarball
        working-directory: cli
        run: |
          ARCHIVE="kates-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          cp ../LICENSE LICENSE
          tar -czf "${ARCHIVE}" kates LICENSE
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"

      # SLSA build provenance for each tarball, verifiable with
      # `gh attestation verify kates-<os>-<arch>.tar.gz --repo bmscomp/kates`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: cli/kates-${{ matrix.os }}-${{ matrix.arch }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kates-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            cli/kates-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            cli/kates-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256

  kates-image:
    name: Kates image
    uses: ./.github/workflows/publish-docker.yml
    secrets: inherit

  connect-image:
    name: Connect image
    uses: ./.github/workflows/publish-connect.yml
    secrets: inherit

  tester-image:
    name: Tester image
    uses: ./.github/workflows/publish-tester.yml
    secrets: inherit

  # No `secrets: inherit`: the chart job needs only its own GITHUB_TOKEN.
  charts:
    name: Helm charts
    needs: [kates-image, connect-image, tester-image]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-charts.yml

  # This release's own CLI, run outside any checkout, deploys the charts this
  # run just published, as a Homebrew user would: pulled from GHCR, their
  # signatures required. A chart, an overlay or an image pin that cannot
  # install fails here, before the GitHub Release and the tap point anyone at
  # it. The charts are already pushed by then, and a published version is
  # never pushed again, so the fix ships as new chart versions.
  published-smoke:
    name: Deploy the published charts
    needs: [build, charts]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # For versions.env and the kind topology only: the deploy runs elsewhere.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/load-versions

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Create Kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: ${{ env.KIND_VERSION }}
          kubectl_version: ${{ env.KUBECTL_VERSION }}
          cluster_name: ci-smoke
          config: config/cluster.yaml
          wait: 120s

      # As make cluster and kates deploy's own cluster build do: alpha is the
      # control plane and one of the three zones.
      - name: Make every zone schedulable
        run: |
          kubectl wait --for=condition=Ready nodes --all --timeout=180s
          kubectl taint nodes --all node-role.kubernetes.io/control-plane:NoSchedule- || true

      - name: Download the CLI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kates-linux-amd64
          path: ${{ runner.temp }}/cli

      - name: Deploy from the published charts, outside any checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KATES_REQUIRE_SIGNED_CHARTS: "1"
        run: |
          set -euo pipefail
          tar -xzf "${RUNNER_TEMP}/cli/kates-linux-amd64.tar.gz" -C "${RUNNER_TEMP}/cli"
          kates="${RUNNER_TEMP}/cli/kates"
          mkdir -p "${RUNNER_TEMP}/elsewhere" && cd "${RUNNER_TEMP}/elsewhere"
          "${kates}" version
          flags=(--yes --with-monitoring=false --with-chaos=false --with-kafka-ui=false
                 --with-schema-registry none --with-cert-manager=false)
          "${kates}" deploy --dry-run "${flags[@]}"
          "${kates}" deploy "${flags[@]}"
          helm list -A
          kubectl get pods -A

      - name: Show what failed
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
          cat "${RUNNER_TEMP}/elsewhere/deploy-error.log" ~/.local/state/kates/deploy/deploy-error.log 2>/dev/null || true

  release:
    name: Create GitHub Release
    needs: [build, kates-image, connect-image, tester-image, charts, published-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Aggregate checksums
        run: cat dist/*.sha256 > dist/checksums.txt

      - name: Render release and Marketplace description
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sed "s|__TAG__|${TAG}|g" .github/release-body.md.tmpl > dist/release-body.md

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: dist/release-body.md
          generate_release_notes: true
          files: |
            dist/kates-*.tar.gz
            dist/checksums.txt

  homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download darwin artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Compute SHAs and update formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          SHA_DARWIN_ARM64=$(shasum -a 256 dist/kates-darwin-arm64.tar.gz | cut -d' ' -f1)
          SHA_DARWIN_AMD64=$(shasum -a 256 dist/kates-darwin-amd64.tar.gz | cut -d' ' -f1)
          SHA_LINUX_AMD64=$(shasum -a 256 dist/kates-linux-amd64.tar.gz | cut -d' ' -f1)
          SHA_LINUX_ARM64=$(shasum -a 256 dist/kates-linux-arm64.tar.gz | cut -d' ' -f1)
          VERSION="${TAG#v}"
          REPO="bmscomp/kates"

          cat > kates.rb <<'EOF'
          class Kates < Formula
            desc "CLI for Kafka Advanced Testing & Engineering Suite"
            homepage "https://github.com/__REPO__"
            version "__VERSION__"
            license "Apache-2.0"

            # kates deploy checks the cosign signature of every chart it pulls.
            depends_on "cosign"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/__REPO__/releases/download/__TAG__/kates-darwin-arm64.tar.gz"
                sha256 "__SHA_DARWIN_ARM64__"
              else
                url "https://github.com/__REPO__/releases/download/__TAG__/kates-darwin-amd64.tar.gz"
                sha256 "__SHA_DARWIN_AMD64__"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/__REPO__/releases/download/__TAG__/kates-linux-arm64.tar.gz"
                sha256 "__SHA_LINUX_ARM64__"
              else
                url "https://github.com/__REPO__/releases/download/__TAG__/kates-linux-amd64.tar.gz"
                sha256 "__SHA_LINUX_AMD64__"
              end
            end

            def install
              bin.install "kates"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/kates version")
            end
          end
          EOF

          sed -i 's/^          //' kates.rb
          sed -i "s|__REPO__|${REPO}|g"                     kates.rb
          sed -i "s|__VERSION__|${VERSION}|g"                kates.rb
          sed -i "s|__TAG__|${TAG}|g"                        kates.rb
          sed -i "s|__SHA_DARWIN_ARM64__|${SHA_DARWIN_ARM64}|g" kates.rb
          sed -i "s|__SHA_DARWIN_AMD64__|${SHA_DARWIN_AMD64}|g" kates.rb
          sed -i "s|__SHA_LINUX_ARM64__|${SHA_LINUX_ARM64}|g"  kates.rb
          sed -i "s|__SHA_LINUX_AMD64__|${SHA_LINUX_AMD64}|g"  kates.rb

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/bmscomp/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp kates.rb tap/Formula/kates.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/kates.rb
          git commit -m "kates ${TAG}"
          git push

  # The formula's own `test do` block runs `kates version`, but only when
  # someone runs `brew test`. This installs from the tap the way a user does,
  # on the OS most users are on, and checks the binary reports the tag.
  brew-smoke:
    name: brew install smoke test
    needs: homebrew
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Install from the tap and run it
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          brew install bmscomp/tap/kates
          out=$(kates version)
          echo "${out}"
          echo "${out}" | grep -F -- "${TAG#v}" \
            || { echo "::error::kates version does not report ${TAG#v}"; exit 1; }
