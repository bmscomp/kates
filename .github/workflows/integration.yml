name: CI · Integration

# What needs a real cluster, and only that. Helm lint, template rendering,
# kubeconform and the config YAML parse all live in CI · Backend; they used to
# be repeated here (with `helm dependency build || true`, so a broken chart
# lint here was a false green anyway).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cluster: ${{ steps.filter.outputs.cluster || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        # Manual runs have no diff to filter on; the `|| 'true'` above runs
        # everything for them.
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            cluster:
              - 'cli/**'
              - '!cli/**/*.md'
              - 'kates/**'
              - '!kates/**/*.md'
              - 'config/**'
              - 'images.env'
              - 'versions.env'
              - 'Makefile'
              - 'charts/kafka-cluster/**'
              - 'charts/strimzi-operator/**'
              - 'scripts/deploy-kafka-generic.sh'
              - '.github/workflows/integration.yml'

  integration:
    name: Kind Cluster Smoke Tests
    needs: changes
    if: needs.changes.outputs.cluster == 'true'
    runs-on: ubuntu-latest
    # The Kafka deploy below takes up to 10 minutes on its own.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # versions.env is the single source of truth; the action fails if a pin
      # is missing, which is the point: a silently empty KIND_VERSION would
      # request https://kind.sigs.k8s.io/dl//kind-linux-amd64 and install a 404.
      - uses: ./.github/actions/load-versions

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # helm/kind-action rather than two hand-rolled curls. Those hardcoded
      # kind-linux-amd64, verified no checksum, cached nothing, and — being shell
      # inside a run block — were invisible to Dependabot, which is how the pin
      # reached eighteen months old without anyone noticing.
      #
      # node_image is deliberately NOT passed: config/cluster.yaml names the
      # image per node and check-versions.sh asserts it against versions.env.
      # Passing it here as well would create a second source of truth, and the
      # flag silently wins over the file.
      - name: Create Kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: ${{ env.KIND_VERSION }}
          kubectl_version: ${{ env.KUBECTL_VERSION }}
          cluster_name: ci-test
          config: config/cluster.yaml
          wait: 120s

      - name: Wait for every node
        run: |
          kubectl cluster-info --context kind-ci-test
          # kind-action's `wait` covers the control plane; the workers join after
          # it returns, and the zone checks below need all three.
          kubectl wait --for=condition=Ready nodes --all --timeout=180s

      - name: Validate cluster topology
        id: topology
        run: |
          echo "Checking node labels..."
          for zone in alpha sigma gamma; do
            if kubectl get nodes -l topology.kubernetes.io/zone=${zone} --no-headers | grep -q .; then
              echo "✅ Zone ${zone} node found"
            else
              echo "❌ Zone ${zone} node missing" && exit 1
            fi
          done

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build kates CLI
        working-directory: cli
        run: go build -o ../build/kates .

      - name: "CI Gate: kates detect --fail-on-error"
        id: detect
        run: |
          echo "Running cluster compatibility check..."
          ./build/kates detect --fail-on-error --quiet
          echo "✅ Cluster is compatible with Kafka deployment"

      - name: Apply storage classes
        id: storage
        run: kubectl apply -f config/storage/storage-classes.yaml

      - name: Create namespaces
        run: |
          for ns in kafka monitoring velero litmus apicurio; do
            kubectl create namespace ${ns} --dry-run=client -o yaml | kubectl apply -f -
          done

      - name: Verify Kafka CRDs can be deployed
        run: |
          echo "Verifying Strimzi CRDs would be accepted..."
          kubectl apply --dry-run=server -f config/kafka/kafka-topics.yaml 2>&1 || echo "Expected: CRDs not installed yet (Strimzi operator needed)"
          echo "✅ Kafka config files are syntactically valid Kubernetes manifests"

      - name: Verify NetworkPolicies
        id: netpol
        run: |
          kubectl apply -f config/kafka/kafka-networkpolicies.yaml --dry-run=server
          echo "✅ NetworkPolicies are valid"

      - name: Verify monitoring config
        id: monitoring
        run: |
          echo "Jaeger Helm values present:"
          test -f config/monitoring/jaeger-values.yaml && echo "✅ jaeger-values.yaml"
          test -f config/monitoring/jaeger-values-offline.yaml && echo "✅ jaeger-values-offline.yaml"

      # The conformity check against a live Strimzi cluster. The deploy is the
      # migration e2e's: the operator chart and the kafka-cluster chart the repo
      # ships, with values-ci.yaml's one controller and one broker so it fits
      # the runner. ConformityLiveTest then runs the check's code through this
      # job's kubeconfig against cli/examples/conformity/kind-ci.yaml, and every
      # rule must pass. No Kates API is deployed: kafka.source cr reads only
      # Kubernetes.
      - name: Deploy Strimzi + Kafka (krafter)
        id: kafka
        run: ./scripts/deploy-kafka-generic.sh --yes --skip-tests -f charts/kafka-cluster/values-ci.yaml

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Conformity check against the live cluster
        id: conformity
        working-directory: kates
        env:
          KATES_CONFORMITY_LIVE: "true"
        run: ./mvnw test -q -B -ntp -Dtest=ConformityLiveTest

      # Reads each step's real outcome. The previous table printed ✅ on every
      # row under `if: always()`, so a failed run still summarised as green.
      - name: Summary
        if: always()
        env:
          TOPOLOGY: ${{ steps.topology.outcome }}
          DETECT: ${{ steps.detect.outcome }}
          STORAGE: ${{ steps.storage.outcome }}
          NETPOL: ${{ steps.netpol.outcome }}
          MONITORING: ${{ steps.monitoring.outcome }}
          KAFKA: ${{ steps.kafka.outcome }}
          CONFORMITY: ${{ steps.conformity.outcome }}
        run: |
          mark() { case "$1" in success) echo "✅" ;; skipped) echo "⏭️" ;; *) echo "❌" ;; esac; }
          {
            echo "## Integration Test Results"
            echo
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| 3-zone topology | $(mark "$TOPOLOGY") |"
            echo "| kates detect gate | $(mark "$DETECT") |"
            echo "| Storage classes | $(mark "$STORAGE") |"
            echo "| NetworkPolicies | $(mark "$NETPOL") |"
            echo "| Jaeger manifests | $(mark "$MONITORING") |"
            echo "| Strimzi + Kafka deploy | $(mark "$KAFKA") |"
            echo "| Conformity (kind-ci.yaml) | $(mark "$CONFORMITY") |"
          } >> "$GITHUB_STEP_SUMMARY"

      # No explicit teardown: helm/kind-action registers a post step that deletes
      # the cluster it created, on success and on failure alike. A `kind delete`
      # here would only race it.

  gate:
    name: Gate · Integration
    if: always()
    needs: [changes, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci-gate
        with:
          needs: ${{ toJSON(needs) }}
