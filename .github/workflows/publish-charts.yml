name: Publish · Helm charts

# ──────────────────────────────────────────────────────────────────────────────
# Publishes every chart tracked under charts/ to the OCI registry:
#   oci://ghcr.io/bmscomp/charts/<name>:<Chart.yaml version>
# Each chart is signed with cosign (keyless, GitHub OIDC), the signature is
# verified, and its build provenance is attested — matching the images.
#
# Called by release.yml on every `v*` tag, after the three image workflows:
# the charts pin those images, so a chart never goes out before its images
# have passed their CVE gate. Runnable by hand from main for a chart-only fix.
#
# A PUBLISHED VERSION IS NEVER PUSHED AGAIN. `helm package` is not
# byte-reproducible (file mtimes go into the tarball), so a re-push would
# point the tag at new bytes under anyone who pinned its digest. A chart whose
# files changed goes out only under a new Chart.yaml version. A version that
# is already there is still checked: an earlier run that died between push
# and sign, or sign and attest, is finished here rather than skipped forever.
#
# Users verify what they pull with the commands in README.md.
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

# A literal name, not github.workflow: called from release.yml, github.workflow
# is "Release", and a shared group cancelled a publish job on v1.24.0 (#240).
concurrency:
  group: publish-charts-${{ github.ref }}
  cancel-in-progress: false

env:
  CHART_REGISTRY: oci://ghcr.io/bmscomp/charts

jobs:
  publish:
    name: Package, Push, Sign & Attest Charts
    # Only reviewed code publishes: main, or a release tag. A dispatch from a
    # feature branch would put unreviewed charts under a real version.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing, build provenance
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/load-versions

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Helm keeps its own registry credentials; cosign and gh read Docker's.
      - name: Log in to GHCR
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${TOKEN}" | helm registry login ghcr.io -u "${ACTOR}" --password-stdin
          echo "${TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin

      # helm package refuses a chart whose declared dependencies are not
      # built. Order matters: the kafka-common consumers before the umbrella,
      # which packages its file:// subcharts as they are on disk.
      - name: Build chart dependencies
        uses: ./.github/actions/helm-deps
        with:
          charts: strimzi-operator kafka-cluster connect-cluster kates-chaos monitoring mirror-maker2 kates-platform

      - name: Push, sign and verify charts
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          workflow=".github/workflows/publish-charts.yml"
          identity="^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/publish-charts\.yml@refs/(heads/main|tags/v.+)$"
          issuer="https://token.actions.githubusercontent.com"
          mkdir -p .build/pulled
          : > .build/subjects.sha256

          # Tracked charts only: a stray directory under charts/ is not a chart.
          # :(glob) keeps `*` to one level, so test charts nested deeper
          # (kafka-common/tests/harness) are not published.
          for chart in $(git ls-files ':(glob)charts/*/Chart.yaml' | xargs -n1 dirname); do
            name=$(sed -nE 's/^name:[[:space:]]*"?([^"[:space:]]+)"?.*$/\1/p' "${chart}/Chart.yaml")
            version=$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?.*$/\1/p' "${chart}/Chart.yaml")
            repo="${CHART_REGISTRY#oci://}/${name}"
            echo "==> ${name} ${version}"

            if out=$(helm pull "${CHART_REGISTRY}/${name}" --version "${version}" -d .build/pulled 2>&1); then
              echo "already published; not pushing it again"
              published=yes
            elif grep -qiE 'not found|denied|forbidden|unauthorized|40[134]' <<< "${out}"; then
              # Absent, or unreadable. A token refused the read is refused the
              # push as well, so an unreadable version cannot be overwritten.
              helm package "${chart}" --destination .build/ > /dev/null
              out=$(helm push ".build/${name}-${version}.tgz" "${CHART_REGISTRY}" 2>&1) || { echo "${out}"; exit 1; }
              published=no
            else
              # Anything else (a timeout, a 5xx) leaves it unknown: stop
              # rather than risk pushing over a published version.
              echo "::error::cannot tell whether ${name} ${version} is published: ${out}"
              exit 1
            fi
            echo "${out}"
            digest=$(awk '/^Digest:/ {print $2}' <<< "${out}")
            if [[ "${digest}" != sha256:* ]]; then
              echo "::error::no digest for ${name} ${version}"
              exit 1
            fi

            if ! cosign verify "${repo}@${digest}" --certificate-identity-regexp "${identity}" \
                 --certificate-oidc-issuer "${issuer}" > /dev/null 2>&1; then
              cosign sign --yes "${repo}@${digest}"
              cosign verify "${repo}@${digest}" --certificate-identity-regexp "${identity}" \
                --certificate-oidc-issuer "${issuer}" > /dev/null
            fi
            echo "signature verified"

            # shortcut: a published chart missing its attestation gets this
            # run's commit as its source, right only while a changed chart
            # must take a new version; record the pushing commit if that goes.
            if [[ "${published}" == no ]] || ! gh attestation verify "oci://${repo}@${digest}" \
                 --repo "${GITHUB_REPOSITORY}" --signer-workflow "${GITHUB_REPOSITORY}/${workflow}" > /dev/null 2>&1; then
              echo "${digest#sha256:}  ${repo}" >> .build/subjects.sha256
            fi
          done

          if [[ -s .build/subjects.sha256 ]]; then
            echo "attest=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Attest build provenance
        if: steps.push.outputs.attest == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: .build/subjects.sha256
