name: CI · Release scan

# A release pin PR (chore/release-*) moves only pins, so the path-filtered image
# builds skip it, and the first Trivy pass over what the tag ships used to be
# Verify Published Images, after the images were already pushed (v1.29.2 and
# v1.33.0 both failed there). This builds every image the tag publishes from
# the PR's tree and applies the release's own gate, so a CVE that would fail
# the release fails the pin PR instead.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan ${{ matrix.image }} (amd64)
    if: startsWith(github.head_ref, 'chore/release-')
    runs-on: ubuntu-latest
    # The native compile is 15-25 minutes on a 4-core runner.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # cache-from reads the publish workflows' scopes, so the image is the
          # one the release would build from the same layers.
          - image: kates
            context: .
            file: kates/Dockerfile
            cache: type=gha,scope=jvm-amd64
          - image: kates-native
            context: .
            file: kates/Dockerfile.native
            cache: type=gha,scope=native-amd64
          - image: connect
            context: .
            file: Dockerfile.connect
            cache: type=gha,scope=connect-amd64
          # No cache, as in publish-tester.yml and ci-tester.yml.
          - image: kates-tester
            context: tester
            file: tester/Dockerfile
            cache: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ matrix.image }}:release-scan
          cache-from: ${{ matrix.cache }}

      # The same settings as Verify Published Images in publish-docker.yml,
      # publish-connect.yml and publish-tester.yml.
      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:release-scan
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

  gate:
    name: Gate · Release scan
    if: always()
    needs: [scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci-gate
        with:
          needs: ${{ toJSON(needs) }}
