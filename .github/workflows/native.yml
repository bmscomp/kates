name: CI · Native image

# The native image ships alongside the JVM one, but until now nothing built it
# outside a release tag. Ahead-of-time compilation breaks in ways no JVM test can
# see — a type Jackson can no longer introspect, a classpath resource that was
# not packaged, a class initialised at build time that needed a runtime
# initialiser — so the first sign of a break was a failed release, or a shipped
# image whose endpoints return {}.
#
# This builds the real Dockerfile.native and smoke-tests the resulting binary.
# It is slow (the compiler needs ~20 minutes and most of the runner's memory),
# so it runs only when the backend actually changes, plus nightly.

on:
  push:
    branches: [main]
    paths:
      - "kates/**"
      - ".github/workflows/native.yml"
      - "scripts/native-smoke-test.sh"
      - "!**/*.md"
  pull_request:
    branches: [main]
    paths:
      - "kates/**"
      - ".github/workflows/native.yml"
      - "scripts/native-smoke-test.sh"
      - "!**/*.md"
  schedule:
    # 03:17 UTC — catches breakage from dependency updates that land without
    # touching kates/**, and the odd-minute offset avoids the top-of-hour rush.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-smoke-test:
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    # A native compile is 15-25 minutes on a 4-core runner; the timeout is a
    # backstop against a hung compiler burning an hour of runner time.
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write # notify-scheduled-failure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds the SAME Dockerfile the release publishes, so this validates what
      # ships rather than an approximation of it.
      - name: Build native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: kates/Dockerfile.native
          tags: kates:native-ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the native binary
        run: ./scripts/native-smoke-test.sh kates:native-ci

      # Size is a headline reason to ship native at all; surfacing it in the
      # run summary makes an accidental regression visible instead of
      # something you notice months later on a slow node pull.
      - name: Report image size
        if: always()
        run: |
          size=$(docker image inspect kates:native-ci --format '{{.Size}}' 2>/dev/null || echo 0)
          layers=$(docker image inspect kates:native-ci --format '{{len .RootFS.Layers}}' 2>/dev/null || echo 0)
          echo "native image size: ${size} bytes (${layers} layers)"
          {
            echo "### Native image"
            echo
            echo "| Size | Layers |"
            echo "|---:|---:|"
            echo "| $((size / 1024 / 1024)) MiB | ${layers} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue for a failed nightly run
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/notify-scheduled-failure
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
