version: 2
updates:
  # Keeps the digest-pinned base images (Dockerfile, Dockerfile.native) current
  # across Docker Hub, quay.io, and registry.access.redhat.com — resolves the
  # digests the manual web lookup could not fetch for quay/RedHat.
  - package-ecosystem: docker
    directory: /kates
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The Connect and legacy-Kafka images (root Dockerfiles) and the tester
  # image were not covered: only /kates was.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /tester
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Maven dependencies (Quarkus BOM, kafka-clients/netty CVE pins, etc.).
  - package-ecosystem: maven
    directory: /kates
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # GitHub Actions used across the workflows. Every `uses:` is pinned to a
  # commit SHA with a `# vX.Y.Z` comment; Dependabot bumps both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR per week for the whole set rather than one per action.
      actions:
        patterns: ["*"]

  # The Go CLI: go.mod/go.sum were not on Dependabot at all.
  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
