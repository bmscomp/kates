{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "headlamp.fullname" . }}
  labels:
    {{- include "headlamp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "headlamp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | default "ingress-nginx" }}
      ports:
        - port: {{ .Values.containerPort }}
          protocol: TCP
    # The Helm test, which asks Headlamp for its page
    - from:
        - podSelector:
            matchLabels:
              {{- include "headlamp.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.containerPort }}
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Any address, IPv4 or IPv6: where the API server listens depends on the cluster.
    - ports:
        - port: 443
          protocol: TCP
        - port: {{ .Values.networkPolicy.apiServer.port | default 6443 }}
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              {{- include "headlamp.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.containerPort }}
          protocol: TCP
{{- end }}
