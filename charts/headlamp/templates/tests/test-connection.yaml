apiVersion: v1
kind: Pod
metadata:
  name: {{ include "headlamp.fullname" . }}-test
  labels:
    {{- include "headlamp.podLabels" (dict "ctx" . "labels" (include "headlamp.labels" .)) | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.test.podSecurityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
  - name: connection-test
    image: {{ include "headlamp.image" (dict "ctx" . "image" .Values.test.image) | quote }}
    {{- with .Values.test.securityContext }}
    securityContext:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.test.resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    command:
      - sh
      - -c
      - |
        echo "Testing Headlamp connectivity..."
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://{{ include "headlamp.fullname" . }}:{{ .Values.service.port }}/)
        if [ "$STATUS" = "200" ]; then
          echo "Headlamp is reachable (HTTP $STATUS)"
          exit 0
        else
          echo "Headlamp unreachable (HTTP $STATUS)"
          exit 1
        fi
