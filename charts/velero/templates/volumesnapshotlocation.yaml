{{- if .Values.snapshotsEnabled }}

{{- if typeIs "[]interface {}" .Values.configuration.volumeSnapshotLocation }}
{{- range .Values.configuration.volumeSnapshotLocation }}
{{- /* Skip stub entries with no provider — they would render CRs that fail
       the velero.io schema (provider is required). */}}
{{- if .provider }}
---
apiVersion: velero.io/v1
kind: VolumeSnapshotLocation
metadata:
  name: {{ .name | default "default" }}
  namespace: {{ $.Release.Namespace }}
  {{- with .annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{- $key | nindent 4 }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ include "velero.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    helm.sh/chart: {{ include "velero.chart" $ }}
spec:
  {{- /* Render credential only when name/key are actually set — a bare
         `credential:` (null) fails the velero.io CRD schema. */}}
  {{- $cred := .credential | default dict }}
  {{- if or $cred.name $cred.key }}
  credential:
    {{- with $cred.name }}
    name: {{ . }}
    {{- end }}
    {{- with $cred.key }}
    key: {{ . }}
    {{- end }}
  {{- end }}
  provider: {{ .provider }}
{{- with .config }}
  config:
{{- range $key, $value := . }}
{{- $key | nindent 4 }}: {{ $value | quote }}
{{- end }}
{{- end -}}
{{- end }}{{- /* end if .provider */}}
{{- end }}
{{- end }}
{{- end }}
