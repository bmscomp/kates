{{- if .Values.backupsEnabled }}

{{- if typeIs "[]interface {}" .Values.configuration.backupStorageLocation }}
{{- range .Values.configuration.backupStorageLocation }}
{{- /* Skip stub entries with no provider — they would render CRs that fail
       the velero.io schema (provider is required). */}}
{{- if .provider }}
---
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: {{ .name | default "default" }}
  namespace: {{ $.Release.Namespace }}
  {{- with .annotations }}
  annotations:
      {{- range $key, $value := . }}
    {{- $key | nindent 4 }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ include "velero.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    helm.sh/chart: {{ include "velero.chart" $ }}
spec:
  {{- /* Render credential only when name/key are actually set — a bare
         `credential:` (null) fails the velero.io CRD schema. */}}
  {{- $cred := .credential | default dict }}
  {{- if or $cred.name $cred.key }}
  credential:
    {{- with $cred.name }}
    name: {{ . }}
    {{- end }}
    {{- with $cred.key }}
    key: {{ . }}
    {{- end }}
  {{- end }}
  provider: {{ .provider }}
  accessMode: {{ .accessMode | default "ReadWrite" }}
  {{- with .default }}
  default: {{ . }}
  {{- end }}
  {{- with .validationFrequency }}
  validationFrequency: {{ . }}
  {{- end }}
  objectStorage:
    bucket: {{ .bucket | quote }}
    {{- with .prefix }}
    prefix: {{ . | quote }}
    {{- end }}
    {{- with .caCert }}
    caCert: {{ . }}
    {{- end }}
{{- with .config }}
  config:
{{- range $key, $value := . }}
{{- $key | nindent 4 }}: {{ $value | quote }}
{{- end }}
{{- end }}
{{- end }}{{- /* end if .provider */}}
{{- end }}
{{- end }}
{{- end }}
