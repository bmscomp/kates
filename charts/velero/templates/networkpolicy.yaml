{{- /*
What Velero needs where the namespace denies all ingress and egress by
default: DNS, the API server and the object store, for the server, the node
agent and the CRD Jobs; the metrics port for Prometheus and the Helm test.
A hook ahead of the CRD upgrade Job, since a pre-install Job runs before any
ordinary resource exists; never deleted after it succeeds, so every other pod
has it too. Helm leaves hook resources behind on uninstall.
*/ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "velero.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "velero.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ include "velero.chart" . }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8085
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        {{- range .Values.networkPolicy.apiServerPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    # The backup storage locations, wherever they are.
    - ports:
        {{- range .Values.networkPolicy.objectStorePorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    # The Helm test reads the server's metrics.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 8085
          protocol: TCP
{{- end }}
