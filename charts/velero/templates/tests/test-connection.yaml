{{- /* Kates addition (not upstream): post-install smoke test against the
       Velero server's metrics endpoint. */}}
{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "velero.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels := dict "app.kubernetes.io/name" (include "velero.name" .) "app.kubernetes.io/instance" .Release.Name "app.kubernetes.io/managed-by" .Release.Service "helm.sh/chart" (include "velero.chart" .) }}
    {{- toYaml (merge $labels (.Values.podLabels | default dict)) | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- with .Values.image.imagePullSecrets }}
  imagePullSecrets:
    {{- range . }}
    - name: {{ . }}
    {{- end }}
  {{- end }}
  securityContext:
    {{- toYaml .Values.tests.podSecurityContext | nindent 4 }}
  containers:
    - name: velero-metrics-test
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      securityContext:
        {{- toYaml .Values.tests.containerSecurityContext | nindent 8 }}
      resources:
        {{- toYaml .Values.tests.resources | nindent 8 }}
      command:
        - sh
        - -c
        - |
          set -e
          echo "Checking Velero server metrics endpoint..."
          curl -sf http://{{ include "velero.fullname" . }}.{{ .Release.Namespace }}.svc:8085/metrics > /dev/null
          echo "Velero server responding."
{{- end }}
