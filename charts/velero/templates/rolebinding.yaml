{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "velero.fullname" . }}-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: {{ include "velero.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ include "velero.chart" . }}
subjects:
  - kind: ServiceAccount
    namespace: {{ .Release.Namespace }}
    name: {{ include "velero.serverServiceAccount" . }}
roleRef:
{{- if eq (include "velero.namespaceScope" .) "true" }}
  {{- /* Kates: a namespace admin may bind admin, but not create a Role of every verb on every resource */}}
  kind: ClusterRole
  name: admin
{{- else }}
  kind: Role
  name: {{ include "velero.fullname" . }}-server
{{- end }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
