apiVersion: v2
name: kates-chaos
# Minor bump: the installer, GameDay and test pods now run non-root with a
# PSS restricted securityContext and resources by default, so an installer or
# GameDay image that needs root stops starting; GameDay and the tests move to
# kates-tester, which has the shell they need.
# Patch: images.tester moves to kates-tester 1.32.0, the tag the v1.32.0
# release publishes; every chart that runs it pins the same one.
version: 2.3.8
# Tracks the LitmusChaos execution-plane version this chart deploys.
appVersion: "3.28.0"
description: Kates Chaos Engineering — wraps the LitmusChaos execution plane (operator, exporter, CRDs) with Kafka-specific RBAC, experiment/engine templating, and monitoring
home: https://github.com/bmscomp/kates
sources:
  - https://github.com/bmscomp/kates
keywords:
  - chaos-engineering
  - kafka
  - kates
  - litmus
maintainers:
  - name: bmscomp
    url: https://github.com/bmscomp
dependencies:
  - name: litmus-core
    version: 3.28.1
    repository: https://litmuschaos.github.io/litmus-helm/
    condition: litmus-core.enabled
annotations:
  artifacthub.io/category: skip-prediction
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: changed
      description: "images.tester moves to kates-tester 1.32.0, the tag the v1.32.0 release publishes; scripts/check-versions.sh holds it to the kates chart's appVersion. The image is unchanged since 1.30.1 (nothing under tester/ moved), so this is the pin, not the tooling."
    - kind: changed
      description: "images.tester moves to kates-tester 1.31.0, the tag the v1.31.0 release publishes; scripts/check-versions.sh holds it to the kates chart's appVersion. The image is unchanged since 1.30.1 (nothing under tester/ moved), so this is the pin, not the tooling."
    - kind: changed
      description: "images.tester moves to kates-tester 1.30.1, the tag the v1.30.1 release publishes; scripts/check-versions.sh holds it to the kates chart's appVersion. The image is unchanged since 1.30.0 (nothing under tester/ moved), so this is the pin, not the tooling."
    - kind: changed
      description: "images.tester moves to kates-tester 1.30.0, the tag the v1.30.0 release publishes; scripts/check-versions.sh holds it to the kates chart's appVersion. The image is unchanged since 1.29.3 (nothing under tester/ moved), so this is the pin, not the tooling."
    - kind: changed
      description: "images.tester moves to kates-tester 1.29.3, the tag the v1.29.3 release publishes; scripts/check-versions.sh holds it to the kates chart's appVersion. The image is unchanged since 1.29.2 — nothing under tester/ moved — so this is the pin, not the tooling."
    - kind: changed
      description: "images.tester moves to kates-tester 1.29.2, the tag the v1.29.2 release publishes; scripts/check-versions.sh holds it to the kates chart's appVersion. The image is unchanged since 1.29.1 — nothing under tester/ moved — so this is the pin, not the tooling."
    - kind: changed
      description: "images.tester moves to kates-tester 1.29.1, the tag the v1.29.1 release publishes; scripts/check-versions.sh holds it to the kates chart's appVersion. The image is unchanged since 1.29.0 — nothing under tester/ moved — so this is the pin, not the tooling."
    - kind: changed
      description: "images.tester moves to kates-tester 1.29.0, the tag the v1.29.0 release publishes (scripts/check-versions.sh holds it to the kates chart's appVersion). The image is unchanged since 1.28.0 — nothing under tester/ moved — so this is the pin, not the tooling."
    - kind: fixed
      description: "The GameDay Job and both helm test pods never started: they run their checks with sh, and registry.k8s.io/kubectl has no shell (StartError: exec: \"sh\": executable file not found in $PATH), so helm test and gameday.enabled always failed. They now run images.tester, ghcr.io/bmscomp/kates-tester:1.28.0 (a shell and kubectl, pinned to the kates appVersion like every chart's test image), as its own uid and gid 1000. images.kubectl is now the installer Job's image only; a gameday.image override still wins"
    - kind: changed
      description: "The experiment installer Job, the GameDay Job and both helm test pods pass Pod Security Standards restricted by default: seccompProfile RuntimeDefault, runAsNonRoot as uid/gid 65534 for the installer (registry.k8s.io/kubectl runs as root otherwise) and 1000 for GameDay and the tests, allowPrivilegeEscalation false, every capability dropped, and CPU and memory requests with a memory limit (10m/64Mi, limit 128Mi). Set through experiments.installer.podSecurityContext/securityContext/resources (resources now reach the installer's two init containers too), the new gameday.podSecurityContext/securityContext/resources and the new tests block. An installer or GameDay image that must run as root needs its podSecurityContext set back"
    - kind: changed
      description: "With values-generic.yaml, whose kyvernoPolicy ClusterPolicy (still on, mutate true) patches a pod with no securityContext to uid 1001 at admission, the installer, GameDay and test pods now run as the uid they set themselves (65534 for the installer, 1000 for GameDay and the tests). litmus-core's operator and exporter take no securityContext from values: they are restricted only through that mutate policy or a kyvernoPolicy.exceptions PolicyException, so a release that turns kyvernoPolicy off on a cluster enforcing restricted needs the exception"
    - kind: added
      description: "kyvernoPolicy.exceptions, a list of {policyName, ruleNames}: one kyverno.io/v2 PolicyException (<fullname>-exceptions, rendered where that API exists) in the release namespace exempting litmus-core's operator and exporter (app.kubernetes.io/instance=<release> and app.kubernetes.io/name=litmus-core's nameOverride, litmus; the chart's own pods pass on their own, and chaos runner and experiment pods are not matched) from those rules of any Kyverno policy, the cluster's own included, each rule's autogen- and autogen-cronjob- variants too. litmus-core takes no securityContext from values, so its operator (and exporter) Deployment fails PSS restricted unless kyvernoPolicy's mutate rules patch it; this is how a cluster that enforces restricted without them exempts them"
    - kind: added
      description: "podLabels, added to the labels of the installer Job, GameDay Job and helm test pods; the chart's own labels win on a clash. litmus-core's pods take labels from litmus-core.customLabels instead"
    - kind: added
      description: "litmus-core.exporter.resources defaults to requests 50m/64Mi and a 128Mi memory limit; the subchart's own default is none"
    - kind: fixed
      description: "The helm test pods ignored global.imagePullSecrets"
    - kind: added
      description: "litmus-core.exporter — the chaos exporter the Kates — Chaos infrastructure board reads (litmuschaos_* series), off upstream and still off by default here, with its image pinned to docker.io like the operator and runner rather than pulled through the scarf.sh redirector. kates deploy --with-monitoring turns it on together with monitoring.serviceMonitor"
    - kind: fixed
      description: "monitoring.serviceMonitor scraped the chaos operator too: litmus-core's exporter Service selects on labels both pods carry and both name a container port http, so the Service resolved to the operator's port 80 and every scrape of it was refused. The default relabelings keep the exporter's port only"
    - kind: removed
      description: "ACTION REQUIRED — monitoring.grafanaDashboard.* is GONE, and a release that still sets any of its keys is refused with the replacement named. The board is delivered by charts/monitoring (dashboards.enabled there) with every other board, and this chart's <fullname>-grafana-dashboard ConfigMap is no longer rendered. Its $namespace and $operator_deployment constants default to litmus, litmus-core's own fullname; a Litmus under another name or namespace edits them on the board or in board.py rather than in values"
    - kind: changed
      description: "The Grafana board moves to dashboards/kates-chaos-infra and is built from board.py by scripts/gen-dashboards.py, instead of being written inline in this chart's template. It was the twelfth board in the repository and the only one outside dashboards/: no panel descriptions, not covered by the layout gate"
    - kind: changed
      description: "The board's uid is unchanged (kates-chaos-overview), so Grafana replaces it in place and existing links, playlists and annotations keep resolving. Its title changes from Kates Chaos Engineering to Kates — Chaos infrastructure, because that name and the monitoring chart's Kates — Chaos sat next to each other in one Grafana and neither said which was which"
    - kind: fixed
      description: "Four series or labels the board read that LitmusChaos does not publish: the verdict label on litmuschaos_experiment_verdict (the chaos-exporter emits chaosresult_verdict), litmuschaos_engine_experiment_count (no such series; the duration panel wanted litmuschaos_experiment_total_duration), increase() over litmuschaos_experiment_verdict (increase over a 0/1 gauge; the run total is litmuschaos_cluster_scoped_experiments_run_count), and a pod=~\".*chaos-operator.*\" matcher that can never match litmus-core's `litmus` Deployment (chaos-operator is the container name), replaced by kube_deployment_status_replicas_available"
    - kind: added
      description: "Descriptions on all six panels, which had none — the layout gate in ci-kafka-charts.yml now covers the board and will not accept a panel without one. A hidden $operator_deployment constant replaces the pod-name matcher that could never match"
    - kind: changed
      description: Scoped the chart to the LitmusChaos execution plane (operator-only); removed portal (frontend/server/MongoDB) references from NOTES, tests, and GameDay
    - kind: added
      description: Configurable images block, service account name, structured NetworkPolicy, ServiceMonitor scrape controls, multi-namespace RBAC/Kyverno, probes and components on ChaosEngines
    - kind: deprecated
      description: rbac.kafkaNamespace/rbac.katesNamespace (use rbac.targetNamespaces) and networkPolicies.enabled (use networkPolicy.enabled) — still honored
