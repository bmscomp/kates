# Kates Chaos — Kind Cluster Overlay
# Optimized for single-node Kind with pre-loaded images.

litmus-core:
  enabled: true
  operator:
    image:
      pullPolicy: IfNotPresent
  runner:
    image:
      pullPolicy: IfNotPresent

global:
  imagePullPolicy: IfNotPresent

rbac:
  enabled: true
  targetNamespaces:
    - name: kafka
      role: target
    - name: kates
      role: coordinator
  nodeChaos:
    enabled: true

monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels:
      release: monitoring
  grafanaDashboard:
    enabled: true
    labels:
      grafana_dashboard: "1"

networkPolicy:
  enabled: false

pdb:
  enabled: false

experiments:
  enabled: true
