{{- $kubectl := include "kates-chaos.kubectlImage" . }}
{{- $pullPolicy := .Values.global.imagePullPolicy | default "IfNotPresent" }}
{{- $kafkaNamespace := include "kates-chaos.kafkaNamespace" . }}
{{- $testSA := printf "%s-test" (include "kates-chaos.fullname" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $testSA }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kates-chaos.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $testSA }}
  labels:
    {{- include "kates-chaos.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  - apiGroups: ["litmuschaos.io"]
    resources: ["chaosexperiments", "chaosengines", "chaosresults"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $testSA }}
  labels:
    {{- include "kates-chaos.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $testSA }}
subjects:
  - kind: ServiceAccount
    name: {{ $testSA }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "kates-chaos.fullname" . }}-test-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kates-chaos.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ $testSA }}
  containers:
    - name: test
      image: {{ $kubectl }}
      imagePullPolicy: {{ $pullPolicy }}
      command: ['sh', '-c']
      args:
        - |
          echo "Waiting for the chaos operator to become Available..."
          if kubectl wait --for=condition=Available deployment \
            -l app.kubernetes.io/name=litmus -n {{ .Release.Namespace }} --timeout=120s; then
            echo "✅ Chaos operator Available"
            exit 0
          fi
          echo "❌ Chaos operator not Available"
          kubectl get pods -n {{ .Release.Namespace }} -l app.kubernetes.io/name=litmus
          exit 1
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "kates-chaos.fullname" . }}-test-crds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kates-chaos.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ $testSA }}
  containers:
    - name: test
      image: {{ $kubectl }}
      imagePullPolicy: {{ $pullPolicy }}
      command: ['sh', '-c']
      args:
        - |
          echo "Verifying Litmus CRDs..."
          CRDS="chaosengines chaosexperiments chaosresults"
          PASS=0
          TOTAL=0
          for crd in $CRDS; do
            TOTAL=$((TOTAL + 1))
            if kubectl get crd ${crd}.litmuschaos.io >/dev/null 2>&1; then
              echo "  ✅ ${crd}.litmuschaos.io"
              PASS=$((PASS + 1))
            else
              echo "  ❌ ${crd}.litmuschaos.io missing"
            fi
          done
          echo ""
          echo "Verifying ChaosExperiments in {{ $kafkaNamespace }}..."
          COUNT=$(kubectl get chaosexperiments -n {{ $kafkaNamespace }} --no-headers 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" -gt "0" ]; then
            echo "  ✅ $COUNT experiments found"
            PASS=$((PASS + 1))
          else
            echo "  ⚠️  No experiments found (post-install hook may not have run yet)"
          fi
          TOTAL=$((TOTAL + 1))
          echo ""
          echo "Result: $PASS/$TOTAL checks passed"
          if [ "$PASS" -ge "$TOTAL" ]; then
            exit 0
          else
            exit 1
          fi
