{{- if .Values.rbac.enabled }}
{{- $sa := include "kates-chaos.serviceAccountName" . }}
{{- $targets := include "kates-chaos.targetNamespaces" . | fromYamlArray }}
{{- range $t := $targets }}
{{- if eq ($t.role | default "target") "target" }}
---
# ── Target namespace {{ $t.name }}: fault-injection identity + Role ───────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $t.name }}
  labels:
    {{- include "kates-chaos.labels" $ | nindent 4 }}
  {{- with include "kates-chaos.annotations" $ }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa }}
  namespace: {{ $t.name }}
  labels:
    {{- include "kates-chaos.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "pods/log", "pods/exec", "pods/eviction"]
    verbs: ["create", "list", "get", "patch", "update", "delete", "deletecollection"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "list", "get", "patch", "update", "delete", "deletecollection"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["list", "get", "patch", "update", "delete"]
  - apiGroups: ["litmuschaos.io"]
    resources: ["chaosengines", "chaosexperiments", "chaosresults"]
    verbs: ["create", "list", "get", "patch", "update", "delete"]
  - apiGroups: ["kafka.strimzi.io"]
    resources: ["kafkas"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "delete", "list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa }}
  namespace: {{ $t.name }}
  labels:
    {{- include "kates-chaos.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $sa }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $t.name }}
{{- end }}
{{- end }}
{{- if .Values.rbac.nodeChaos.enabled }}
---
# ── Cluster-scoped RBAC for node-level chaos ─────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kates-chaos.fullname" . }}-node-chaos
  labels:
    {{- include "kates-chaos.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "pods/eviction"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["list", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kates-chaos.fullname" . }}-node-chaos
  labels:
    {{- include "kates-chaos.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kates-chaos.fullname" . }}-node-chaos
subjects:
  {{- range $t := $targets }}
  {{- if eq ($t.role | default "target") "target" }}
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $t.name }}
  {{- end }}
  {{- end }}
{{- end }}
{{- range $t := $targets }}
{{- if eq ($t.role | default "target") "coordinator" }}
---
# ── Coordinator namespace {{ $t.name }}: create engines + read results ────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kates-chaos.fullname" $ }}-coordinator-{{ $t.name }}
  labels:
    {{- include "kates-chaos.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["litmuschaos.io"]
    resources: ["chaosengines", "chaosresults"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kates-chaos.fullname" $ }}-coordinator-{{ $t.name }}
  labels:
    {{- include "kates-chaos.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kates-chaos.fullname" $ }}-coordinator-{{ $t.name }}
subjects:
  - kind: ServiceAccount
    name: {{ $t.serviceAccount | default "default" }}
    namespace: {{ $t.name }}
{{- end }}
{{- end }}
{{- end }}
