{{- if and .Values.kyvernoPolicy.enabled (.Capabilities.APIVersions.Has "kyverno.io/v1") }}
{{- $kp := .Values.kyvernoPolicy }}
{{- $namespaces := $kp.namespaces | default (list .Release.Namespace) }}
{{- $excludeSelector := $kp.excludeSelector | default (dict "matchExpressions" (list (dict "key" "chaosUID" "operator" "Exists"))) }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: chaos-pod-security-standards
  labels:
    {{- include "kates-chaos.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Chaos Pod Security Standards
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Enforces and auto-patches restricted pod security standards for all
      chaos-infra pods: non-root containers, dropped capabilities, seccomp
      profiles, and no privilege escalation. Chaos experiment/runner pods
      (matched by excludeSelector) are skipped because they require elevated
      privileges for fault injection.
spec:
  validationFailureAction: {{ $kp.action | default "Audit" }}
  background: true
  rules:
    {{- if $kp.mutate }}
    # ── Mutate: auto-inject pod-level security context ────────────────────────
    - name: mutate-run-as-non-root
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: {{ toYaml $namespaces | nindent 16 }}
      exclude:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: {{ toYaml $namespaces | nindent 16 }}
              selector:
                {{- toYaml $excludeSelector | nindent 16 }}
      mutate:
        patchStrategicMerge:
          spec:
            securityContext:
              +(runAsNonRoot): true
              +(runAsUser): 1001
              +(fsGroup): 1001

    - name: mutate-drop-capabilities
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: {{ toYaml $namespaces | nindent 16 }}
      exclude:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: {{ toYaml $namespaces | nindent 16 }}
              selector:
                {{- toYaml $excludeSelector | nindent 16 }}
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - (name): "*"
                securityContext:
                  +(capabilities):
                    +(drop):
                      - "ALL"

    - name: mutate-seccomp-profile
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: {{ toYaml $namespaces | nindent 16 }}
      exclude:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: {{ toYaml $namespaces | nindent 16 }}
              selector:
                {{- toYaml $excludeSelector | nindent 16 }}
      mutate:
        patchStrategicMerge:
          spec:
            securityContext:
              +(seccompProfile):
                +(type): RuntimeDefault

    - name: mutate-disable-privilege-escalation
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: {{ toYaml $namespaces | nindent 16 }}
      exclude:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: {{ toYaml $namespaces | nindent 16 }}
              selector:
                {{- toYaml $excludeSelector | nindent 16 }}
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - (name): "*"
                securityContext:
                  +(allowPrivilegeEscalation): false
    {{- end }}

    # ── Validate: enforce standards ───────────────────────────────────────────
    - name: validate-non-root
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: {{ toYaml $namespaces | nindent 16 }}
      exclude:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: {{ toYaml $namespaces | nindent 16 }}
              selector:
                {{- toYaml $excludeSelector | nindent 16 }}
      validate:
        message: "Chaos pods must run as non-root (spec.securityContext.runAsNonRoot: true)."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true

    - name: validate-drop-capabilities
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: {{ toYaml $namespaces | nindent 16 }}
      exclude:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: {{ toYaml $namespaces | nindent 16 }}
              selector:
                {{- toYaml $excludeSelector | nindent 16 }}
      validate:
        message: "Containers must drop ALL capabilities."
        pattern:
          spec:
            containers:
              - securityContext:
                  capabilities:
                    drop: ["ALL"]

    - name: validate-no-privilege-escalation
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: {{ toYaml $namespaces | nindent 16 }}
      exclude:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: {{ toYaml $namespaces | nindent 16 }}
              selector:
                {{- toYaml $excludeSelector | nindent 16 }}
      validate:
        message: "Containers must not allow privilege escalation."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
{{- end }}
