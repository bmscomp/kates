{{- /* kyvernoPolicy.exceptions: this release's litmus-core operator and
       exporter, in its own namespace, exempt from rules of any policy, the
       cluster's included (litmus-core takes no securityContext from values).
       Not tied to kyvernoPolicy.enabled. */}}
{{- with .Values.kyvernoPolicy.exceptions }}
{{- if $.Capabilities.APIVersions.Has "kyverno.io/v2" }}
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: {{ printf "%s-exceptions" (include "kates-chaos.fullname" $) | trunc 63 | trimSuffix "-" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "kates-chaos.labels" $ | nindent 4 }}
  {{- /* A hook, so it exists before the Litmus Deployments it exempts: Helm
         applies custom resources after Deployments, which Enforce would refuse.
         shortcut: Helm does not track hooks, so helm uninstall, or emptying
         the list, leaves it; delete it with kubectl until that matters. */}}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with include "kates-chaos.annotations" $ }}
    {{- . | trim | nindent 4 }}
    {{- end }}
spec:
  exceptions:
    {{- range . }}
    - policyName: {{ .policyName | quote }}
      ruleNames:
        {{- range .ruleNames }}
        {{- /* with the rules Kyverno generates from it for controllers and CronJobs */}}
        - {{ . | quote }}
        - {{ printf "autogen-%s" . | quote }}
        - {{ printf "autogen-cronjob-%s" . | quote }}
        {{- end }}
    {{- end }}
  match:
    any:
      - resources:
          kinds: [Pod, Deployment, ReplicaSet, StatefulSet, Job, CronJob]
          namespaces: [{{ $.Release.Namespace | quote }}]
          {{- /* litmus-core's operator and exporter only: both carry the
                 release and litmus-core's name (its nameOverride, litmus).
                 This chart's own pods pass on their own; chaos runner and
                 experiment pods carry no instance label */}}
          selector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name | quote }}
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [{{ (index $.Values "litmus-core").nameOverride | default "litmus" | quote }}]
{{- end }}
{{- end }}
