# Kates Chaos — Generic Kubernetes Cluster Overlay
# Cloud-native defaults for any standard Kubernetes environment.

litmus-core:
  enabled: true
  operator:
    image:
      pullPolicy: Always
  runner:
    image:
      pullPolicy: Always

global:
  imagePullPolicy: Always

rbac:
  enabled: true
  targetNamespaces:
    - name: kafka
      role: target
    - name: kates
      role: coordinator
  nodeChaos:
    enabled: true

monitoring:
  serviceMonitor:
    # Off by default to avoid duplicating the litmus-core exporter
    # ServiceMonitor. Enable if you scrape via this chart instead.
    enabled: false
    interval: 15s
    labels:
      release: monitoring
  grafanaDashboard:
    enabled: true
    labels:
      grafana_dashboard: "1"

networkPolicy:
  enabled: true

kyvernoPolicy:
  enabled: true
  action: Audit
  mutate: true

# No stateful workload ships with this chart; leave the PDB off unless you
# point pdb.selector at a workload you run in the release namespace.
pdb:
  enabled: false

experiments:
  enabled: true
