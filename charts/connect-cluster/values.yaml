  #     artifacts:
  #       - type: maven
  #         group: org.apache.camel.kafkaconnector
  #         artifact: camel-aws-s3-sink-kafka-connector
  #         version: "4.8.3"
  #
  #   # --- Search / Analytics ---
  #   - name: elasticsearch-sink
  #     artifacts:
  #       - type: maven
  #         group: io.confluent
  #         artifact: kafka-connect-elasticsearch
  #         version: "14.1.0"
  #
  #   # --- Data Warehouse ---
  #   - name: bigquery-sink
  #     artifacts:
  #       - type: maven
  #         group: com.wepay.kcbq
  #         artifact: kcbq-connector
  #         version: "2.5.0"
  #
  #   # --- HTTP / Webhooks ---
  #   - name: http-sink
  #     artifacts:
  #       - type: maven
  #         group: io.aiven
  #         artifact: aiven-kafka-connect-http
  #         version: "0.6.0"
  #
  #   # --- JDBC (Aiven alternative) ---
  #   - name: aiven-jdbc
  #     artifacts:
  #       - type: maven
  #         group: io.aiven
  #         artifact: jdbc-connector-for-apache-kafka
  #         version: "6.11.1"
  #
  #   # --- Incubating Debezium ---
  #   - name: debezium-vitess
  #     artifacts:
  #       - type: maven
  #         group: io.debezium
  #         artifact: debezium-connector-vitess
  #         version: "3.6.0.Final"

# ── Metrics ─────────────────────────────────────────────────────────────────
metricsConfig:
  configMapName: kafka-metrics
  configMapKey: kafka-metrics-config.yml

# ── Pod Template Overrides ──────────────────────────────────────────────────
template:
  pod:
    metadata: {}

# ── Connectors ──────────────────────────────────────────────────────────────
# Default auto-restart settings applied to all connectors unless overridden
# at the individual connector level.
autoRestart:
  enabled: true
  maxRestarts: 10

connectors: []

# ── Test Connectors ─────────────────────────────────────────────────────────
# These connectors are ONLY deployed when running `helm test`, and they are
# automatically deleted when the test succeeds. Use this for testing/examples.
testConnectors:
  - name: debezium-postgres-source-working-example
    class: io.debezium.connector.postgresql.PostgresConnector
    tasksMax: 1
    config:
      database.hostname: "postgresql.database.svc"
      database.port: "5432"
      database.user: "${secrets:connect/connect-pg-credentials:username}"
      database.password: "${secrets:connect/connect-pg-credentials:password}"
      database.dbname: "orders"
      topic.prefix: "cdc"
      schema.include.list: "public"
      table.include.list: "public.demo_orders"
      plugin.name: "pgoutput"
      publication.name: "dbz_demo_orders_pub"
      publication.autocreate.mode: "filtered"
      slot.name: "debezium_demo_orders"
      snapshot.mode: "initial"
      decimal.handling.mode: "double"
      tombstones.on.delete: "false"
      schema.history.internal.kafka.bootstrap.servers: "krafter-kafka-bootstrap.kafka.svc:9092"
      schema.history.internal.kafka.security.protocol: "SASL_PLAINTEXT"
      schema.history.internal.kafka.sasl.mechanism: "SCRAM-SHA-512"
      schema.history.internal.kafka.sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username=\"kates-connect\" password=\"${secrets:connect/kates-connect:password}\";"
      schema.history.internal.kafka.topic: "cdc-schema-history"

  - name: jdbc-sink-from-cdc-working-example
    class: io.debezium.connector.jdbc.JdbcSinkConnector
    tasksMax: 1
    config:
      topics: "cdc.public.demo_orders"
      connection.url: "jdbc:postgresql://postgresql.database.svc:5432/orders"
      connection.username: "${secrets:connect/connect-pg-credentials:username}"
      connection.password: "${secrets:connect/connect-pg-credentials:password}"
      table.name.format: "demo_orders_replica"
      insert.mode: "upsert"
      primary.key.mode: "record_key"
      primary.key.fields: "id"
      delete.enabled: "true"
      schema.evolution: "basic"

  - name: jdbc-sink-working-example
    class: io.debezium.connector.jdbc.JdbcSinkConnector
    tasksMax: 1
    config:
      topics: "kates-results"
      connection.url: "jdbc:postgresql://postgresql.database.svc:5432/orders"
      connection.username: "${secrets:connect/connect-pg-credentials:username}"
      connection.password: "${secrets:connect/connect-pg-credentials:password}"
      insert.mode: "insert"
      auto.create: "true"
      auto.evolve: "true"
      delete.enabled: "false"

  - name: jdbc-source-working-example
    class: io.aiven.connect.jdbc.JdbcSourceConnector
    tasksMax: 1
    config:
      connection.url: "jdbc:postgresql://postgresql.database.svc:5432/orders"
      connection.user: "${secrets:connect/connect-pg-credentials:username}"
      connection.password: "${secrets:connect/connect-pg-credentials:password}"
      mode: "bulk"
      query: "SELECT table_name FROM information_schema.tables WHERE table_schema='public'"
      topic.prefix: "kates-jdbc-source-"
      poll.interval.ms: "30000"

testTopics:
  - name: cdc-public-demo-orders
    topicName: cdc.public.demo_orders
    partitions: 3
    replicas: 3
    config:
      min.insync.replicas: "2"
# ── RBAC ────────────────────────────────────────────────────────────────────
serviceAccount:
  # -- Create a dedicated ServiceAccount for Connect pods
  create: true
  # -- Annotations to add to the ServiceAccount (e.g. for IRSA/Workload Identity)
  annotations: {}
  # -- Name of the ServiceAccount (defaults to fullname)
  name: ""

# ── REST API Exposure ───────────────────────────────────────────────────────
# Expose the Kafka Connect REST API (port 8083) via a Kubernetes Service
# and optionally an Ingress for external tooling (Kafka UI, monitoring).
restApi:
  service:
    enabled: true
    type: ClusterIP
    port: 8083
    annotations: {}
  ingress:
    enabled: false
    className: ""
    annotations: {}
      # nginx.ingress.kubernetes.io/rewrite-target: /
    hosts: []
      # - host: connect.example.com
      #   paths:
      #     - path: /
      #       pathType: Prefix
    tls: []
      # - secretName: connect-tls
      #   hosts:
      #     - connect.example.com

# ── Observability ───────────────────────────────────────────────────────────
alerts:
  enabled: true
  labels:
    release: kafka
    prometheus: kube-prometheus
    severity: warning
  thresholds:
    heapUsagePercent: 85
    errorRatePerSecond: 1
    rebalanceRatePerSecond: 0.1
    sourceLagMinutes: 15

podMonitors:
  enabled: true
  labels:
    release: kafka
    prometheus: kube-prometheus

dashboards:
  enabled: true
  namespace: ""   # defaults to release namespace
  label: grafana_dashboard
  labelValue: "1"

# ── Monitoring (PodMonitor) ─────────────────────────────────────────────────
monitoring:
  enabled: true
  interval: ""
  scrapeTimeout: ""
  honorLabels: false
  metricRelabelings: []
