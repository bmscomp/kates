# connect-cluster values.yaml

# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""
# -- Override the release namespace
namespaceOverride: ""

# -- Keep CRDs on helm uninstall (safety measure)
keepOnDelete: true

# -- Extra labels to add to all resources
extraLabels: {}

# -- Test images used in Helm test pods
testImages:
  kubectl: "ghcr.io/bmscomp/kates-tester:1.17.0"

# -- Number of Kafka Connect worker replicas
replicas: 3
# -- Kafka Connect image (leave empty to use Strimzi default)
image: "ghcr.io/bmscomp/connect:3.6.0"
# -- Kafka version
version: "4.3.0"
# -- Group ID for the Connect cluster
groupId: kates-connect-cluster

# -- Kubernetes cluster domain (used for Schema Registry FQDN computation)
clusterDomain: cluster.local

# ── Kafka Connection Settings ───────────────────────────────────────────────
# By default, this assumes the Kafka cluster is named 'krafter' and is deployed
# in the same namespace as this Connect cluster. Adjust these if Kafka is deployed
# elsewhere or has a different name.
kafka:
  # -- Kafka cluster name
  clusterName: "krafter"
  # -- Namespace where the Kafka cluster is deployed (leave empty if same namespace as Connect)
  namespace: ""
  # -- Bootstrap servers for the Kafka cluster (leave empty to compute automatically)
  bootstrapServers: ""
  tls:
    enabled: false
    # -- Secret containing the CA certificate for Kafka
    trustedCertificateSecret: "krafter-cluster-ca-cert"
    certificateKey: "ca.crt"
  authentication:
    type: scram-sha-512
    username: "kates-connect"
    # -- Secret containing the authentication password (defaults to username if empty)
    secretName: "kates-connect"
    # -- Key in the Secret containing the authentication password
    secretKey: "password"

# ── Managed KafkaUser ───────────────────────────────────────────────────────
# One flag provisions everything: KafkaUser (in the Kafka namespace), ACLs,
# and the credentials Secret in the Connect namespace. Requires the Strimzi
# User Operator; ACLs apply when the Kafka cluster has authorization enabled.
kafkaUser:
  create: false
  # -- User name (defaults to kafka.authentication.username)
  name: ""
  authorization:
    enabled: true
    type: simple
    # -- auto: derive least-privilege ACLs from chart values (groupId,
    # internal topics, exactly-once, topicGrants). custom: use acls verbatim.
    mode: auto
  # -- Data topics connectors read/write (auto mode). Prefix patterns recommended.
  topicGrants:
    - name: cdc
      patternType: prefix
  # -- Extra consumer groups beyond <groupId> and connect-*
  groupGrants: []
  # -- Used only when authorization.mode=custom
  acls: []
  quotas: {}
  # -- KafkaUser template passthrough (labels/annotations on the generated Secret)
  template: {}
  # -- Make the credentials Secret available in the Connect namespace when
  # Kafka lives elsewhere. job: hook Job copies it (re-runs on upgrade for
  # rotation). reflector: annotate for kubernetes-reflector instead.
  secretSync:
    enabled: true
    method: job
    timeoutSeconds: 300

# ── Scheduling ──────────────────────────────────────────────────────────────
topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway
  additional: []

podDisruptionBudget:
  maxUnavailable: 1

rack:
  enabled: true
  topologyKey: topology.kubernetes.io/zone

tolerations: []
nodeSelector: {}
nodeAffinity: {}
podAntiAffinity:
  enabled: true
  topologyKey: kubernetes.io/hostname

# -- Pod-level security context
podSecurityContext:
  fsGroup: 1001
  runAsNonRoot: true
  # runAsUser: 1001
  seccompProfile: RuntimeDefault

# -- DNS settings
dnsPolicy: ""
dnsConfig: {}

# -- Termination grace period (seconds)
terminationGracePeriodSeconds: 30

priorityClassName: "system-cluster-critical"
imagePullSecrets: []


# ── Internal Topics ─────────────────────────────────────────────────────────
internalTopics:
  prefix: ""  # defaults to groupId
  # -- Override individual topic names (defaults to <groupId>-<suffix>)
  # offsetsName: ""
  # configsName: ""
  # statusName: ""

# ── JVM & Resources ────────────────────────────────────────────────────────
jvmOptions:
  -Xms: 1024m
  -Xmx: 1024m
  gcLoggingEnabled: true
  javaSystemProperties: []

resources:
  requests:
    memory: 2Gi
    cpu: 1000m
  limits:
    memory: 4Gi
    cpu: 4000m

# ── Schema Registry (Apicurio) ──────────────────────────────────────────────
schemaRegistry:
  enabled: false
  serviceName: apicurio-apicurio-registry
  # -- Namespace where the Schema Registry is deployed (defaults to the Kafka namespace)
  namespace: ""
  port: 80
  path: /apis/ccompat/v7
  # -- Pod labels used by the NetworkPolicy egress rule
  podSelector:
    app.kubernetes.io/name: apicurio-registry

# ── Secret Access (Strimzi 1.0.0+) ──────────────────────────────────────────
# The KubernetesSecretConfigProvider is always enabled. Use the syntax
# ${secrets:<namespace>/<secret-name>:<key>} in connector configs to reference
# Kubernetes Secrets without volume mounts. The Connect ServiceAccount must
# have RBAC permissions to read the target secrets.
# See: https://strimzi.io/docs/operators/latest/configuring.html#type-ExternalConfiguration-reference


# ── Network Policy ──────────────────────────────────────────────────────────
# Default-deny posture: the chart ships a deny-all policy for the Connect pods
# and every allowed flow below is an explicit, individually configurable rule.
# Anything not listed is blocked.
# Deprecated flat keys (kafkaPorts, monitoringNamespace, restApiClients) are
# still honored and win over the structured equivalents when set.
networkPolicy:
  enabled: true

  # -- Deny-all Ingress+Egress for the Connect pods. Disable only when a
  # platform-level default-deny already exists and duplicates are forbidden.
  defaultDeny:
    enabled: true
    # -- Pod selector for the deny policy (empty = Connect pods only)
    selector: {}

  # -- DNS egress. Empty selectors = any destination; on locked-down clusters
  # pin to kube-dns, e.g.:
  #   namespaceSelector: {kubernetes.io/metadata.name: kube-system}
  #   podSelector: {k8s-app: kube-dns}
  dns:
    enabled: true
    namespaceSelector: {}
    podSelector: {}
    ports: [53]

  # -- Kubernetes API server egress (needed by KubernetesSecretConfigProvider).
  # Empty ipBlock = any destination; pin the control-plane CIDR on strict
  # clusters, e.g. ipBlock: {cidr: 10.0.0.1/32}
  apiServer:
    enabled: true
    ports: [443, 6443]
    ipBlock: {}

  # -- Worker-to-worker REST traffic on 8083 (leader forwarding)
  workerToWorker:
    enabled: true

  # -- Kafka broker egress
  kafka:
    enabled: true
    ports: [9092, 9093]

  # -- Metrics scrape ingress (JMX exporter, port 9404)
  monitoring:
    enabled: true
    namespace: monitoring
    port: 9404

  # -- Connect REST API (8083) ingress. No catch-all: kubelet probes bypass
  # NetworkPolicy, so only the clients listed here (plus the Strimzi operator)
  # get access. allowAll: true restores the old open behavior.
  restApi:
    allowAll: false
    operator: true
    clients:
      - namespace: kates
        podSelector:
          app.kubernetes.io/name: kates

  # -- Schema Registry egress (rendered only when schemaRegistry.enabled)
  schemaRegistry:
    enabled: true

  # -- OTLP tracing egress (rendered only when tracing.endpoint is set).
  # Port is parsed from tracing.endpoint; pin selectors to the collector
  # namespace/pods if desired.
  tracing:
    enabled: true
    namespaceSelector: {}
    podSelector: {}
    # port: 4317

  # -- Namespace where the Strimzi Operator is deployed (leave empty if same as Kafka)
  strimziOperatorNamespace: ""

  # -- Extra raw NetworkPolicy rule fragments, appended verbatim
  extraIngress: []
  extraEgress: []

# ── Database Egress (NetworkPolicy) ─────────────────────────────────────────
databaseEgress: []
  # - namespace: database
  #   port: 5432
  #   podSelector:
  #     app.kubernetes.io/name: postgresql

# ── Converter Configuration ─────────────────────────────────────────────────
config:
  replicationFactor: 3
  keyConverter: org.apache.kafka.connect.json.JsonConverter
  valueConverter: org.apache.kafka.connect.json.JsonConverter
  keyConverterSchemasEnable: true
  valueConverterSchemasEnable: true

# -- Arbitrary extra Kafka Connect worker config properties
extraConfig:
  producer.acks: "all"
  producer.enable.idempotence: "true"
  consumer.auto.offset.reset: "earliest"
  exactly.once.source.support: "enabled"
  group.initial.rebalance.delay.ms: "3000"

# ── Logging ─────────────────────────────────────────────────────────────────
logging:
  type: external

# ── Tracing (OpenTelemetry) ─────────────────────────────────────────────────
tracing:
  enabled: true
  type: opentelemetry
  # -- OTLP collector endpoint, e.g. http://otel-collector.observability.svc:4317
  # Tracing is inert until this is set (injects OTEL_* env vars into workers).
  endpoint: ""
  # -- Service name reported in traces (defaults to the release fullname)
  serviceName: ""

# ── Environment Variables ───────────────────────────────────────────────────
env: []

# ── Probes ──────────────────────────────────────────────────────────────────
readinessProbe:
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 10
  timeoutSeconds: 30
livenessProbe:
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 20
  timeoutSeconds: 30

# ── Strimzi Build (Custom Plugins) ──────────────────────────────────────────
# Enable this to let Strimzi build a custom Connect image with plugins.
# If using a pre-built image (recommended), leave this empty.
build: {}
  # output:
  #   type: docker
  #   image: "ghcr.io/bmscomp/connect:3.6.0"
  #   pushSecret: my-registry-credentials
  # plugins:
  #   # --- Cloud Storage ---
  #   - name: camel-s3-sink
  #     artifacts:
  #       - type: maven
  #         group: org.apache.camel.kafkaconnector
  #         artifact: camel-aws-s3-sink-kafka-connector
  #         version: "4.8.3"
  #
  #   # --- Search / Analytics ---
  #   - name: elasticsearch-sink
  #     artifacts:
  #       - type: maven
  #         group: io.confluent
  #         artifact: kafka-connect-elasticsearch
  #         version: "14.1.0"
  #
  #   # --- Data Warehouse ---
  #   - name: bigquery-sink
  #     artifacts:
  #       - type: maven
  #         group: com.wepay.kcbq
  #         artifact: kcbq-connector
  #         version: "2.5.0"
  #
  #   # --- HTTP / Webhooks ---
  #   - name: http-sink
  #     artifacts:
  #       - type: maven
  #         group: io.aiven
  #         artifact: aiven-kafka-connect-http
  #         version: "0.6.0"
  #
  #   # --- JDBC (Aiven; already bundled in the default connect image) ---
  #   # Not on Maven Central — Aiven publishes release archives on GitHub.
  #   - name: aiven-jdbc
  #     artifacts:
  #       - type: zip
  #         url: https://github.com/Aiven-Open/jdbc-connector-for-apache-kafka/releases/download/v6.10.0/jdbc-connector-for-apache-kafka-6.10.0.zip
  #
  #   # --- Incubating Debezium ---
  #   - name: debezium-vitess
  #     artifacts:
  #       - type: maven
  #         group: io.debezium
  #         artifact: debezium-connector-vitess
  #         version: "3.6.0.Final"

# ── Metrics ─────────────────────────────────────────────────────────────────
metricsConfig:
  # -- Create the JMX exporter ConfigMap in-chart (recommended; makes the chart
  # self-contained). Set false to reference an existing ConfigMap.
  create: true
  # -- ConfigMap name (empty = <fullname>-metrics when create=true)
  configMapName: ""
  configMapKey: kafka-metrics-config.yml

# ── Pod Template Overrides ──────────────────────────────────────────────────
template:
  pod:
    metadata: {}

# ── Connectors ──────────────────────────────────────────────────────────────
# Default auto-restart settings applied to all connectors unless overridden
# at the individual connector level.
autoRestart:
  enabled: true
  maxRestarts: 10

connectors: []

# ── Test Connectors ─────────────────────────────────────────────────────────
# These connectors are ONLY deployed when running `helm test`, and they are
# automatically deleted when the test succeeds. Use this for testing/examples.
testConnectors:
  - name: debezium-postgres-source-working-example
    class: io.debezium.connector.postgresql.PostgresConnector
    tasksMax: 1
    config:
      database.hostname: "postgresql.database.svc"
      database.port: "5432"
      database.user: "${secrets:connect/connect-pg-credentials:username}"
      database.password: "${secrets:connect/connect-pg-credentials:password}"
      database.dbname: "orders"
      topic.prefix: "cdc"
      schema.include.list: "public"
      table.include.list: "public.demo_orders"
      plugin.name: "pgoutput"
      publication.name: "dbz_demo_orders_pub"
      publication.autocreate.mode: "filtered"
      slot.name: "debezium_demo_orders"
      snapshot.mode: "initial"
      decimal.handling.mode: "double"
      tombstones.on.delete: "false"
      schema.history.internal.kafka.bootstrap.servers: "krafter-kafka-bootstrap.kafka.svc:9092"
      schema.history.internal.kafka.security.protocol: "SASL_PLAINTEXT"
      schema.history.internal.kafka.sasl.mechanism: "SCRAM-SHA-512"
      schema.history.internal.kafka.sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username=\"kates-connect\" password=\"${secrets:connect/kates-connect:password}\";"
      schema.history.internal.kafka.topic: "cdc-schema-history"

  - name: jdbc-sink-from-cdc-working-example
    class: io.debezium.connector.jdbc.JdbcSinkConnector
    tasksMax: 1
    config:
      topics: "cdc.public.demo_orders"
      connection.url: "jdbc:postgresql://postgresql.database.svc:5432/orders"
      connection.username: "${secrets:connect/connect-pg-credentials:username}"
      connection.password: "${secrets:connect/connect-pg-credentials:password}"
      table.name.format: "demo_orders_replica"
      insert.mode: "upsert"
      primary.key.mode: "record_key"
      primary.key.fields: "id"
      delete.enabled: "true"
      schema.evolution: "basic"

  - name: jdbc-sink-working-example
    class: io.debezium.connector.jdbc.JdbcSinkConnector
    tasksMax: 1
    config:
      topics: "kates-results"
      connection.url: "jdbc:postgresql://postgresql.database.svc:5432/orders"
      connection.username: "${secrets:connect/connect-pg-credentials:username}"
      connection.password: "${secrets:connect/connect-pg-credentials:password}"
      insert.mode: "insert"
      auto.create: "true"
      auto.evolve: "true"
      delete.enabled: "false"

  - name: jdbc-source-working-example
    class: io.aiven.connect.jdbc.JdbcSourceConnector
    tasksMax: 1
    config:
      connection.url: "jdbc:postgresql://postgresql.database.svc:5432/orders"
      connection.user: "${secrets:connect/connect-pg-credentials:username}"
      connection.password: "${secrets:connect/connect-pg-credentials:password}"
      mode: "bulk"
      query: "SELECT table_name FROM information_schema.tables WHERE table_schema='public'"
      topic.prefix: "kates-jdbc-source-"
      poll.interval.ms: "30000"

testTopics:
  - name: cdc-public-demo-orders
    topicName: cdc.public.demo_orders
    partitions: 3
    replicas: 3
    config:
      min.insync.replicas: "2"
# ── Autoscaling (HPA) ───────────────────────────────────────────────────────
# KafkaConnect exposes the scale subresource, so a standard HPA works.
# When enabled, the chart stops managing spec.replicas.
autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # -- Set to enable memory-based scaling (e.g. 80)
  targetMemoryUtilizationPercentage: ""
  # -- Additional autoscaling/v2 metrics entries
  extraMetrics: []
  # -- HPA scaling behavior (autoscaling/v2 behavior block)
  behavior: {}

# ── RBAC ────────────────────────────────────────────────────────────────────
# -- Restrict the secret-reader Role to specific secrets. Empty = all secrets
# in the namespace (get/list/watch). When set, verbs narrow to get/watch and
# access is limited to the named secrets.
rbac:
  secretNames: []
  # - kates-connect
  # - connect-pg-credentials

serviceAccount:
  # -- Create a dedicated ServiceAccount for Connect pods
  create: true
  # -- Annotations to add to the ServiceAccount (e.g. for IRSA/Workload Identity)
  annotations: {}
  # -- Name of the ServiceAccount (defaults to fullname)
  name: ""

# ── REST API Exposure ───────────────────────────────────────────────────────
# Expose the Kafka Connect REST API (port 8083) via a Kubernetes Service
# and optionally an Ingress for external tooling (Kafka UI, monitoring).
restApi:
  service:
    enabled: true
    type: ClusterIP
    port: 8083
    annotations: {}
  ingress:
    enabled: false
    className: ""
    annotations: {}
      # nginx.ingress.kubernetes.io/rewrite-target: /
    hosts: []
      # - host: connect.example.com
      #   paths:
      #     - path: /
      #       pathType: Prefix
    tls: []
      # - secretName: connect-tls
      #   hosts:
      #     - connect.example.com

# ── Observability ───────────────────────────────────────────────────────────
alerts:
  enabled: true
  labels:
    release: kafka
    prometheus: kube-prometheus
    severity: warning
  thresholds:
    heapUsagePercent: 85
    errorRatePerSecond: 1
    rebalanceRatePerSecond: 0.1
    sourceLagMinutes: 15

podMonitors:
  enabled: true
  labels:
    release: kafka
    prometheus: kube-prometheus

dashboards:
  enabled: true
  namespace: ""   # defaults to release namespace
  label: grafana_dashboard
  labelValue: "1"

# ── Monitoring (PodMonitor) ─────────────────────────────────────────────────
monitoring:
  enabled: true
  interval: ""
  scrapeTimeout: ""
  honorLabels: false
  metricRelabelings: []
