# connect-cluster values.yaml

# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""
# -- Override the release namespace
namespaceOverride: ""

# -- Keep CRDs on helm uninstall (safety measure)
keepOnDelete: true

# -- Extra labels to add to all resources
extraLabels: {}

# -- Test images used in Helm test pods
testImages:
  kubectl: "ghcr.io/bmscomp/kates-tester:1.17.0"

# -- Number of Kafka Connect worker replicas
replicas: 3
# -- Kafka Connect image (leave empty to use Strimzi default)
image: "ghcr.io/bmscomp/connect:3.6.0"
# -- Kafka version
version: "4.2.0"
# -- Group ID for the Connect cluster
groupId: kates-connect-cluster

# -- Kubernetes cluster domain (used for Schema Registry FQDN computation)
clusterDomain: cluster.local

# ── Kafka Connection Settings ───────────────────────────────────────────────
# By default, this assumes the Kafka cluster is named 'krafter' and is deployed
# in the same namespace as this Connect cluster. Adjust these if Kafka is deployed
# elsewhere or has a different name.
kafka:
  # -- Kafka cluster name
  clusterName: "krafter"
  # -- Namespace where the Kafka cluster is deployed (leave empty if same namespace as Connect)
  namespace: ""
  # -- Bootstrap servers for the Kafka cluster (leave empty to compute automatically)
  bootstrapServers: ""
  tls:
    enabled: false
    # -- Secret containing the CA certificate for Kafka
    trustedCertificateSecret: "krafter-cluster-ca-cert"
    certificateKey: "ca.crt"
  authentication:
    type: scram-sha-512
    username: "kates-connect"
    # -- Secret containing the authentication password (defaults to username if empty)
    secretName: "kates-connect"
    # -- Key in the Secret containing the authentication password
    secretKey: "password"

# ── Scheduling ──────────────────────────────────────────────────────────────
topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway
  additional: []

podDisruptionBudget:
  maxUnavailable: 1

rack:
  enabled: true
  topologyKey: topology.kubernetes.io/zone

tolerations: []
nodeSelector: {}
nodeAffinity: {}
podAntiAffinity:
  enabled: true
  topologyKey: kubernetes.io/hostname

# -- Pod-level security context
podSecurityContext:
  fsGroup: 1001
  runAsNonRoot: true
  # runAsUser: 1001
  seccompProfile: RuntimeDefault

# -- DNS settings
dnsPolicy: ""
dnsConfig: {}

# -- Termination grace period (seconds)
terminationGracePeriodSeconds: 30

priorityClassName: "system-cluster-critical"
imagePullSecrets: []


# ── Internal Topics ─────────────────────────────────────────────────────────
internalTopics:
  prefix: ""  # defaults to groupId
  # -- Override individual topic names (defaults to <groupId>-<suffix>)
  # offsetsName: ""
  # configsName: ""
  # statusName: ""

# ── JVM & Resources ────────────────────────────────────────────────────────
jvmOptions:
  -Xms: 1024m
  -Xmx: 1024m
  gcLoggingEnabled: true
  javaSystemProperties: []

resources:
  requests:
    memory: 2Gi
    cpu: 1000m
  limits:
    memory: 4Gi
    cpu: 4000m

# ── Schema Registry (Apicurio) ──────────────────────────────────────────────
schemaRegistry:
  enabled: false
  serviceName: apicurio-apicurio-registry
  # -- Namespace where the Schema Registry is deployed (leave empty if same as Kafka)
  namespace: ""
  port: 80
  path: /apis/ccompat/v7

# ── Secret Access (Strimzi 1.0.0+) ──────────────────────────────────────────
# The KubernetesSecretConfigProvider is always enabled. Use the syntax
# ${secrets:<namespace>/<secret-name>:<key>} in connector configs to reference
# Kubernetes Secrets without volume mounts. The Connect ServiceAccount must
# have RBAC permissions to read the target secrets.
# See: https://strimzi.io/docs/operators/latest/configuring.html#type-ExternalConfiguration-reference


# ── Network Policy ──────────────────────────────────────────────────────────
networkPolicy:
  enabled: true
  # -- Namespace where the Strimzi Operator is deployed (leave empty if same as Kafka)
  strimziOperatorNamespace: ""
  kafkaPorts:
    - 9092
    - 9093
  monitoringNamespace: monitoring

# ── Database Egress (NetworkPolicy) ─────────────────────────────────────────
databaseEgress: []
  # - namespace: database
  #   port: 5432
  #   podSelector:
  #     app.kubernetes.io/name: postgresql

# ── Converter Configuration ─────────────────────────────────────────────────
config:
  replicationFactor: 3
  keyConverter: org.apache.kafka.connect.json.JsonConverter
  valueConverter: org.apache.kafka.connect.json.JsonConverter
  keyConverterSchemasEnable: true
  valueConverterSchemasEnable: true

# -- Arbitrary extra Kafka Connect worker config properties
extraConfig:
  producer.acks: "all"
  producer.enable.idempotence: "true"
  consumer.auto.offset.reset: "earliest"
  exactly.once.source.support: "enabled"
  group.initial.rebalance.delay.ms: "3000"

# ── Logging ─────────────────────────────────────────────────────────────────
logging:
  type: external

# ── Tracing (OpenTelemetry) ─────────────────────────────────────────────────
tracing:
  enabled: true
  type: opentelemetry

# ── Environment Variables ───────────────────────────────────────────────────
env: []

# ── Probes ──────────────────────────────────────────────────────────────────
readinessProbe:
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 10
  timeoutSeconds: 30
livenessProbe:
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 20
  timeoutSeconds: 30

# ── Strimzi Build (Custom Plugins) ──────────────────────────────────────────
# Enable this to let Strimzi build a custom Connect image with plugins.
# If using a pre-built image (recommended), leave this empty.
build: {}
  # output:
  #   type: docker
  #   image: "ghcr.io/bmscomp/connect:custom"
  #   pushSecret: my-registry-credentials
  # plugins:
