{{- if .Values.podMonitors.enabled }}
{{- $clusterName := include "connect-cluster.fullname" . -}}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $clusterName }}
  namespace: {{ include "connect-cluster.namespace" . }}
  labels:
    {{- include "connect-cluster.labels" . | nindent 4 }}
    {{- with .Values.podMonitors.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      # Strimzi labels Connect pods <cluster>-connect
      strimzi.io/name: {{ $clusterName }}-connect
      strimzi.io/kind: KafkaConnect
  podMetricsEndpoints:
    - port: tcp-prometheus
      path: /metrics
      {{- if .Values.monitoring.interval }}
      interval: {{ .Values.monitoring.interval }}
      {{- end }}
      {{- if .Values.monitoring.scrapeTimeout }}
      scrapeTimeout: {{ .Values.monitoring.scrapeTimeout }}
      {{- end }}
      {{- if .Values.monitoring.honorLabels }}
      honorLabels: {{ .Values.monitoring.honorLabels }}
      {{- end }}
      {{- with .Values.monitoring.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
