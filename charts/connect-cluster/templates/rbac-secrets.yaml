{{- /*
Secret access for the KubernetesSecretConfigProvider. The workers run as the
operator-made <fullname>-connect account (whether or not serviceAccount.create
is set), and read exactly the Secrets the connector configs reference:
one Role per namespace, `get` on those names only.
*/}}
{{- $r := include "connect-cluster.resolve" . | fromJson }}
{{- $ns := include "connect-cluster.namespace" . }}
{{- $fullname := include "connect-cluster.fullname" . }}
{{- $grants := $r.secretRefs }}
{{- $all := (.Values.rbac | default dict).allSecrets }}
{{- if $all }}
{{- /* 1.x breadth, opt-in: every Secret here and in the Kafka namespace. */}}
{{- $grants = dict $ns list (include "connect-cluster.kafkaNamespace" .) list }}
{{- end }}
{{- range $secretNs := keys $grants | sortAlpha }}
{{- $names := get $grants $secretNs }}
{{- $name := ternary (printf "%s-secret-reader" $fullname) (printf "%s-secret-reader-%s" $fullname $secretNs | trunc 63 | trimSuffix "-") (eq $secretNs $ns) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $secretNs }}
  labels:
    {{- include "connect-cluster.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    {{- if $all }}
    verbs: ["get", "list", "watch"]
    {{- else }}
    resourceNames: {{ $names | toJson }}
    verbs: ["get"]
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $secretNs }}
  labels:
    {{- include "connect-cluster.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "connect-cluster.workerServiceAccount" $ }}
    namespace: {{ $ns }}
{{- end }}
