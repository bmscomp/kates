{{- /* The workers read their credentials and the cluster CA from this
       namespace; when Kafka lives elsewhere they are copied here (kafka-common,
       the implementation mirror-maker2 uses). */}}
{{- $r := include "connect-cluster.resolve" . | fromJson }}
{{- $sync := $r.secretSync }}
{{- if and (include "kafka-common.enabled" (list $sync.enabled true)) (eq ($sync.method | default "job") "job") $sync.resolvedSecrets }}
{{- include "kafka-common.secretSync" (dict
      "ctx" .
      "fullname" (include "connect-cluster.fullname" .)
      "namespace" (include "connect-cluster.namespace" .)
      "labels" (include "connect-cluster.componentLabels" (dict "ctx" . "component" "secret-sync"))
      "secrets" $sync.resolvedSecrets
      "image" ($sync.image | default .Values.testImages.kubectl)
      "pullPolicy" .Values.imagePullPolicy
      "timeoutSeconds" $sync.timeoutSeconds
      "watch" $sync.watch
      "schedule" $sync.schedule) }}
{{- end }}
