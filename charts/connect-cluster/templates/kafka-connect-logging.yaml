{{- if eq ((.Values.logging).type | default "inline") "external" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "connect-cluster.fullname" . }}-logging
  namespace: {{ include "connect-cluster.namespace" . }}
  labels:
    {{- include "connect-cluster.labels" . | nindent 4 }}
data:
  log4j2.properties: |-
    name = Config
    
    appender.console.type = Console
    appender.console.name = STDOUT
    appender.console.layout.type = PatternLayout
    appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n
    
    rootLogger.level = INFO
    rootLogger.appenderRef.console.ref = STDOUT
    
    logger.reflections.name = org.reflections
    logger.reflections.level = ERROR
{{- end }}
