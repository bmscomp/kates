{{- /*
The Kafka Connect board, as a ConfigMap the Grafana sidecar picks up.

The board itself is not written here any more. It is built from
dashboards/kafka-connect/board.py, which is where its 35 panels, their
descriptions and their layout live; scripts/gen-dashboards.py writes the
result to files/dashboards/kafka-connect.json and `--check` fails CI when this
copy has drifted from it. Helm cannot read a file outside its own chart
directory, which is the only reason the copy exists.

What this template still does is give the board its per-release identity,
because two things about it cannot be expressed in a static file:

  uid    Grafana keys a board by uid and allows 40 characters. The release
         name alone does not fit and does not discriminate: truncated to 16
         characters, `kafka-connect-orders-eu` and `kafka-connect-orders-us`
         are the same string, and the second release installed would silently
         overwrite the first one's board. The uid is therefore the truncated
         name *plus* a digest of the whole one, so releases that share a
         prefix still get different uids.
  title  One Grafana, several Connect groups: the board has to say which.

Everything else is identical for every release. The expressions carry
`$namespace` and `$cluster` rather than a rendered selector — this chart's
PodMonitor applies kafka-common.strimziRelabelings, so `strimzi_io_cluster` is
on every series the workers publish and a variable can do what a rendered pod
regex used to. Every series they read is checked against
files/metrics/connect-metrics.yaml by
`scripts/check-metric-contract.sh connect-cluster`.
*/}}
{{- $d := .Values.dashboards | default dict }}
{{- if $d.enabled }}
{{- $name := include "connect-cluster.fullname" . }}
{{- $ns := include "connect-cluster.namespace" . }}
{{- $file := "files/dashboards/kafka-connect.json" }}
{{- $raw := .Files.Get $file }}
{{- if not $raw }}
{{- fail (printf "connect-cluster: %s is missing or empty — run scripts/gen-dashboards.py" $file) }}
{{- end }}
{{- $board := fromJson $raw }}
{{- $_ := set $board "uid" (printf "kates-connect-%s-%s" ($name | trunc 16 | trimSuffix "-") (sha256sum $name | trunc 8)) }}
{{- $_ := set $board "title" (printf "Kafka Connect — %s" $name) }}
{{- $_ := set $board "links" (list (dict "title" "Kafka Connect runbook" "type" "link" "url" .Values.alerts.runbookBaseUrl "targetBlank" true)) }}
{{ include "kafka-common.dashboardConfigMap" (dict
      "name" (printf "%s-dashboard" $name)
      "namespace" ($d.namespace | default $ns)
      "labels" (include "connect-cluster.componentLabels" (dict "ctx" . "component" "dashboard"))
      "label" ($d.label | default "grafana_dashboard")
      "labelValue" ($d.labelValue | default "1")
      "folder" ($d.folder | default "Kafka")
      "file" "kafka-connect.json"
      "json" (toPrettyJson $board)) }}
{{- end }}
