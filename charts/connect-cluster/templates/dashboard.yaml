{{- /*
ONE BOARD, read top to bottom, in the order an incident asks its questions:

  (header)              up, connectors, failures, task availability, errors
  Connectors and tasks  which connector, which task, which worker
  Throughput            is data moving, and how far behind the sinks are
  Errors and DLQ        what is failing, retried, skipped, dead-lettered
  Offset commits        will a restart reprocess
  Workers               rebalances, startups, heap
  Client path           the producers and consumers under the tasks (collapsed)

Positions come from kafka-common.grafana.layout, never from hand-written
coordinates. The `uid` is the (truncated) release name plus a digest of the
whole one: Grafana keys a board by uid and allows 40 characters, so two
releases sharing a prefix would otherwise overwrite each other's board. Every expression carries the release selector, and every series
it reads is checked against files/metrics/connect-metrics.yaml by
scripts/check-metric-contract.sh connect-cluster.
*/}}
{{- $d := .Values.dashboards | default dict }}
{{- if $d.enabled }}
{{- $name := include "connect-cluster.fullname" . }}
{{- $ns := include "connect-cluster.namespace" . }}
{{- $s := include "kafka-common.promSelector" (dict "namespace" $ns "pod" (printf "%s-connect-[0-9]+" $name)) }}
{{- $ds := dict "type" "prometheus" "uid" "${datasource}" }}
{{- $p := dict "ds" $ds }}

{{- $header := list
      (include "connect-cluster.panel" (merge (dict "type" "stat" "title" "Workers up" "w" 4 "h" 4 "expr" (printf "sum(up{%s}) or vector(0)" $s)) $p) | fromJson)
      (include "connect-cluster.panel" (merge (dict "type" "stat" "title" "Connectors" "w" 4 "h" 4 "expr" (printf "count(max by (connector) (kafka_connect_connector_metrics{%s})) or vector(0)" $s)) $p) | fromJson)
      (include "connect-cluster.panel" (merge (dict "type" "stat" "title" "Failed connectors" "w" 4 "h" 4 "red" 1 "expr" (printf "count(max by (connector) (kafka_connect_connector_metrics{status=\"failed\", %s})) or vector(0)" $s)) $p) | fromJson)
      (include "connect-cluster.panel" (merge (dict "type" "stat" "title" "Failed tasks" "w" 4 "h" 4 "red" 1 "expr" (printf "sum(kafka_connect_connector_task_status{status=\"failed\", %s}) or vector(0)" $s)) $p) | fromJson)
      (include "connect-cluster.panel" (merge (dict "type" "stat" "title" "Tasks running" "w" 4 "h" 4 "unit" "percentunit" "expr" (printf "sum(kafka_connect_worker_metrics_connector_running_task_count{%s}) / sum(kafka_connect_worker_metrics_connector_total_task_count{%s})" $s $s)) $p) | fromJson)
      (include "connect-cluster.panel" (merge (dict "type" "stat" "title" "Record errors /s" "w" 4 "h" 4 "unit" "short" "expr" (printf "sum(rate(kafka_connect_task_error_metrics_total_errors_logged{%s}[5m])) or vector(0)" $s)) $p) | fromJson) }}

{{- $tasks := list
      (include "connect-cluster.panel" (merge (dict "type" "table" "title" "Connector status" "w" 8 "expr" (printf "max by (connector, status) (kafka_connect_connector_metrics{status!=\"\", %s})" $s)) $p) | fromJson)
      (include "connect-cluster.panel" (merge (dict "type" "table" "title" "Task status" "w" 8 "expr" (printf "sum by (connector, task, status) (kafka_connect_connector_task_status{%s})" $s)) $p) | fromJson)
      (include "connect-cluster.panel" (merge (dict "title" "Tasks per worker" "w" 8 "legend" "{{pod}}" "expr" (printf "sum by (pod) (kafka_connect_coordinator_metrics_assigned_tasks{%s})" $s)) $p) | fromJson) }}

{{- $throughput := list
      (include "connect-cluster.panel" (merge (dict "title" "Source records polled /s" "w" 8 "unit" "short" "legend" "{{connector}}" "expr" (printf "sum by (connector) (rate(kafka_connect_source_task_metrics_source_record_poll_total{%s}[5m]))" $s)) $p) | fromJson)
      (include "connect-cluster.panel" (merge (dict "title" "Source records written /s" "w" 8 "unit" "short" "legend" "{{connector}}" "expr" (printf "sum by (connector) (rate(kafka_connect_source_task_metrics_source_record_write_total{%s}[5m]))" $s)) $p) | fromJson)
      (include "connect-cluster.panel" (merge (dict "title" "Source records in flight" "w" 8 "unit" "short" "legend" "{{connector}}" "expr" (printf "sum by (connector) (kafka_connect_source_task_metrics_source_record_active_count{%s})" $s)) $p) | fromJson)
      (include "connect-cluster.panel" (merge (dict "title" "Sink records read /s" "w" 8 "unit" "short" "legend" "{{connector}}" "expr" (printf "sum by (connector) (rate(kafka_connect_sink_task_metrics_sink_record_read_total{%s}[5m]))" $s)) $p) | fromJson)
      (include "connect-cluster.panel" (merge (dict "title" "Sink records put /s" "w" 8 "unit" "short" "legend" "{{connector}}" "expr" (printf "sum by (connector) (rate(kafka_connect_sink_task_metrics_sink_record_send_total{%s}[5m]))" $s)) $p) | fromJson)
      (include "connect-cluster.panel" (merge (dict "title" "Sink lag (max records behind)" "w" 8 "unit" "short" "legend" "{{connector}}" "expr" (printf "max by (connector) (kafka_connect_sink_task_metrics_sink_record_lag_max{%s})" $s)) $p) | fromJson) }}

{{- $errors := list
      (include "connect-cluster.panel" (merge (dict "title" "Errors logged /s" "w" 8 "unit" "short" "legend" "{{connector}}" "expr" (printf "sum by (connector) (rate(kafka_connect_task_error_metrics_total_errors_logged{%s}[5m]))" $s)) $p) | fromJson)
      (include "connect-cluster.panel" (merge (dict "title" "Record failures and skips /s" "w" 8 "unit" "short" "legend" "{{connector}} {{kind}}" "expr" (printf "label_replace(sum by (connector) (rate(kafka_connect_task_error_metrics_total_record_failures{%s}[5m])), \"kind\", \"failed\", \"\", \"\") or label_replace(sum by (connector) (rate(kafka_connect_task_error_metrics_total_records_skipped{%s}[5m])), \"kind\", \"skipped\", \"\", \"\")" $s $s)) $p) | fromJson)
      (include "connect-cluster.panel" (merge (dict "title" "Dead letter queue /s" "w" 8 "unit" "short" "legend" "{{connector}} {{kind}}" "expr" (printf "label_replace(sum by (connector) (rate(kafka_connect_task_error_metrics_deadletterqueue_produce_requests{%s}[5m])), \"kind\", \"written\", \"\", \"\") or label_replace(sum by (connector) (rate(kafka_connect_task_error_metrics_deadletterqueue_produce_failures{%s}[5m])), \"kind\", \"failed\", \"\", \"\")" $s $s)) $p) | fromJson) }}

{{- $commits := list
      (include "connect-cluster.panel" (merge (dict "title" "Offset commit time (avg)" "w" 8 "unit" "ms" "legend" "{{connector}}" "expr" (printf "max by (connector) (kafka_connect_connector_task_metrics_offset_commit_avg_time_ms{%s})" $s)) $p) | fromJson)
      (include "connect-cluster.panel" (merge (dict "title" "Offset commit failures" "w" 8 "unit" "percentunit" "legend" "{{connector}}" "expr" (printf "max by (connector) (kafka_connect_connector_task_metrics_offset_commit_failure_percentage{%s})" $s)) $p) | fromJson)
      (include "connect-cluster.panel" (merge (dict "title" "Sink offset commits /s" "w" 8 "unit" "short" "legend" "{{connector}}" "expr" (printf "sum by (connector) (kafka_connect_sink_task_metrics_offset_commit_completion_rate{%s})" $s)) $p) | fromJson) }}

{{- $workers := list
      (include "connect-cluster.panel" (merge (dict "title" "Rebalances /s" "w" 8 "unit" "short" "legend" "{{pod}}" "expr" (printf "rate(kafka_connect_worker_rebalance_metrics_completed_rebalances_total{%s}[5m])" $s)) $p) | fromJson)
      (include "connect-cluster.panel" (merge (dict "title" "Rebalance time (avg)" "w" 8 "unit" "ms" "legend" "{{pod}}" "expr" (printf "kafka_connect_worker_rebalance_metrics_rebalance_avg_time_ms{%s}" $s)) $p) | fromJson)
      (include "connect-cluster.panel" (merge (dict "title" "Startup failures (15m)" "w" 8 "unit" "short" "legend" "{{kind}}" "expr" (printf "label_replace(sum(increase(kafka_connect_worker_metrics_connector_startup_failure_total{%s}[15m])), \"kind\", \"connector\", \"\", \"\") or label_replace(sum(increase(kafka_connect_worker_metrics_task_startup_failure_total{%s}[15m])), \"kind\", \"task\", \"\", \"\")" $s $s)) $p) | fromJson)
      (include "connect-cluster.panel" (merge (dict "title" "Heap used" "w" 12 "unit" "bytes" "legend" "{{pod}}" "expr" (printf "sum by (pod) (jvm_memory_used_bytes{area=\"heap\", %s} or jvm_memory_bytes_used{area=\"heap\", %s})" $s $s)) $p) | fromJson)
      (include "connect-cluster.panel" (merge (dict "title" "Heap used / max" "w" 12 "unit" "percentunit" "legend" "{{pod}}" "expr" (printf "sum by (pod) (jvm_memory_used_bytes{area=\"heap\", %s} or jvm_memory_bytes_used{area=\"heap\", %s}) / sum by (pod) (jvm_memory_max_bytes{area=\"heap\", %s} or jvm_memory_bytes_max{area=\"heap\", %s})" $s $s $s $s)) $p) | fromJson) }}

{{- $clients := list
      (include "connect-cluster.panel" (merge (dict "title" "Producer records sent /s" "w" 8 "unit" "short" "legend" "{{clientid}}" "expr" (printf "sum by (clientid) (kafka_producer_producer_record_send_rate{%s})" $s)) $p) | fromJson)
      (include "connect-cluster.panel" (merge (dict "title" "Producer errors and retries /s" "w" 8 "unit" "short" "legend" "{{clientid}} {{kind}}" "expr" (printf "label_replace(sum by (clientid) (kafka_producer_producer_record_error_rate{%s}), \"kind\", \"error\", \"\", \"\") or label_replace(sum by (clientid) (kafka_producer_producer_record_retry_rate{%s}), \"kind\", \"retry\", \"\", \"\")" $s $s)) $p) | fromJson)
      (include "connect-cluster.panel" (merge (dict "title" "Producer request latency (avg)" "w" 8 "unit" "ms" "legend" "{{clientid}}" "expr" (printf "max by (clientid) (kafka_producer_producer_request_latency_avg{%s})" $s)) $p) | fromJson)
      (include "connect-cluster.panel" (merge (dict "title" "Consumer records /s" "w" 12 "unit" "short" "legend" "{{clientid}}" "expr" (printf "sum by (clientid) (kafka_consumer_consumer_fetch_manager_records_consumed_rate{%s})" $s)) $p) | fromJson)
      (include "connect-cluster.panel" (merge (dict "title" "Consumer lag (max)" "w" 12 "unit" "short" "legend" "{{clientid}}" "expr" (printf "max by (clientid) (kafka_consumer_consumer_fetch_manager_records_lag_max{%s})" $s)) $p) | fromJson) }}

{{- $rows := list
      (dict "title" "" "panels" $header)
      (dict "title" "Connectors and tasks" "panels" $tasks)
      (dict "title" "Throughput" "panels" $throughput)
      (dict "title" "Errors and dead letter queue" "panels" $errors)
      (dict "title" "Offset commits" "panels" $commits)
      (dict "title" "Workers" "panels" $workers)
      (dict "title" "Client path" "collapsed" true "panels" $clients) }}

{{- $board := dict
      "title" (printf "Kafka Connect — %s" $name)
      "uid" (printf "kates-connect-%s-%s" ($name | trunc 16 | trimSuffix "-") (sha256sum $name | trunc 8))
      "tags" (list "kafka" "connect" "strimzi" "kates")
      "timezone" "browser"
      "schemaVersion" 39
      "refresh" "30s"
      "editable" true
      "graphTooltip" 1
      "time" (dict "from" "now-6h" "to" "now")
      "links" (list (dict "title" "Kafka Connect runbook" "type" "link" "url" .Values.alerts.runbookBaseUrl "targetBlank" true))
      "templating" (dict "list" (list (dict "name" "datasource" "label" "Prometheus" "type" "datasource" "query" "prometheus" "current" (dict))))
      "panels" (include "kafka-common.grafana.layout" (dict "rows" $rows) | fromJsonArray) }}
{{ include "kafka-common.dashboardConfigMap" (dict
      "name" (printf "%s-dashboard" $name)
      "namespace" ($d.namespace | default $ns)
      "labels" (include "connect-cluster.componentLabels" (dict "ctx" . "component" "dashboard"))
      "label" ($d.label | default "grafana_dashboard")
      "labelValue" ($d.labelValue | default "1")
      "folder" ($d.folder | default "Kafka")
      "file" "kafka-connect.json"
      "json" (toPrettyJson $board)) }}
{{- end }}

{{/*
A Grafana panel. Call with (dict "ds" <datasource> "type" "timeseries"|"stat"|"table"
"title" … "expr" … "legend" … "unit" … "red" <stat threshold> "w" … "h" …).
*/}}
{{- define "connect-cluster.panel" -}}
{{- $type := .type | default "timeseries" -}}
{{- $target := dict "refId" "A" "expr" .expr "datasource" .ds -}}
{{- with .legend }}{{ $_ := set $target "legendFormat" . }}{{ end -}}
{{- if eq $type "table" }}{{ $_ := set $target "format" "table" }}{{ $_ := set $target "instant" true }}{{ end -}}
{{- $defaults := dict "unit" (.unit | default "short") -}}
{{- if eq $type "stat" -}}
{{- $steps := list (dict "color" "green" "value" nil) -}}
{{- with .red }}{{ $steps = append $steps (dict "color" "red" "value" .) }}{{ end -}}
{{- $_ := set $defaults "thresholds" (dict "mode" "absolute" "steps" $steps) -}}
{{- end -}}
{{- $panel := dict "type" $type "title" .title "datasource" .ds "targets" (list $target) "fieldConfig" (dict "defaults" $defaults "overrides" list) "w" (.w | default 12) "h" (.h | default 8) -}}
{{- if eq $type "table" }}{{ $_ := set $panel "transformations" (list (dict "id" "organize" "options" (dict "excludeByName" (dict "Time" true)))) }}{{ end -}}
{{- toJson $panel -}}
{{- end }}
