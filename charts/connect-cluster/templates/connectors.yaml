{{- if gt (len (default (list) .Values.connectors)) 0 }}
{{- $globalAutoRestart := .Values.autoRestart }}
{{- range .Values.connectors }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: {{ .name }}
  namespace: {{ include "connect-cluster.namespace" $ }}
  labels:
    {{- /* merge to avoid duplicate app.kubernetes.io/component key; per-connector labels win */}}
    {{- $labels := mergeOverwrite
          (include "connect-cluster.labels" $ | fromYaml)
          (dict "app.kubernetes.io/component" "connector"
                "kates.io/connector-name" .name
                "strimzi.io/cluster" (include "connect-cluster.fullname" $))
          (default (dict) .labels) }}
    {{- toYaml $labels | nindent 4 }}
  annotations:
    {{- if not (eq (toString $.Values.keepOnDelete) "false") }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- range $k, $v := (default (dict) .annotations) }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
spec:
  class: {{ .class }}
  tasksMax: {{ .tasksMax | default 1 }}
  {{- if .state }}
  state: {{ .state }}
  {{- end }}
  autoRestart:
    {{- if .autoRestart }}
    enabled: {{ .autoRestart.enabled | default true }}
    maxRestarts: {{ .autoRestart.maxRestarts | default ($globalAutoRestart.maxRestarts | default 10) }}
    {{- else }}
    enabled: {{ $globalAutoRestart.enabled | default true }}
    maxRestarts: {{ $globalAutoRestart.maxRestarts | default 10 }}
    {{- end }}
  {{- with .config }}
  config:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
