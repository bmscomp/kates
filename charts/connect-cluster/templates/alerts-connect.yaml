{{- if .Values.alerts.enabled }}
{{- $clusterName := include "connect-cluster.fullname" . -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $clusterName }}-alerts
  namespace: {{ include "connect-cluster.namespace" . }}
  labels:
    {{- include "connect-cluster.labels" . | nindent 4 }}
    {{- with .Values.alerts.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kafka-connect
      rules:
        # ── Critical ─────────────────────────────────────────────────────
        - alert: KafkaConnectTaskFailed
          expr: kafka_connect_worker_metrics_connector_failed_task_count > 0
          for: 2m
          labels:
            severity: critical
            cluster: {{ $clusterName }}
          annotations:
            summary: "Kafka Connect has failed tasks"
            description: "Connector has {{ "{{" }} $value {{ "}}" }} failed task(s) for more than 2 minutes."

        - alert: KafkaConnectWorkerDown
          expr: kafka_connect_worker_metrics_connector_count == 0
          for: 3m
          labels:
            severity: critical
            cluster: {{ $clusterName }}
          annotations:
            summary: "Kafka Connect worker has no connectors"
            description: "Connect worker reports 0 connectors for more than 3 minutes."

        - alert: KafkaConnectTaskCountMismatch
          expr: |
            kafka_connect_worker_metrics_connector_total_task_count
            != kafka_connect_worker_metrics_task_count
          for: 5m
          labels:
            severity: critical
            cluster: {{ $clusterName }}
          annotations:
            summary: "Task count mismatch — expected vs running"
            description: "Expected {{ "{{" }} $labels.connector {{ "}}" }} tasks do not match running tasks for 5+ minutes. Possible stuck or crashed tasks."

        # ── Warning ──────────────────────────────────────────────────────
        - alert: KafkaConnectRebalanceStorm
          expr: rate(kafka_connect_worker_rebalance_metrics_rebalance_total[5m]) > {{ .Values.alerts.thresholds.rebalanceRatePerSecond }}
          for: 5m
          labels:
            severity: warning
            cluster: {{ $clusterName }}
          annotations:
            summary: "Kafka Connect rebalancing too frequently"
            description: "Connect workers are rebalancing at {{ "{{" }} $value {{ "}}" }}/s which may indicate instability."

        - alert: KafkaConnectHighErrorRate
          expr: rate(kafka_connect_task_metrics_total_errors_logged_total[5m]) > {{ .Values.alerts.thresholds.errorRatePerSecond }}
          for: 5m
          labels:
            severity: warning
            cluster: {{ $clusterName }}
          annotations:
            summary: "Kafka Connect high error rate"
            description: "Connect tasks are logging errors at {{ "{{" }} $value {{ "}}" }}/s."

        - alert: KafkaConnectRebalanceTooLong
          expr: kafka_connect_worker_rebalance_metrics_rebalance_time_ms_total > 120000
          for: 2m
          labels:
            severity: warning
            cluster: {{ $clusterName }}
          annotations:
            summary: "Kafka Connect rebalance taking too long"
            description: "A Connect rebalance has been running for over 2 minutes ({{ "{{" }} $value {{ "}}" }}ms)."

        - alert: KafkaConnectWorkerHeapHigh
          expr: |
            jvm_memory_bytes_used{area="heap", kubernetes_name="{{ include "connect-cluster.fullname" . }}-connect"}
            / jvm_memory_bytes_max{area="heap", kubernetes_name="{{ include "connect-cluster.fullname" . }}-connect"}
            > {{ divf .Values.alerts.thresholds.heapUsagePercent 100.0 }}
          for: 5m
          labels:
            severity: warning
            cluster: {{ $clusterName }}
          annotations:
            summary: "Kafka Connect worker JVM heap usage above {{ .Values.alerts.thresholds.heapUsagePercent }}%"
            description: "Worker {{ "{{" }} $labels.pod {{ "}}" }} heap is at {{ "{{" }} printf \"%.0f\" (mul $value 100) {{ "}}" }}% for 5+ minutes. Consider increasing -Xmx."

        - alert: KafkaConnectSourceLag
          expr: kafka_connect_source_task_metrics_source_record_poll_total == 0
          for: {{ .Values.alerts.thresholds.sourceLagMinutes }}m
          labels:
            severity: warning
            cluster: {{ $clusterName }}
          annotations:
            summary: "Kafka Connect source connector producing no records"
            description: "Source task {{ "{{" }} $labels.connector {{ "}}" }}/{{ "{{" }} $labels.task {{ "}}" }} has polled 0 records for {{ .Values.alerts.thresholds.sourceLagMinutes }}+ minutes."
{{- end }}
