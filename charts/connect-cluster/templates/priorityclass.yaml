{{- with .Values.priorityClass }}
{{- if and .create (not (eq ($.Values.rbac.scope | default ($.Values.global).rbacScope | default "cluster") "namespace")) }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .name }}
  labels:
    {{- include "connect-cluster.labels" $ | nindent 4 }}
value: {{ int .value }}
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: {{ .description | quote }}
{{- end }}
{{- end }}
