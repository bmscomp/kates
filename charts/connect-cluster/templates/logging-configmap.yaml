{{- if eq ((.Values.logging).type | default "") "external" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "connect-cluster.fullname" . }}-logging
  namespace: {{ include "connect-cluster.namespace" . }}
  labels:
    {{- include "connect-cluster.labels" . | nindent 4 }}
data:
  log4j2.properties: |-
    {{- include "connect-cluster.loggingConfig" . | nindent 4 }}
{{- end }}
