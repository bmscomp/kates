{{- if .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "connect-cluster.fullname" . }}-secret-reader
  namespace: {{ include "connect-cluster.namespace" . }}
  labels:
    {{- include "connect-cluster.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "connect-cluster.fullname" . }}-secret-reader
  namespace: {{ include "connect-cluster.namespace" . }}
  labels:
    {{- include "connect-cluster.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "connect-cluster.fullname" . }}-secret-reader
subjects:
  # Strimzi-managed ServiceAccount (auto-created by the operator)
  - kind: ServiceAccount
    name: {{ include "connect-cluster.fullname" . }}-connect
    namespace: {{ include "connect-cluster.namespace" . }}
---
# RBAC for Helm test pods — allows kubectl get on connect resources
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "connect-cluster.fullname" . }}-test-reader
  namespace: {{ include "connect-cluster.namespace" . }}
  labels:
    {{- include "connect-cluster.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["kafka.strimzi.io"]
    resources: ["kafkaconnects"]
    verbs: ["get", "list"]
  - apiGroups: ["kafka.strimzi.io"]
    resources: ["kafkaconnectors"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "connect-cluster.fullname" . }}-test-reader
  namespace: {{ include "connect-cluster.namespace" . }}
  labels:
    {{- include "connect-cluster.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "connect-cluster.fullname" . }}-test-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "connect-cluster.serviceAccountName" . }}
    namespace: {{ include "connect-cluster.namespace" . }}
{{- end }}
