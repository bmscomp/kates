{{- if .Values.serviceAccount.create }}
{{- $secretNames := (.Values.rbac).secretNames | default (list) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "connect-cluster.fullname" . }}-secret-reader
  namespace: {{ include "connect-cluster.namespace" . }}
  labels:
    {{- include "connect-cluster.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    {{- if $secretNames }}
    # Scoped: only the secrets referenced by connector configs
    resourceNames:
      {{- toYaml $secretNames | nindent 6 }}
    verbs: ["get", "watch"]
    {{- else }}
    verbs: ["get", "list", "watch"]
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "connect-cluster.fullname" . }}-secret-reader
  namespace: {{ include "connect-cluster.namespace" . }}
  labels:
    {{- include "connect-cluster.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "connect-cluster.fullname" . }}-secret-reader
subjects:
  # Strimzi-managed ServiceAccount (auto-created by the operator)
  - kind: ServiceAccount
    name: {{ include "connect-cluster.fullname" . }}-connect
    namespace: {{ include "connect-cluster.namespace" . }}
{{- if and .Values.kafka.namespace (ne .Values.kafka.namespace (include "connect-cluster.namespace" .)) }}
---
# Cross-namespace secret access: allow Connect pods to read secrets in the Kafka namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "connect-cluster.fullname" . }}-kafka-secret-reader
  namespace: {{ .Values.kafka.namespace }}
  labels:
    {{- include "connect-cluster.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    {{- if $secretNames }}
    resourceNames:
      {{- toYaml $secretNames | nindent 6 }}
    verbs: ["get", "watch"]
    {{- else }}
    verbs: ["get", "list", "watch"]
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "connect-cluster.fullname" . }}-kafka-secret-reader
  namespace: {{ .Values.kafka.namespace }}
  labels:
    {{- include "connect-cluster.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "connect-cluster.fullname" . }}-kafka-secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "connect-cluster.fullname" . }}-connect
    namespace: {{ include "connect-cluster.namespace" . }}
{{- end }}
---
# RBAC for Helm test pods — allows kubectl get on connect resources
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "connect-cluster.fullname" . }}-test-reader
  namespace: {{ include "connect-cluster.namespace" . }}
  labels:
    {{- include "connect-cluster.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["kafka.strimzi.io"]
    resources: ["kafkaconnects"]
    verbs: ["get", "list"]
  - apiGroups: ["kafka.strimzi.io"]
    resources: ["kafkaconnectors"]
    verbs: ["get", "list", "create", "delete"]
  # Tier 0 test: verify the Kafka auth secret exists (scoped to that secret)
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.kafka.authentication.secretName | default .Values.kafka.authentication.username | default "kates-connect" | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "connect-cluster.fullname" . }}-test-reader
  namespace: {{ include "connect-cluster.namespace" . }}
  labels:
    {{- include "connect-cluster.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "connect-cluster.fullname" . }}-test-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "connect-cluster.serviceAccountName" . }}
    namespace: {{ include "connect-cluster.namespace" . }}
{{- end }}
