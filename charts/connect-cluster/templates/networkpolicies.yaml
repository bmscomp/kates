{{- if .Values.networkPolicy.enabled }}
{{- $clusterName := include "connect-cluster.fullname" . -}}
{{- $namespace := include "connect-cluster.namespace" . -}}
{{- $connectPodName := printf "%s-connect" $clusterName -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $clusterName }}-connect-extra
  namespace: {{ $namespace }}
  labels:
    {{- include "connect-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/name: {{ $connectPodName }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9404
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kates
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kates
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.strimziOperatorNamespace | default (include "connect-cluster.kafkaNamespace" .) }}
          podSelector:
            matchLabels:
              strimzi.io/kind: cluster-operator
        # Allow ingress from all sources for health probes (kubelet)
        - namespaceSelector: {}
      ports:
        - port: 8083
          protocol: TCP
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow worker-to-worker REST traffic (leader forwarding and task assignment)
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $clusterName }}
              strimzi.io/kind: KafkaConnect
              strimzi.io/name: {{ $connectPodName }}
      ports:
        - port: 8083
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "connect-cluster.kafkaNamespace" . }}
          podSelector:
            matchLabels:
              strimzi.io/cluster: {{ .Values.kafka.clusterName }}
      ports:
        {{- range .Values.networkPolicy.kafkaPorts | default (list 9092 9093) }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- if .Values.schemaRegistry.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.schemaRegistry.namespace | default (include "connect-cluster.kafkaNamespace" .) }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: apicurio-registry
      ports:
        - port: {{ .Values.schemaRegistry.port | default 80 }}
          protocol: TCP
    {{- end }}
    {{- range (default (list) .Values.databaseEgress) }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          {{- with .podSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - port: {{ .port | default 5432 }}
          protocol: TCP
    {{- end }}
    # Allow API Server egress
    - to: []
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
{{- if .Values.databaseEgress }}
{{- range .Values.databaseEgress }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-connect-ingress-{{ .port | default 5432 }}
  namespace: {{ .namespace }}
  labels:
    {{- include "connect-cluster.labels" $ | nindent 4 }}
spec:
  podSelector:
    {{- with .podSelector }}
    matchLabels:
      {{- toYaml . | nindent 6 }}
    {{- else }}
    matchLabels: {}
    {{- end }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "connect-cluster.namespace" $ }}
          podSelector:
            matchLabels:
              strimzi.io/name: {{ $connectPodName }}
      ports:
        - port: {{ .port | default 5432 }}
          protocol: TCP
{{- end }}
{{- end }}
{{- end }}
