{{- /*
The Connect principal (kafkaUser.create), in the Kafka namespace where the
User Operator writes its credentials Secret. ACLs are derived from these
values (mode: auto), so group and topic names cannot drift, or taken
verbatim (mode: custom).
*/ -}}
{{- if (.Values.kafkaUser).create }}
{{- $r := include "connect-cluster.resolve" . | fromJson }}
{{- $tpl := deepCopy (.Values.kafkaUser.template | default dict) }}
{{- /* method: reflector — kubernetes-reflector mirrors the Secret here. */}}
{{- if $r.secretSync.reflector }}
{{- $ns := include "connect-cluster.namespace" . }}
{{- $ann := dict
      "reflector.v1.k8s.emberstack.com/reflection-allowed" "true"
      "reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces" $ns
      "reflector.v1.k8s.emberstack.com/reflection-auto-enabled" "true"
      "reflector.v1.k8s.emberstack.com/reflection-auto-namespaces" $ns }}
{{- $tpl = mustMergeOverwrite (dict "secret" (dict "metadata" (dict "annotations" $ann))) $tpl }}
{{- end }}
{{- include "kafka-common.kafkaUser" (dict
      "name" (include "connect-cluster.kafkaUsername" .)
      "namespace" (include "connect-cluster.kafkaNamespace" .)
      "cluster" (.Values.kafka.clusterName | default "krafter")
      "labels" (include "connect-cluster.labels" .)
      "keep" (eq (include "kafka-common.enabled" (list .Values.keepOnDelete true)) "true")
      "authType" (.Values.kafka.authentication.type | default "scram-sha-512")
      "quotas" .Values.kafkaUser.quotas
      "template" $tpl
      "authorization" .Values.kafkaUser.authorization
      "acls" (include "connect-cluster.kafkaUserAcls" .)) }}
{{- end }}

{{/* The Connect principal's ACLs, as a YAML list at column 0. */}}
{{- define "connect-cluster.kafkaUserAcls" -}}
{{- $authz := .Values.kafkaUser.authorization | default dict }}
{{- $gid := .Values.groupId }}
{{- if eq ($authz.mode | default "auto") "custom" }}
{{- if not .Values.kafkaUser.acls }}
{{- fail "connect-cluster: kafkaUser.authorization.mode=custom requires kafkaUser.acls" }}
{{- end }}
{{ toYaml .Values.kafkaUser.acls }}
{{- else }}
{{- $r := include "connect-cluster.resolve" . | fromJson }}
{{- $topics := include "connect-cluster.internalTopics" . | fromYaml }}
# ── Connect internal topics ──
{{- range (list $topics.offsets $topics.configs $topics.status) }}
- resource: { type: topic, name: {{ . | quote }}, patternType: literal }
  operations: ["Read", "Write", "Create", "Describe", "DescribeConfigs"]
  host: "*"
{{- end }}
# ── Worker group, and the connect-<connector> groups of sink connectors ──
- resource: { type: group, name: {{ $gid | quote }}, patternType: literal }
  operations: ["Read", "Describe"]
  host: "*"
- resource: { type: group, name: "connect-", patternType: prefix }
  operations: ["Read", "Describe"]
  host: "*"
{{- range .Values.kafkaUser.groupGrants }}
- resource: { type: group, name: {{ .name | quote }}, patternType: {{ .patternType | default "prefix" }} }
  operations: ["Read", "Describe"]
  host: "*"
{{- end }}
# ── Connector data topics ──
{{- range .Values.kafkaUser.topicGrants }}
- resource: { type: topic, name: {{ .name | quote }}, patternType: {{ .patternType | default "prefix" }} }
  operations: {{ .operations | default (list "Read" "Write" "Create" "Describe") | toJson }}
  host: "*"
{{- end }}
{{- range $r.connectors }}
{{- with .deadLetterQueue }}
# ── Dead letter queue ──
- resource: { type: topic, name: {{ .topic | quote }}, patternType: literal }
  operations: ["Write", "Create", "Describe"]
  host: "*"
{{- end }}
{{- end }}
{{- if include "kafka-common.enabled" (list .Values.exactlyOnce.enabled true) }}
# ── Exactly-once source support (KIP-618) ──
# The leader writes the config topic transactionally as connect-cluster-<groupId>;
# each source task's producer is <groupId>-<connector>-<task>.
- resource: { type: transactionalId, name: {{ printf "connect-cluster-%s" $gid | quote }}, patternType: literal }
  operations: ["Write", "Describe"]
  host: "*"
- resource: { type: transactionalId, name: {{ printf "%s-" $gid | quote }}, patternType: prefix }
  operations: ["Write", "Describe"]
  host: "*"
{{- end }}
# ── Cluster metadata (admin client) ──
- resource: { type: cluster }
  operations: ["Describe", "DescribeConfigs"]
  host: "*"
{{- end }}
{{- end }}
