{{- include "connect-cluster.validate" . }}
{{- $r := include "connect-cluster.resolve" . | fromJson }}
{{- $topics := include "connect-cluster.internalTopics" . | fromYaml }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: {{ include "connect-cluster.fullname" . }}
  namespace: {{ include "connect-cluster.namespace" . }}
  labels:
    {{- include "connect-cluster.labels" . | nindent 4 }}
  annotations:
    {{- if include "kafka-common.enabled" (list .Values.keepOnDelete true) }}
    helm.sh/resource-policy: keep
    {{- end }}
    strimzi.io/use-connector-resources: "true"
spec:
  {{- /* version, image, replicas (lookup-preserved under the HPA), JVM,
         probes, logging, tracing, rack, JMX, metrics and spec.template — the
         last built as one map and merged with templateExtra. */}}
  {{- include "kafka-common.connectWorker.spec" (dict "ctx" . "w" (include "connect-cluster.worker" . | fromYaml)) | nindent 2 }}
  bootstrapServers: {{ $r.bootstrap | quote }}
  {{- with include "kafka-common.clientTlsAuth" (dict "c" (include "connect-cluster.kafka" . | fromYaml) "field" "kafka" "chart" "connect-cluster") | trim }}
  {{- . | nindent 2 }}
  {{- end }}
  groupId: {{ .Values.groupId | quote }}
  offsetStorageTopic: {{ $topics.offsets }}
  configStorageTopic: {{ $topics.configs }}
  statusStorageTopic: {{ $topics.status }}
  config:
    {{- $rf := .Values.config.replicationFactor | default 3 }}
    offset.storage.replication.factor: {{ $rf }}
    config.storage.replication.factor: {{ $rf }}
    status.storage.replication.factor: {{ $rf }}
    key.converter: {{ .Values.config.keyConverter | default "org.apache.kafka.connect.json.JsonConverter" }}
    value.converter: {{ .Values.config.valueConverter | default "org.apache.kafka.connect.json.JsonConverter" }}
    key.converter.schemas.enable: {{ eq (include "kafka-common.enabled" (list .Values.config.keyConverterSchemasEnable true)) "true" }}
    value.converter.schemas.enable: {{ eq (include "kafka-common.enabled" (list .Values.config.valueConverterSchemasEnable true)) "true" }}
    {{- /* Connect configures a converter with the worker properties under its
           own prefix only, and Apicurio's converters read
           apicurio.registry.url, so each Apicurio converter gets its own. */}}
    {{- if .Values.schemaRegistry.enabled }}
    {{- $registry := printf "http://%s.%s.svc.%s:%d%s" .Values.schemaRegistry.serviceName (include "connect-cluster.schemaRegistryNamespace" .) (include "connect-cluster.clusterDomain" .) (.Values.schemaRegistry.port | int) .Values.schemaRegistry.path }}
    {{- range $side := list "key" "value" }}
    {{- $prop := printf "%s.converter.apicurio.registry.url" $side }}
    {{- if and (hasPrefix "io.apicurio." (index $.Values.config (printf "%sConverter" $side) | default "")) (not (hasKey ($.Values.extraConfig | default dict) $prop)) }}
    {{ $prop }}: {{ $registry }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- /* Every worker of a group must agree on this, so it is a chart switch;
           the managed KafkaUser grants the transactional IDs it needs. */}}
    exactly.once.source.support: {{ ternary "enabled" "disabled" (eq (include "kafka-common.enabled" (list .Values.exactlyOnce.enabled true)) "true") }}
    config.providers: file,dir,secrets
    config.providers.file.class: org.apache.kafka.common.config.provider.FileConfigProvider
    config.providers.dir.class: org.apache.kafka.common.config.provider.DirectoryConfigProvider
    config.providers.secrets.class: io.strimzi.kafka.KubernetesSecretConfigProvider
    {{- range $key, $value := .Values.extraConfig }}
    {{ $key }}: {{ $value | toJson }}
    {{- end }}
  {{- with .Values.plugins }}
  plugins:
    {{- range . }}
    - name: {{ .name }}
      artifacts:
        {{- toYaml .artifacts | nindent 8 }}
    {{- end }}
  {{- end }}
  {{- if and .Values.build .Values.build.output }}
  build:
    {{- toYaml .Values.build | nindent 4 }}
  {{- end }}
