# JMX exporter rules for Kafka Connect workers — the series the chart's alerts
# and dashboard read. scripts/metric-contract/connect-cluster.yaml proves every
# name they use is one these rules produce.
#
# Derived from Strimzi's kafka-connect-metrics example, with two changes the
# example does not have (docs/kafka-charts-refactor-plan.md, C5):
#  - the exporter's 1.x line strips a trailing `_total` from anything not
#    published as a COUNTER, so cumulative `*-total` attributes have their own
#    COUNTER rules, ahead of the GAUGE rule for the same bean;
#  - Kafka quotes an ObjectName value containing characters outside
#    [A-Za-z0-9._%-], and a greedy `(.+)>` runs into the `<>` after the bean,
#    so connector captures are `"?([^,"]+?)"?`.
lowercaseOutputName: true
lowercaseOutputLabelNames: true
rules:
# Client app-info (producer/consumer/connect clients embedded in workers)
- pattern: "kafka.(.+)<type=app-info, client-id=(.+)><>start-time-ms"
  name: kafka_$1_start_time_seconds
  type: GAUGE
  valueFactor: 0.001
  labels:
    clientId: "$2"
- pattern: "kafka.(.+)<type=app-info, client-id=(.+)><>(commit-id|version): (.+)"
  name: kafka_$1_$3_info
  value: 1
  type: UNTYPED
  labels:
    clientId: "$2"
    $3: "$4"

# Connect worker metrics (per connector)
- pattern: 'kafka.connect<type=connect-worker-metrics, connector="?([^,"]+?)"?><>([^:]+):'
  name: kafka_connect_worker_metrics_$2
  type: GAUGE
  labels:
    connector: "$1"

# Connect worker metrics (global)
- pattern: "kafka.connect<type=connect-worker-metrics><>([^:]+-total):"
  name: kafka_connect_worker_metrics_$1
  type: COUNTER
- pattern: "kafka.connect<type=connect-worker-metrics><>([^:]+):"
  name: kafka_connect_worker_metrics_$1
  type: GAUGE

# Connect worker rebalance metrics
- pattern: "kafka.connect<type=connect-worker-rebalance-metrics><>([^:]+-total):"
  name: kafka_connect_worker_rebalance_metrics_$1
  type: COUNTER
- pattern: "kafka.connect<type=connect-worker-rebalance-metrics><>(leader-name|connect-protocol): (.+)"
  name: kafka_connect_worker_rebalance_metrics_info
  value: 1
  type: UNTYPED
  labels:
    $1: "$2"
- pattern: "kafka.connect<type=connect-worker-rebalance-metrics><>([^:]+):"
  name: kafka_connect_worker_rebalance_metrics_$1
  type: GAUGE

# Connector status / metadata
- pattern: 'kafka.connect<type=connector-metrics, connector="?([^,"]+?)"?><>(connector-class|connector-type|connector-version|status): (.+)'
  name: kafka_connect_connector_metrics
  value: 1
  type: UNTYPED
  labels:
    connector: "$1"
    $2: "$3"

# Task status (running | paused | failed | unassigned | restarting | destroyed)
- pattern: 'kafka.connect<type=connector-task-metrics, connector="?([^,"]+?)"?, task=(\d+)><>status: (.+)'
  name: kafka_connect_connector_task_status
  value: 1
  type: UNTYPED
  labels:
    connector: "$1"
    task: "$2"
    status: "$3"

# Task-level metrics: connector-task, source-task, sink-task, task-error
- pattern: 'kafka.connect<type=(.+)-metrics, connector="?([^,"]+?)"?, task=(\d+)><>(.+-total):'
  name: kafka_connect_$1_metrics_$4
  type: COUNTER
  labels:
    connector: "$2"
    task: "$3"
- pattern: 'kafka.connect<type=(.+)-metrics, connector="?([^,"]+?)"?, task=(\d+)><>(.+-count|.+-ms|.+-ratio|.+-seq-no|.+-rate|.+-max|.+-avg|.+-failures|.+-requests|.+-timestamp|.+-logged|.+-errors|.+-retries|.+-skipped|.+-percentage):'
  name: kafka_connect_$1_metrics_$4
  type: GAUGE
  labels:
    connector: "$2"
    task: "$3"

# Connect group coordinator: what each worker was assigned
- pattern: "kafka.connect<type=connect-coordinator-metrics, client-id=(.+)><>(assigned-connectors|assigned-tasks):"
  name: kafka_connect_coordinator_metrics_$2
  type: GAUGE
  labels:
    clientId: "$1"

# Connect coordinator / client metrics
- pattern: "kafka.connect<type=connect-metrics, client-id=(.+)><>(.+-total):"
  name: kafka_connect_connect_metrics_$2
  type: COUNTER
  labels:
    clientId: "$1"
- pattern: "kafka.connect<type=connect-metrics, client-id=(.+)><>(.+-rate|.+-avg|.+-max|.+-count|.+-ms|.+-age|.+-ratio):"
  name: kafka_connect_connect_metrics_$2
  type: GAUGE
  labels:
    clientId: "$1"

# Embedded producer/consumer/admin client metrics
- pattern: "kafka.(producer|consumer|admin.client)<type=(.+)-metrics, client-id=(.+)><>(.+-total):"
  name: kafka_$1_$2_$4
  type: COUNTER
  labels:
    clientId: "$3"
- pattern: "kafka.(producer|consumer|admin.client)<type=(.+)-metrics, client-id=(.+)><>(.+-rate|.+-avg|.+-max):"
  name: kafka_$1_$2_$4
  type: GAUGE
  labels:
    clientId: "$3"
