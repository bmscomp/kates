# Generic cluster overlay for connect-cluster
# Disables components that require extra operators (like Prometheus CRDs)

# The image is deliberately NOT overridden here. kind pulls the same published
# image every other cluster runs — ghcr.io/bmscomp/connect:<debezium>-kafka-<kafka>
# from values.yaml. That tag is a release artefact, so it exists for the pins
# this repo declares; check-versions.sh asserts the Debezium line in the pin is
# the one Dockerfile.connect builds.
#
# This overlay used to pin a locally built `connect:<debezium>` instead, which
# made every Connect deploy on kind depend on `make connect-build` having run on
# that machine. When it had not, kubelet read the bare tag as
# docker.io/library/connect and the pods sat in ImagePullBackOff.
#
# To run an image built from the working tree — a plugin change, a Debezium bump
# not yet published — build it, then override the pin for that deploy:
#
#   make connect-build        # also loads the qualified tag into the kind cluster
#   helm upgrade --install connect-cluster charts/connect-cluster -n connect \
#     -f charts/connect-cluster/values-kind.yaml --set image=connect:<debezium>
#
# `make connect-build` also loads the image under the qualified tag values.yaml
# names, so on kind a fresh local build shadows the registry copy without any
# override at all (the pull policy is IfNotPresent).

alerts:
  enabled: false

podMonitors:
  enabled: false

dashboards:
  enabled: false

networkPolicy:
  enabled: true

databaseEgress:
  - namespace: kates
    port: 5432
    podSelector:
      app.kubernetes.io/name: postgresql

tracing:
  enabled: false

schemaRegistry:
  enabled: true
  path: /apis/ccompat/v7
