# Generic cluster overlay for connect-cluster
# Disables components that require extra operators (like Prometheus CRDs)

# Use the image built on this machine, not the registry.
#
# charts/connect-cluster/values.yaml names the PUBLISHED tag
# ghcr.io/bmscomp/connect:<debezium>-kafka-<kafka>, and that tag exists only
# once the publish workflow has run for those exact versions. Bump either pin
# locally and a kind deploy asks the registry for something nobody has built
# yet — which does not surface as a readable error but as ImagePullBackOff on
# every Connect pod, twenty minutes in:
#
#   Failed to pull image "ghcr.io/bmscomp/connect:3.6.2-kafka-4.3.1": not found
#
# `make connect-build` builds this tag and kind-loads it, so the local image is
# always the one matching the local pins. The tag carries no registry prefix and
# is not :latest, so kubelet resolves it to the loaded image and never reaches
# out. Build it before deploying Connect on kind; check-versions.sh asserts this
# tag and Dockerfile.connect agree.
image: "connect:3.6.2"

alerts:
  enabled: false

podMonitors:
  enabled: false

dashboards:
  enabled: false

networkPolicy:
  enabled: true

databaseEgress:
  - namespace: kates
    port: 5432
    podSelector:
      app.kubernetes.io/name: postgresql

tracing:
  enabled: false

schemaRegistry:
  enabled: true
  path: /apis/ccompat/v7
