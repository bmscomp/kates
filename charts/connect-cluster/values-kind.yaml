# Generic cluster overlay for connect-cluster
# Disables components that require extra operators (like Prometheus CRDs)

alerts:
  enabled: false

podMonitors:
  enabled: false

dashboards:
  enabled: false

networkPolicy:
  enabled: true

databaseEgress:
  - namespace: kates
    port: 5432
    podSelector:
      app.kubernetes.io/name: postgresql

tracing:
  enabled: false

schemaRegistry:
  enabled: true
  path: /apis/ccompat/v7
