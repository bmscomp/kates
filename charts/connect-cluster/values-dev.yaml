# Development overlay for connect-cluster: one small worker, replication
# factor 1, no zone spreading.
# helm upgrade --install connect-cluster charts/connect-cluster -f charts/connect-cluster/values-dev.yaml

replicas: 1

topologySpreadConstraints:
  enabled: false

podAntiAffinity:
  enabled: false

jvmOptions:
  -Xms: 512m
  -Xmx: 512m
  gcLoggingEnabled: true

resources:
  requests:
    memory: 1Gi
    cpu: 500m
  limits:
    memory: 2Gi
    cpu: 2000m

alerts:
  enabled: false

config:
  replicationFactor: 1

testTopics:
  - name: cdc-public-demo-orders
    topicName: cdc.public.demo_orders
    partitions: 1
    replicas: 1
