{{- if .Values.listeners.sasl.enabled }}
{{- $users := .Values.listeners.sasl.users }}
{{- $first := index $users 0 }}
{{- /*
KIP-85 put the JAAS config inline in server.properties as
`listener.name.<listener>.<mechanism>.sasl.jaas.config`, which is why this chart
needs no jaas.conf file and no KAFKA_OPTS -Djava.security.auth.login.config.
It works identically on 2.x and 3.x, which is the whole reason SASL/PLAIN was
picked over SCRAM here: SCRAM credentials would have to be written to ZooKeeper
on one line and to the storage formatter on the other.

The passwords live in a Secret rather than the scripts ConfigMap, and the
entrypoint appends this file to the generated server.properties.
*/}}
{{- $jaas := printf "listener.name.sasl_plaintext.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username=%q password=%q %s;" $first.username $first.password (include "legacy-kafka.jaasUserEntries" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "legacy-kafka.fullname" . }}-jaas
  namespace: {{ include "legacy-kafka.namespace" . }}
  labels:
    {{- include "legacy-kafka.labels" . | nindent 4 }}
type: Opaque
stringData:
  jaas.properties: |
    {{ $jaas }}
  # Client-side properties for the topics Job and the Helm test, so the chart's
  # own tooling can reach a SASL-only broker without a second Secret.
  client.properties: |
    security.protocol=SASL_PLAINTEXT
    sasl.mechanism=PLAIN
    sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username={{ $first.username | quote }} password={{ $first.password | quote }};
{{- end }}
