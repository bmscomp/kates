{{- include "legacy-kafka.validate" . }}
{{- $fullname := include "legacy-kafka.fullname" . }}
{{- $ns := include "legacy-kafka.namespace" . }}
{{- $domain := .Values.clusterDomain | default "cluster.local" }}
{{- $headless := include "legacy-kafka.headlessService" . }}
{{- $zkSvc := include "legacy-kafka.zookeeperService" . }}
{{- $k := .Values.kafka }}
{{- $l := .Values.listeners }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-scripts
  namespace: {{ $ns }}
  labels:
    {{- include "legacy-kafka.labels" . | nindent 4 }}
data:
  # ── Broker entrypoint ────────────────────────────────────────────────────
  # server.properties is GENERATED at start-up rather than shipped, because
  # advertised.listeners has to name the pod that is actually running — a
  # StatefulSet ordinal is only knowable from inside the pod. The generated
  # file lands under /tmp (an emptyDir), which is what lets the image
  # filesystem stay read-only.
  kafka-entrypoint.sh: |
    #!/bin/sh
    set -eu

    ORDINAL="${POD_NAME##*-}"
    FQDN="${POD_NAME}.{{ $headless }}.{{ $ns }}.svc.{{ $domain }}"
    CFG_DIR=/tmp/kafka-config
    CFG="${CFG_DIR}/server.properties"
    mkdir -p "${CFG_DIR}"

    # ---- listeners -------------------------------------------------------
    LISTENERS=""
    ADVERTISED=""
    PROTO_MAP=""
    INTER_BROKER=""
    {{- if $l.plaintext.enabled }}
    LISTENERS="PLAINTEXT://0.0.0.0:{{ $l.plaintext.port }}"
    ADVERTISED="PLAINTEXT://${FQDN}:{{ $l.plaintext.port }}"
    PROTO_MAP="PLAINTEXT:PLAINTEXT"
    INTER_BROKER="PLAINTEXT"
    {{- end }}
    {{- if $l.sasl.enabled }}
    # `if` blocks rather than `[ ... ] && x=y`: under `set -e` a trailing
    # AND-list whose test fails is an exit status of 1, and whether that kills
    # the script is shell-dependent. Not worth finding out in production.
    if [ -n "${LISTENERS}" ]; then LISTENERS="${LISTENERS},"; fi
    if [ -n "${ADVERTISED}" ]; then ADVERTISED="${ADVERTISED},"; fi
    if [ -n "${PROTO_MAP}" ]; then PROTO_MAP="${PROTO_MAP},"; fi
    LISTENERS="${LISTENERS}SASL_PLAINTEXT://0.0.0.0:{{ $l.sasl.port }}"
    ADVERTISED="${ADVERTISED}SASL_PLAINTEXT://${FQDN}:{{ $l.sasl.port }}"
    PROTO_MAP="${PROTO_MAP}SASL_PLAINTEXT:SASL_PLAINTEXT"
    if [ -z "${INTER_BROKER}" ]; then INTER_BROKER="SASL_PLAINTEXT"; fi
    {{- end }}

    {
      echo "# generated by the legacy-kafka chart at $(date -u +%FT%TZ) — do not edit"
      echo "log.dirs={{ $k.logDir }}"
      echo "advertised.listeners=${ADVERTISED}"
      echo "inter.broker.listener.name=${INTER_BROKER}"
      echo "num.partitions=3"
      echo "offsets.topic.replication.factor={{ $k.replicationFactor }}"
      echo "transaction.state.log.replication.factor={{ $k.replicationFactor }}"
      echo "transaction.state.log.min.isr={{ $k.replicationFactor }}"
      echo "default.replication.factor={{ $k.replicationFactor }}"
      echo "group.initial.rebalance.delay.ms=0"
      echo "auto.create.topics.enable=false"
    {{- if eq (include "legacy-kafka.mode" .) "kraft" }}
      # ---- KRaft ---------------------------------------------------------
      # Combined broker+controller. The controller listener is never
      # advertised: peers reach it through the quorum voter list below.
      echo "process.roles=broker,controller"
      echo "node.id=${ORDINAL}"
      echo "controller.listener.names=CONTROLLER"
      echo "listener.security.protocol.map=${PROTO_MAP},CONTROLLER:PLAINTEXT"
      echo "listeners=${LISTENERS},CONTROLLER://0.0.0.0:9093"
      echo "controller.quorum.voters={{ range $i := until (int $k.replicas) }}{{ if $i }},{{ end }}{{ $i }}@{{ $fullname }}-{{ $i }}.{{ $headless }}.{{ $ns }}.svc.{{ $domain }}:9093{{ end }}"
    {{- else }}
      # ---- ZooKeeper -----------------------------------------------------
      echo "broker.id=${ORDINAL}"
      echo "listeners=${LISTENERS}"
      echo "listener.security.protocol.map=${PROTO_MAP}"
      echo "zookeeper.connect={{ $zkSvc }}.{{ $ns }}.svc.{{ $domain }}:2181"
      echo "zookeeper.connection.timeout.ms=18000"
    {{- end }}
    {{- if $l.sasl.enabled }}
      echo "sasl.enabled.mechanisms=PLAIN"
      echo "sasl.mechanism.inter.broker.protocol=PLAIN"
    {{- end }}
    {{- range $key, $value := $k.config }}
      echo {{ printf "%s=%v" $key $value | quote }}
    {{- end }}
    } > "${CFG}"

    {{- if $l.sasl.enabled }}
    # The JAAS line carries passwords, so it lives in a Secret and is appended
    # here rather than baked into this ConfigMap.
    cat /etc/kafka-jaas/jaas.properties >> "${CFG}"
    {{- end }}

    echo "─── effective server.properties ───"
    grep -v 'password' "${CFG}" || true
    echo "───────────────────────────────────"

    {{- if eq (include "legacy-kafka.mode" .) "kraft" }}
    # Formatting is idempotent with --ignore-formatted, so this is safe on
    # every restart, including after a PVC survives one.
    /opt/kafka/bin/kafka-storage.sh format \
      -t "{{ $k.clusterId }}" -c "${CFG}" --ignore-formatted
    {{- end }}

    exec /opt/kafka/bin/kafka-server-start.sh "${CFG}"

  {{- if eq (include "legacy-kafka.mode" .) "zookeeper" }}
  # ── ZooKeeper entrypoint ─────────────────────────────────────────────────
  # Runs from the broker image: the Kafka tarball ships ZooKeeper, so there is
  # no second image to pin and no way for the two to drift apart.
  zookeeper-entrypoint.sh: |
    #!/bin/sh
    set -eu

    ORDINAL="${POD_NAME##*-}"
    CFG_DIR=/tmp/zk-config
    CFG="${CFG_DIR}/zookeeper.properties"
    mkdir -p "${CFG_DIR}" "{{ .Values.zookeeper.dataDir }}"

    # myid must match the server.N index, and N is the ordinal + 1.
    echo "$((ORDINAL + 1))" > "{{ .Values.zookeeper.dataDir }}/myid"

    {
      echo "dataDir={{ .Values.zookeeper.dataDir }}"
      echo "clientPort=2181"
      echo "tickTime=2000"
      echo "initLimit=10"
      echo "syncLimit=5"
      echo "maxClientCnxns=0"
      echo "admin.enableServer=false"
      echo "4lw.commands.whitelist=srvr,ruok,mntr,stat"
      {{- if gt (int .Values.zookeeper.replicas) 1 }}
      {{- range $i := until (int .Values.zookeeper.replicas) }}
      echo "server.{{ add $i 1 }}={{ $fullname }}-zookeeper-{{ $i }}.{{ $zkSvc }}.{{ $ns }}.svc.{{ $domain }}:2888:3888"
      {{- end }}
      {{- end }}
    } > "${CFG}"

    exec /opt/kafka/bin/zookeeper-server-start.sh "${CFG}"
  {{- end }}

  # ── Topic creation (post-install Job) ────────────────────────────────────
  # Uses the cluster's OWN client, which for a 2.x broker is the only client
  # guaranteed to work: a 4.x kafka-topics.sh would hit the KIP-896 floor.
  create-topics.sh: |
    #!/bin/sh
    set -eu
    BOOTSTRAP="{{ include "legacy-kafka.bootstrapAddress" . }}"

    echo "Waiting for ${BOOTSTRAP} to answer..."
    i=0
    until /opt/kafka/bin/kafka-broker-api-versions.sh \
            --bootstrap-server "${BOOTSTRAP}" {{ include "legacy-kafka.clientConfigArg" . }} >/dev/null 2>&1; do
      i=$((i + 1))
      if [ "$i" -gt 60 ]; then
        echo "❌ broker never became reachable at ${BOOTSTRAP}"
        exit 1
      fi
      sleep 5
    done
    echo "✅ broker reachable"

    {{- range .Values.topics }}
    echo "→ topic {{ .name }} (partitions={{ .partitions | default 1 }} rf={{ .replicationFactor | default 1 }})"
    /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${BOOTSTRAP}" {{ include "legacy-kafka.clientConfigArg" $ }} \
      --create --if-not-exists \
      --topic {{ .name | quote }} \
      --partitions {{ .partitions | default 1 }} \
      --replication-factor {{ .replicationFactor | default 1 }}{{ range $ck, $cv := .config }} \
      --config {{ printf "%s=%v" $ck $cv | quote }}{{ end }}
    {{- end }}

    echo "─── topics now on the source ───"
    /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${BOOTSTRAP}" {{ include "legacy-kafka.clientConfigArg" . }} --list
