{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cdc-postgresql.fullname" . }}
  labels:
    {{- include "cdc-postgresql.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cdc-postgresql.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # The chart's own Helm test.
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: test
        {{- if not (or .Values.networkPolicy.allowNamespaces .Values.networkPolicy.allowPods) }}
        - namespaceSelector: {}
        {{- end }}
        {{- range .Values.networkPolicy.allowNamespaces }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
        {{- range .Values.networkPolicy.allowPods }}
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - port: postgres
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cdc-postgresql.fullname" . }}-test
  labels:
    {{- include "cdc-postgresql.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: test
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              {{- include "cdc-postgresql.selectorLabels" . | nindent 14 }}
      ports:
        - port: postgres
          protocol: TCP
{{- end }}
