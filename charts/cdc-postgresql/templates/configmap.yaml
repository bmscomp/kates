apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cdc-postgresql.fullname" . }}-init
  labels:
    {{- include "cdc-postgresql.labels" . | nindent 4 }}
data:
  # Runs once, on an empty data directory. Owning the database lets Debezium
  # create its publication; REPLICATION lets it open a replication slot.
  10-cdc-user.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 --username postgres --dbname "$POSTGRES_DB" \
      -v db="$POSTGRES_DB" -v user="$CDC_USER" -v password="$CDC_PASSWORD" <<'SQL'
    CREATE ROLE :"user" WITH LOGIN REPLICATION PASSWORD :'password';
    ALTER DATABASE :"db" OWNER TO :"user";
    SQL
