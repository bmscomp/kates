apiVersion: v1
kind: Service
metadata:
  name: {{ include "cdc-postgresql.fullname" . }}
  labels:
    {{- include "cdc-postgresql.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cdc-postgresql.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
