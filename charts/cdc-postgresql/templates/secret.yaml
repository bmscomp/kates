apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cdc-postgresql.fullname" . }}
  labels:
    {{- include "cdc-postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "auth.postgresPassword is required" .Values.auth.postgresPassword | quote }}
  password: {{ required "auth.password is required" .Values.auth.password | quote }}
