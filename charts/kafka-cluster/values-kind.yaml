# Kind cluster overlay — layers on top of values-detected.yaml
# Usage: helm upgrade --install ... -f .build/values-detected.yaml -f values-kind.yaml
#
# This file contains ONLY environment-specific feature flags.
# Pool definitions, storage classes, and resource sizes are generated
# by `kates detect` and written to .build/values-detected.yaml — no
# hardcoding needed here.

# Simplify Kafka listeners for local access — no external nodeport
kafka:
  metadataVersion: 3.7-IV4
  listeners:
    - name: plain
      port: 9092
      type: internal
      tls: false
      authentication:
        type: scram-sha-512
    - name: tls
      port: 9093
      type: internal
      tls: true
      authentication:
        type: tls

# Disable production features not needed locally
kafkaExporter:
  enabled: false

cruiseControl:
  enabled: false

networkPolicies:
  enabled: false

tieredStorage:
  enabled: false

backup:
  enabled: false

drainCleaner:
  enabled: false

alerts:
  enabled: false

podMonitors:
  enabled: false

dashboards:
  enabled: false

rebalance:
  enabled: false

podSecurityPolicy:
  enabled: false

# Disable CRD upgrade hook — Strimzi operator chart handles this
crdUpgrade:
  enabled: false

# ── Entity Operator — Kind tuning ────────────────────────────────────────────
# On Kind all Kafka pods compete for the same node resources.
# Smaller requests get the EO scheduled faster; 10s reconciliation interval
# means KafkaTopic/KafkaUser resources are acted on almost immediately
# instead of waiting up to 60 s (production default).
entityOperator:
  topicOperator:
    reconciliationIntervalMs: 10000
    jvmOptions:
      -Xms: 64m
      -Xmx: 128m
    resources:
      requests:
        memory: 96Mi
        cpu: 50m
      limits:
        memory: 192Mi
        cpu: 200m
  userOperator:
    reconciliationIntervalMs: 10000
    jvmOptions:
      -Xms: 64m
      -Xmx: 128m
    resources:
      requests:
        memory: 96Mi
        cpu: 50m
      limits:
        memory: 192Mi
        cpu: 200m
