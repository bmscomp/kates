# Kind overlay — layered over the detected values (.build/values-detected.yaml
# from `kates detect`) or values-dev.yaml.
#
# Environment flags only: node pools, storage classes and sizes come from the
# layer below. The Strimzi CRDs, the drain cleaner and the dashboards are the
# strimzi-operator chart's.

# Internal listeners only: no NodePort on a laptop, whatever the layer below
# declares.
kafka:
  metadataVersion: 4.2-IV1
  listeners:
    - name: plain
      port: 9092
      type: internal
      tls: false
      authentication:
        type: scram-sha-512
    - name: tls
      port: 9093
      type: internal
      tls: true
      authentication:
        type: tls
  externalAccess:
    type: none

kafkaExporter:
  enabled: false

cruiseControl:
  enabled: false

networkPolicy:
  enabled: false

tieredStorage:
  enabled: false

backup:
  enabled: false

# Scrape and rules are deliberately NOT held off here. A PodMonitor and a
# PrometheusRule cost nothing on a laptop, the chart renders them only where
# the monitoring.coreos.com API exists, and this overlay switching them off
# is what left every board `kates deploy` installs with nothing to show.

rebalance:
  enabled: false

kyvernoPolicy:
  enabled: false

# ── Entity Operator — Kind tuning ────────────────────────────────────────────
# All Kafka pods compete for the same nodes: smaller requests schedule the
# entity operator sooner, and a 10 s reconciliation acts on KafkaTopic and
# KafkaUser changes almost at once (the production default is 60 s).
entityOperator:
  topicOperator:
    reconciliationIntervalMs: 10000
    jvmOptions:
      -Xms: 64m
      -Xmx: 128m
    resources:
      requests:
        memory: 96Mi
        cpu: 50m
      limits:
        memory: 192Mi
        cpu: 200m
  userOperator:
    reconciliationIntervalMs: 10000
    jvmOptions:
      -Xms: 64m
      -Xmx: 128m
    resources:
      requests:
        memory: 96Mi
        cpu: 50m
      limits:
        memory: 192Mi
        cpu: 200m
