# Additional cluster — a second (third, …) Kafka cluster beside the primary,
# usually on another Kafka version, to migrate to or from.
#
#   helm upgrade --install krafter-42 charts/kafka-cluster \
#     -n kafka-krafter-42 --create-namespace \
#     -f charts/kafka-cluster/values-kind.yaml \
#     -f charts/kafka-cluster/values-additional.yaml \
#     --set clusterName=krafter-42 --set kafkaVersion=4.2.1 \
#     --set kafka.metadataVersion=4.2 \
#     --set networkPolicy.operatorNamespace=<the operator that reconciles it>
#
# SHARING A NAMESPACE. Every resource the chart names carries clusterName, so
# two clusters can share one — except the node pools, whose names are the
# pools' identity. Give each cluster its own pool names
# (nodePools.pools[].name) if you install this next to another cluster.
#
# WHAT IS SHARED is not here any more: the Strimzi CRDs, the drain cleaner,
# the operator's NetworkPolicy and the dashboards belong to the strimzi-operator
# chart, once per operator.
#
# SIZING. One controller, one broker, replication factor 1: an additional
# cluster exists to be migrated to or from, not to be durable, and two
# three-zone clusters do not fit a laptop. Cruise Control, the exporter and
# the rebalance templates are pointless on one broker and off.
#
# USERS AND TOPICS. The platform profile gives this cluster the platform's
# users (kates-mm2 on both ends is what a migration needs); its topics are off,
# because a migration lab creates its own corpus on the source. Set
# networkPolicy.operatorNamespace to the operator that reconciles this cluster
# (the primary's strimzi-operator, or this namespace for a co-located one).

profile: platform

# Clears the 0.4-shaped pools a lower layer (kates detect) may carry.
controllerPools: []
brokerPools: []

nodePools:
  defaults:
    volume:
      deleteClaim: true
    scheduling:
      spread:
        enabled: false
      antiAffinity:
        enabled: false
  roleDefaults:
    controller:
      replicas: 1
      storage:
        volumes:
          - id: 0
            size: 1Gi
      jvmOptions:
        -Xms: 256m
        -Xmx: 256m
        gcLoggingEnabled: false
      resources:
        requests: { memory: 512Mi, cpu: 250m }
        limits: { memory: 512Mi, cpu: 500m }
    broker:
      replicas: 1
      storage:
        volumes:
          - id: 0
            size: 5Gi
      jvmOptions:
        -Xms: 512m
        -Xmx: 512m
        gcLoggingEnabled: false
      resources:
        requests: { memory: 1Gi, cpu: 250m }
        limits: { memory: 1Gi, cpu: 500m }
  pools:
    - name: controllers
      roles: [controller]
    - name: brokers
      roles: [broker]

kafka:
  config:
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
    transaction.state.log.min.isr: 1
    default.replication.factor: 1
    min.insync.replicas: 1

entityOperator:
  topicOperator:
    reconciliationIntervalMs: 10000
    jvmOptions:
      -Xms: 64m
      -Xmx: 128m
    resources:
      requests: { memory: 96Mi, cpu: 50m }
      limits: { memory: 192Mi, cpu: 200m }
  userOperator:
    reconciliationIntervalMs: 10000
    jvmOptions:
      -Xms: 64m
      -Xmx: 128m
    resources:
      requests: { memory: 96Mi, cpu: 50m }
      limits: { memory: 192Mi, cpu: 200m }

topics:
  enabled: false

kafkaExporter:
  enabled: false

cruiseControl:
  enabled: false

rebalance:
  enabled: false
