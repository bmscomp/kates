{{- /*
Velero: a daily Schedule and a pre-upgrade Backup of this cluster.

Objects: the Strimzi CRs, and the Secrets, ConfigMaps and PVC/PV objects
labelled strimzi.io/cluster=<cluster>. Velero applies labelSelector to every
included resource, so the selector names the cluster and nothing else.

Volume data (backup.volumes):
  fs-backup  every volume, file by file (Velero's node agent)
  snapshot   CSI snapshots (crash-consistent)
  none       objects only
With tiered storage active, broker-only pools' volumes are left out either way
(their PVCs carry velero.io/exclude-from-backup, their pods the fs-backup
exclusion): their closed segments are in object storage. Controller volumes,
which hold the metadata log, are always in.
*/ -}}
{{- $r := dict -}}
{{- $_ := include "kafka-cluster.resolve" (dict "ctx" . "out" $r) -}}
{{- $b := .Values.backup -}}
{{- if $b.enabled }}
{{- $cluster := include "kafka-cluster.clusterName" . -}}
{{- $veleroNs := $b.veleroNamespace | default "velero" -}}
{{- $spec := dict
      "includedNamespaces" (list (include "kafka-cluster.namespace" .))
      "includedResources" (list "persistentvolumeclaims" "persistentvolumes" "configmaps" "secrets" "kafkas.kafka.strimzi.io" "kafkanodepools.kafka.strimzi.io" "kafkatopics.kafka.strimzi.io" "kafkausers.kafka.strimzi.io" "kafkarebalances.kafka.strimzi.io")
      "labelSelector" (dict "matchExpressions" (list (dict "key" "strimzi.io/cluster" "operator" "In" "values" (list $cluster))))
      "snapshotVolumes" (eq $r.backupVolumes "snapshot")
      "defaultVolumesToFsBackup" (eq $r.backupVolumes "fs-backup")
      "storageLocation" ($b.storageLocation | default "default") -}}
{{- with $b.volumeSnapshotLocations }}{{- $_ := set $spec "volumeSnapshotLocations" . }}{{- end }}
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: {{ $cluster }}-daily-backup
  namespace: {{ $veleroNs }}
  labels:
    {{- include "kafka-cluster.componentLabels" (dict "ctx" . "component" "backup") | nindent 4 }}
  annotations:
    kates.io/volume-data: {{ $r.backupVolumes | quote }}
spec:
  schedule: {{ $b.schedule | quote }}
  useOwnerReferencesInBackup: false
  template:
    {{- toYaml (merge (dict "ttl" ($b.ttl | default "168h0m0s")) $spec) | nindent 4 }}
{{- if include "kafka-common.enabled" (list $b.preUpgrade true) }}
---
{{- /*
  A restore point taken before every upgrade, kept 30 days. A Backup is
  one-shot, so each upgrade gets its own name; Velero deletes it at expiry.
*/}}
apiVersion: velero.io/v1
kind: Backup
metadata:
  name: {{ printf "%s-pre-upgrade-r%d" $cluster .Release.Revision | trunc 63 | trimSuffix "-" }}
  namespace: {{ $veleroNs }}
  labels:
    {{- include "kafka-cluster.componentLabels" (dict "ctx" . "component" "backup") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
spec:
  {{- toYaml (merge (dict "ttl" "720h0m0s") $spec) | nindent 2 }}
{{- end }}
{{- if $b.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $cluster }}-backup-storage
  namespace: {{ include "kafka-cluster.namespace" . }}
  labels:
    {{- include "kafka-cluster.componentLabels" (dict "ctx" . "component" "backup") | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with $b.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $b.persistence.size | default "20Gi" }}
{{- end }}
{{- end }}
