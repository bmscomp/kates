{{- $r := dict -}}
{{- $_ := include "kafka-cluster.resolve" (dict "ctx" . "out" $r) -}}
{{- $v := .Values -}}
{{- $ts := $v.tieredStorage -}}
{{- $cc := include "kafka-common.enabled" (list $v.cruiseControl.enabled true) -}}
{{- $rebalance := and $cc (include "kafka-common.enabled" (list $v.rebalance.enabled true)) -}}

{{- /* spec.kafka.template: the chart's defaults, then kafka.template. */ -}}
{{- $ktpl := dict "kafkaContainer" (dict "securityContext" (include "kafka-cluster.containerSecurityContext" . | fromYaml)) -}}
{{- include "kafka-cluster.merge" (dict "dst" $ktpl "src" ($v.kafka.template | default dict)) -}}

{{- /* Tiered storage: the RSM config, with the SeaweedFS endpoint filled in. */ -}}
{{- $rsmConfig := dict -}}
{{- if $r.tiered -}}
{{- if $v.seaweedfs.enabled -}}
{{- $rsmConfig = dict
      "storage.s3.endpoint.url" (include "kafka-cluster.objectStoreEndpoint" .)
      "storage.s3.bucket.name" ($v.seaweedfs.buckets.tieredStorage | default "kafka-tiered-storage")
      "storage.s3.region" ($v.seaweedfs.s3.region | default "us-east-1")
      "storage.s3.path.style.access.enabled" "true" -}}
{{- end -}}
{{- include "kafka-cluster.merge" (dict "dst" $rsmConfig "src" $r.legacyRsmConfig) -}}
{{- include "kafka-cluster.merge" (dict "dst" $rsmConfig "src" ((($ts.remoteStorageManager).config) | default dict)) -}}
{{- end -}}
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ include "kafka-cluster.clusterName" . }}
  namespace: {{ include "kafka-cluster.namespace" . }}
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
  annotations:
    # Deleting the Kafka CR deletes the cluster.
    helm.sh/resource-policy: keep
spec:
  kafka:
    version: {{ $v.kafkaVersion | quote }}
    {{- with $v.kafka.metadataVersion }}
    metadataVersion: {{ . | quote }}
    {{- end }}
    {{- if $r.tiered }}
    image: {{ $ts.image }}
    {{- else if $v.kafka.image }}
    image: {{ $v.kafka.image }}
    {{- end }}
    listeners:
      {{- toYaml $r.listeners | nindent 6 }}
    {{- with $v.kafka.authorization }}
    authorization:
      {{- $authz := omit . "superUsers" }}
      {{- if $r.superUsers }}{{- $_ := set $authz "superUsers" $r.superUsers }}{{- end }}
      {{- toYaml $authz | nindent 6 }}
    {{- end }}
    config:
      {{- include "kafka-cluster.kafkaConfig" (dict "ctx" . "r" $r) | trim | nindent 6 }}
    {{- with $v.kafka.quotas }}
    quotas:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if $r.tiered }}
    tieredStorage:
      type: custom
      remoteStorageManager:
        className: {{ $ts.remoteStorageManager.className }}
        classPath: {{ $ts.remoteStorageManager.classPath | quote }}
        {{- with $rsmConfig }}
        config:
          {{- range $k, $val := . }}
          {{ $k }}: {{ include "kafka-cluster.scalar" $val | quote }}
          {{- end }}
        {{- end }}
    {{- end }}
    {{- if $r.metrics.enabled }}
    metricsConfig:
      {{- if eq $r.metrics.type "strimziMetricsReporter" }}
      type: strimziMetricsReporter
      {{- with $r.metrics.allowList }}
      values:
        allowList:
          {{- toYaml . | nindent 10 }}
      {{- end }}
      {{- else }}
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: {{ include "kafka-cluster.metricsConfigMap" . }}
          key: kafka-metrics-config.yml
      {{- end }}
    {{- end }}
    {{- with $v.kafka.rack }}
    rack:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- range $key := (list "logging" "jmxOptions" "livenessProbe" "readinessProbe") }}
    {{- with (index $v.kafka $key) }}
    {{ $key }}:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- end }}
    template:
      {{- toYaml $ktpl | nindent 6 }}
  {{- with $v.kafka.clusterCa }}
  clusterCa:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $v.kafka.clientsCa }}
  clientsCa:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $v.maintenanceTimeWindows }}
  maintenanceTimeWindows:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  entityOperator:
    topicOperator:
      {{- toYaml ($v.entityOperator.topicOperator | default dict) | nindent 6 }}
    userOperator:
      {{- toYaml ($v.entityOperator.userOperator | default dict) | nindent 6 }}
    {{- with $v.entityOperator.template }}
    template:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- if include "kafka-common.enabled" (list $v.kafkaExporter.enabled true) }}
  kafkaExporter:
    {{- $ke := omit $v.kafkaExporter "enabled" }}
    {{- range $k, $val := $ke }}{{- if not $val }}{{- $_ := unset $ke $k }}{{- end }}{{- end }}
    {{- toYaml $ke | nindent 4 }}
  {{- end }}
  {{- if $cc }}
  cruiseControl:
    {{- with $v.cruiseControl.brokerCapacity }}
    brokerCapacity:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $v.cruiseControl.autoRebalance }}
    autoRebalance:
      {{- range . }}
      - mode: {{ .mode }}
        {{- if (.template).name }}
        template:
          name: {{ .template.name }}
        {{- else if $rebalance }}
        template:
          name: {{ include "kafka-cluster.resourceName" (list $ (printf "%s-template" .mode) "") }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- with $v.cruiseControl.config }}
    config:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- range $key := (list "resources" "apiUsers" "template" "image" "jvmOptions" "logging" "livenessProbe" "readinessProbe") }}
    {{- with (index $v.cruiseControl $key) }}
    {{ $key }}:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- end }}
    {{- if $r.metrics.enabled }}
    {{- /* Cruise Control keeps the JMX exporter and its own rule set. */}}
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: {{ include "kafka-cluster.ccMetricsConfigMap" . }}
          key: metrics-config.yml
    {{- end }}
  {{- end }}
