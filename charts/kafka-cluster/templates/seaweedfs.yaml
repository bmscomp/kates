{{- /*
SeaweedFS: the S3-compatible object store for tiered storage and Velero.

The subchart names its Services after itself (<nameOverride|seaweedfs>-filer,
-s3), not after this release, so the endpoint is computed from that naming and
published once, in <cluster>-object-store, for anything else that needs it.
Only one release per namespace can enable the subchart.
*/ -}}
{{- if .Values.seaweedfs.enabled }}
{{- $s3 := .Values.seaweedfs.s3 -}}
{{- if not $s3.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kafka-cluster.objectStoreSecret" . }}
  namespace: {{ include "kafka-cluster.namespace" . }}
  labels:
    {{- include "kafka-cluster.componentLabels" (dict "ctx" . "component" "object-store") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ $s3.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $s3.secretAccessKey | quote }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kafka-cluster.resourceName" (list . "object-store" "kafka-seaweedfs-config") }}
  namespace: {{ include "kafka-cluster.namespace" . }}
  labels:
    {{- include "kafka-cluster.componentLabels" (dict "ctx" . "component" "object-store") | nindent 4 }}
data:
  endpoint: {{ include "kafka-cluster.objectStoreEndpoint" . | quote }}
  region: {{ $s3.region | quote }}
  credentials-secret: {{ include "kafka-cluster.objectStoreSecret" . | quote }}
  tiered-storage-bucket: {{ .Values.seaweedfs.buckets.tieredStorage | quote }}
  velero-bucket: {{ .Values.seaweedfs.buckets.velero | quote }}
{{- end }}
