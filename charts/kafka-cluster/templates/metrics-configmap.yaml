{{- /*
The JMX exporter rule sets: Strimzi's own, vendored unchanged in files/metrics
(scripts/check-strimzi-metrics.sh keeps them that way). The operator's
dashboards read exactly the series these produce. Cruise Control has its own
MBeans and its own, much shorter, rule set.
*/ -}}
{{- $r := dict -}}
{{- $_ := include "kafka-cluster.resolve" (dict "ctx" . "out" $r) -}}
{{- if and $r.metrics.enabled (eq $r.metrics.type "jmxPrometheusExporter") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kafka-cluster.metricsConfigMap" . }}
  namespace: {{ include "kafka-cluster.namespace" . }}
  labels:
    {{- include "kafka-cluster.componentLabels" (dict "ctx" . "component" "metrics") | nindent 4 }}
data:
  kafka-metrics-config.yml: |
    {{- .Files.Get "files/metrics/kafka-metrics.yaml" | nindent 4 }}
{{- end }}
{{- if and $r.metrics.enabled (include "kafka-common.enabled" (list .Values.cruiseControl.enabled true)) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kafka-cluster.ccMetricsConfigMap" . }}
  namespace: {{ include "kafka-cluster.namespace" . }}
  labels:
    {{- include "kafka-cluster.componentLabels" (dict "ctx" . "component" "metrics") | nindent 4 }}
data:
  metrics-config.yml: |
    {{- .Files.Get "files/metrics/cruise-control-metrics.yaml" | nindent 4 }}
{{- end }}
