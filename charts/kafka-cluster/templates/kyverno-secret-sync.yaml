{{- if .Values.secretSync.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sync-kafka-users
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Sync Kafka User Secrets
    policies.kyverno.io/category: Secrets Management
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Automatically clones KafkaUser credential secrets from the Kafka namespace
      into their respective component namespaces, keeping them in sync.
spec:
  rules:
    - name: sync-kates-backend
      match:
        any:
          - resources:
              kinds: ["Secret"]
              names: ["kates-backend"]
              namespaces: [{{ .Release.Namespace | quote }}]
      generate:
        apiVersion: v1
        kind: Secret
        name: kates-backend
        namespace: {{ .Values.secretSync.namespaces.katesBackend | default "kates" | quote }}
        synchronize: true
        clone:
          namespace: {{ .Release.Namespace | quote }}
          name: kates-backend

    - name: sync-kates-connect
      match:
        any:
          - resources:
              kinds: ["Secret"]
              names: ["kates-connect"]
              namespaces: [{{ .Release.Namespace | quote }}]
      generate:
        apiVersion: v1
        kind: Secret
        name: kates-connect
        namespace: {{ .Values.secretSync.namespaces.katesConnect | default "connect" | quote }}
        synchronize: true
        clone:
          namespace: {{ .Release.Namespace | quote }}
          name: kates-connect

    - name: sync-kafka-ui
      match:
        any:
          - resources:
              kinds: ["Secret"]
              names: ["kafka-ui"]
              namespaces: [{{ .Release.Namespace | quote }}]
      generate:
        apiVersion: v1
        kind: Secret
        name: kafka-ui
        namespace: {{ .Values.secretSync.namespaces.kafkaUI | default "kafka-ui" | quote }}
        synchronize: true
        clone:
          namespace: {{ .Release.Namespace | quote }}
          name: kafka-ui
{{- end }}
