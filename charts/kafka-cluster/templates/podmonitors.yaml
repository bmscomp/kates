{{- /*
One PodMonitor per component of THIS cluster, each selecting on
strimzi.io/cluster plus the component's strimzi.io/name, with the relabelings
Strimzi's dashboards expect (strimzi_io_cluster, namespace,
kubernetes_pod_name, …). 0.4 selected operator pods in this namespace, where
the operator does not run, and the Connect and MirrorMaker 2 pods, which their
own charts scrape. The operator's PodMonitor is the strimzi-operator chart's.
*/ -}}
{{- $r := dict -}}
{{- $_ := include "kafka-cluster.resolve" (dict "ctx" . "out" $r) -}}
{{- if and $r.podMonitor.enabled $r.metrics.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
{{- $v := .Values -}}
{{- $cluster := include "kafka-cluster.clusterName" . -}}
{{- $ns := include "kafka-cluster.namespace" . -}}
{{- $pm := $r.podMonitor -}}
{{- $labels := include "kafka-cluster.componentLabels" (dict "ctx" . "component" "monitoring") | fromYaml -}}
{{- include "kafka-cluster.merge" (dict "dst" $labels "src" ($pm.labels | default dict)) -}}
{{- $relabel := include "kafka-common.strimziRelabelings" . | fromYamlArray -}}
{{- $components := list (list "kafka" "kafka" "tcp-prometheus" "kafka-resources-metrics") -}}
{{- if include "kafka-common.enabled" (list $v.cruiseControl.enabled true) }}{{- $components = append $components (list "cruise-control" "cruise-control" "tcp-prometheus" "") }}{{- end -}}
{{- if include "kafka-common.enabled" (list $v.kafkaExporter.enabled true) }}{{- $components = append $components (list "kafka-exporter" "kafka-exporter" "tcp-prometheus" "") }}{{- end -}}
{{- range $c := $components }}
---
{{ include "kafka-common.podMonitor" (dict
      "name" (include "kafka-cluster.resourceName" (list $ (index $c 0) (index $c 3)))
      "namespace" $ns
      "labels" (toYaml $labels)
      "selector" (dict "strimzi.io/cluster" $cluster "strimzi.io/name" (printf "%s-%s" $cluster (index $c 1)))
      "namespaces" (list $ns)
      "endpoint" (dict "port" (index $c 2) "interval" $pm.interval "scrapeTimeout" $pm.scrapeTimeout "relabelings" $relabel)) }}
{{- end }}
---
{{- /* The entity operator exposes each operator's metrics on its health port. */}}
{{ include "kafka-common.podMonitor" (dict
      "name" (include "kafka-cluster.resourceName" (list . "entity-operator" ""))
      "namespace" $ns
      "labels" (toYaml $labels)
      "selector" (dict "strimzi.io/cluster" $cluster "strimzi.io/name" (printf "%s-entity-operator" $cluster))
      "namespaces" (list $ns)
      "endpoints" (list
        (dict "port" "healthcheck-to" "interval" $pm.interval "scrapeTimeout" $pm.scrapeTimeout "relabelings" $relabel)
        (dict "port" "healthcheck-uo" "interval" $pm.interval "scrapeTimeout" $pm.scrapeTimeout "relabelings" $relabel))) }}
{{- end }}
