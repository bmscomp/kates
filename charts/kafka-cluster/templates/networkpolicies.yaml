{{- /*
NetworkPolicies for THIS cluster's pods.

  <cluster>-default-deny      everything the rules below do not allow
  <cluster>-allow-dns         DNS egress
  <cluster>-kafka             brokers and controllers: the quorum, the
                              operator, the declared clients, external
                              listeners, metrics
  <cluster>-cruise-control    <cluster>-entity-operator    <cluster>-kafka-exporter

Broker ports come from kafka.listeners, by listener name, so a custom listener
is reachable by the clients that name it. Policies are additive: Strimzi's own
generated policies (STRIMZI_NETWORK_POLICY_GENERATION) still apply beside
these. The Connect, MirrorMaker 2, Kafka UI and operator pods are selected by
their own charts' policies, not here.
*/ -}}
{{- $r := dict -}}
{{- $_ := include "kafka-cluster.resolve" (dict "ctx" . "out" $r) -}}
{{- $np := $r.netpol -}}
{{- if $np.enabled }}
{{- $cluster := include "kafka-cluster.clusterName" . -}}
{{- $ns := include "kafka-cluster.namespace" . -}}
{{- $monNs := ($np.monitoring).namespace | default "monitoring" -}}
{{- $opNs := $np.operatorNamespace | default "strimzi-operator" -}}
{{- $partOf := dict "app.kubernetes.io/part-of" (printf "strimzi-%s" $cluster) -}}
{{- $clusterPods := dict "podSelector" (dict "matchLabels" (dict "strimzi.io/cluster" $cluster)) -}}
{{- $operator := dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" $opNs)) "podSelector" (dict "matchLabels" (dict "strimzi.io/kind" "cluster-operator")) -}}
{{- $monitoring := dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" $monNs)) -}}
{{- $apiServer := include "kafka-common.netpol.apiServerEgress" (dict "ports" (($np.apiServer).ports) "ipBlock" (($np.apiServer).ipBlock)) | fromYamlArray -}}
{{- $listenerPorts := list -}}
{{- range $r.listeners }}{{- $listenerPorts = append $listenerPorts (int .port) }}{{- end -}}
{{- if $np.defaultDenyEnabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kafka-cluster.resourceName" (list . "default-deny" "default-deny") }}
  namespace: {{ $ns }}
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml ((($np.defaultDeny).selector) | default $partOf) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
{{- end }}
{{- if $np.dnsEnabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kafka-cluster.resourceName" (list . "allow-dns" "allow-dns") }}
  namespace: {{ $ns }}
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml ((($np.dns).selector) | default $partOf) | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- include "kafka-common.netpol.dnsEgress" (dict "namespaceSelector" ((($np.dns).to).namespaceSelector) "podSelector" ((($np.dns).to).podSelector)) | nindent 4 }}
{{- end }}
---
{{- /* Brokers and controllers */}}
{{- $ingress := list -}}
{{- /* The quorum, replication and the cluster's own operands (entity operator, Cruise Control, exporter use 9091). */ -}}
{{- $ingress = append $ingress (dict "from" (list $clusterPods) "ports" (include "kafka-cluster.tcpPorts" (concat (list 9090 9091) $listenerPorts) | fromYamlArray)) -}}
{{- /* The Cluster Operator: control plane, replication (admin client), the Kafka agent, and every listener. */ -}}
{{- $ingress = append $ingress (dict "from" (list $operator) "ports" (include "kafka-cluster.tcpPorts" (concat (list 9090 9091 8443) $listenerPorts) | fromYamlArray)) -}}
{{- /* Declared clients */ -}}
{{- range $np.resolvedClients -}}
{{- if .ports -}}
{{- $peer := dict "podSelector" (dict "matchLabels" .podSelector) -}}
{{- if ne .namespace $ns -}}
{{- $_ := set $peer "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" .namespace)) -}}
{{- end -}}
{{- $ingress = append $ingress (dict "from" (list $peer) "ports" (include "kafka-cluster.tcpPorts" .ports | fromYamlArray)) -}}
{{- end -}}
{{- end -}}
{{- /* Helm-test and CLI pods in this namespace (kates.io/test-pod=true). */ -}}
{{- if $np.internalPorts -}}
{{- $ingress = append $ingress (dict "from" (list (dict "podSelector" (dict "matchLabels" (dict "kates.io/test-pod" "true")))) "ports" (include "kafka-cluster.tcpPorts" $np.internalPorts | fromYamlArray)) -}}
{{- end -}}
{{- /* External listeners: from anywhere, or from their allowed CIDRs. */ -}}
{{- $cidrs := (.Values.kafka.externalAccess).allowedCidrs | default list -}}
{{- $eaName := (.Values.kafka.externalAccess).name | default "external" -}}
{{- range $np.externalListeners -}}
{{- $rule := dict "ports" (include "kafka-cluster.tcpPorts" (list .port) | fromYamlArray) -}}
{{- if and $cidrs (eq .name $eaName) -}}
{{- $from := list -}}
{{- range $cidrs }}{{- $from = append $from (dict "ipBlock" (dict "cidr" .)) }}{{- end -}}
{{- $_ := set $rule "from" $from -}}
{{- end -}}
{{- $ingress = append $ingress $rule -}}
{{- end -}}
{{- $ingress = append $ingress (dict "from" (list $monitoring) "ports" (include "kafka-cluster.tcpPorts" (list 9404) | fromYamlArray)) -}}
{{- $ingress = concat $ingress ($np.extraIngress | default list) -}}
{{- $egress := list (dict "to" (list $clusterPods)) -}}
{{- $egress = concat $egress $apiServer -}}
{{- if $r.tiered -}}
{{- $tse := .Values.tieredStorage.egress | default dict -}}
{{- $rule := dict "ports" (include "kafka-cluster.tcpPorts" ($tse.ports | default (list 443)) | fromYamlArray) -}}
{{- with $tse.to }}{{- $_ := set $rule "to" . }}{{- end -}}
{{- $egress = append $egress $rule -}}
{{- end -}}
{{- $egress = concat $egress ($np.extraEgress | default list) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kafka-cluster.resourceName" (list . "kafka" "kafka-brokers") }}
  namespace: {{ $ns }}
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: {{ $cluster }}
      strimzi.io/name: {{ $cluster }}-kafka
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- toYaml $ingress | nindent 4 }}
  egress:
    {{- toYaml $egress | nindent 4 }}
{{- /* Operands */}}
{{- $operands := list -}}
{{- if include "kafka-common.enabled" (list .Values.cruiseControl.enabled true) -}}
{{- /* The operator drives Cruise Control over its REST API (9090). */ -}}
{{- $operands = append $operands (dict "name" "cruise-control" "legacy" "cruise-control" "ingress" (list (dict "from" (list $operator) "ports" (include "kafka-cluster.tcpPorts" (list 9090) | fromYamlArray)) (dict "from" (list $monitoring) "ports" (include "kafka-cluster.tcpPorts" (list 9404) | fromYamlArray)))) -}}
{{- end -}}
{{- $operands = append $operands (dict "name" "entity-operator" "legacy" "entity-operator" "ingress" (list (dict "from" (list $monitoring) "ports" (include "kafka-cluster.tcpPorts" (list 8080 8081) | fromYamlArray)))) -}}
{{- if include "kafka-common.enabled" (list .Values.kafkaExporter.enabled true) -}}
{{- $operands = append $operands (dict "name" "kafka-exporter" "legacy" "kafka-exporter" "ingress" (list (dict "from" (list $monitoring) "ports" (include "kafka-cluster.tcpPorts" (list 9404) | fromYamlArray)))) -}}
{{- end -}}
{{- range $operands }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kafka-cluster.resourceName" (list $ .name .legacy) }}
  namespace: {{ $ns }}
  labels:
    {{- include "kafka-cluster.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: {{ $cluster }}
      strimzi.io/name: {{ $cluster }}-{{ .name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- toYaml .ingress | nindent 4 }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $cluster }}
    {{- toYaml $apiServer | nindent 4 }}
{{- end }}
{{- end }}
