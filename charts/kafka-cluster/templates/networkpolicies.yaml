apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-connect
  namespace: {{ $namespace }}
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/kind: KafkaConnect
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Prometheus metrics scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9404
          protocol: TCP
    # Connect REST API (status & management from kates backend)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kates
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kates
      ports:
        - port: 8083
          protocol: TCP
  egress:
    # To Kafka brokers (SCRAM plain listener)
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/kind: Kafka
      ports:
        - port: 9092
          protocol: TCP
    # To Kubernetes API
    - to: []
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP

{{- end }}
