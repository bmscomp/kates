{{- if .Values.networkPolicies.enabled }}
{{- $clusterName := include "kafka-cluster.clusterName" . -}}
{{- $namespace := include "kafka-cluster.namespace" . -}}
{{- $monitoringNs := .Values.networkPolicies.monitoringNamespace -}}
{{- if .Values.networkPolicies.defaultDeny }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $namespace }}
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- .Values.networkPolicies.defaultDenySelector | toYaml | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
{{- end }}
{{- if .Values.networkPolicies.allowDNS }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ $namespace }}
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- .Values.networkPolicies.allowDNSSelector | toYaml | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-brokers
  namespace: {{ $namespace }}
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/kind: Kafka
      strimzi.io/cluster: {{ $clusterName }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $clusterName }}
      ports:
        - port: 9091
          protocol: TCP
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kates
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kates
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: litmus
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litmus
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kates
          podSelector:
            matchLabels:
              app: kafka-ui
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.apicurioNamespace | default .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: apicurio-registry
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.connectNamespace | default "connect" }}
          podSelector:
            matchLabels:
              strimzi.io/kind: KafkaConnect
      ports:
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kates
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kates
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: litmus
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litmus
      ports:
        - port: 9093
          protocol: TCP
    - from: []
      ports:
        - port: 9094
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9404
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.operatorNamespace | default .Release.Namespace }}
          podSelector:
            matchLabels:
              strimzi.io/kind: cluster-operator
      ports:
        - port: 9091
          protocol: TCP
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
        - port: 2181
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $clusterName }}
      ports:
        - port: 9090
          protocol: TCP
        - port: 9091
          protocol: TCP
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
    - to: []
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-controllers
  namespace: {{ $namespace }}
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/controller-role: "true"
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $clusterName }}
      ports:
        - port: 9090
          protocol: TCP
        - port: 9091
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $clusterName }}
    - to: []
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: strimzi-operator
  namespace: {{ .Values.networkPolicies.operatorNamespace | default "strimzi-operator" }}
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/kind: cluster-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Metrics from monitoring namespace + health probes from kubelet
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow API Server egress
    - to: []
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    # Allow egress to the target Kafka application namespace pods
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $clusterName }}
      ports:
        - port: 9091
          protocol: TCP
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
        - port: 2181
          protocol: TCP
    # Allow egress to Kafka Connect pods across all namespaces
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.connectNamespace | default "connect" }}
          podSelector:
            matchLabels:
              strimzi.io/kind: KafkaConnect
      ports:
        - port: 8083
          protocol: TCP
    # Allow egress to its own namespace pods
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.operatorNamespace | default .Release.Namespace }}
          podSelector:
            matchLabels:
              strimzi.io/kind: cluster-operator
{{- if .Values.networkPolicies.kafkaUI }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-ui
  namespace: {{ $namespace }}
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: kafka-ui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: []
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/kind: Kafka
      ports:
        - port: 9092
          protocol: TCP
    - to: []
      ports:
        - port: 443
          protocol: TCP
{{- end }}
