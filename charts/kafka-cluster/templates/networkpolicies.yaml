{{- if .Values.networkPolicies.enabled }}
{{- $clusterName := include "kafka-cluster.clusterName" . -}}
{{- $namespace := include "kafka-cluster.namespace" . -}}
{{- $monitoringNs := .Values.networkPolicies.monitoringNamespace -}}
{{- if .Values.networkPolicies.defaultDeny }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $namespace }}
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- .Values.networkPolicies.defaultDenySelector | toYaml | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
{{- end }}
{{- if .Values.networkPolicies.allowDNS }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ $namespace }}
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- .Values.networkPolicies.allowDNSSelector | toYaml | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-brokers
  namespace: {{ $namespace }}
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/kind: Kafka
      strimzi.io/cluster: {{ $clusterName }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $clusterName }}
      ports:
        - port: 9091
          protocol: TCP
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kates
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litmus
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: kafka-ui
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: apicurio-registry
      ports:
        - port: 9092
          protocol: TCP
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kates
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litmus
      ports:
        - port: 9093
          protocol: TCP
    - from: []
      ports:
        - port: 9094
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $monitoringNs }}
      ports:
        - port: 9404
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $clusterName }}
      ports:
        - port: 9090
          protocol: TCP
        - port: 9091
          protocol: TCP
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
    - to: []
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-controllers
  namespace: {{ $namespace }}
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/controller-role: "true"
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $clusterName }}
      ports:
        - port: 9090
          protocol: TCP
        - port: 9091
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $clusterName }}
    - to: []
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: strimzi-operator
  namespace: {{ .Values.networkPolicies.operatorNamespace | default "strimzi-operator" }}
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/kind: cluster-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP ingress to port 8080 (metrics & health probes) from all sources (including node kubelet)
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow API Server egress
    - to: []
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    # Allow egress to the target Kafka application namespace pods
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $namespace }}
    # Allow egress to its own namespace pods
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.operatorNamespace | default "strimzi-operator" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-ui
  namespace: {{ $namespace }}
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: kafka-ui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: []
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/kind: Kafka
      ports:
        - port: 9092
          protocol: TCP
    - to: []
      ports:
        - port: 443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cruise-control
  namespace: {{ $namespace }}
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/kind: Kafka
      strimzi.io/name: {{ $clusterName }}-cruise-control
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              strimzi.io/kind: cluster-operator
      ports:
        - port: 9090
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $monitoringNs }}
      ports:
        - port: 9404
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $clusterName }}
    - to: []
      ports:
        - port: 443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: strimzi-drain-cleaner
  namespace: {{ $namespace }}
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: strimzi-drain-cleaner
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: []
      ports:
        - port: 8443
          protocol: TCP
  egress:
    - to: []
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-connect
  namespace: {{ $namespace }}
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/name: {{ $clusterName }}-connect
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $monitoringNs }}
      ports:
        - port: 9404
          protocol: TCP
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kates
        - podSelector:
            matchLabels:
              strimzi.io/kind: cluster-operator
        {{- range .Values.networkPolicies.allowedClientNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: 8083
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/kind: Kafka
      ports:
        - port: 9092
          protocol: TCP
    # Egress to Apicurio Schema Registry (same namespace)
    - to:
        - podSelector:
            matchLabels:
              app: apicurio-registry
      ports:
        - port: 8080
          protocol: TCP
    # Egress to external databases (cross-namespace)
    {{- range (default (list) .Values.kafkaConnect.databaseEgress) }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          {{- with .podSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - port: {{ .port | default 5432 }}
          protocol: TCP
    {{- end }}
    - to: []
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-mirror-maker
  namespace: {{ $namespace }}
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/kind: KafkaMirrorMaker2
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $monitoringNs }}
      ports:
        - port: 9404
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/kind: Kafka
      ports:
        - port: 9092
          protocol: TCP
    - to: []
      ports:
        - port: 9092
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: entity-operator
  namespace: {{ $namespace }}
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/kind: Kafka
      strimzi.io/name: {{ $clusterName }}-entity-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $monitoringNs }}
      ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $clusterName }}
      ports:
        - port: 9091
          protocol: TCP
        - port: 9092
          protocol: TCP
    - to: []
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-exporter
  namespace: {{ $namespace }}
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/kind: Kafka
      strimzi.io/name: {{ $clusterName }}-kafka-exporter
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $monitoringNs }}
      ports:
        - port: 9404
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $clusterName }}
      ports:
        - port: 9092
          protocol: TCP
    - to: []
      ports:
        - port: 443
          protocol: TCP
{{- if and .Values.kafkaConnect.enabled .Values.kafkaConnect.databaseEgress }}
{{- range .Values.kafkaConnect.databaseEgress }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-connect-ingress
  namespace: {{ .namespace }}
  labels:
    {{- include "kafka-cluster.labels" $ | nindent 4 }}
spec:
  podSelector:
    {{- with .podSelector }}
    matchLabels:
      {{- toYaml . | nindent 6 }}
    {{- else }}
    matchLabels: {}
    {{- end }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $namespace }}
          podSelector:
            matchLabels:
              strimzi.io/name: {{ $clusterName }}-connect
      ports:
        - port: {{ .port | default 5432 }}
          protocol: TCP
{{- end }}
{{- end }}

{{- end }}
