{{- $r := dict -}}
{{- $_ := include "kafka-cluster.resolve" (dict "ctx" . "out" $r) -}}
{{- $testUser := include "kafka-cluster.testUser" . -}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "kafka-cluster.clusterName" . }}-test-metrics"
  namespace: {{ include "kafka-cluster.namespace" . }}
  labels:
    {{- /* strimzi.io/cluster comes from kafka-cluster.labels — do not repeat it */}}
    {{- include "kafka-cluster.labels" . | nindent 4 }}
    kates.io/test-pod: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "9"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  serviceAccountName: {{ include "kafka-cluster.clusterName" . }}-admin
  restartPolicy: Never
  securityContext:
    {{- include "kafka-cluster.podSecurityContext" . | nindent 4 }}
  containers:
    - name: metrics-check
      image: {{ include "kafka-cluster.kubectlImage" $ }}
      {{- include "kafka-common.imagePullPolicy" .Values.testImages.pullPolicy | nindent 6 }}
      command: ["sh", "-c"]
      args:
        - |
          set -e
          CLUSTER="{{ include "kafka-cluster.clusterName" . }}"
          NAMESPACE="{{ include "kafka-cluster.namespace" . }}"

          echo "=== Tier 9: Metrics & Exporter Pipeline ==="

          {{- if and $r.metrics.enabled (eq $r.metrics.type "jmxPrometheusExporter") }}
          CM="{{ include "kafka-cluster.metricsConfigMap" . }}"
          echo "Checking the $CM ConfigMap..."
          if kubectl get configmap "$CM" -n $NAMESPACE > /dev/null 2>&1; then
            echo "  ✓ ConfigMap '$CM' exists"
          else
            echo "  ✗ ConfigMap '$CM' not found" && exit 1
          fi
          {{- end }}

          {{- if include "kafka-common.enabled" (list .Values.kafkaExporter.enabled true) }}
          echo ""
          echo "Checking Kafka Exporter pod..."
          EXPORTER_PODS=$(kubectl get pods -n $NAMESPACE \
            -l strimzi.io/name=${CLUSTER}-kafka-exporter \
            --no-headers 2>/dev/null)
          if [ -z "$EXPORTER_PODS" ]; then
            echo "  ✗ No Kafka Exporter pod found" && exit 1
          fi
          EXPORTER_RUNNING=$(echo "$EXPORTER_PODS" | grep "Running" | wc -l | tr -d ' ')
          if [ "$EXPORTER_RUNNING" -ge 1 ]; then
            echo "  ✓ Kafka Exporter pod is Running"
          else
            echo "  ✗ Kafka Exporter pod not running" && exit 1
          fi
          {{- end }}

          {{- if $r.podMonitor.enabled }}
          echo ""
          echo "Checking PodMonitor resources..."
          PM_COUNT=$(kubectl get podmonitors -n $NAMESPACE \
            --no-headers 2>/dev/null | wc -l | tr -d ' ')
          if [ "$PM_COUNT" -ge 1 ]; then
            echo "  ✓ Found $PM_COUNT PodMonitor(s)"
          else
            echo "  ⚠ No PodMonitors found (monitoring may be configured externally)"
          fi
          {{- end }}

          echo "✓ Tier 9 complete"
      securityContext:
        {{- include "kafka-cluster.containerSecurityContext" . | nindent 8 }}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
