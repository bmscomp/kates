{{- $r := dict -}}
{{- $_ := include "kafka-cluster.resolve" (dict "ctx" . "out" $r) -}}
{{- $testUser := include "kafka-cluster.testUser" . -}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "kafka-cluster.clusterName" . }}-test-listeners"
  namespace: {{ include "kafka-cluster.namespace" . }}
  labels:
    {{- /* strimzi.io/cluster comes from kafka-cluster.labels — do not repeat it */}}
    {{- include "kafka-cluster.labels" . | nindent 4 }}
    kates.io/test-pod: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "6"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  serviceAccountName: {{ include "kafka-cluster.clusterName" . }}-admin
  restartPolicy: Never
  securityContext:
    {{- include "kafka-cluster.podSecurityContext" . | nindent 4 }}
  containers:
    - name: listener-check
      image: {{ include "kafka-cluster.kubectlImage" $ }}
      {{- include "kafka-common.imagePullPolicy" .Values.testImages.pullPolicy | nindent 6 }}
      command: ["sh", "-c"]
      args:
        - |
          set -e
          CLUSTER="{{ include "kafka-cluster.clusterName" . }}"
          NAMESPACE="{{ include "kafka-cluster.namespace" . }}"

          echo "=== Tier 6: Listener & TLS Configuration ==="

          FAIL=0
          {{- range $r.listeners }}
          echo "Checking listener '{{ .name }}' (port {{ .port }}, type={{ .type }}, tls={{ .tls }})..."
          BOOTSTRAP=$(kubectl get kafka $CLUSTER -n $NAMESPACE \
            -o jsonpath='{.status.listeners[?(@.name=="{{ .name }}")].bootstrapServers}')
          if [ -n "$BOOTSTRAP" ]; then
            echo "  ✓ Listener '{{ .name }}': $BOOTSTRAP"
          else
            echo "  ✗ Listener '{{ .name }}': no bootstrapServers in status"
            FAIL=1
          fi
          {{- if .tls }}

          echo "  Verifying TLS CA secret..."
          if kubectl get secret ${CLUSTER}-cluster-ca-cert -n $NAMESPACE > /dev/null 2>&1; then
            # Verify the cert is not expired
            EXPIRY=$(kubectl get secret ${CLUSTER}-cluster-ca-cert -n $NAMESPACE \
              -o jsonpath='{.data.ca\.crt}' 2>/dev/null | base64 -d | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2 || true)
            if [ -n "$EXPIRY" ]; then
              echo "  ✓ Cluster CA cert exists (expires: $EXPIRY)"
            else
              echo "  ✓ Cluster CA cert secret exists"
            fi
          else
            echo "  ⚠ Cluster CA cert secret not found"
          fi
          {{- end }}
          {{- end }}

          echo ""
          echo "Checking listener count..."
          CONFIGURED={{ len $r.listeners }}
          ACTUAL=$(kubectl get kafka $CLUSTER -n $NAMESPACE \
            -o jsonpath='{.status.listeners}' | grep -o '"name"' | wc -l | tr -d ' ')
          echo "  Configured: $CONFIGURED, Active: $ACTUAL"
          if [ "$ACTUAL" -lt "$CONFIGURED" ]; then
            echo "  ✗ Some listeners not active" && FAIL=1
          else
            echo "  ✓ All listeners active"
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo "✗ Listener validation failed" && exit 1
          fi
          echo "✓ Tier 6 complete"
      securityContext:
        {{- include "kafka-cluster.containerSecurityContext" . | nindent 8 }}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
