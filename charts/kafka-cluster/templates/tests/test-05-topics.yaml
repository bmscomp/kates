{{- $r := dict -}}
{{- $_ := include "kafka-cluster.resolve" (dict "ctx" . "out" $r) -}}
{{- $testUser := include "kafka-cluster.testUser" . -}}
{{- if $r.topics }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "kafka-cluster.clusterName" . }}-test-topics"
  namespace: {{ include "kafka-cluster.namespace" . }}
  labels:
    {{- /* strimzi.io/cluster comes from kafka-cluster.labels — do not repeat it */}}
    {{- include "kafka-cluster.labels" . | nindent 4 }}
    kates.io/test-pod: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  serviceAccountName: {{ include "kafka-cluster.clusterName" . }}-admin
  restartPolicy: Never
  securityContext:
    {{- include "kafka-cluster.podSecurityContext" . | nindent 4 }}
  containers:
    - name: topic-check
      image: {{ include "kafka-cluster.kubectlImage" $ }}
      {{- include "kafka-common.imagePullPolicy" .Values.testImages.pullPolicy | nindent 6 }}
      command: ["sh", "-c"]
      args:
        - |
          set -e
          CLUSTER="{{ include "kafka-cluster.clusterName" . }}"
          NAMESPACE="{{ include "kafka-cluster.namespace" . }}"

          echo "=== Tier 5: Topic Provisioning ==="

          echo "Checking KafkaTopic CRs for cluster $CLUSTER..."
          TOPICS=$(kubectl get kafkatopics -n $NAMESPACE \
            -l strimzi.io/cluster=$CLUSTER \
            -o jsonpath='{.items[*].metadata.name}')
          FAIL=0
          COUNT=0
          for t in $TOPICS; do
            COUNT=$((COUNT + 1))
            STATUS=$(kubectl get kafkatopic $t -n $NAMESPACE \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')
            if [ "$STATUS" = "True" ]; then
              echo "  ✓ Topic $t: Ready"
            else
              echo "  ✗ Topic $t: NOT Ready ($STATUS)"
              FAIL=1
            fi
          done

          if [ "$COUNT" -eq 0 ]; then
            echo "  ⚠ No KafkaTopic CRs found (topics may be managed externally)"
          fi

          {{- with (index $r.topics 0) }}
          echo ""
          echo "Validating first topic '{{ .name }}' spec..."
          PARTITIONS=$(kubectl get kafkatopic {{ .name }} -n {{ include "kafka-cluster.namespace" $ }} \
            -o jsonpath='{.spec.partitions}')
          REPLICAS=$(kubectl get kafkatopic {{ .name }} -n {{ include "kafka-cluster.namespace" $ }} \
            -o jsonpath='{.spec.replicas}')
          echo "  Partitions: $PARTITIONS (expected {{ .spec.partitions }})"
          echo "  Replicas:   $REPLICAS (expected {{ .spec.replicas }})"
          if [ "$PARTITIONS" != "{{ .spec.partitions }}" ] || [ "$REPLICAS" != "{{ .spec.replicas }}" ]; then
            echo "  ✗ Spec mismatch" && FAIL=1
          else
            echo "  ✓ Spec matches declared values"
          fi
          {{- end }}

          if [ "$FAIL" -eq 1 ]; then
            echo "✗ Topic validation failed" && exit 1
          fi
          echo "✓ Tier 5 complete"
      securityContext:
        {{- include "kafka-cluster.containerSecurityContext" . | nindent 8 }}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
{{- end }}
