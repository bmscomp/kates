# CI / E2E — the smallest cluster that works: one controller and one broker,
# layered LAST over the detected values or the kind overlay. Replication
# factor 1 has no durability; this exists to fit the E2E jobs onto a 2-CPU /
# 7-GB runner. The pools replace any the lower layers set.

# Clears the 0.4-shaped pools a lower layer (kates detect) may carry.
controllerPools: []
brokerPools: []

nodePools:
  defaults:
    volume:
      deleteClaim: true
    scheduling:
      spread:
        enabled: false
      antiAffinity:
        enabled: false
  roleDefaults:
    controller:
      replicas: 1
      storage:
        volumes:
          - id: 0
            size: 1Gi
      jvmOptions:
        -Xms: 256m
        -Xmx: 256m
        gcLoggingEnabled: false
      resources:
        requests: { memory: 512Mi, cpu: 250m }
        limits: { memory: 512Mi, cpu: 500m }
    broker:
      replicas: 1
      storage:
        volumes:
          - id: 0
            size: 5Gi
      jvmOptions:
        -Xms: 512m
        -Xmx: 512m
        gcLoggingEnabled: false
      resources:
        requests: { memory: 1Gi, cpu: 250m }
        limits: { memory: 1Gi, cpu: 500m }
  pools:
    - name: controllers-ci
      roles: [controller]
    - name: brokers-ci
      roles: [broker]

kafka:
  config:
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
    transaction.state.log.min.isr: 1
    default.replication.factor: 1
    min.insync.replicas: 1
