# Development — one controller and one broker, minimal resources, relaxed
# policies. Replication factor 1: no durability. The pool names are the ones
# 0.4 used, so an existing dev cluster keeps its pools.

# Clears the 0.4-shaped pools a lower layer (kates detect) may carry.
controllerPools: []
brokerPools: []

nodePools:
  defaults:
    volume:
      deleteClaim: true
    scheduling:
      spread:
        enabled: false
      antiAffinity:
        enabled: false
  roleDefaults:
    controller:
      replicas: 1
      storage:
        volumes:
          - id: 0
            size: 1Gi
      jvmOptions:
        -Xms: 256m
        -Xmx: 256m
        gcLoggingEnabled: false
      resources:
        requests: { memory: 512Mi, cpu: 250m }
        limits: { memory: 512Mi, cpu: 500m }
    broker:
      replicas: 1
      storage:
        volumes:
          - id: 0
            size: 5Gi
      jvmOptions:
        -Xms: 512m
        -Xmx: 512m
        gcLoggingEnabled: false
      resources:
        requests: { memory: 1Gi, cpu: 250m }
        limits: { memory: 1Gi, cpu: 500m }
  pools:
    - name: controllers-dev
      roles: [controller]
    - name: brokers-dev
      roles: [broker]

# One broker cannot hold the default replication factors (3): Kafka could not
# create its internal topics.
kafka:
  config:
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
    transaction.state.log.min.isr: 1
    default.replication.factor: 1
    min.insync.replicas: 1

entityOperator:
  topicOperator:
    resources:
      requests: { memory: 256Mi, cpu: 50m }
      limits: { memory: 384Mi, cpu: 200m }
    jvmOptions:
      -Xms: 128m
      -Xmx: 256m
    reconciliationIntervalMs: 120000
  userOperator:
    resources:
      requests: { memory: 256Mi, cpu: 50m }
      limits: { memory: 384Mi, cpu: 200m }
    jvmOptions:
      -Xms: 128m
      -Xmx: 256m

kafkaExporter:
  enabled: false

cruiseControl:
  enabled: false

networkPolicy:
  enabled: false

tieredStorage:
  enabled: false

backup:
  enabled: false

alerts:
  enabled: false

monitoring:
  podMonitor:
    enabled: false
