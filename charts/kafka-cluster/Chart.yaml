apiVersion: v2
name: kafka-cluster
description: A Strimzi Kafka cluster in KRaft mode — node pools, topics, users, rebalancing, tiered storage, network policy and observability
type: application
# Patch: values-kind.yaml no longer switches the scrape and the rules off.
# Defaults are unchanged; a kind install with prometheus-operator present now
# gets its PodMonitors and PrometheusRule, which is the difference between the
# Kafka boards and twelve empty panels.
version: 1.0.1
appVersion: "4.3.1"
icon: https://strimzi.io/assets/images/strimzi_logo.png
home: https://strimzi.io/
keywords:
  - kafka
  - strimzi
  - kraft
  - streaming
  - messaging
maintainers:
  - name: Platform Team
sources:
  - https://github.com/strimzi/strimzi-kafka-operator
dependencies:
  - name: kafka-common
    version: 0.1.0
    repository: file://../kafka-common
  - name: seaweedfs
    version: "3.68.0"
    repository: "https://seaweedfs.github.io/seaweedfs/helm"
    condition: seaweedfs.enabled
annotations:
  # The oldest Kafka this chart's PRIMARY configuration can run. values.yaml
  # turns on share groups (kafka.config `group.share.enable: true`), which need
  # Kafka >= 4.2 and a metadata version >= 4.2; the chart therefore renders the
  # share-group keys only for kafkaVersion >= this floor, and an additional
  # cluster below it starts without them. The CLI reads this annotation to
  # decide which operators can host the primary (window ∩ >= floor must be
  # non-empty); scripts/check-versions.sh asserts the default kafkaVersion is
  # at or above it. Raise it when the platform's configuration needs something
  # newer; never lower it without removing the feature that set it.
  kates.io/kafka-floor: "4.2.0"
  artifacthub.io/changes: |
    - kind: fixed
      description: values-kind.yaml held monitoring.podMonitor.enabled and alerts.enabled at false, so a kind install never created its PodMonitors or its PrometheusRule and every Kafka board stayed empty. The overlay leaves both at the chart defaults; the templates already render nothing where the monitoring.coreos.com API is absent
    - kind: added
      description: nodePools — one model for every pool (defaults, roleDefaults, pools) with working defaults of three controllers and three brokers, per-pool storage/resources/scheduling, dual-role pools and namespaced sysctls. The 0.4 pool keys are translated
    - kind: added
      description: profile — profiles/platform.yaml carries the kates platform's topics, users, super user and client grants; values-platform.yaml selects it. The base values are generic
    - kind: added
      description: tieredStorage renders spec.kafka.tieredStorage with the plugin image, class, config and credentials; the backup leaves broker-only volumes out only while it is active. Helm test test-tiered-storage proves offload and remote reads
    - kind: added
      description: KafkaRebalance templates referenced by cruiseControl.autoRebalance; an opt-in full rebalance (rebalance.full)
    - kind: added
      description: kafka.quotas, kafka.image, logging, jmxOptions, probes, maintenanceTimeWindows, cruiseControl.apiUsers/template, entityOperator.template, kafka.externalAccess presets
    - kind: added
      description: networkPolicy.clients — who may reach which listeners, ports derived from kafka.listeners; tiered-storage egress; the test pods may reach the API server
    - kind: added
      description: Strimzi's own JMX exporter rules (vendored, checked against upstream), a Cruise Control rule set of its own, PodMonitors per component with the Strimzi relabelings, alerts scoped to the cluster with runbook links (docs/kafka-cluster-runbook.md), recording rules and an optional availability SLO
    - kind: added
      description: Rails for the metadata version, pools, replication factors against the broker count, min.insync.replicas, tiered storage, sysctls, listener names, Cruise Control and productionMode
    - kind: changed
      description: Every namespaced resource is named <clusterName>-… so clusters can share a namespace; compatibility.legacyResourceNames keeps the 0.4 names (the metrics ConfigMap rename rolls brokers)
    - kind: changed
      description: The base values expose no NodePort listener and grant no super user; alerts and PodMonitors render only where the monitoring.coreos.com API exists
    - kind: changed
      description: Alerts renamed or replaced — KafkaRaftLeaderElectionRate is KafkaRaftLeaderElections, KafkaRaftUncommittedRecords is KafkaRaftUnknownVoters; new KafkaUnderMinIsrPartitions, KafkaOfflineLogDirectory, KafkaUncleanLeaderElection, KafkaNodesMissing, KafkaFencedBrokers, KafkaBrokerMetadataLag, KafkaRequestQueueSaturated, CruiseControlNoLoadModel, KafkaTieredStorageCopyErrors
    - kind: changed
      description: podSecurityPolicy is kyvernoPolicy, with a per-cluster ClusterPolicy name and optional PolicyExceptions
    - kind: removed
      description: The CRD hook, the drain cleaner, StrimziOperatorDown and the certificate alerts belong to strimzi-operator 0.3; drainCleaner.enabled=true fails with a pointer
    - kind: removed
      description: The chart's Kafka, KRaft, Cruise Control and Connect dashboards read 36 series no rule produced; the operator's dashboards (strimzi-operator) replace them
    - kind: removed
      description: The kafka-connect, kafka-mirror-maker, kafka-ui, strimzi-drain-cleaner and operator NetworkPolicies, which select other releases' pods
    - kind: fixed
      description: Controller pools honour their own resources and JVM options; the anti-affinity of controllers is scoped to the cluster
