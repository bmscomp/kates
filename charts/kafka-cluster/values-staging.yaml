# Staging — production-like topology with moderate resources: three
# controllers and one broker in each of three zones.
clusterName: krafter

# Clears the 0.4-shaped pools a lower layer (kates detect) may carry.
controllerPools: []
brokerPools: []

nodePools:
  roleDefaults:
    controller:
      storage:
        volumes:
          - id: 0
            size: 10Gi
    broker:
      replicas: 1
      storage:
        volumes:
          - id: 0
            size: 100Gi
      jvmOptions:
        -Xms: 2048m
        -Xmx: 2048m
      resources:
        requests: { memory: 4Gi, cpu: 1000m }
        limits: { memory: 4Gi, cpu: 2000m }
  # Zone pins come from `kates detect`; these pools spread by topology only.
  pools:
    - name: controllers
      roles: [controller]
    - name: brokers-az1
      roles: [broker]
    - name: brokers-az2
      roles: [broker]
    - name: brokers-az3
      roles: [broker]

networkPolicy:
  enabled: true

alerts:
  enabled: true

kyvernoPolicy:
  enabled: true
  action: Enforce

backup:
  enabled: true
  schedule: "0 2 * * *"
  ttl: 168h0m0s
  volumes: fs-backup
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
