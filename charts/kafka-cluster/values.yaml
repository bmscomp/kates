# kafka-cluster 1.0 — default values.
#
# The defaults render a generic, working cluster: three KRaft controllers and
# three brokers on the default StorageClass, internal listeners only, no
# platform topics or users. The kates platform's topics, users and client
# NetworkPolicy grants are a profile (`profile: platform`, what
# values-platform.yaml sets). Upgrading from 0.4? Read
# docs/kafka-cluster-1.0-upgrade.md: the 0.4 keys still work in 1.x and NOTES
# name their replacements.

# -- Kafka cluster name: the Strimzi Kafka CR name, the strimzi.io/cluster
# label, and the prefix of every namespaced resource this chart creates.
clusterName: krafter
# -- Kafka broker/controller version. The default is the newest in the
# vendored operator's window (scripts/check-versions.sh asserts that) and must
# stay at or above Chart.yaml's kates.io/kafka-floor. Any x.y.z is accepted:
# whether the operator can run it is the operator's and the CLI's check.
kafkaVersion: "4.3.1"
# -- Strimzi version the chart is aligned with (the Helm-test client image tag
# and scripts/check-versions.sh)
strimziVersion: "1.2.0"

# -- Override the chart name used in labels
nameOverride: ""
# -- Override the fully-qualified name (not used in resource names: those
# carry clusterName)
fullnameOverride: ""
# -- Extra labels merged into every resource (the CLI stamps kates.io/lab
# here). Never selector labels.
extraLabels: {}

# -- A named set of defaults merged under these values. `platform` adds the
# kates platform's topics, users, super user and client grants
# (profiles/platform.yaml); values-platform.yaml sets it. Items you set in
# `topics.items`, `users.items` and `networkPolicy.clients` win over the
# profile's by name.
profile: ""

# -- Refuse settings that are unsafe in production: the placeholder S3
# secret, a NodePort listener without TLS, `deleteClaim: true`, a backup that
# protects no broker data, and more (README "Rails").
productionMode: false

# -- Keep KafkaTopics and KafkaUsers when the release is uninstalled. The
# Kafka CR and its node pools are always kept: deleting them deletes data.
keepOnDelete: true

compatibility:
  # -- Keep the 0.4 names of the resources that existed then (kafka-metrics,
  # default-deny, allow-dns, kafka-brokers, the SeaweedFS Secret and
  # ConfigMap, the Kyverno ClusterPolicy, the PrometheusRule). Renaming the
  # metrics ConfigMap changes the Kafka CR, which rolls every broker; set this
  # on an upgrade and clear it in a maintenance window. New resources are
  # always prefixed with clusterName.
  legacyResourceNames: false

# -- Settings shared with subcharts
global:
  # -- Registry of the Helm-test Kafka client image when testImages.kafka is empty
  imageRegistry: "quay.io"
  # -- Repository of that image
  imageRepository: "strimzi"
  # -- Pull secrets for the pods this chart owns (tests)
  imagePullSecrets: []
  # -- Kubernetes DNS domain
  clusterDomain: "cluster.local"
  # -- Accepted for `kates detect` output. Volumes take their class from
  # nodePools (a class change on an existing volume is refused by Strimzi).
  storageClass: ""

# -- Images of the Helm-test pods. Pinned: scripts/check-versions.sh keeps
# them aligned with the other charts.
testImages:
  kafka: "ghcr.io/bmscomp/kates-tester:1.22.0"
  kubectl: "ghcr.io/bmscomp/kates-tester:1.22.0"
  # -- Pull policy for test pods (empty: Kubernetes' default)
  pullPolicy: IfNotPresent

# ── Kafka ────────────────────────────────────────────────────────────────────
kafka:
  # -- Kafka image. Empty: the operator's image for kafkaVersion.
  # tieredStorage.image replaces it when tiered storage is enabled.
  image: ""
  # -- KRaft metadata version, pinned one step behind kafkaVersion so a
  # rollback stays possible (left unset, the operator raises it as soon as
  # kafkaVersion changes). `4.2` and `4.2-IV1` are both accepted; it can never
  # be newer than kafkaVersion. Keep it at 4.2 or newer: share groups need it.
  metadataVersion: 4.2-IV1

  # -- Listeners. Internal only by default; externalAccess adds one for
  # clients outside the Kubernetes cluster. NetworkPolicy ports are derived
  # from this list.
  listeners:
    - name: plain
      port: 9092
      type: internal
      tls: false
      authentication:
        type: scram-sha-512
    - name: tls
      port: 9093
      type: internal
      tls: true
      authentication:
        type: tls

  # -- An external listener preset, appended to `listeners`. Off by default:
  # 0.4 exposed a NodePort on every install.
  externalAccess:
    # -- none | nodeport | loadbalancer | ingress
    type: none
    name: external
    port: 9094
    tls: true
    authentication:
      type: scram-sha-512
    # -- Passed to the listener's `configuration` (ingress needs
    # bootstrap.host, brokers[].host and class)
    configuration: {}
    # -- Source ranges for the NetworkPolicy rule of this listener (empty:
    # from anywhere, which is what an external listener is for)
    allowedCidrs: []

  authorization:
    type: simple
    # -- Principals that bypass ACLs. The platform profile adds kates-backend.
    superUsers: []

  # -- Broker configuration. Share-group keys (group.share.*, share.*) are
  # rendered only for kafkaVersion >= 4.2.0. Replication factors above the
  # rendered broker count are refused.
  config:
    offsets.topic.replication.factor: 3
    transaction.state.log.replication.factor: 3
    transaction.state.log.min.isr: 2
    default.replication.factor: 3
    min.insync.replicas: 2
    unclean.leader.election.enable: false
    auto.create.topics.enable: false
    log.retention.hours: 24
    log.retention.bytes: 10737418240
    log.segment.bytes: 1073741824
    log.cleanup.policy: delete
    num.io.threads: 8
    num.network.threads: 5
    num.replica.fetchers: 3
    quota.producer.default: 52428800
    quota.consumer.default: 104857600
    message.max.bytes: 10485760
    group.share.enable: true
    group.min.session.timeout.ms: 6000
    group.max.session.timeout.ms: 1800000
    metadata.log.max.record.bytes.between.snapshots: 20971520
    controller.quorum.election.timeout.ms: 5000
    controller.quorum.fetch.timeout.ms: 10000
    controller.quorum.election.backoff.max.ms: 5000

  # -- Cluster-wide quotas (spec.kafka.quotas). `type: strimzi` with
  # minAvailableRatioPerVolume stops producers before a disk fills; the prod
  # overlay sets 0.1. Empty: Kafka's own per-client defaults only.
  quotas: {}

  rack:
    topologyKey: topology.kubernetes.io/zone

  # -- spec.kafka.logging (inline loggers or an external ConfigMap)
  logging: {}
  # -- spec.kafka.jmxOptions
  jmxOptions: {}
  livenessProbe: {}
  readinessProbe: {}

  # -- spec.kafka.template, deep-merged over the chart's (PDB and a hardened
  # kafkaContainer security context). Node pools render their own pod,
  # kafkaContainer and persistentVolumeClaim templates, which Strimzi uses
  # instead of these: set per-pool pod settings under nodePools.
  template:
    podDisruptionBudget:
      maxUnavailable: 1

  clusterCa:
    generateCertificateAuthority: true
    validityDays: 1825
    renewalDays: 180
    certificateExpirationPolicy: replace-key
  clientsCa:
    generateCertificateAuthority: true
    validityDays: 1825
    renewalDays: 180
    certificateExpirationPolicy: replace-key

# -- Cron expressions for certificate renewal and other disruptive operator
# work (spec.maintenanceTimeWindows)
maintenanceTimeWindows: []

# ── Node pools ───────────────────────────────────────────────────────────────
# Every pool is rendered from `pools`, with precedence
#   pool  >  roleDefaults[role]  >  defaults
# (maps merged, lists replaced). `kates detect --generate-values` writes its
# own pools, and Helm replaces the list. A pool's name is its identity:
# renaming one creates a new pool and removes the old one with its data.
# The 0.4 keys (controllerPools, brokerPools, controllerDefaults,
# brokerDefaults) still work in 1.x and are translated to this model.
nodePools:
  defaults:
    # -- Storage of every pool. `volumes` entries are merged over `volume`.
    storage:
      type: jbod
      volumes:
        - id: 0
          size: 100Gi
    # -- Defaults for each JBOD volume
    volume:
      type: persistent-claim
      deleteClaim: false
    scheduling:
      # -- Node label a pool's `zone` pins to
      zoneKey: topology.kubernetes.io/zone
      # -- Topology spread of a pool's pods (topologyKey empty: zoneKey)
      spread:
        enabled: true
        maxSkew: 1
        topologyKey: ""
        whenUnsatisfiable: ScheduleAnyway
      # -- Preferred anti-affinity between pods of a pool (controller-only
      # pools: between all controllers of the cluster)
      antiAffinity:
        enabled: true
        topologyKey: kubernetes.io/hostname
      tolerations: []
      priorityClassName: ""
      # -- Pod grace period. Empty: Strimzi's default (30s).
      terminationGracePeriodSeconds: null
    # -- Merged over the hardened pod security context
    podSecurityContext: {}
    # -- Merged over the hardened Kafka container security context
    containerSecurityContext: {}
    # -- Namespaced sysctls only (net.*, kernel.shm*, kernel.msg*,
    # kernel.sem, fs.mqueue.*), rendered into the pod security context.
    # vm.max_map_count and other node-level keys are refused: tune nodes
    # with a DaemonSet or the node image.
    sysctls: []
    # -- Raw KafkaNodePool.spec.template, deep-merged last
    template: {}
  roleDefaults:
    controller:
      replicas: 3
      storage:
        volumes:
          - id: 0
            size: 10Gi
      jvmOptions:
        -Xms: 512m
        -Xmx: 512m
        gcLoggingEnabled: true
      resources:
        requests:
          memory: 1Gi
          cpu: 500m
        limits:
          memory: 1Gi
          cpu: 1000m
    broker:
      replicas: 3
      jvmOptions:
        -Xms: 2048m
        -Xmx: 2048m
        gcLoggingEnabled: true
      resources:
        requests:
          memory: 4Gi
          cpu: 1000m
        limits:
          memory: 4Gi
          cpu: 2000m
  # -- The pools. Each needs a unique name and roles; anything from
  # `defaults`/`roleDefaults` can be overridden per pool, and `zone` pins a
  # pool to one zone. Two clusters sharing a namespace need distinct pool
  # names (KafkaNodePool names are namespaced, not per cluster).
  pools:
    - name: controllers
      roles: [controller]
    - name: brokers
      roles: [broker]
    # - name: brokers-az1
    #   roles: [broker]
    #   zone: az1
    #   replicas: 1
    #   storage:
    #     volumes:
    #       - { id: 0, size: 200Gi, class: gp3-az1 }

# ── Operands ─────────────────────────────────────────────────────────────────
entityOperator:
  topicOperator:
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 500m
    jvmOptions:
      -Xms: 128m
      -Xmx: 256m
    reconciliationIntervalMs: 60000
  userOperator:
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 500m
    jvmOptions:
      -Xms: 128m
      -Xmx: 256m
  # -- spec.entityOperator.template
  template: {}

# -- Kafka Exporter (consumer lag and topic/partition metrics)
kafkaExporter:
  enabled: true
  topicRegex: ".*"
  groupRegex: ".*"
  topicExcludeRegex: ""
  groupExcludeRegex: ""
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m
  template: {}

# -- Cruise Control
cruiseControl:
  enabled: true
  brokerCapacity:
    cpu: "2000m"
    inboundNetwork: 50MiB/s
    outboundNetwork: 50MiB/s
  # -- Automatic rebalancing on scale-up and scale-down. An entry without a
  # template uses the chart's rebalance template for its mode.
  autoRebalance:
    - mode: add-brokers
    - mode: remove-brokers
  config: {}
  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 512Mi
      cpu: 500m
  # -- spec.cruiseControl.apiUsers (hashLoginService Secret)
  apiUsers: {}
  # -- spec.cruiseControl.template
  template: {}

# -- KafkaRebalance templates used by cruiseControl.autoRebalance, and an
# optional full rebalance. Rendered only with cruiseControl.enabled.
rebalance:
  enabled: true
  # -- Shared settings of every template (a KafkaRebalance spec without mode)
  goals:
    - com.linkedin.kafka.cruisecontrol.analyzer.goals.RackAwareGoal
    - com.linkedin.kafka.cruisecontrol.analyzer.goals.ReplicaCapacityGoal
    - com.linkedin.kafka.cruisecontrol.analyzer.goals.DiskCapacityGoal
    - com.linkedin.kafka.cruisecontrol.analyzer.goals.NetworkInboundCapacityGoal
    - com.linkedin.kafka.cruisecontrol.analyzer.goals.NetworkOutboundCapacityGoal
    - com.linkedin.kafka.cruisecontrol.analyzer.goals.CpuCapacityGoal
    - com.linkedin.kafka.cruisecontrol.analyzer.goals.TopicReplicaDistributionGoal
    - com.linkedin.kafka.cruisecontrol.analyzer.goals.LeaderBytesInDistributionGoal
  skipHardGoalCheck: false
  # -- Regex of topics never moved
  excludedTopics: ""
  # -- Bytes/s cap on replica movement (0: none)
  replicationThrottle: 0
  concurrentPartitionMovementsPerBroker: 0
  concurrentLeaderMovements: 0
  # -- Per-mode overrides of the settings above
  templates:
    add-brokers: {}
    remove-brokers: {}
  # -- A standing full rebalance proposal. Cruise Control computes it once;
  # approve it with `kubectl annotate kafkarebalance <name>
  # strimzi.io/rebalance=approve`.
  full:
    enabled: false
    rebalanceDisk: true
    # -- Approve every proposal automatically
    autoApprove: false

# ── Topics and users ─────────────────────────────────────────────────────────
topics:
  enabled: true
  # -- Applied to every topic
  defaults:
    partitions: 3
    # -- Empty: the rendered broker count, capped at 3
    replicas: null
    # -- Added to each topic's config unless set there. min.insync.replicas
    # empty: replicas - 1, at least 1 and at most 2.
    config: {}
  # Topics by name: {partitions, replicas, config, topicName, enabled}. A
  # list of {name: …} entries is still accepted in 1.x. (No default here, so
  # either form merges without a Helm warning.)
  # items:
  #   orders:
  #     partitions: 12
  #     config:
  #       retention.ms: "604800000"

users:
  enabled: true
  # Users by name: {authentication, authorization, quotas, template,
  # enabled}. A list of {name: …} entries is still accepted in 1.x.
  # items:
  #   orders-app:
  #     authentication: { type: scram-sha-512 }
  #     authorization:
  #       type: simple
  #       acls:
  #         - resource: { type: topic, name: orders, patternType: literal }
  #           operations: ["Read", "Write", "Describe"]

# ── Tiered storage and backup ────────────────────────────────────────────────
# Tiered storage offloads closed log segments to object storage through a
# remote storage manager (RSM) plugin. The stock Strimzi image has none, so
# `image` must name one that carries it.
tieredStorage:
  enabled: false
  # -- REQUIRED when enabled: a Kafka image with the RSM plugin
  image: ""
  remoteStorageManager:
    # -- e.g. io.aiven.kafka.tieredstorage.RemoteStorageManager
    className: ""
    # -- e.g. /opt/kafka/plugins/tiered-storage/*
    classPath: ""
    # -- RSM settings; Strimzi prefixes them with rsm.config. The chart adds
    # the SeaweedFS endpoint and region when those are empty and
    # seaweedfs.enabled.
    config: {}
  credentials:
    # -- Secret with the object-store credentials, exposed to the brokers as
    # environment variables. Empty with seaweedfs.enabled: the SeaweedFS
    # credentials Secret.
    existingSecret: ""
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  metadata:
    replicationFactor: 3
  # -- Add remote.storage.enable=true to every chart-managed topic
  topicDefault: true
  # -- How long offloaded segments also stay on local disk
  localRetentionMs: 86400000
  # -- Egress from the brokers to the object store (NetworkPolicy). Empty
  # `to`: any destination on these ports.
  egress:
    to: []
    ports: [80, 443, 8333]

# -- Velero Schedule and pre-upgrade Backup of this cluster's objects and,
# depending on `volumes`, its volume data.
backup:
  enabled: false
  schedule: "0 2 * * *"
  ttl: 168h0m0s
  # -- Namespace where Velero runs (its CRs must live there)
  veleroNamespace: velero
  storageLocation: default
  volumeSnapshotLocations: []
  # -- How volume data is protected: `fs-backup` (file-by-file, every
  # volume), `snapshot` (CSI snapshots; crash-consistent), or `none`
  # (objects only). With tiered storage active, broker volumes are excluded
  # either way: their data lives in object storage.
  #
  # Empty means fs-backup, unless a 0.4 release's snapshotVolumes /
  # defaultVolumesToFsBackup say otherwise — so a value set here always wins
  # over the translated ones.
  volumes: ""
  # -- Also render the pre-upgrade one-shot Backup
  preUpgrade: true
  persistence:
    enabled: false
    size: 20Gi
    storageClass: ""

# -- SeaweedFS: an S3-compatible object store for tiered storage and Velero
seaweedfs:
  enabled: false
  s3:
    # -- Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. Recommended;
    # without it the chart renders one from the two keys below.
    existingSecret: ""
    accessKeyId: "kates-kafka"
    # -- Placeholder: refused with filer.s3.enableAuth or productionMode
    secretAccessKey: "change-me-in-prod"
    region: "us-east-1"
  buckets:
    tieredStorage: "kafka-tiered-storage"
    velero: "velero-backups"
  # Pass-through to the seaweedfs subchart. Its Service names come from
  # `nameOverride` (default seaweedfs), not from this release, so only one
  # release per namespace can enable it.
  master:
    replicas: 1
  volume:
    replicas: 1
    storage: 100Gi
  filer:
    replicas: 1
    s3:
      enabled: true
      port: 8333
      httpsPort: 0
      allowEmptyFolder: false
      enableAuth: false

# ── Network ──────────────────────────────────────────────────────────────────
networkPolicy:
  enabled: true
  # -- Deny everything the policies below do not allow, for this cluster's
  # pods. An empty selector derives app.kubernetes.io/part-of:
  # strimzi-<clusterName>.
  defaultDeny:
    enabled: true
    selector: {}
  # -- DNS egress for this cluster's pods (same selector derivation). `to`
  # pins the resolver: {namespaceSelector: {…}, podSelector: {…}}.
  dns:
    enabled: true
    selector: {}
    to: {}
  # -- Kubernetes API egress (the rack-awareness init container and the
  # entity operator need it)
  apiServer:
    ports: [443, 6443]
    ipBlock: {}
  monitoring:
    # -- Namespace Prometheus scrapes from
    namespace: monitoring
  # -- Namespace of the Cluster Operator reconciling this cluster
  operatorNamespace: strimzi-operator
  # -- Who may reach the brokers. `listeners` are listener NAMES from
  # kafka.listeners, and their ports are derived. An empty namespace means the
  # release namespace. Pods labelled kates.io/test-pod=true in the release
  # namespace (Helm tests, CLI clients) are always allowed.
  clients: []
  # - name: my-app
  #   namespace: apps
  #   podSelector: { app.kubernetes.io/name: my-app }
  #   listeners: [tls]
  # -- Extra rules for the broker policy
  extraIngress: []
  extraEgress: []

# ── Observability ────────────────────────────────────────────────────────────
metrics:
  # -- Expose Kafka metrics (spec.kafka.metricsConfig)
  enabled: true
  # -- jmxPrometheusExporter (Strimzi's upstream rule set, vendored in
  # files/metrics) or strimziMetricsReporter. Cruise Control always uses the
  # exporter. Empty means jmxPrometheusExporter, unless a 0.4 release's
  # kafka.metricsConfig.type says otherwise.
  type: ""
  # -- strimziMetricsReporter only: regexes of the metrics to expose
  allowList: []

monitoring:
  podMonitor:
    # -- PodMonitors for the brokers/controllers, Cruise Control, the
    # Kafka Exporter and the entity operator
    enabled: true
    # Extra labels on the PodMonitor, for a Prometheus whose podMonitorSelector
    # has been narrowed. Empty by default: kates-monitoring 1.5.0 selects every
    # PodMonitor in the watched namespaces, and the `release: kafka` that used
    # to be here selected nothing under any Prometheus this repository installs
    # — the monitoring release is called `monitoring`, not `kafka`. It also went
    # stale the moment the chart was installed under another release name,
    # while `app.kubernetes.io/instance`, which the chart already sets, tracks
    # the real one. Prefer selecting on that.
    labels: {}
    interval: ""
    scrapeTimeout: ""

alerts:
  enabled: true
  # Extra labels on the PrometheusRule, for a Prometheus whose ruleSelector has
  # been narrowed. Empty for the same reason as monitoring.podMonitor.labels;
  # `prometheus: kube-prometheus` named a Prometheus no chart here installs.
  labels: {}
  # -- The rules read the JMX exporter's series names; with
  # metrics.type=strimziMetricsReporter they would never fire, so the chart
  # refuses that pairing unless this is set (after porting the rules).
  allowReporterMetrics: false
  # -- Base of every rule's runbook_url; the alert name is the anchor
  runbookBaseUrl: "https://github.com/bmscomp/kates/blob/main/docs/kafka-cluster-runbook.md"
  thresholds:
    # -- Consumer-group lag (messages) per group
    consumerLagWarning: 1000000
    consumerLagCritical: 10000000
    # -- p99 request time (ms)
    requestLatencyP99Ms: 1000
    # -- Fraction of request-handler time idle
    handlerIdleRatio: 0.3
    # -- p99 log flush time (ms)
    logFlushP99Ms: 500
    # -- Fraction of volume capacity free
    diskFreeWarning: 0.2
    diskFreeCritical: 0.1
    # -- KRaft leader elections (epoch changes) in 15 minutes
    raftElectionsPer15m: 3
    # -- Requests waiting in a broker's request queue
    requestQueueSize: 100
    # -- Milliseconds a broker's metadata may trail the controller
    metadataLagMs: 60000
  # -- An availability SLO over produce and fetch requests: recording rules
  # for the error ratio and a multi-window burn-rate alert.
  slo:
    enabled: false
    # -- Ratio of requests that must succeed over 30 days
    target: 0.999
    # -- Burn rate that pages (14.4 spends 2% of a 30-day budget in an hour)
    burnRate: 14.4

# -- Kafka dashboards come from the strimzi-operator chart (the operator's
# own boards, which read the series files/metrics produces). Setting
# enabled here prints where to turn them on.
dashboards:
  enabled: false

# ── Policy and access ────────────────────────────────────────────────────────
# -- Kyverno ClusterPolicy restricting pods in this namespace (needs Kyverno)
kyvernoPolicy:
  enabled: false
  # -- Audit or Enforce
  action: Audit
  mutate: false
  # -- Leave Strimzi-managed pods out of mutation and capability checks
  excludeStrimziPods: true
  policyExceptions:
    enabled: false
    namespaces: []
    exemptRules: []

# -- A read-only Role for this cluster's resources and a ServiceAccount bound
# to it (the Helm tests use it)
rbac:
  create: true
  extraRules: []

serviceAccount:
  annotations: {}

# -- Helm tests (`helm test`)
tests:
  # -- A KafkaUser the produce/consume tests authenticate as, limited to
  # helm-test-* topics and groups. Off: the tests use the first managed user.
  user:
    create: true

# -- external-secrets SecretStore/PushSecret/ExternalSecret wiring
externalSecrets:
  enabled: false
  secretStore:
    create: false
    provider: {}
  # -- PushSecrets: [{sourceSecret, refreshInterval, data: [{secretKey, remoteKey, property}]}]
  push: []
  # -- ExternalSecrets: [{targetSecret, refreshInterval, data: [...]}]
  pull: []
  # -- Cross-namespace copies: [{name, sourceSecret, targetNamespace, refreshInterval, secretStoreKind}]
  sync: []
