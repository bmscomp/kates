# Production — full HA: three controllers, three zones of three brokers,
# production rails, Velero backup of every volume, SeaweedFS as its object
# store, a TLS external listener.
#
# TIERED STORAGE IS OFF until an image with a remote storage manager plugin
# exists (this repository does not build one yet, and Strimzi's image has
# none). Until then the backup protects broker volumes too (backup.volumes:
# fs-backup). To turn it on:
#
#   tieredStorage:
#     enabled: true
#     image: <registry>/kafka-tiered:<strimzi>-kafka-<version>
#     remoteStorageManager:
#       className: io.aiven.kafka.tieredstorage.RemoteStorageManager
#       classPath: /opt/kafka/plugins/tiered-storage/*
#       config:
#         storage.backend.class: io.aiven.kafka.tieredstorage.storage.s3.S3Storage
#         chunk.size: "4194304"
#
# The SeaweedFS endpoint, bucket, region and credentials are filled in by the
# chart; broker-only pools then drop out of the volume backup.

productionMode: true

# Clears the 0.4-shaped pools a lower layer (kates detect) may carry.
controllerPools: []
brokerPools: []

nodePools:
  roleDefaults:
    controller:
      storage:
        volumes:
          - id: 0
            size: 20Gi
      resources:
        requests: { memory: 2Gi, cpu: 1000m }
        limits: { memory: 2Gi, cpu: 2000m }
    broker:
      storage:
        volumes:
          - id: 0
            size: 200Gi
      jvmOptions:
        -Xms: 4096m
        -Xmx: 4096m
      resources:
        requests: { memory: 8Gi, cpu: 2000m }
        limits: { memory: 8Gi, cpu: 4000m }
  # `kates detect --generate-values` writes zone-pinned pools for the real
  # topology; these spread by topology only.
  pools:
    - name: controllers
      roles: [controller]
    - name: brokers-az1
      roles: [broker]
    - name: brokers-az2
      roles: [broker]
    - name: brokers-az3
      roles: [broker]

kafka:
  # Producers stop before a volume is full: a full log directory goes offline.
  quotas:
    type: strimzi
    minAvailableRatioPerVolume: 0.1
  externalAccess:
    type: nodeport
    tls: true

tieredStorage:
  enabled: false

backup:
  enabled: true
  schedule: "0 2 * * *"
  ttl: 336h0m0s          # 14 days
  volumes: fs-backup     # broker volumes included while tiered storage is off
  storageLocation: seaweedfs

seaweedfs:
  enabled: true
  s3:
    # Provisioned outside the chart (e.g. by external-secrets); the chart
    # renders no credentials Secret of its own.
    existingSecret: "kafka-seaweedfs-credentials"
  master:
    replicas: 3
  volume:
    replicas: 3
    storage: 500Gi
  filer:
    replicas: 2
    s3:
      enabled: true
      enableAuth: true

networkPolicy:
  enabled: true

kyvernoPolicy:
  enabled: true
  action: Enforce
