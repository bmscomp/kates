{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kafka-ui.fullname" . }}
  namespace: {{ include "kafka-ui.namespace" . }}
  labels:
    {{- include "kafka-ui.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kafka-ui.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Ingress controller (browser access via Ingress resource)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - port: 8080
          protocol: TCP
    {{- if eq .Values.service.type "NodePort" }}
    # NodePort direct access (browser via node IP)
    - from: []
      ports:
        - port: 8080
          protocol: TCP
    {{- end }}
    # Prometheus metrics scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace | default "monitoring" }}
      ports:
        - port: 8080
          protocol: TCP
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # DNS resolution
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # To Kafka brokers (SASL_PLAINTEXT and TLS listeners)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "kafka-ui.kafkaNamespace" . }}
          podSelector:
            matchLabels:
              strimzi.io/cluster: {{ .Values.kafka.clusterName }}
      ports:
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
    {{- if .Values.schemaRegistry.enabled }}
    # To Schema Registry (port derived from schemaRegistry.url)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "kafka-ui.kafkaNamespace" . }}
      ports:
        - port: {{ include "kafka-ui.schemaRegistryPort" . }}
          protocol: TCP
    {{- end }}
    {{- if .Values.kafkaConnect.enabled }}
    # To Kafka Connect REST API (port derived from kafkaConnect.url)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "kafka-ui.kafkaNamespace" . }}
      ports:
        - port: {{ include "kafka-ui.kafkaConnectPort" . }}
          protocol: TCP
    {{- end }}
    {{- if .Values.networkPolicy.apiServerEgress }}
    # Kubernetes API server (only if explicitly enabled)
    - to: []
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
