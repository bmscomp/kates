# Production overlay for kafka-ui
replicas: 2

auth:
  enabled: true
  type: "LOGIN_FORM"

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: kafka-ui.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: kafka-ui-tls
      hosts:
        - kafka-ui.example.com

kafka:
  tls:
    enabled: true

schemaRegistry:
  enabled: true
  # url: "http://apicurio-registry.kafka.svc:8080/apis/ccompat/v7"

kafkaConnect:
  enabled: true
  name: "connect-cluster"
  # url: "http://connect-cluster-connect-api.kafka.svc:8083"

networkPolicy:
  enabled: true
