# Production overlay for kafka-ui
replicas: 2

auth:
  enabled: true
  type: "LOGIN_FORM"

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: kafka-ui.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: kafka-ui-tls
      hosts:
        - kafka-ui.example.com

kafka:
  tls:
    enabled: true

networkPolicy:
  enabled: true
