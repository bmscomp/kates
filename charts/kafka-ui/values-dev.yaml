# Development overlay for kafka-ui
# Enables Schema Registry and Kafka Connect integration for full visibility.

schemaRegistry:
  enabled: true

kafkaConnect:
  enabled: true

startupProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi
