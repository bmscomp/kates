# Strimzi Operator — Production Overlay (UPLIFT, NOT current behavior)
# Usage: helm dependency build charts/strimzi-operator && helm upgrade --install strimzi-operator charts/strimzi-operator -n strimzi-operator -f charts/strimzi-operator/values-prod.yaml
#
# READ BEFORE ENABLING. These settings have NEVER been applied to any cluster.
# They were stranded in config/kafka/strimzi-values.yaml, whose header claimed
# deploy-kafka.sh passed it with -f — it never did. Proof: the live operator
# runs STRIMZI_FULL_RECONCILIATION_INTERVAL_MS=120000 (the upstream default),
# not the 60000 that file specifies.
#
# So this overlay is a REAL BEHAVIOR CHANGE, not a restatement of the status
# quo. Measured against this chart: it takes the operator from 17 to 19
# resources (+1 NetworkPolicy, +1 PodDisruptionBudget), tightens the
# reconciliation loop, and flips the operator to a read-only root filesystem.
# Enabling dashboards below would add 9 more ConfigMaps. Roll it out
# deliberately, not as a default.

strimzi-kafka-operator:
  # ── Hardening ──────────────────────────────────────────────────────────────
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # ── Availability ───────────────────────────────────────────────────────────
  # Two operator replicas in active/standby (leader election is on by default).
  # This is REQUIRED for the PodDisruptionBudget below to be safe: with a single
  # replica, minAvailable=1 makes the pod un-evictable, so `kubectl drain`,
  # cluster-autoscaler scale-down, and node upgrades block on it indefinitely.
  # Two replicas let the standby be evicted while the leader keeps reconciling.
  replicas: 2

  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    unhealthyPodEvictionPolicy: IfHealthyBudget
  priorityClassName: system-cluster-critical

  # Spread the two replicas across nodes (and zones when present) so the standby
  # survives losing the leader's node. ScheduleAnyway keeps single-node clusters
  # (kind, small on-prem) schedulable instead of leaving a replica Pending.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          name: strimzi-cluster-operator
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          name: strimzi-cluster-operator

  # ── Reconciliation ─────────────────────────────────────────────────────────
  # Tighter loop than the 120000 default — more responsive, more API traffic.
  fullReconciliationIntervalMs: 60000

  # ── Feature gates (pin per Strimzi version) ────────────────────────────────
  # Explicit empty string = "reviewed, run the version's DEFAULT gates". This
  # pins intent so an operator upgrade cannot silently flip a gate on us. For
  # Strimzi 1.1.0 the production-relevant gates are all graduated (GA); the only
  # new gate, UseBackgroundPodDeletion, is alpha and stays OFF in prod. Re-review
  # this string on every appVersion bump (format: "+GateOn,-GateOff").
  featureGates: ""

  # ── Node placement (uncomment to pin to an infra pool) ─────────────────────
  # Cluster-scoped operators commonly run on dedicated infra/system nodes,
  # consistent with priorityClassName: system-cluster-critical below.
  # nodeSelector:
  #   node-role.kubernetes.io/infra: ""
  # tolerations:
  #   - key: node-role.kubernetes.io/infra
  #     operator: Exists
  #     effect: NoSchedule

  # ── Network ────────────────────────────────────────────────────────────────
  # Restricts access to the OPERATOR deployment only. Does NOT control the
  # NetworkPolicies the operator generates for Kafka operands.
  operatorNetworkPolicy:
    enabled: true

  # ── Resources ──────────────────────────────────────────────────────────────
  # 768Mi is what runs live today. Do NOT lower this to the 512Mi that
  # config/kafka/strimzi-values.yaml specified — that would REGRESS production
  # below its current allocation. Memory only; cpu inherits upstream defaults.
  resources:
    limits:
      memory: 768Mi
    requests:
      memory: 768Mi

  # ── JVM heap ───────────────────────────────────────────────────────────────
  # The memory limit above is Guaranteed QoS, but without an explicit -Xmx the
  # JVM sizes the heap from cgroup defaults and can creep toward the 768Mi limit
  # under reconciliation load and OOMKill. Pin the heap with headroom for
  # metaspace, threads and non-heap. Tune against the operator's real RSS.
  extraEnvs:
    - name: JAVA_OPTS
      value: "-Xms256m -Xmx512m"

  # ── Dashboards: left OFF deliberately ──────────────────────────────────────
  # Upstream creates 9 Grafana ConfigMaps whose names are independent of the
  # release name, and charts/kafka-cluster/values.yaml has its own dashboards
  # block targeting the `kafka` namespace. Enabling this without resolving
  # ownership produces colliding ConfigMaps. Decide who owns the dashboards
  # first, then enable on ONE side.
  dashboards:
    enabled: false

# ── Operator self-observability (wrapper-owned, not the subchart) ────────────
# Scrape the cluster operator's OWN metrics (reconciliation counters, JVM) and
# alert on operator health — distinct from the Kafka operands it manages. The
# `release: kafka` label matches this repo's Prometheus podMonitor/rule
# selector (same as charts/kafka-cluster podMonitors.labels).
metrics:
  podMonitor:
    enabled: true
    labels:
      release: kafka
alerts:
  enabled: true
  labels:
    release: kafka

# ── Airgapped / restricted-egress clusters ───────────────────────────────────
# There are FOUR distinct egress dependencies. Mirror all four or the operator
# will fail to install, upgrade, or reconcile operands.
#
# 1. CRD BUNDLE (hook, every install AND upgrade). The hook is a pre-upgrade
#    gate: if the source is unreachable the upgrade aborts and the release is
#    left in pending-upgrade. Two airgap options:
#      a) Mirror the bundle and point the hook at it (still one HTTP call each
#         install/upgrade):
#           crdUpgrade:
#             url: "https://mirror.internal/strimzi-crds-1.1.0.yaml"
#      b) FULLY offline — vendor the bundle into a ConfigMap and skip egress
#         entirely. Create it once per version from your mirror:
#           kubectl -n strimzi-operator create configmap strimzi-crds-1.1.0 \
#             --from-file=strimzi-crds.yaml=strimzi-crds-1.1.0.yaml
#         then:
#           crdUpgrade:
#             bundleConfigMap: "strimzi-crds-1.1.0"
#    In a default-deny namespace, also allow the hook Job's egress:
#      crdUpgrade:
#        networkPolicy:
#          enabled: true
#
# 2. OPERATOR SUBCHART (`helm dependency build`, needs quay.io). Vendor the
#    strimzi-kafka-operator OCI chart into your internal registry/mirror.
#
# 3. OPERATOR IMAGE. Redirect + pin by digest. This is
#    defaultImageRegistry/Repository/Tag (NOT global.imageRegistry, which
#    upstream ignores entirely), plus imagePullSecrets for a private registry:
#
#      strimzi-kafka-operator:
#        defaultImageRegistry: registry.internal
#        defaultImageRepository: strimzi
#        image:
#          # Pin the operator by digest for reproducibility (overrides the tag).
#          tag: "1.1.0@sha256:<operator-digest>"
#          imagePullSecrets:
#            - name: registry-internal
#
# 4. OPERAND IMAGES (Kafka, Connect, Bridge, cruise-control, kaniko, …). The
#    operator resolves these from its own env at RUNTIME. defaultImageRegistry
#    prefixes them, but to PIN them by digest for a fully offline cluster,
#    override the STRIMZI_*_IMAGES / STRIMZI_DEFAULT_*_IMAGE env via extraEnvs.
#    Take the exact list from `kubectl set env deploy/strimzi-cluster-operator
#    --list` on a connected cluster, then rewrite each to the mirror digest:
#
#      strimzi-kafka-operator:
#        extraEnvs:
#          - name: STRIMZI_KAFKA_IMAGES
#            value: |
#              4.0.0=registry.internal/strimzi/kafka:1.1.0-kafka-4.0.0@sha256:<digest>
#          - name: STRIMZI_DEFAULT_KAFKA_CONNECT_IMAGE
#            value: registry.internal/strimzi/kafka:1.1.0-kafka-4.0.0@sha256:<digest>
#          # …repeat for BRIDGE, CRUISE_CONTROL, KANIKO_EXECUTOR, MAVEN_BUILDER
#
# NOTE: the crdUpgrade hook and Helm tests use testImages.kubectl
# (ghcr.io/bmscomp/kates-tester) — mirror that too, or override it.
