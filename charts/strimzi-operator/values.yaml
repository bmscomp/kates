# Strimzi Operator — Default Values
#
# Wraps the upstream strimzi-kafka-operator chart with the kates defaults that
# were previously duplicated (and drifting) across three ad-hoc `helm` call
# sites. The defaults below reproduce what is LIVE today — not what any single
# call site intended.
#
# FOUR THINGS TO KNOW BEFORE YOU EDIT THIS FILE:
#
# 1. CRD LIFECYCLE. The upstream chart ships its CRDs in `crds/`, so `helm
#    install` creates them, `helm upgrade` NEVER updates them, and `helm
#    uninstall` never deletes them. The `crdUpgrade` hook below closes that
#    gap. Disable it and your CRDs freeze at the version first installed.
#
# 2. NESTING IS MANDATORY. Every operator setting MUST live under the
#    `strimzi-kafka-operator:` key. A top-level `watchAnyNamespace: true` is
#    silently ignored by Helm — values.schema.json rejects it deliberately so
#    the mistake is loud instead of silent.
#
# 3. THIS CHART HAS A SUBCHART. Run `helm dependency build charts/strimzi-operator`
#    before install/upgrade/template or it will not render at all.
#
# 4. REGISTRY REDIRECTION is `strimzi-kafka-operator.defaultImageRegistry`.
#    NOT `global.imageRegistry` — upstream contains zero `.Values.global`
#    references and ignores it entirely, so this chart does not declare it.

nameOverride: ""
fullnameOverride: ""

# -- Extra labels added to every resource this chart renders
commonLabels: {}
# -- Extra annotations added to every resource this chart renders
commonAnnotations: {}

# ── Strimzi version ──────────────────────────────────────────────────────────
# -- Strimzi version used to build the CRD bundle URL for the crdUpgrade hook.
# MUST equal Chart.yaml's appVersion, the dependency version, and versions.env
# STRIMZI_VERSION — otherwise the hook applies CRDs for a different operator
# than the one being installed. Enforced by scripts/check-versions.sh.
strimziVersion: "1.2.0"

# ── Image sources ────────────────────────────────────────────────────────────
# -- Images used by this chart's OWN resources (the CRD-upgrade hook and Helm
# tests). The operator's own image comes from the subchart.
testImages:
  # -- kubectl image used by the CRD-upgrade hook Job and the Helm tests
  kubectl: "ghcr.io/bmscomp/kates-tester:1.23.0"

# ── CRD lifecycle ────────────────────────────────────────────────────────────
# Closes the gap Helm leaves: crds/ is applied on install and never on upgrade.
# This hook runs pre-install AND pre-upgrade, so CRDs are current before the
# operator Deployment is patched.
crdUpgrade:
  # -- Apply the Strimzi CRD bundle via a pre-install/pre-upgrade hook Job
  enabled: true
  # -- Override the CRD bundle URL (empty = derive from strimziVersion).
  # Set this to an internal mirror for airgapped clusters — see values-prod.yaml.
  url: ""
  # -- Job retry budget before the install/upgrade is aborted
  backoffLimit: 3
  # -- Seconds to retain a FAILED Job for log inspection. This never applies to
  # the success path: the hook carries `hook-delete-policy: hook-succeeded`, so
  # Helm deletes the Job the moment it succeeds and there is nothing left for
  # the TTL to govern. On failure the Job survives, and this is its retention.
  ttlSecondsAfterFinished: 300

# ── Additional (namespace-scoped) operators ──────────────────────────────────
# One Kubernetes cluster has ONE set of Strimzi CRDs and ONE set of the
# fixed-name cluster-scoped roles and bindings. They belong to the newest
# operator on the cluster — the primary's release. Every other operator runs
# with `strimzi-kafka-operator.createGlobalResources: false` and reuses them
# (see values-namespace-scope.yaml). What that flag also skips are the three
# fixed-name ClusterRoleBindings that tie the operator's ServiceAccount to
# `strimzi-cluster-operator-global`, `strimzi-kafka-broker` and
# `strimzi-kafka-client` — without them a second operator has no rack
# awareness and no volume-expansion checks. This block renders those three
# bindings under names unique to the release namespace
# (`strimzi-cluster-operator-<namespace>-…`) so the additional operator keeps
# parity without touching upstream's names.
globalBindings:
  # -- Render the three unique-name ClusterRoleBindings for this release's
  # operator ServiceAccount. Off for the primary (upstream renders its own
  # under createGlobalResources: true); on for every additional operator.
  enabled: false

# ── Operator NetworkPolicy (kates-owned) ─────────────────────────────────────
# The policy kafka-cluster 0.4 wrote into the operator's namespace
# (`networkPolicies.operatorPolicy`), now owned here: one policy per operator,
# egress to every namespace it watches. On since 0.3. While a kafka-cluster
# 0.4 release still owns the object, it is skipped and NOTES say so;
# kafka-cluster 1.0 no longer renders it.
#
# Not to be confused with `strimzi-kafka-operator.operatorNetworkPolicy`,
# upstream's shell that renders whatever ingress/egress you hand it and
# nothing else.
operatorPolicy:
  # -- Render the operator's NetworkPolicy in the release namespace
  enabled: true

# -- Refuse settings that are unsafe in production (a single drain-cleaner
# replica)
productionMode: false

# ── Drain Cleaner ────────────────────────────────────────────────────────────
# A validating webhook that turns node-drain evictions of Kafka pods into
# operator-driven rolling restarts. One per Kubernetes cluster: enable it on
# the primary operator's release only. Needs a serving certificate the API
# server trusts — cert-manager (tls.certManager) or your own (tls.secretName
# plus tls.caBundle); without one the render fails, because the webhook would
# be uncallable and `failurePolicy: Ignore` would let every eviction through.
drainCleaner:
  enabled: false
  image: quay.io/strimzi/drain-cleaner:1.6.1
  imagePullPolicy: ""
  # -- Run 2 or more in production (refused below 2 with productionMode)
  replicas: 1
  # -- Deny the eviction and have the operator roll the pod (Strimzi's
  # recommended mode); false lets the eviction through after annotating
  denyEviction: true
  # -- Namespaces whose evictions are intercepted. Empty: the operator's
  # watch scope.
  namespaces: []
  # -- Rendered by default when replicas > 1
  podDisruptionBudget:
    minAvailable: 1
  networkPolicy:
    enabled: true
  tls:
    # -- Issue the serving certificate with cert-manager and inject its CA
    # (issuerRef empty: a self-signed Issuer)
    certManager:
      enabled: false
      issuerRef: {}
      duration: 8760h
      renewBefore: 720h
    # -- An existing kubernetes.io/tls Secret, mounted at
    # /etc/webhook-certificates
    secretName: ""
    # -- Base64 CA bundle for the webhook
    caBundle: ""
  webhookAnnotations: {}
  env: []
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  # -- Empty: preferred anti-affinity between the webhook pods
  affinity: {}
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m

# ── Operator monitoring ──────────────────────────────────────────────────────
# A PodMonitor for the operator and the alerts only the operator can raise:
# operator down, reconciliations failing, and certificate expiry for every
# cluster it manages. Rendered only where the monitoring.coreos.com API
# exists.
monitoring:
  podMonitor:
    enabled: true
    # Extra labels on the PodMonitor, for a Prometheus whose podMonitorSelector
    # has been narrowed. Empty by default: kates-monitoring 1.5.0 selects every
    # PodMonitor in the watched namespaces, and the `release: kafka` that used
    # to be here selected nothing under any Prometheus this repository installs
    # — the monitoring release is called `monitoring`, not `kafka`. It also went
    # stale the moment the chart was installed under another release name,
    # while `app.kubernetes.io/instance`, which the chart already sets, tracks
    # the real one. Prefer selecting on that.
    labels: {}
    interval: ""

alerts:
  enabled: true
  # Extra labels on the PrometheusRule, for a Prometheus whose ruleSelector has
  # been narrowed. Empty for the same reason as monitoring.podMonitor.labels;
  # `prometheus: kube-prometheus` named a Prometheus no chart here installs.
  labels: {}
  runbookBaseUrl: "https://github.com/bmscomp/kates/blob/main/docs/kafka-cluster-runbook.md"
  thresholds:
    certificateWarningDays: 30
    certificateCriticalDays: 7

# ── Upstream Strimzi operator (subchart) ─────────────────────────────────────
# The ONLY place operator settings take effect. Full key reference:
#   https://github.com/strimzi/strimzi-kafka-operator/blob/main/helm-charts/helm3/strimzi-kafka-operator/values.yaml
#
# Only FOUR keys below deviate from stock upstream; everything else is pinned
# for safety or is an explicit restatement of an upstream default.
strimzi-kafka-operator:
  # -- Operator replicas. All three previous call sites set 1.
  replicas: 1

  # -- Watch every namespace (STRIMZI_NAMESPACE="*"). All three previous call
  # sites set this; verified live. This default is what makes the retired
  # top-level `--set watchAnyNamespace=true` harmless rather than dangerous.
  watchAnyNamespace: true

  # -- Cluster DNS domain. Upstream only emits KUBERNETES_SERVICE_DNS_DOMAIN
  # when this differs from cluster.local, so callers on non-default domains
  # MUST inject the detected value (see values-generic.yaml).
  kubernetesServiceDnsDomain: cluster.local

  # -- Reconciliation operation timeout. Upstream default is 300000; 900000 is
  # what the CLI set and what runs live, so it is the behavior-preserving value.
  operationTimeoutMs: 900000

  # -- Full reconciliation interval. Upstream default; verified live. NOT the
  # 60000 in config/kafka/strimzi-values.yaml, which was never applied.
  fullReconciliationIntervalMs: 120000

  # -- Operator resources. MEMORY ONLY: 768Mi is what runs live (upstream
  # default is 384Mi). cpu is deliberately NOT set — upstream already defaults
  # it to limits 1000m / requests 200m, and duplicating that here would create
  # a second source of truth for a value nobody overrode.
  resources:
    limits:
      memory: 768Mi
    requests:
      memory: 768Mi

  # -- Leader election. `enable` is the correct upstream key and defaults to
  # true. The old CLI passed a misspelled `leaderElection.enabled=false` that
  # Helm silently ignored — leader election has never actually been off, so
  # true is behavior-preserving. Setting false here would be a NEW change.
  leaderElection:
    enable: true

  # ── Pinned for safety (restating upstream defaults on purpose) ─────────────
  # -- Create the cluster-scoped ClusterRoles/ClusterRoleBindings. true for the
  # primary operator, which owns them. false is the ADDITIONAL-operator shape
  # (values-namespace-scope.yaml): the fixed-name roles come from the primary's
  # release, and `globalBindings.enabled: true` restores the three bindings
  # this flag skips — on its own, false leaves the operator's ServiceAccount
  # unbound from strimzi-cluster-operator-global and the two delegation roles.
  createGlobalResources: true
  # -- Aggregate ClusterRoles that extend existing roles with Strimzi CRD access
  createAggregateRoles: false
  rbac:
    # -- Create the operator's RBAC resources
    create: true
  # -- Create the operator ServiceAccount
  serviceAccountCreate: true
  # -- Operator ServiceAccount name. Upstream templates the RBAC subjects and
  # the Deployment's serviceAccountName from this value, so it is genuinely
  # overridable. What is NOT overridable is the Deployment's own name, which
  # upstream hardcodes to `strimzi-cluster-operator` — the Helm tests key on
  # that literal, not on this value.
  serviceAccount: strimzi-cluster-operator

  # ── Off by default — these are uplifts, enable via values-prod.yaml ────────
  # -- PodDisruptionBudget for the operator Deployment
  podDisruptionBudget:
    enabled: false
  # -- NetworkPolicy for the operator Deployment (does NOT affect operator-
  # generated policies for Kafka operands)
  operatorNetworkPolicy:
    enabled: false
  # -- The operator's nine Grafana dashboards (Kafka, KRaft, Cruise Control,
  # Kafka Exporter, Connect, MirrorMaker 2, Kafka Bridge, Kafka OAuth,
  # operators), as ConfigMaps a Grafana
  # sidecar picks up by label. They read exactly the series the exporter rules
  # vendored in kafka-cluster produce; kafka-cluster 1.0 ships no dashboards of
  # its own. Names are fixed, so enable them on ONE operator release (the
  # namespace-scope overlay turns them off).
  dashboards:
    enabled: true
    # -- Namespace of the ConfigMaps (empty: the release namespace)
    namespace: ""
    label: grafana_dashboard
    labelValue: "1"

  # -- Pod-level security context for the operator. Empty = live behavior;
  # hardening is an opt-in uplift in values-prod.yaml.
  podSecurityContext: {}
  # -- Container-level security context for the operator. Empty = live behavior.
  securityContext: {}

  # NOTE: defaultImageTag is deliberately NOT pinned — upstream defaults it to
  # its own appVersion, so pinning would duplicate the version pin.
