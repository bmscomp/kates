{{- if .Values.operatorPolicy.enabled }}
{{- /*
DNS and API server egress for this release's own pods that are not the
operator: the CRD upgrade Job (which also fetches its bundle over HTTPS) and
the Helm tests (kubectl). A hook ahead of the Job, since a pre-install Job runs
before any ordinary resource exists; never deleted after it succeeds, so the
tests have it too. Helm leaves hook resources behind on uninstall.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "strimzi-operator.fullname" . }}-jobs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strimzi-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  podSelector:
    matchLabels:
      {{- include "strimzi-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
{{- end }}
