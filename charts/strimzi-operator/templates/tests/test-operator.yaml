{{- $op := index .Values "strimzi-kafka-operator" -}}
{{- $kubectl := include "strimzi-operator.kubectlImage" . }}
{{- $testSA := printf "%s-test" (include "strimzi-operator.fullname" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $testSA }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strimzi-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $testSA }}
  labels:
    {{- include "strimzi-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # Read pods so the failure diagnostic below can actually run. Without this
  # the diagnostic prints Forbidden at exactly the moment it is needed.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Prod-invariant assertions read the operator's PDB and NetworkPolicy.
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $testSA }}
  labels:
    {{- include "strimzi-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $testSA }}
subjects:
  - kind: ServiceAccount
    name: {{ $testSA }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "strimzi-operator.fullname" . }}-test-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strimzi-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ $testSA }}
  securityContext:
    {{- include "strimzi-operator.podSecurityContext" . | nindent 4 }}
  containers:
    - name: test
      image: {{ $kubectl }}
      securityContext:
        {{- include "strimzi-operator.containerSecurityContext" . | nindent 8 }}
      command: ['sh', '-c']
      args:
        - |
          echo "Waiting for the cluster operator to become Available..."
          # The Deployment name is hardcoded upstream and is NOT derived from
          # .Values.serviceAccount (that only sets serviceAccountName).
          if kubectl wait --for=condition=Available \
            deploy/strimzi-cluster-operator \
            -n {{ .Release.Namespace }} --timeout=180s; then
            echo "✅ Cluster operator Available"
            exit 0
          fi
          echo "❌ Cluster operator not Available"
          kubectl get pods -n {{ .Release.Namespace }}
          exit 1
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "strimzi-operator.fullname" . }}-test-crds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strimzi-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ $testSA }}
  securityContext:
    {{- include "strimzi-operator.podSecurityContext" . | nindent 4 }}
  containers:
    - name: test
      image: {{ $kubectl }}
      securityContext:
        {{- include "strimzi-operator.containerSecurityContext" . | nindent 8 }}
      command: ['sh', '-c']
      args:
        - |
          echo "Verifying Strimzi CRDs are Established..."
          CRDS="kafkas.kafka.strimzi.io \
                kafkaconnects.kafka.strimzi.io \
                kafkatopics.kafka.strimzi.io \
                kafkausers.kafka.strimzi.io \
                kafkanodepools.kafka.strimzi.io \
                kafkabridges.kafka.strimzi.io \
                kafkaconnectors.kafka.strimzi.io \
                kafkamirrormaker2s.kafka.strimzi.io \
                kafkarebalances.kafka.strimzi.io \
                strimzipodsets.core.strimzi.io"
          FAIL=0
          for crd in $CRDS; do
            if kubectl wait --for=condition=Established "crd/${crd}" --timeout=60s >/dev/null 2>&1; then
              echo "  ✅ ${crd}"
            else
              echo "  ❌ ${crd} not Established"
              FAIL=$((FAIL + 1))
            fi
          done
          if [ "$FAIL" -gt 0 ]; then
            echo "❌ ${FAIL} CRD(s) not Established"
            exit 1
          fi
          echo "✅ All 10 Strimzi CRDs Established"
{{- if $op.watchAnyNamespace }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "strimzi-operator.fullname" . }}-test-watch-scope
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strimzi-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ $testSA }}
  securityContext:
    {{- include "strimzi-operator.podSecurityContext" . | nindent 4 }}
  containers:
    - name: test
      image: {{ $kubectl }}
      securityContext:
        {{- include "strimzi-operator.containerSecurityContext" . | nindent 8 }}
      command: ['sh', '-c']
      args:
        - |
          # Defense-in-depth. The chart default makes a watch-scope collapse
          # unreachable today, but the subchart's values block keeps
          # additionalProperties: true (upstream has ~40 keys that drift every
          # release), so a typo inside that block stays silent. This assertion
          # is what makes it loud.
          echo "Asserting the operator watches ALL namespaces..."
          SCOPE=$(kubectl get deploy strimzi-cluster-operator \
            -n {{ .Release.Namespace }} \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="STRIMZI_NAMESPACE")].value}')
          echo "  STRIMZI_NAMESPACE=${SCOPE:-<unset>}"
          if [ "${SCOPE}" = "*" ]; then
            echo "✅ Watch scope is cluster-wide as configured"
            exit 0
          fi
          echo "❌ watchAnyNamespace=true but STRIMZI_NAMESPACE is not '*'."
          echo "   Kafka clusters outside {{ .Release.Namespace }} would go UNMANAGED."
          exit 1
{{- end }}
{{- if or $op.podDisruptionBudget.enabled $op.operatorNetworkPolicy.enabled }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "strimzi-operator.fullname" . }}-test-prod-invariants
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strimzi-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ $testSA }}
  securityContext:
    {{- include "strimzi-operator.podSecurityContext" . | nindent 4 }}
  containers:
    - name: test
      image: {{ $kubectl }}
      securityContext:
        {{- include "strimzi-operator.containerSecurityContext" . | nindent 8 }}
      command: ['sh', '-c']
      args:
        - |
          FAIL=0
          {{- if $op.podDisruptionBudget.enabled }}
          # The runtime form of scripts/check-pdb-safety.sh: a PDB whose
          # minAvailable is >= the operator's replica count makes the pod
          # un-evictable and blocks node drains forever.
          echo "Checking the operator PodDisruptionBudget is drain-safe..."
          REPLICAS=$(kubectl get deploy strimzi-cluster-operator -n {{ .Release.Namespace }} -o jsonpath='{.spec.replicas}')
          PDB_JSON=$(kubectl get pdb -n {{ .Release.Namespace }} \
            -o jsonpath='{range .items[*]}{.spec.minAvailable}{"\n"}{end}' 2>/dev/null)
          if [ -z "${PDB_JSON}" ]; then
            echo "  ❌ podDisruptionBudget.enabled but no PDB found"
            FAIL=$((FAIL + 1))
          else
            MINA=$(echo "${PDB_JSON}" | head -1)
            echo "  replicas=${REPLICAS} minAvailable=${MINA}"
            # Integer compare only; skip percentage budgets.
            case "${MINA}" in
              ''|*[!0-9]*) echo "  (non-integer minAvailable, skipping numeric check)" ;;
              *) if [ "${REPLICAS}" -gt "${MINA}" ]; then
                   echo "  ✅ at least one operator pod is always evictable"
                 else
                   echo "  ❌ minAvailable ${MINA} >= replicas ${REPLICAS}: node drains will block"
                   FAIL=$((FAIL + 1))
                 fi ;;
            esac
          fi
          {{- end }}
          {{- if $op.operatorNetworkPolicy.enabled }}
          echo "Checking the operator NetworkPolicy exists..."
          if [ "$(kubectl get networkpolicy -n {{ .Release.Namespace }} --no-headers 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "  ✅ NetworkPolicy present"
          else
            echo "  ❌ operatorNetworkPolicy.enabled but no NetworkPolicy found"
            FAIL=$((FAIL + 1))
          fi
          {{- end }}
          if [ "${FAIL}" -gt 0 ]; then
            echo "❌ ${FAIL} production invariant(s) failed"
            exit 1
          fi
          echo "✅ Production invariants hold"
{{- end }}
