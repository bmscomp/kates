apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apicurio-registry.fullname" . }}
  labels:
    {{- include "apicurio-registry.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "apicurio-registry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "apicurio-registry.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "apicurio-registry.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ include "apicurio-registry.kafkaBootstrapServers" . }}
            {{- if .Values.global.kafka.securityProtocol }}
            - name: QUARKUS_KAFKA_STREAMS_SECURITY_PROTOCOL
              value: {{ .Values.global.kafka.securityProtocol | quote }}
            - name: KAFKA_SECURITY_PROTOCOL
              value: {{ .Values.global.kafka.securityProtocol | quote }}
            {{- end }}
            {{- if .Values.global.kafka.saslMechanism }}
            - name: QUARKUS_KAFKA_STREAMS_SASL_MECHANISM
              value: {{ .Values.global.kafka.saslMechanism | quote }}
            - name: KAFKA_SASL_MECHANISM
              value: {{ .Values.global.kafka.saslMechanism | quote }}
            {{- end }}
            {{- if .Values.global.kafka.saslJaasConfigSecretName }}
            - name: QUARKUS_KAFKA_STREAMS_SASL_JAAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.kafka.saslJaasConfigSecretName }}
                  key: sasl.jaas.config
            - name: KAFKA_SASL_JAAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.kafka.saslJaasConfigSecretName }}
                  key: sasl.jaas.config
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
