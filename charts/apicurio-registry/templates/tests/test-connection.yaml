apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "apicurio-registry.fullname" . }}-test-connection"
  labels:
    {{- include "apicurio-registry.podLabels" (dict "ctx" . "labels" (include "apicurio-registry.labels" .)) | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.tests.podSecurityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: registry-api
      # From image.registry like the registry itself, so one mirror serves both.
      image: "{{ .Values.image.registry }}/{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      command: ['curl']
      # Hits the v3 REST API, not just the HTTP listener: proves the app is
      # up, storage initialised, and the API surface actually served.
      args: ['-fsS', '--max-time', '30', 'http://{{ include "apicurio-registry.fullname" . }}:{{ .Values.service.port }}/apis/registry/v3/system/info']
      {{- with .Values.tests.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tests.resources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  restartPolicy: Never
