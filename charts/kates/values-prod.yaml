# No image.tag here: values.yaml carries the release pin, and it has to name a
# release with the health endpoints the probes use (>= 1.22.0). A second pin
# in an overlay does not move with it. values-native.yaml carries the matching
# <appVersion>-native pin, which has to move by hand.
image:
  repository: ghcr.io/bmscomp/kates
  pullPolicy: Always

# The heap is sized against the memory LIMIT: -Xmx2560m is 62.5% of 4Gi. The
# rest is what the JVM holds outside the heap — metaspace, thread stacks,
# direct buffers, the code cache, ZGC's own structures. A heap at or above the
# limit gets the container OOMKilled under load, with nothing in the Java log
# to say why. Change the two together and keep the heap at no more than ~70%
# of the limit.
resources:
  requests:
    memory: "2Gi"
    cpu: "500m"
  limits:
    memory: "4Gi"
    cpu: "1000m"

jvm:
  options: "-Xms512m -Xmx2560m -XX:+UseZGC -XX:+ZGenerational"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: "50%"
  maxUnavailable: ""

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: kates

networkPolicy:
  enabled: true

lifecycle:
  preStopSleepSeconds: 10

terminationGracePeriodSeconds: 90

metrics:
  serviceMonitor:
    enabled: true
    interval: "15s"
  prometheusRule:
    enabled: true

# Fail rendering if insecure chart defaults would reach production.
productionMode: true

postgresql:
  enabled: false

externalDatabase:
  enabled: true
  # productionMode requires real credentials here. Point existingSecret at a
  # Secret carrying the password (key: password), e.g. one provisioned by
  # your secrets operator:
  # existingSecret: "kates-db-credentials"

backup:
  enabled: true
  schedule: "0 1 * * *"
  retention: 30
  persistence:
    enabled: true
    size: 50Gi

cleanup:
  enabled: true
  schedule: "0 3 * * 0"
  retentionDays: 90

defaults:
  replicationFactor: "3"
  partitions: "6"
  minInsyncReplicas: "2"
