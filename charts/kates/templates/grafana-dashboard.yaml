{{- if .Values.metrics.grafanaDashboard.enabled }}
{{- /*
The board lives in dashboards/kates-overview/, built from its board.py by
scripts/gen-dashboards.py, which also writes the copy this template loads —
Helm cannot read a file outside its own chart directory, and
`gen-dashboards.py --check` fails when the two drift.
dashboards/kates-overview/README.md is its documentation.

This used to be 130 lines of hand-written JSON inside this template, with the
release fullname interpolated into 16 of its 21 expressions as a literal
`job=` selector. Eleven of the names in it did not exist; five of those were
renamable in place — three Agroal metrics spelled `agroal_pool_*` where
Quarkus publishes `agroal_*`, plus `kates_active_runs` and
`kates_benchmark_throughput_records_per_sec` — and the other six took three
panels with them, `kates_benchmark_p99_latency_ms` among them. The board is
now scoped by a `$job` template variable instead, so nothing has to be
injected here and one copy serves every release in a Grafana.
dashboards/kates-overview/README.md has the full arithmetic.

ConfigMap name, namespace, labels and data key are unchanged, so an existing
install keeps the same object and the sidecar keeps picking it up.
*/}}
{{- $file := "files/dashboards/kates-overview.json" }}
{{- $board := .Files.Get $file }}
{{- if not $board }}
{{- fail (printf "kates: %s is missing from the chart. It is generated from dashboards/kates-overview/ — run scripts/gen-dashboards.py." $file) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kates.fullname" . }}-grafana-dashboard
  labels:
    {{- include "kates.labels" . | nindent 4 }}
    {{- with .Values.metrics.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  kates-dashboard.json: |-
    {{- $board | nindent 4 }}
{{- end }}
