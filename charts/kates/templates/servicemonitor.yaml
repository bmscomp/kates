{{- /*
The API check matches every other chart in this repository: without it, the
flag on a cluster that has no prometheus-operator fails the whole release at
apply time with "no matches for kind ServiceMonitor".
*/ -}}
{{- if and .Values.metrics.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kates.fullname" . }}
  labels:
    {{- include "kates.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if .Values.metrics.serviceMonitor.namespace }}
  namespace: {{ .Values.metrics.serviceMonitor.namespace }}
  {{- end }}
spec:
  endpoints:
    - port: http
      path: /q/metrics
      interval: {{ .Values.metrics.serviceMonitor.interval | default "30s" }}
      {{- if .Values.metrics.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      {{- end }}
      {{- with .Values.metrics.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metrics.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  # A ServiceMonitor matches the Service's labels, which are kates.labels —
  # not the pod selector, whose `app:` the Service does not carry. Selecting
  # on kates.selectorLabels matched nothing, silently: Prometheus discovered
  # the endpoints and dropped every one of them.
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kates.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
