{{- /* Embedded PostgreSQL — dev/test convenience only: single replica, no
       replication. productionMode fails rendering if this is enabled (see
       secret.yaml); production deployments use externalDatabase. */}}
{{- if .Values.postgresql.enabled }}
{{- $image := include "kates.imageRef" (dict "image" (printf "%s:%s" .Values.postgresql.image.repository .Values.postgresql.image.tag) "ctx" .) }}
{{- /* musl and glibc sort text differently, so a switch under existing data
       leaves text indexes that miss rows. lookup finds nothing under helm
       template: the check-libc init container below covers that case. */}}
{{- $running := lookup "apps/v1" "StatefulSet" .Release.Namespace (include "kates.postgresql.fullname" .) }}
{{- if and $running (not .Values.postgresql.allowLibcChange) }}
  {{- $was := (index $running.spec.template.spec.containers 0).image }}
  {{- if ne (contains "alpine" $was) (contains "alpine" $image) }}
    {{- fail (printf "postgresql.image: this release's database runs on %s and the new image is %s. Alpine and Debian sort text differently, so switching under existing data breaks its text indexes. Stay on the same libc (postgresql.image.tag=16.15 is Debian), or move with the steps under Change the PostgreSQL libc in the upgrade playbook of the book" $was $image) }}
  {{- end }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kates.postgresql.fullname" . }}
  labels:
    {{- include "kates.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ include "kates.postgresql.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kates.postgresql.fullname" . }}
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        {{- /* instance is not in the selector: it lets kyvernoPolicy.exceptions match this pod */}}
        {{- $own := printf "app.kubernetes.io/name: %s\napp.kubernetes.io/component: database\napp.kubernetes.io/instance: %s" (include "kates.postgresql.fullname" .) .Release.Name }}
        {{- include "kates.podLabels" (dict "labels" $own "ctx" .) | nindent 8 }}
    spec:
      {{- with include "kates.imagePullSecrets" . }}{{ . | nindent 6 }}{{ end }}
      {{- with .Values.postgresql.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      # Runs whatever rendered the chart, so it also stops Argo CD and a
      # reinstall onto a retained volume, which the lookup above cannot see.
      - name: check-libc
        image: {{ $image | quote }}
        {{- with .Values.postgresql.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        env:
        - name: ALLOW_LIBC_CHANGE
          value: {{ .Values.postgresql.allowLibcChange | quote }}
        command:
        - sh
        - -c
        - |
          marker=/var/lib/postgresql/data/.libc
          libc=glibc
          if [ -f /etc/alpine-release ]; then libc=musl; fi
          if [ -f /var/lib/postgresql/data/pgdata/PG_VERSION ]; then
            # Data older than this check has no marker: it ran the Debian default.
            was=$(cat "$marker" 2>/dev/null || echo glibc)
            if [ "$was" != "$libc" ] && [ "$ALLOW_LIBC_CHANGE" != true ]; then
              echo "This data was written on $was and this image uses $libc: switching breaks text indexes. See Change the PostgreSQL libc in the upgrade playbook of the book." >&2
              exit 1
            fi
          fi
          echo "$libc" > "$marker"
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          {{- toYaml .Values.postgresql.resources | nindent 10 }}
      containers:
      - name: postgresql
        image: {{ $image | quote }}
        {{- with .Values.postgresql.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: 5432
          name: postgres
          protocol: TCP
        env:
        - name: POSTGRES_DB
          value: {{ .Values.postgresql.auth.database | quote }}
        - name: POSTGRES_USER
          value: {{ .Values.postgresql.auth.username | quote }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "kates.dbSecretName" . }}
              key: {{ include "kates.dbPasswordKey" . }}
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: run-postgresql
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp
        resources:
          {{- toYaml .Values.postgresql.resources | nindent 10 }}
        readinessProbe:
          exec:
            command: ['pg_isready', '-U', {{ .Values.postgresql.auth.username | quote }}]
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ['pg_isready', '-U', {{ .Values.postgresql.auth.username | quote }}]
          initialDelaySeconds: 10
          periodSeconds: 30
      volumes:
      - name: run-postgresql
        emptyDir: {}
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      {{- if .Values.postgresql.storage.storageClass }}
      storageClassName: {{ .Values.postgresql.storage.storageClass | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.postgresql.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kates.postgresql.fullname" . }}
  labels:
    {{- include "kates.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "kates.postgresql.fullname" . }}
    app.kubernetes.io/component: database
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
{{- end }}
