apiVersion: v1
kind: Pod
metadata:
  name: {{ include "kates.fullname" . }}-test
  labels:
    {{- include "kates.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    fsGroup: 100
  containers:
  - name: health-check
    image: curlimages/curl:8.7.1
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        memory: "32Mi"
        cpu: "25m"
      limits:
        memory: "64Mi"
        cpu: "100m"
    command:
      - sh
      - -c
      - |
        # Asserts on the READINESS endpoint, the same one the kubelet probes.
        # `/api/health` is a Kafka reachability report, not an app health check:
        # it returns non-200 whenever the brokers are down, which is a normal
        # state for a chaos-testing tool and used to fail `helm test` on any
        # cluster without a live Kafka. Its body is still printed below as
        # diagnostics, but it does not decide the result.
        BASE=http://{{ include "kates.fullname" . }}:{{ .Values.service.port }}
        READY_PATH={{ .Values.probes.readiness.path | default "/q/health/ready" | quote }}
        echo "Testing KATES readiness endpoint ($READY_PATH)..."
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE$READY_PATH")
        if [ "$STATUS" = "200" ]; then
          echo "Readiness check passed (HTTP $STATUS)"
          curl -s "$BASE$READY_PATH"
          echo ""
          echo "Kafka reachability (informational, non-200 is not a failure):"
          curl -s -o /dev/null -w "  /api/health -> %{http_code}\n" "$BASE/api/health"
          curl -s "$BASE/api/health"
          exit 0
        else
          echo "Readiness check failed (HTTP $STATUS)"
          curl -s "$BASE$READY_PATH"
          exit 1
        fi
