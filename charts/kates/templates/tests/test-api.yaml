apiVersion: v1
kind: Pod
metadata:
  name: {{ include "kates.fullname" . }}-test-api
  labels:
    {{- include "kates.podLabels" (dict "labels" (include "kates.labels" .) "ctx" .) | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- with include "kates.imagePullSecrets" . }}{{ . | nindent 2 }}{{ end }}
  {{- with .Values.securityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
  - name: api-check
    {{- $t := .Values.helmTests | default dict }}
    image: {{ include "kates.imageRef" (dict "image" ($t.image | default "curlimages/curl:8.7.1") "ctx" .) | quote }}
    {{- with .Values.containerSecurityContext }}
    securityContext:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $t.resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    command:
      - sh
      - -c
      - |
        PASS=0
        FAIL=0
        check() {
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$1")
          if [ "$CODE" = "$2" ]; then
            echo "PASS $1 -> $CODE"
            PASS=$((PASS+1))
          else
            echo "FAIL $1 -> $CODE (expected $2)"
            FAIL=$((FAIL+1))
          fi
        }
        BASE="http://{{ include "kates.fullname" . }}:{{ .Values.service.port }}"
        check "$BASE/q/health/live" 200
        check "$BASE/q/health/ready" 200
        check "$BASE/q/health/started" 200
        check "$BASE/q/openapi" 200
        # NOT asserted: /api/health reports Kafka reachability and returns
        # non-200 when the brokers are down — a normal condition here, and one
        # the readiness probe above deliberately ignores. Reported only.
        echo "INFO $BASE/api/health -> $(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/health")"
        echo ""
        echo "Results: $PASS passed, $FAIL failed"
        [ "$FAIL" -eq 0 ]
