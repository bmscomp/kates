apiVersion: v1
kind: Pod
metadata:
  name: {{ include "kates.fullname" . }}-test-kafka
  labels:
    {{- include "kates.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    fsGroup: 100
  containers:
  - name: kafka-check
    image: curlimages/curl:8.7.1
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    {{- if .Values.apiKey.enabled }}
    env:
    - name: KATES_API_KEY
      valueFrom:
        secretKeyRef:
          name: {{ .Values.apiKey.existingSecret | default (printf "%s-api-key" (include "kates.fullname" .)) }}
          key: {{ .Values.apiKey.secretKey | default "api-key" }}
          optional: true
    {{- end }}
    resources:
      requests:
        memory: "32Mi"
        cpu: "25m"
      limits:
        memory: "64Mi"
        cpu: "100m"
    volumeMounts:
    - name: tmp
      mountPath: /tmp
    command:
      - sh
      - -c
      - |
        # /api/cluster is authenticated. Without the key this test got a 401
        # and reported it as "Kafka may be unreachable", then exited 0 — so it
        # passed on every cluster, including ones with no Kafka at all.
        echo "Testing Kafka connectivity via KATES API..."
        CODE=$(curl -s -o /tmp/body -w "%{http_code}" \
          ${KATES_API_KEY:+-H "X-API-Key: ${KATES_API_KEY}"} \
          http://{{ include "kates.fullname" . }}:{{ .Values.service.port }}/api/cluster)
        BODY=$(cat /tmp/body 2>/dev/null)
        echo "HTTP $CODE"
        echo "$BODY" | head -20
        case "$CODE" in
          200)
            echo "PASS: Kafka cluster reachable"
            exit 0
            ;;
          401|403)
            # The test's own credentials, not the cluster's health. Warning
            # about Kafka here is what hid the problem in the first place.
            echo "FAIL: the API rejected this test's key (HTTP $CODE)."
            echo "      Check the ${KATES_API_KEY:+existing }api-key Secret and apiKey.enabled."
            exit 1
            ;;
          000)
            echo "FAIL: Kates API not reachable at all"
            exit 1
            ;;
          *)
            # A Kafka-testing tool routinely runs against brokers that are down,
            # partitioned or mid-experiment, so this stays a warning — but only
            # once the two failures above have been ruled out.
            echo "WARN: Kates responded but Kafka is unreachable (HTTP $CODE)"
            exit 0
            ;;
        esac
  volumes:
  - name: tmp
    emptyDir: {}
