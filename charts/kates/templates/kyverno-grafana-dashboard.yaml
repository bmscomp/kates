{{- if and .Values.kyvernoPolicy.enabled .Values.kyvernoPolicy.grafanaDashboard (.Capabilities.APIVersions.Has "kyverno.io/v1") }}
{{- /*
The board lives in dashboards/kyverno-security/, built from its board.py by
scripts/gen-dashboards.py, which also writes the copy this template loads —
Helm cannot read a file outside its own chart directory, and
`gen-dashboards.py --check` fails when the two drift.
dashboards/kyverno-security/README.md is its documentation.

Nothing is injected here. One Kyverno per cluster means one board: the uid
and the title are fixed, and the only namespace on the board is Kyverno's own
(`namespace="kyverno"` on the controller-pod panel), which is neither this
release's namespace nor the one this ConfigMap is delivered to.

This chart has no kafka-common dependency, so the ConfigMap stays hand-built
here rather than calling kafka-common.dashboardConfigMap — same name, same
namespace, same labels, same data key as before. It carries no grafana_folder
annotation, which is also unchanged: the sidecar files it wherever its
default folder is.
*/}}
{{- $file := "files/dashboards/kyverno-security.json" }}
{{- $board := .Files.Get $file }}
{{- if not $board }}
{{- fail (printf "kates: %s is missing from the chart. It is generated from dashboards/kyverno-security/ — run scripts/gen-dashboards.py." $file) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kates.fullname" . }}-kyverno-dashboard
  namespace: {{ .Values.kyvernoPolicy.grafanaDashboardNamespace | default "monitoring" }}
  labels:
    {{- include "kates.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  kyverno-security.json: |-
    {{- $board | nindent 4 }}
{{- end }}
