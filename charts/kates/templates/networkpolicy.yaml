{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kates.fullname" . }}
  labels:
    {{- include "kates.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kates.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Kubelet probes (and other general ingress for now to prevent probe drops)
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8080
          protocol: TCP
        - port: 9000
          protocol: TCP
    {{- with .Values.networkPolicy.ingressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The Kubernetes API, for chaos faults, pod listing, KafkaTopic CRs and the
    # orphan reconciler; 6443 is the API server's own port after the Service DNAT.
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    {{- if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "kates.postgresql.fullname" . }}
              app.kubernetes.io/component: database
      ports:
        - port: 5432
          protocol: TCP
    {{- end }}
    {{- if .Values.externalDatabase.enabled }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: {{ .Values.externalDatabase.port | default 5432 }}
          protocol: TCP
    {{- end }}
    {{- if .Values.networkPolicy.cdcDatabase.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.cdcDatabase.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.cdcDatabase.podLabels | nindent 14 }}
      ports:
        - port: {{ .Values.networkPolicy.cdcDatabase.port | default 5432 }}
          protocol: TCP
    {{- end }}
    # The brokers, and the Trogdor coordinator on 8889 where the default
    # trogdor.coordinatorUrl puts it.
    # shortcut: a coordinator in another namespace needs a networkPolicy.egressRules entry.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ tpl (.Values.networkPolicy.kafka.namespace | default "kafka") . | quote }}
      ports:
        - port: {{ .Values.networkPolicy.kafka.port | default 9092 }}
          protocol: TCP
        - port: 8889
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheus.namespace | default "monitoring" }}
      ports:
        - port: {{ .Values.networkPolicy.prometheus.port | default 9090 }}
          protocol: TCP
    {{- with .Values.networkPolicy.egressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}

{{- if and .Values.networkPolicy.enabled .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kates.postgresql.fullname" . }}
  labels:
    {{- include "kates.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kates.postgresql.fullname" . }}
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "kates.selectorLabels" . | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
