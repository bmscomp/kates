{{- if .Values.apiKey.enabled }}
{{- if not .Values.apiKey.existingSecret }}
{{- /*
  The key must survive an upgrade.

  This was `randAlphaNum 32` evaluated inline, and Helm evaluates templates on
  every `helm upgrade` — so every redeploy silently rotated the key. The pod
  picked up the new one, every client kept the old one, and the only symptom was

      ✖ Failed to get cluster info: [403] Invalid API key

  from a CLI that had been working a minute earlier, with nothing in any log
  connecting it to the deploy that caused it.

  So an existing secret's value is read back and reused. `lookup` returns
  nothing under `helm template` and `--dry-run`, which is correct: those render
  a throwaway value and never reach the cluster.
*/}}
{{- $name := printf "%s-api-key" (include "kates.fullname" .) }}
{{- $key := .Values.apiKey.secretKey | default "api-key" }}
{{- $value := .Values.apiKey.value }}
{{- if not $value }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
  {{- if and $existing $existing.data (index $existing.data $key) }}
    {{- $value = index $existing.data $key | b64dec }}
  {{- else }}
    {{- $value = randAlphaNum 32 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kates.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
