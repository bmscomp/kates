{{- if .Values.backup.enabled }}
{{- if not .Values.postgresql.enabled }}{{- fail "backup.enabled: the backup CronJob dumps the bundled PostgreSQL (postgresql.enabled) only, so with externalDatabase no backup would run. Back the external database up with its own tooling and set backup.enabled=false." }}{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "kates.fullname" . }}-backup
  labels:
    {{- include "kates.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.backup.retention }}
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        {{- include "kates.labels" . | nindent 8 }}
        app.kubernetes.io/component: backup
    spec:
      template:
        metadata:
          labels:
            {{- $own := printf "%s\napp.kubernetes.io/component: backup" (include "kates.selectorLabels" .) }}
            {{- include "kates.podLabels" (dict "labels" $own "ctx" .) | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          {{- with include "kates.imagePullSecrets" . }}{{ . | nindent 10 }}{{ end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
          - name: pg-backup
            image: {{ include "kates.imageRef" (dict "image" .Values.backup.image "ctx" .) | quote }}
            {{- with .Values.containerSecurityContext }}
            securityContext:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            command:
              - sh
              - -c
              - |
                # Without pipefail a failed pg_dump still left gzip's valid,
                # empty archive, the job passed, and the prune below deleted
                # the real backups. The dump is written as .partial and named
                # only once it succeeds, so a failed try (OnFailure retries in
                # the same pod) leaves no archive a restore would pick.
                set -eo pipefail
                TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                FILENAME="/backups/kates-${TIMESTAMP}.sql.gz"
                rm -f /backups/kates-*.sql.gz.partial
                echo "Starting backup to ${FILENAME}..."
                pg_dump -h {{ include "kates.postgresql.fullname" . }} \
                  -U "${PGUSER}" \
                  -d "${PGDATABASE}" \
                  --no-password \
                  | gzip > "${FILENAME}.partial"
                mv "${FILENAME}.partial" "${FILENAME}"
                echo "Backup complete: $(du -sh ${FILENAME})"
                echo "Pruning backups older than {{ .Values.backup.retention }} days..."
                find /backups -name "kates-*.sql.gz" -mtime +{{ .Values.backup.retention }} -delete
                echo "Done."
            env:
              - name: PGUSER
                value: {{ include "kates.dbUsername" . | quote }}
              - name: PGPASSWORD
                valueFrom:
                  secretKeyRef:
                    name: {{ include "kates.dbSecretName" . }}
                    key: {{ include "kates.dbPasswordKey" . }}
              - name: PGDATABASE
                value: {{ .Values.postgresql.auth.database | quote }}
            volumeMounts:
              - name: backup-storage
                mountPath: /backups
            resources:
              {{- toYaml .Values.backup.resources | nindent 14 }}
          volumes:
            - name: backup-storage
              {{- if .Values.backup.persistence.enabled }}
              persistentVolumeClaim:
                claimName: {{ .Values.backup.persistence.existingClaim | default (printf "%s-backup" (include "kates.fullname" .)) }}
              {{- else }}
              emptyDir: {}
              {{- end }}
---
{{- if and .Values.backup.persistence.enabled (not .Values.backup.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kates.fullname" . }}-backup
  labels:
    {{- include "kates.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.backup.persistence.storageClass }}
  storageClassName: {{ .Values.backup.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.persistence.size | default "5Gi" }}
{{- end }}
{{- end }}
