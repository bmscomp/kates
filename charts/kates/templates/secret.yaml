{{- /* Production guard rails — fail loudly instead of shipping insecure or
       empty credentials. Enabled via productionMode (values-prod.yaml). */}}
{{- if .Values.productionMode }}
  {{- if .Values.postgresql.enabled }}
    {{- fail "productionMode: the embedded PostgreSQL StatefulSet is single-replica and intended for dev/test only. Use externalDatabase with existingSecret in production." }}
  {{- end }}
  {{- if and .Values.externalDatabase.enabled (not .Values.externalDatabase.existingSecret) (not .Values.externalDatabase.password) }}
    {{- fail "productionMode: externalDatabase has no credentials. Set externalDatabase.existingSecret (recommended) or externalDatabase.password." }}
  {{- end }}
{{- end }}
{{- $createSecret := false -}}
{{- if .Values.postgresql.enabled -}}
  {{- if not .Values.postgresql.auth.existingSecret -}}
    {{- $createSecret = true -}}
  {{- end -}}
{{- else if .Values.externalDatabase.enabled -}}
  {{- if not .Values.externalDatabase.existingSecret -}}
    {{- $createSecret = true -}}
  {{- end -}}
{{- end -}}
{{- if $createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kates.fullname" . }}-db
  labels:
    {{- include "kates.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  QUARKUS_DATASOURCE_USERNAME: {{ .Values.postgresql.auth.username | quote }}
  QUARKUS_DATASOURCE_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  {{- else if .Values.externalDatabase.enabled }}
  QUARKUS_DATASOURCE_USERNAME: {{ .Values.externalDatabase.username | quote }}
  QUARKUS_DATASOURCE_PASSWORD: {{ .Values.externalDatabase.password | quote }}
  {{- end }}
{{- end }}
