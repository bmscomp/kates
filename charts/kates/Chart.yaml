apiVersion: v2
name: kates
description: Kates — Kafka Advanced Testing & Engineering Suite
type: application
# Minor bump, not a patch: the default readiness path and startup probe
# thresholds changed, so a default install behaves differently after upgrade.
version: 0.7.0
# The non-blocking health endpoints this chart's probes now point at come from
# a BUILD-TIME property (quarkus.messaging.health.enabled=false), so they only
# exist in the image built from this branch. Keep appVersion and
# image.tag in values.yaml pinned to that release.
appVersion: "1.22.0"
keywords:
  - kafka
  - testing
  - benchmarking
  - chaos-engineering
  - performance
  - sla
home: https://github.com/bmscomp/kates
sources:
  - https://github.com/bmscomp/kates
maintainers:
  - name: bmscomp
    email: bmscomp@gmail.com
icon: https://raw.githubusercontent.com/bmscomp/kates/main/docs/icon.png
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
# No subchart dependencies: the bundled database is a self-contained
# StatefulSet on the official `postgres` image (templates/postgresql.yaml).
# For production HA, set postgresql.enabled=false and point externalDatabase
# at a managed cluster — CloudNativePG is the recommended non-Bitnami option.
