replicaCount: 2

image:
  pullPolicy: IfNotPresent

# The heap is sized against the memory LIMIT (half of it here, as in
# values-dev.yaml). The default -Xmx2560m would not fit in this limit at all.
resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "500m"

jvm:
  options: "-Xms256m -Xmx512m -XX:+UseZGC -XX:+ZGenerational"

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

networkPolicy:
  enabled: true

metrics:
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true

backup:
  enabled: true
  schedule: "0 3 * * *"
  retention: 14
  persistence:
    enabled: true
    size: 10Gi

cleanup:
  enabled: true
  retentionDays: 60

defaults:
  replicationFactor: "2"
  partitions: "3"
  minInsyncReplicas: "1"
