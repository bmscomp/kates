# Kind cluster overlay — layers on top of values-dev.yaml
# Usage: helm upgrade --install ... -f values-dev.yaml -f values-kind.yaml
#
# This file deliberately does NOT set image.repository/tag. `kates deploy`
# adds -f values-native-local.yaml AFTER this one on a kind cluster, so the
# backend runs the native image built from the working tree
# (kates:native-local, pullPolicy: Never) while everything below — NodePort
# service, tolerations, production features off — still applies. Setting an
# image here would be overridden anyway, and installing this file by hand
# leaves the chart default: ghcr.io/bmscomp/kates:<appVersion>, which is only
# pullable once that version has actually been published.

image:
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

jvm:
  options: "-Xms512m -Xmx1024m -XX:+UseZGC"


service:
  type: NodePort
  nodePort: "30083"

grpc:
  nodePort: "30084"

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

# Disable production features not needed locally
networkPolicy:
  enabled: false

metrics:
  serviceMonitor:
    enabled: false
  prometheusRule:
    enabled: false
  grafanaDashboard:
    enabled: false

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

backup:
  enabled: false

cleanup:
  enabled: false
