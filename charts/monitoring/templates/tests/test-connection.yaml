{{- if (index .Values "kube-prometheus-stack").enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-monitoring-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml (merge (include "kates-monitoring.labels" . | fromYaml) (.Values.podLabels | default dict)) | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- with (.Values.global).imagePullSecrets }}
  imagePullSecrets:
    {{- range . }}
    - name: {{ if kindIs "string" . }}{{ . }}{{ else }}{{ .name }}{{ end }}
    {{- end }}
  {{- end }}
  securityContext:
    {{- toYaml .Values.test.podSecurityContext | nindent 4 }}
  containers:
    - name: connection-test
      image: {{ with (.Values.global).imageRegistry }}{{ . }}/{{ end }}{{ .Values.test.image }}
      securityContext:
        {{- toYaml .Values.test.securityContext | nindent 8 }}
      resources:
        {{- toYaml .Values.test.resources | nindent 8 }}
      command:
        - sh
        - -c
        - |
          set -e
          echo "Checking Prometheus readiness..."
          # prometheus-operated is the operator-managed headless service —
          # its name is stable regardless of release name.
          curl -sf http://prometheus-operated.{{ .Release.Namespace }}.svc:9090/-/ready
          echo "Prometheus ready."
          echo "Checking Grafana health..."
          curl -sf http://{{ .Release.Name }}-grafana.{{ .Release.Namespace }}.svc/api/health
          echo "Grafana healthy."
{{- end }}
