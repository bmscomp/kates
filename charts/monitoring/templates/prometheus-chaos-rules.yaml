{{- /*
  The CRD check matches every other chart here (kafka-cluster, connect-cluster,
  strimzi-operator all render nothing without it) and this one was missing it.
  With chaosAlerts.enabled=true on a cluster that has no Prometheus Operator,
  the release failed at apply time with "no matches for kind PrometheusRule" —
  after the rest of the chart had already been installed.
*/ -}}
{{- if and .Values.chaosAlerts.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kafka-chaos-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kates-monitoring.labels" . | nindent 4 }}
spec:
  groups:
    - name: kafka-chaos-expected
      rules:
        # Alert ONLY during active chaos experiments
        - alert: KafkaChaosExperimentActive
          expr: |
            count(kube_customresource_chaosengine_status_engine_status{namespace="{{ .Values.kafkaNamespace }}", status="initialized"} == 1) > 0
          for: 0m
          labels:
            severity: info
            chaos: expected
          annotations:
            summary: "Chaos experiment is actively running in Kafka namespace"
            description: "A LitmusChaos experiment is currently in progress. Alerts may be expected."

    - name: kafka-chaos-unexpected
      rules:
        # Pod restart during NO active chaos = real issue
        - alert: KafkaBrokerRestartUnexpected
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="{{ .Values.kafkaNamespace }}", pod=~"krafter-pool-.*"}[5m]) > 0
            and on() count(kube_customresource_chaosengine_status_engine_status{namespace="{{ .Values.kafkaNamespace }}", status="initialized"} == 1) == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: 'Kafka broker {{ "{{ $labels.pod }}" }} restarted unexpectedly'
            description: 'Broker restarted without any active chaos experiment. Investigate immediately.'

        # High CPU after chaos completed = potential issue
        - alert: KafkaHighCPUPostChaos
          expr: |
            sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="{{ .Values.kafkaNamespace }}", pod=~"krafter-pool-.*", container="kafka"}[5m])) > 0.8
            and on() count(kube_customresource_chaosengine_status_engine_status{namespace="{{ .Values.kafkaNamespace }}", status="initialized"} == 1) == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'Kafka broker {{ "{{ $labels.pod }}" }} has high CPU after chaos'
            description: 'CPU usage is above 80% with no active chaos experiment.'

        # Kafka cluster not ready after chaos completed
        - alert: KafkaClusterNotReadyPostChaos
          expr: |
            kube_customresource_kafka_status_ready{namespace="{{ .Values.kafkaNamespace }}", name="krafter"} != 1
            and on() count(kube_customresource_chaosengine_status_engine_status{namespace="{{ .Values.kafkaNamespace }}", status="initialized"} == 1) == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Kafka cluster is not ready after chaos experiment"
            description: "The Kafka cluster has not recovered after chaos. Manual investigation required."

    - name: kafka-chaos-results
      rules:
        # Experiment failed
        - alert: ChaosExperimentFailed
          expr: |
            litmuschaos_failed_experiments > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Chaos experiment failed"
            description: "A chaos experiment has failed. Check Litmus UI for details."

        # Low probe success rate
        - alert: ChaosProbeSuccessLow
          expr: |
            litmuschaos_probe_success_percentage < 50
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: 'Chaos probe success rate is low'
            description: 'Probe success is {{ "{{ $value }}" }}%. System may not be resilient.'

    - name: kafka-gameday
      rules:
        # GameDay workflow tracking
        - alert: GameDayWorkflowStarted
          expr: |
            count(kube_workflow_status{namespace="{{ .Values.kafkaNamespace }}", workflow=~"kafka-gameday-.*"} == 1) > 0
          for: 0m
          labels:
            severity: info
            gameday: active
          annotations:
            summary: "GameDay workflow is in progress"
            description: "A scheduled GameDay chaos workflow has started."

    - name: kafka-chaos-rto-rpo
      interval: 15s
      rules:
        # The Kates application's own integrity verifier publishes these, one
        # set per run, tagged run_id and test_type. It only publishes them for a
        # run that actually verified integrity, so a plain load test leaves
        # these recording rules empty rather than recording a perfect RTO it
        # never measured.
        #
        # The values are in SECONDS. IntegrityResult measures in Duration and
        # exposes milliseconds; BenchmarkMetrics.recordIntegrity divides before
        # publishing, because the alert thresholds below are in seconds and a
        # millisecond value under a _seconds name makes KafkaRTOExceedsSLA fire
        # on every run.
        - record: kafka:chaos:producer_rto_seconds
          expr: |
            kates_integrity_result_producer_rto_seconds

        - record: kafka:chaos:consumer_rto_seconds
          expr: |
            kates_integrity_result_consumer_rto_seconds

        # The verifier already computes the worse of the two, so this reads it
        # rather than deriving it. It used to be
        #   max without(instance) (producer, consumer)
        # which is not valid PromQL — an aggregation takes one expression, not
        # two — so promtool refused the whole PrometheusRule and Prometheus
        # loaded NONE of this file's rules, including the three groups above.
        # Nothing rendered this template with chaosAlerts.enabled=true, so no
        # gate ever saw it; ci-kafka-charts.yml now renders every toggle.
        - record: kafka:chaos:max_rto_seconds
          expr: |
            kates_integrity_result_max_rto_seconds

        - record: kafka:chaos:rpo_seconds
          expr: |
            kates_integrity_result_rpo_seconds

        - record: kafka:chaos:data_loss_percent
          expr: |
            kates_integrity_result_data_loss_percent

        - record: kafka:chaos:lost_records
          expr: |
            kates_integrity_result_lost_records

        - record: kafka:chaos:duplicate_records
          expr: |
            kates_integrity_result_duplicate_records

        # These two used to read kafka_chaos_e2e_latency_ms and
        # kafka_chaos_producer_throughput_records_per_sec, which nothing
        # publishes and which would have been misnamed if something did: kafka_
        # is the JMX exporter's namespace, and these are the workload's own
        # numbers. They are also numbers Kates already publishes, so rather than
        # registering duplicate meters under a second name, the rules now read
        # the series that exist. End-to-end latency is the run's p99, which is
        # what the panel above them is labelled.
        - record: kafka:chaos:e2e_latency_ms
          expr: |
            max by (run_id, test_type) (
              kates_benchmark_latency_ms{quantile="0.99"}
            )

        - record: kafka:chaos:producer_throughput
          expr: |
            sum by (run_id, test_type) (
              kates_benchmark_throughput_rec_sec
            )

        # SLA breach alerts
        - alert: KafkaRTOExceedsSLA
          expr: |
            kafka:chaos:max_rto_seconds > 30
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: 'Kafka RTO exceeds 30s SLA'
            description: 'Max RTO is {{ "{{ $value }}" }}s. The cluster did not recover within the SLA window.'

        - alert: KafkaRPOExceedsSLA
          expr: |
            kafka:chaos:rpo_seconds > 5
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: 'Kafka RPO exceeds 5s SLA'
            description: 'RPO is {{ "{{ $value }}" }}s. Data loss window exceeds the acceptable recovery point.'

        - alert: KafkaDataLossDetected
          expr: |
            kafka:chaos:data_loss_percent > 0.1
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: 'Data loss {{ "{{ $value }}" }}% exceeds 0.1% SLA'
            description: 'KATES integrity verification detected data loss above the acceptable threshold.'

        - alert: KafkaE2ELatencySpike
          expr: |
            kafka:chaos:e2e_latency_ms > 10000
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: 'Kafka E2E latency spike: {{ "{{ $value }}" }}ms'
            description: 'End-to-end produce-consume latency exceeds 10s during or after chaos.'
{{- end }}
