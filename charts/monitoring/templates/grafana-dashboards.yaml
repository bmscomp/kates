{{- /*
Every board in this chart's dashboards/ directory, in one ConfigMap the
Grafana sidecar discovers by label.

Every file in it is GENERATED. scripts/gen-dashboards.py builds each board
from dashboards/<board>/board.py in the repository root and writes the copy
here, because Helm cannot read a file outside its own chart directory;
`scripts/gen-dashboards.py --check` fails CI when a copy has drifted, so
editing the JSON here does not survive. The glob stays a glob so that adding
a board is a manifest entry and nothing else.

Since 1.5.0 this is the single delivery route for every board the repository
builds: kates, kates-chaos, connect-cluster and mirror-maker2 no longer render
per-release copies, and the boards' template variables select a release
instead. Until 1.3.0 this template also carried a
`legacyKafkaDashboards.enabled` switch over nine deprecated Kafka and Strimzi
boards; those files are deleted, and the Strimzi operator's own dashboards
(charts/strimzi-operator) cover broker health, quorum identity, Cruise
Control and consumer lag.
*/}}
{{- $d := .Values.dashboards }}
{{- if $d.enabled }}
{{- /*
The sidecar label is built as a MAP rather than ranged out beside the
`label`/`labelValue` pair, so that a `labels` entry naming the same key cannot
emit it twice — a duplicate key in a ConfigMap's labels is a manifest the API
server rejects, and the operator who hit it set `labels` to add one label, not
to break the install. merge keeps the first argument's values, so
`label`/`labelValue` win over anything `labels` says about the same key.
*/}}
{{- $labels := merge (dict ($d.label | default "grafana_dashboard") ($d.labelValue | default "1" | toString)) ($d.labels | default dict) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-kates-dashboards
  namespace: {{ $d.namespace | default .Release.Namespace }}
  labels:
    {{- include "kates-monitoring.labels" . | nindent 4 }}
    {{- range $key, $val := $labels }}
    {{ $key }}: {{ $val | quote }}
    {{- end }}
  {{- with $d.folder }}
  annotations:
    grafana_folder: {{ . | quote }}
  {{- end }}
data:
  {{- $files := .Files }}
  {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |-
{{ $files.Get $path | indent 4 }}
  {{- end }}
{{- end }}
