{{- /*
Every board in this chart's dashboards/ directory, in one ConfigMap the
Grafana sidecar discovers by label.

Every file in it is GENERATED. scripts/gen-dashboards.py builds each board
from dashboards/<board>/board.py in the repository root and writes the copy
here, because Helm cannot read a file outside its own chart directory;
`scripts/gen-dashboards.py --check` fails CI when a copy has drifted, so
editing the JSON here does not survive. The glob stays a glob so that adding
a board is a manifest entry and nothing else.

Until 1.3.0 this template also carried a `legacyKafkaDashboards.enabled`
switch over nine deprecated Kafka and Strimzi boards. Those files are deleted;
the Strimzi operator's own dashboards cover broker health, quorum identity,
Cruise Control and consumer lag (charts/strimzi-operator), and the two boards
above cover what they leave out.
*/}}
{{- if .Values.dashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-kates-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kates-monitoring.labels" . | nindent 4 }}
    {{- range $key, $val := .Values.dashboards.labels }}
    {{ $key }}: {{ $val | quote }}
    {{- end }}
data:
  {{- $files := .Files }}
  {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |-
{{ $files.Get $path | indent 4 }}
  {{- end }}
{{- end }}
