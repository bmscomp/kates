# Kates Monitoring — Default Values
# Wraps kube-prometheus-stack with Kates-specific dashboards and config

kube-prometheus-stack:
  enabled: true

  grafana:
    adminPassword: "admin"
    image:
      tag: "12.3.1"
      pullPolicy: IfNotPresent
    service:
      type: NodePort
      nodePort: 30080
    sidecar:
      image:
        tag: "2.2.3"
        pullPolicy: IfNotPresent
      imagePullPolicy: IfNotPresent
      dashboards:
        enabled: true
        # -- The annotation the sidecar reads to file a board into a Grafana
        # folder. Upstream leaves this unset, so the `grafana_folder`
        # annotations that connect-cluster and mirror-maker2 have always
        # emitted were inert and every board landed in one flat list.
        folderAnnotation: grafana_folder
        # -- Which namespaces the sidecar watches for dashboard ConfigMaps.
        #
        # THIS HAS TO BE SET HERE, not left to the subchart. Three of the five
        # charts that ship a board put its ConfigMap in the WORKLOAD's
        # namespace, not Grafana's: connect-cluster and mirror-maker2 default
        # to their release namespace, and kates-chaos to the namespace the
        # LitmusChaos plane runs in. A sidecar that watches only its own
        # namespace finds none of them — the boards are generated, synced,
        # labelled and invisible, with nothing anywhere reporting a problem.
        # That is the failure mode this value exists to make impossible.
        #
        # kube-prometheus-stack's own values have said `ALL` since 46.x, so on
        # this pinned 82.4.3 the default already worked; on 45.x and earlier
        # the key was absent and the sidecar watched one namespace. Inheriting
        # a behaviour this chart depends on from an upstream default is how
        # that comes back on the next version bump, so it is pinned here.
        #
        # THE TRADE-OFF. `ALL` means the sidecar lists and watches ConfigMaps
        # and Secrets across every namespace, which needs the cluster-scoped
        # ClusterRole the Grafana subchart creates when `grafana.rbac.namespaced`
        # is false (its default, and this chart's). On a cluster where that is
        # not acceptable, replace it with the explicit list of namespaces that
        # hold boards — Grafana's own, plus every namespace a Kafka Connect,
        # MirrorMaker 2 or chaos release lives in:
        #
        #     searchNamespace: monitoring,kafka,connect,litmus
        #
        # A list is a list you have to maintain: a board delivered into a
        # namespace missing from it is silently not picked up, which is the
        # same failure as before by another route. Prefer `ALL` unless the
        # cluster forbids it, and set `grafana.rbac.namespaced: true` with a
        # matching Role per namespace if it does.
        searchNamespace: ALL
        provider:
          foldersFromFilesStructure: true
      datasources:
        enabled: true

  prometheus:
    prometheusSpec:
      # -- Select every PodMonitor, ServiceMonitor, PrometheusRule, Probe and
      # ScrapeConfig in the watched namespaces, rather than only those labelled
      # with this chart's release name.
      #
      # kube-prometheus-stack defaults these five flags to true, which makes
      # each selector `release: <this release>`. This release is called
      # `monitoring` (scripts/deploy-monitoring.sh, make monitoring), while
      # kafka-cluster and connect-cluster label their PodMonitors and
      # PrometheusRules `release: kafka` and mirror-maker2 and kates label
      # theirs with nothing at all. The result was that Prometheus selected
      # NONE of them: no broker, Connect or MirrorMaker series was scraped and
      # not one of the charts' alerts was ever loaded — silently, because an
      # unselected PodMonitor produces no event and an empty dashboard looks
      # exactly like an idle cluster.
      #
      # The alternative is to make every workload chart label its objects with
      # the monitoring release's name, which couples each chart to how the
      # platform happens to be installed. Selecting everything in the watched
      # namespaces is what a platform chart should do; narrow it with
      # podMonitorSelector and friends if this Prometheus must share a cluster
      # with objects it should ignore.
      podMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false
      image:
        tag: v3.9.1
        pullPolicy: IfNotPresent
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi

  global:
    imagePullPolicy: IfNotPresent

  prometheusOperator:
    image:
      tag: v0.79.2
      pullPolicy: IfNotPresent
    prometheusConfigReloader:
      image:
        tag: v0.79.2
        pullPolicy: IfNotPresent
    # kube-prometheus-stack reads this under prometheusOperator, not at the top
    # level of the subchart — a second copy used to sit beside kube-state-metrics
    # where the chart never looked at it, so its enabled and tag settings did
    # nothing at all.
    admissionWebhooks:
      enabled: true
      deployment:
        image:
          tag: v0.79.2
          pullPolicy: IfNotPresent
      patch:
        enabled: true
        image:
          tag: v1.6.5
          pullPolicy: IfNotPresent

  alertmanager:
    alertmanagerSpec:
      image:
        tag: v0.28.1
        pullPolicy: IfNotPresent

  kube-state-metrics:
    image:
      tag: v2.14.0
      pullPolicy: IfNotPresent

  prometheus-node-exporter:
    image:
      tag: v1.8.2
      pullPolicy: IfNotPresent

  defaultRules:
    create: true

  kubelet:
    enabled: true

# Chaos alerting rules
chaosAlerts:
  enabled: false

# Kafka namespace for PromQL expressions
kafkaNamespace: kafka

# NetworkPolicy exceptions for clusters with namespace default-deny
networkPolicy:
  prometheusKafkaEgress:
    enabled: true
    # Namespace containing Strimzi Kafka pods exposing tcp-prometheus on 9404
    kafkaNamespace: kafka
    # Ports Prometheus is allowed to scrape on Kafka-related pods
    ports:
      - 9404

# Grafana dashboards shipped by this chart: EVERY board the repository
# builds — the whole of dashboards/ in the repository root, twelve boards
# today. Since 1.5.0 this chart is the single delivery route: kates (0.9.0),
# kates-chaos (2.2.0), connect-cluster (2.1.0) and mirror-maker2 (0.11.0)
# no longer render per-release copies, and the boards' template variables
# ($job, $namespace/$cluster) do what the per-release rewrites did. Every
# file in this chart's dashboards/ is generated by scripts/gen-dashboards.py
# from dashboards/<board>/board.py, and the Grafana sidecar discovers them
# through the label below.
#
# `legacyKafkaDashboards.enabled` is GONE in 1.3.0. It gated nine deprecated
# Kafka and Strimzi boards, and all nine files were deleted: eight were
# subsets of the Strimzi operator's own dashboards or of each other, and
# kafka-perf-global is rebuilt as kafka-performance on metric names the
# exporter rules actually produce. Setting the key now does nothing; Helm
# accepts it silently, and the boards it named do not exist to install.
dashboards:
  # -- Ship the boards at all. false leaves the rest of the chart alone.
  enabled: true
  # -- Namespace of the ConfigMap (empty = the release namespace). Only worth
  # setting when Grafana lives somewhere else and its sidecar does not search
  # this release's namespace.
  namespace: ""
  # -- The label the Grafana sidecar watches, and its value. These two are
  # ALWAYS applied, which is the difference between them and `labels` below:
  # the sidecar finds nothing without them, and losing them is invisible.
  label: grafana_dashboard
  labelValue: "1"
  # -- The Grafana folder to file the boards into, via the `grafana_folder`
  # annotation. EMPTY BY DEFAULT, which is what this chart has always done:
  # the boards land in the sidecar's default folder. Set it — `Kates` is
  # the obvious choice — to group them, which also moves them on upgrade.
  # Needs `kube-prometheus-stack.grafana.sidecar.dashboards.folderAnnotation`,
  # which this chart sets. All twelve boards share one ConfigMap and so one
  # folder.
  folder: ""
  # -- EXTRA labels on the ConfigMap, merged with (not replacing) the
  # `label`/`labelValue` pair above. A `grafana_dashboard` key here is
  # overridden by `label`/`labelValue`; set those instead.
  labels: {}

# Image used by the helm test connectivity pod
test:
  image: curlimages/curl:8.7.1
