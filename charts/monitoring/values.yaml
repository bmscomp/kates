# Kates Monitoring — Default Values
# Wraps kube-prometheus-stack with Kates-specific dashboards and config

kube-prometheus-stack:
  enabled: true

  grafana:
    adminPassword: "admin"
    image:
      tag: "12.3.1"
      pullPolicy: IfNotPresent
    service:
      type: NodePort
      nodePort: 30080
    sidecar:
      image:
        tag: "2.2.3"
        pullPolicy: IfNotPresent
      imagePullPolicy: IfNotPresent
      dashboards:
        enabled: true
        # -- The annotation the sidecar reads to file a board into a Grafana
        # folder. Upstream leaves this unset, so the `grafana_folder`
        # annotations that connect-cluster and mirror-maker2 have always
        # emitted were inert and every board landed in one flat list.
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: true
      datasources:
        enabled: true

  prometheus:
    prometheusSpec:
      image:
        tag: v3.9.1
        pullPolicy: IfNotPresent
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi

  global:
    imagePullPolicy: IfNotPresent

  prometheusOperator:
    image:
      tag: v0.79.2
      pullPolicy: IfNotPresent
    prometheusConfigReloader:
      image:
        tag: v0.79.2
        pullPolicy: IfNotPresent
    # kube-prometheus-stack reads this under prometheusOperator, not at the top
    # level of the subchart — a second copy used to sit beside kube-state-metrics
    # where the chart never looked at it, so its enabled and tag settings did
    # nothing at all.
    admissionWebhooks:
      enabled: true
      deployment:
        image:
          tag: v0.79.2
          pullPolicy: IfNotPresent
      patch:
        enabled: true
        image:
          tag: v1.6.5
          pullPolicy: IfNotPresent

  alertmanager:
    alertmanagerSpec:
      image:
        tag: v0.28.1
        pullPolicy: IfNotPresent

  kube-state-metrics:
    image:
      tag: v2.14.0
      pullPolicy: IfNotPresent

  prometheus-node-exporter:
    image:
      tag: v1.8.2
      pullPolicy: IfNotPresent

  defaultRules:
    create: true

  kubelet:
    enabled: true

# Chaos alerting rules
chaosAlerts:
  enabled: false

# Kafka namespace for PromQL expressions
kafkaNamespace: kafka

# NetworkPolicy exceptions for clusters with namespace default-deny
networkPolicy:
  prometheusKafkaEgress:
    enabled: true
    # Namespace containing Strimzi Kafka pods exposing tcp-prometheus on 9404
    kafkaNamespace: kafka
    # Ports Prometheus is allowed to scrape on Kafka-related pods
    ports:
      - 9404

# Kates dashboards
dashboards:
  enabled: true
  labels:
    grafana_dashboard: "1"

# DEPRECATED: the eight hand-written Kafka boards and the Strimzi operator &
# Connect board. They read series names that kafka-cluster 1.0's exporter rules
# (Strimzi's own) do not produce. The maintained boards are the Strimzi
# operator's (charts/strimzi-operator) and connect-cluster's and
# mirror-maker2's own. Default false in 1.3; removed in 2.0.
legacyKafkaDashboards:
  enabled: true

# Image used by the helm test connectivity pod
test:
  image: curlimages/curl:8.7.1
