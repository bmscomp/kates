# Kates Monitoring — Default Values
# Wraps kube-prometheus-stack with Kates-specific dashboards and config
#
# Every pod this chart and the wrapped stack render passes the Restricted Pod
# Security Standard and carries CPU and memory requests and a memory limit,
# except one: the node-exporter DaemonSet reads the host (host network, PID
# namespace and root filesystem) and cannot run where a namespace enforces
# baseline or restricted. It stays on by default; switch it off with
# `kube-prometheus-stack.nodeExporter.enabled=false`, which `kates deploy`
# already does when the monitoring namespace enforces baseline or restricted.
# The node-level panels and alerts go with it.

# -- Global settings, passed down to kube-prometheus-stack and its subcharts
# as well as used by this chart's own test pod
global:
  # -- Registry prefixed to every image (empty: each image's own registry)
  imageRegistry: ""
  # -- Pull secrets for every pod; `- name: secret` or `- secret`
  imagePullSecrets: []

# -- Extra labels on this chart's own pod (the Helm test). The chart's labels
# win on a clash. The wrapped stack's pods take theirs from each component's
# key: kube-prometheus-stack.grafana.podLabels,
# kube-prometheus-stack.prometheusOperator.podLabels,
# kube-prometheus-stack.kube-state-metrics.podLabels,
# kube-prometheus-stack.prometheus-node-exporter.podLabels, and
# podMetadata.labels under prometheus.prometheusSpec and
# alertmanager.alertmanagerSpec. The admission-create and admission-patch
# Jobs take no pod label value: kube-prometheus-stack.commonLabels labels
# them, with every other resource kube-prometheus-stack's own templates
# render (not the grafana, kube-state-metrics or node-exporter subcharts).
podLabels: {}

kube-prometheus-stack:
  enabled: true

  grafana:
    adminPassword: "admin"
    image:
      tag: "12.3.1"
      pullPolicy: IfNotPresent
    service:
      type: NodePort
      nodePort: 30080
    # -- Grafana's own container
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    # -- The init container that chowns the data volume runs as root with
    # CAP_CHOWN, which the Restricted standard refuses. Off: Grafana's pod
    # fsGroup (472) already makes a persistent volume writable on storage that
    # honours fsGroup. Turn it back on only for storage that does not, in a
    # namespace that allows it.
    initChownData:
      enabled: false
    sidecar:
      image:
        tag: "2.2.3"
        pullPolicy: IfNotPresent
      imagePullPolicy: IfNotPresent
      # -- Each sidecar (dashboards, datasources)
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
      dashboards:
        enabled: true
        # -- The annotation the sidecar reads to file a board into a Grafana
        # folder. Upstream leaves this unset, so the `grafana_folder`
        # annotations that connect-cluster and mirror-maker2 have always
        # emitted were inert and every board landed in one flat list.
        folderAnnotation: grafana_folder
        # -- Which namespaces the sidecar watches for dashboard ConfigMaps.
        #
        # THIS HAS TO BE SET HERE, not left to the subchart. Three of the five
        # charts that ship a board put its ConfigMap in the WORKLOAD's
        # namespace, not Grafana's: connect-cluster and mirror-maker2 default
        # to their release namespace, and kates-chaos to the namespace the
        # LitmusChaos plane runs in. A sidecar that watches only its own
        # namespace finds none of them — the boards are generated, synced,
        # labelled and invisible, with nothing anywhere reporting a problem.
        # That is the failure mode this value exists to make impossible.
        #
        # kube-prometheus-stack's own values have said `ALL` since 46.x, so on
        # this pinned 82.4.3 the default already worked; on 45.x and earlier
        # the key was absent and the sidecar watched one namespace. Inheriting
        # a behaviour this chart depends on from an upstream default is how
        # that comes back on the next version bump, so it is pinned here.
        #
        # THE TRADE-OFF. `ALL` means the sidecar lists and watches ConfigMaps
        # and Secrets across every namespace, which needs the cluster-scoped
        # ClusterRole the Grafana subchart creates when `grafana.rbac.namespaced`
        # is false (its default, and this chart's). On a cluster where that is
        # not acceptable, replace it with the explicit list of namespaces that
        # hold boards — Grafana's own, plus every namespace a Kafka Connect,
        # MirrorMaker 2 or chaos release lives in:
        #
        #     searchNamespace: monitoring,kafka,connect,litmus
        #
        # A list is a list you have to maintain: a board delivered into a
        # namespace missing from it is silently not picked up, which is the
        # same failure as before by another route. Prefer `ALL` unless the
        # cluster forbids it, and set `grafana.rbac.namespaced: true` with a
        # matching Role per namespace if it does.
        searchNamespace: ALL
        provider:
          foldersFromFilesStructure: true
      datasources:
        enabled: true

  prometheus:
    prometheusSpec:
      # -- Select every PodMonitor, ServiceMonitor, PrometheusRule, Probe and
      # ScrapeConfig in the watched namespaces, rather than only those labelled
      # with this chart's release name.
      #
      # kube-prometheus-stack defaults these five flags to true, which makes
      # each selector `release: <this release>`. This release is called
      # `monitoring` (scripts/deploy-monitoring.sh, make monitoring), while
      # kafka-cluster and connect-cluster label their PodMonitors and
      # PrometheusRules `release: kafka` and mirror-maker2 and kates label
      # theirs with nothing at all. The result was that Prometheus selected
      # NONE of them: no broker, Connect or MirrorMaker series was scraped and
      # not one of the charts' alerts was ever loaded — silently, because an
      # unselected PodMonitor produces no event and an empty dashboard looks
      # exactly like an idle cluster.
      #
      # The alternative is to make every workload chart label its objects with
      # the monitoring release's name, which couples each chart to how the
      # platform happens to be installed. Selecting everything in the watched
      # namespaces is what a platform chart should do; narrow it with
      # podMonitorSelector and friends if this Prometheus must share a cluster
      # with objects it should ignore.
      podMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false
      image:
        tag: v3.9.1
        pullPolicy: IfNotPresent
      # -- Prometheus's container in the StatefulSet the operator creates
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 2Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi

  global:
    imagePullPolicy: IfNotPresent

  prometheusOperator:
    image:
      tag: v0.79.2
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    prometheusConfigReloader:
      image:
        tag: v0.79.2
        pullPolicy: IfNotPresent
      # -- The config-reloader the operator adds to Prometheus and Alertmanager
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    # kube-prometheus-stack reads this under prometheusOperator, not at the top
    # level of the subchart — a second copy used to sit beside kube-state-metrics
    # where the chart never looked at it, so its enabled and tag settings did
    # nothing at all.
    admissionWebhooks:
      enabled: true
      deployment:
        image:
          tag: v0.79.2
          pullPolicy: IfNotPresent
      patch:
        enabled: true
        image:
          tag: 1.7.8
          pullPolicy: IfNotPresent
        # -- The admission-create and admission-patch hook Jobs
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi

  alertmanager:
    alertmanagerSpec:
      image:
        tag: v0.28.1
        pullPolicy: IfNotPresent
      # -- Alertmanager's container in the StatefulSet the operator creates
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi

  kube-state-metrics:
    image:
      tag: v2.14.0
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    # The chaos board and the chaos rules below read
    # kube_customresource_chaosengine_status_engine_status — is an experiment
    # in progress? kube-state-metrics publishes nothing about a custom
    # resource unless told its shape, so this is the ChaosEngine's
    # status.engineStatus as a state set (initialized while the experiment
    # runs, completed or stopped after; one series per engine and state) plus
    # the read access it needs. Without it the series never existed: the
    # board's namespace picker, built on it, resolved to nothing, and
    # KafkaChaosExperimentActive could not fire. The three alerts guarded by
    # `and on() count(... == 1) == 0` still cannot: count() over nothing is
    # empty, not zero, so that guard never passes — a separate fix.
    # kube-state-metrics keeps running when the CRD is absent and discovers it
    # when it arrives, so installing this stack before the chaos plane (which
    # kates deploy does) is fine.
    rbac:
      extraRules:
        - apiGroups: ["litmuschaos.io"]
          resources: ["chaosengines"]
          verbs: ["list", "watch"]
    customResourceState:
      enabled: true
      config:
        kind: CustomResourceStateMetrics
        spec:
          resources:
            - groupVersionKind:
                group: litmuschaos.io
                version: v1alpha1
                kind: ChaosEngine
              metricNamePrefix: kube_customresource_chaosengine
              labelsFromPath:
                name: [metadata, name]
                namespace: [metadata, namespace]
              metrics:
                - name: status_engine_status
                  help: "ChaosEngine status.engineStatus, one series per state"
                  each:
                    type: StateSet
                    stateSet:
                      labelName: status
                      path: [status, engineStatus]
                      list: [initialized, completed, stopped]

  # Host-level: cannot pass the Restricted (or Baseline) standard. See the
  # header for the switch, kube-prometheus-stack.nodeExporter.enabled=false.
  prometheus-node-exporter:
    image:
      tag: v1.8.2
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    # -- Merged into the subchart's own (non-root 65534, read-only root
    # filesystem), so only the host controls stay outside Restricted.
    securityContext:
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

  defaultRules:
    create: true

  kubelet:
    enabled: true

# Chaos alerting rules
chaosAlerts:
  enabled: false

# Kafka namespace for PromQL expressions
kafkaNamespace: kafka

# NetworkPolicy exceptions for clusters with namespace default-deny
networkPolicy:
  prometheusKafkaEgress:
    enabled: true
    # Namespace containing Strimzi Kafka pods exposing tcp-prometheus on 9404
    kafkaNamespace: kafka
    # Ports Prometheus is allowed to scrape on Kafka-related pods
    ports:
      - 9404

# Grafana dashboards shipped by this chart: EVERY board the repository
# builds — the whole of dashboards/ in the repository root, twelve boards
# today. Since 1.5.0 this chart is the single delivery route: kates (0.9.0),
# kates-chaos (2.2.0), connect-cluster (2.1.0) and mirror-maker2 (0.11.0)
# no longer render per-release copies, and the boards' template variables
# ($job, $namespace/$cluster) do what the per-release rewrites did. Every
# file in this chart's dashboards/ is generated by scripts/gen-dashboards.py
# from dashboards/<board>/board.py, and the Grafana sidecar discovers them
# through the label below.
#
# `legacyKafkaDashboards.enabled` is GONE in 1.3.0. It gated nine deprecated
# Kafka and Strimzi boards, and all nine files were deleted: eight were
# subsets of the Strimzi operator's own dashboards or of each other, and
# kafka-perf-global is rebuilt as kafka-performance on metric names the
# exporter rules actually produce. Setting the key now does nothing; Helm
# accepts it silently, and the boards it named do not exist to install.
dashboards:
  # -- Ship the boards at all. false leaves the rest of the chart alone.
  enabled: true
  # -- Namespace of the ConfigMap (empty = the release namespace). Only worth
  # setting when Grafana lives somewhere else and its sidecar does not search
  # this release's namespace.
  namespace: ""
  # -- The label the Grafana sidecar watches, and its value. These two are
  # ALWAYS applied, which is the difference between them and `labels` below:
  # the sidecar finds nothing without them, and losing them is invisible.
  label: grafana_dashboard
  labelValue: "1"
  # -- The Grafana folder to file the boards into, via the `grafana_folder`
  # annotation. EMPTY BY DEFAULT, which is what this chart has always done:
  # the boards land in the sidecar's default folder. Set it — `Kates` is
  # the obvious choice — to group them, which also moves them on upgrade.
  # Needs `kube-prometheus-stack.grafana.sidecar.dashboards.folderAnnotation`,
  # which this chart sets. All twelve boards share one ConfigMap and so one
  # folder.
  folder: ""
  # -- EXTRA labels on the ConfigMap, merged with (not replacing) the
  # `label`/`labelValue` pair above. A `grafana_dashboard` key here is
  # overridden by `label`/`labelValue`; set those instead.
  labels: {}

# Image used by the helm test connectivity pod
test:
  image: curlimages/curl:8.7.1
  # -- The test pod's security context (Restricted Pod Security Standard)
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  # -- The test container's security context
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      memory: 32Mi
      cpu: 25m
    limits:
      memory: 64Mi
      cpu: 100m
