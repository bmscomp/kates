{{- if (index .Values "kafka-cluster").enabled }}
{{- $clusterName := (index .Values "kafka-cluster").clusterName | default "krafter" }}
{{- /* kates.io/test-pod is the label kafka-cluster's broker NetworkPolicy
       admits test pods by. These win a clash with podLabels. */}}
{{- $labels := dict "app.kubernetes.io/name" "kates-platform" "app.kubernetes.io/instance" .Release.Name "app.kubernetes.io/managed-by" .Release.Service "helm.sh/chart" (printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_") "kates.io/test-pod" "true" }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-platform-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml (merge $labels (.Values.podLabels | default dict)) | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- with include "kates-platform.imagePullSecrets" . }}{{ . | nindent 2 }}{{ end }}
  # busybox runs as root; 65534 is its nobody user.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: platform-test
      image: "{{ with (.Values.global | default dict).imageRegistry }}{{ . }}/{{ end }}{{ .Values.test.image }}"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      {{- with .Values.test.resources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      command:
        - sh
        - -c
        - |
          set -e
          echo "Checking Kafka bootstrap reachability ({{ $clusterName }}-kafka-bootstrap:9092)..."
          nc -z -w 5 {{ $clusterName }}-kafka-bootstrap.{{ .Release.Namespace }}.svc 9092
          echo "Kafka bootstrap reachable."
{{- end }}
