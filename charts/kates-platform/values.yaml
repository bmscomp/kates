kafka-cluster:
  enabled: true
  # The kates platform's topics, users (kates-backend, kafka-ui, …) and client
  # NetworkPolicy grants — kafka-cluster's profiles/platform.yaml.
  profile: platform
  networkPolicy:
    clients:
      # The profile admits Kates from namespace kates, where `kates deploy`
      # puts it; here it runs next to Kafka, in the release namespace ("").
      - name: kates
        namespace: ""

# Kates reaches the kafka-cluster subchart in this release's namespace; the
# kates chart's own defaults name namespace kafka. Rename krafter here too if
# kafka-cluster.clusterName changes.
kates:
  enabled: true
  kafka:
    bootstrapServers: "krafter-kafka-bootstrap.{{ .Release.Namespace }}.svc:9092"
    clusterName: krafter
    topicNamespace: "{{ .Release.Namespace }}"
  trogdor:
    coordinatorUrl: "http://trogdor-coordinator.{{ .Release.Namespace }}.svc:8889"
  networkPolicy:
    kafka:
      namespace: "{{ .Release.Namespace }}"

# Apicurio Registry (KafkaSQL storage against the kafka-cluster subchart).
# Disabled by default — enable to include the schema registry in the platform.
apicurio-registry:
  enabled: false

# MirrorMaker 2 (cross-cluster replication, DR, and 2.x/3.x → 4.x migration).
# Disabled by default — its defaults mirror krafter onto itself, which is a
# smoke test, not a topology. Enable with a real source:
#   mirror-maker2:
#     enabled: true
#     mirrors:
#       - source: { alias: dc-east, bootstrapServers: kafka-east.example.com:9092, kafkaVersion: "3.9.1" }
mirror-maker2:
  enabled: false

# Kafka Connect (Debezium CDC and JDBC connectors) against the kafka-cluster
# subchart. Disabled by default — `kates deploy` installs it as a separate
# release. Enabled here it runs in the umbrella's namespace, next to Kafka.
connect-cluster:
  enabled: false

# The umbrella's own pod is the helm test connectivity pod below. Its pull
# secrets are global.imagePullSecrets, which kafka-cluster and kates read too
# (the other subcharts take their own imagePullSecrets), then imagePullSecrets;
# an entry is a name (regcred) or {name: regcred}.
# global.imageRegistry, when set, is prepended to its image with a slash.
imagePullSecrets: []
# Labels added to the helm test pod. Its own labels win a clash. The
# subcharts' pods take theirs from kates.podLabels, kafka-cluster.podLabels
# and so on.
podLabels: {}

test:
  # Image of the helm test connectivity pod (needs `nc`). It runs as busybox's
  # nobody user (65534).
  image: busybox:1.37
  resources:
    requests:
      memory: 32Mi
      cpu: 25m
    limits:
      memory: 64Mi
      cpu: 100m
