apiVersion: v2
name: kates-platform
description: Umbrella chart for the full Kates platform — Kafka, Kates, and supporting infrastructure
type: application
# Patch: the umbrella packs kates 0.14.1 and kafka-cluster 1.0.18, whose
# packages ship their environment overlays.
version: 0.8.7
appVersion: "1.0.0"
keywords:
  - kafka
  - kates
  - platform
  - strimzi
maintainers:
  - name: Platform Team
dependencies:
  - name: kafka-cluster
    version: ">=1.0.12 <2.0.0"
    repository: "file://../kafka-cluster"
    condition: kafka-cluster.enabled
  - name: kates
    version: ">=0.13.0 <1.0.0"
    repository: "file://../kates"
    condition: kates.enabled
  - name: apicurio-registry
    version: ">=0.4.1 <1.0.0"
    repository: "file://../apicurio-registry"
    condition: apicurio-registry.enabled
  # Off by default: a mirror needs a second cluster to mean anything, and the
  # chart's own defaults are a loopback on krafter for smoke-testing. Enable it
  # with a real mirrors[].source — see charts/mirror-maker2/README.md.
  - name: mirror-maker2
    version: ">=0.11.8 <1.0.0"
    repository: "file://../mirror-maker2"
    condition: mirror-maker2.enabled
  # Off by default: `kates deploy` installs Connect as its own release, in its
  # own namespace, and the platform runs without it.
  - name: connect-cluster
    version: ">=2.1.10 <3.0.0"
    repository: "file://../connect-cluster"
    condition: connect-cluster.enabled
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Packs kates 0.14.1 and kafka-cluster 1.0.18, whose packages ship their environment overlays (values-*.yaml)"
    - kind: changed
      description: "The umbrella packs kafka-cluster 1.0.17, whose Helm test 10 (performance) reports the producer's MB/sec instead of its max latency. Its own templates are unchanged."
    - kind: changed
      description: "The umbrella packs kates 0.14.0, whose kyvernoPolicy.cosign now verifies the keyless signatures the Kates release makes, with an ImageValidatingPolicy that needs Kyverno 1.17 or newer. Its own templates are unchanged."
    - kind: changed
      description: "The umbrella moves with the v1.29.3 release: it packs kates 0.13.5, kafka-cluster 1.0.16, connect-cluster 2.1.14 and mirror-maker2 0.11.12 as they are on disk. A published umbrella keeps the subcharts it was packed with, so scripts/chart_bumps.py (#462) fails a subchart version change that the umbrella does not follow. Templates are unchanged."
    - kind: changed
      description: "ACTION REQUIRED — the subchart floors move to the versions this umbrella is rendered with: kafka-cluster 1.0.12, kates 0.13.0, apicurio-registry 0.4.1, mirror-maker2 0.11.8 and connect-cluster 2.1.10, whose pods pass Pod Security restricted and take podLabels, and of which kafka-cluster and kates read global.imagePullSecrets as plain names or {name: ...}. Rendering fails, naming the subchart, until charts/ holds them: run make platform-chart-deps before upgrading"
    - kind: fixed
      description: "Under Pod Security Standards restricted, enforced by a namespace label or a Kyverno policy, the umbrella's Helm test pod was refused: it set no seccomp profile. It now runs with seccompProfile RuntimeDefault, still as busybox's nobody user (65534) with no privilege escalation and no capabilities. Its requests and limits, the same as before, are a value now: test.resources"
    - kind: added
      description: "podLabels (default empty) reach the umbrella's Helm test pod, under its own labels, which win a clash; each subchart's pods take theirs from its own podLabels, such as kates.podLabels and kafka-cluster.podLabels. imagePullSecrets (default empty) are the test pod's pull secrets, after global.imagePullSecrets; an entry of either is a Secret name or {name: ...}"
    - kind: changed
      description: "A release that sets global.imageRegistry or global.imagePullSecrets for the subcharts now has them on the Helm test pod too: the registry is prepended to test.image (busybox:1.37 becomes <imageRegistry>/busybox:1.37), so a mirror has to carry busybox; a test.image that already names the mirror gets it twice, so drop it there"
    - kind: fixed
      description: "In any namespace but kafka, the platform's Kates API reached the brokers but its chaos, cluster topology, cluster alerts and conformity checks still looked for Kafka in namespace kafka: chaos refused every plan with No broker pods found, and every conformity check returned 409. The kates floor moves to 0.12.1, which sets those settings from kates.networkPolicy.kafka.namespace, already the release namespace here, and their cluster name from kates.kafka.clusterName (krafter). kafka-cluster.clusterName other than krafter needs kates.kafka.clusterName and kates.kafka.bootstrapServers set to match. Run `make platform-chart-deps` before upgrading"
    - kind: fixed
      description: "Kates could not reach the Kafka the platform installs. The umbrella installs kafka-cluster in its release namespace, but the kates subchart kept its own defaults: bootstrap servers and the Trogdor coordinator in namespace kafka, and NetworkPolicy egress to namespace kafka only; and the platform profile admitted Kates to the brokers only from namespace kates. Installed in kates, as this README does, Kates looked up krafter-kafka-bootstrap.kafka.svc; installed in kafka, the brokers refused it. The umbrella now sets kates.kafka.bootstrapServers, kates.kafka.topicNamespace, kates.trogdor.coordinatorUrl and kates.networkPolicy.kafka.namespace from the release namespace (kates 0.11.7 renders them with tpl), and admits Kates to the brokers from the release namespace, so the platform works in any namespace. A release that set these keys keeps its own values. kafka-cluster.clusterName other than krafter needs kates.kafka.bootstrapServers set to match"
    - kind: fixed
      description: "helm test could not reach Kafka: the test pod lacked kates.io/test-pod=true, the label kafka-cluster's broker NetworkPolicy admits test pods by"
    - kind: fixed
      description: "ACTION REQUIRED for a platform built before this version — the umbrella installed whatever subcharts sat in its gitignored charts/ directory, and Helm never holds those to the ranges in Chart.yaml. A charts/ left from an earlier `helm dependency update` kept installing kates 0.9.1, whose ClusterRole granted get, list and watch on every Secret in the cluster, so the Kates API's service account could read every SCRAM password, CA key and token there; kates 0.10.8 dropped that rule. Each range's floor is now the version this umbrella was rendered with (kafka-cluster 1.0.10, kates 0.11.6, apicurio-registry 0.4.0, mirror-maker2 0.11.6, connect-cluster 2.1.8), and rendering fails, naming the subchart, while charts/ holds an enabled one outside its range. Run `make platform-chart-deps` (or `helm dependency update charts/kates-platform`) before installing or upgrading"
    - kind: changed
      description: "ACTION REQUIRED for INTEGRATION_CDC and for copied kates values — the kates subchart moves from 0.9.1 to 0.11.6. Its ClusterRole grants nothing on Secrets: a platform that runs INTEGRATION_CDC sets kates.rbac.cdcSecretNamespaces to the CDC database's namespace, or the run fails at DB_SETUP with Forbidden. Kates runs one pod: kates.replicaCount above 1, kates.autoscaling.enabled, a RollingUpdate kates.strategy and kates.podDisruptionBudget.minAvailable are refused by the kates schema, and an upgrade leaves the API unreachable until the new pod is Ready. The umbrella's own values are unchanged: kafka-cluster 1.0.10 still takes profile: platform, and the other subcharts take only enabled"
