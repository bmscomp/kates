apiVersion: v2
name: kates-platform
description: Umbrella chart for the full Kates platform — Kafka, Kates, and supporting infrastructure
type: application
# Minor bump: pulls in kates 0.7.0, whose default probe paths and image tag
# changed, so the umbrella deploys a different configuration than 0.4.0 did.
version: 0.5.0
appVersion: "1.0.0"
keywords:
  - kafka
  - kates
  - platform
  - strimzi
maintainers:
  - name: Platform Team
dependencies:
  - name: kafka-cluster
    version: ">=0.2.0 <1.0.0"
    repository: "file://../kafka-cluster"
    condition: kafka-cluster.enabled
  - name: kates
    version: ">=0.5.0 <1.0.0"
    repository: "file://../kates"
    condition: kates.enabled
  - name: apicurio-registry
    version: ">=0.2.0 <1.0.0"
    repository: "file://../apicurio-registry"
    condition: apicurio-registry.enabled
