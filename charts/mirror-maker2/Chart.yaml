apiVersion: v2
name: mirror-maker2
description: Strimzi KafkaMirrorMaker2 — cross-cluster replication, DR, and cross-version migration (2.x/3.x → 4.x)
type: application
# Minor bump: one canonical dashboard, rebuilt around the questions an
# operator asks in an incident and gated for layout as well as for JSON.
version: 0.6.0
# Tracks the Kafka line the MM2 Connect workers run (STRIMZI_KAFKA_VERSION).
appVersion: "4.3.1"
kubeVersion: ">=1.27.0-0"
home: https://github.com/bmscomp/kates
sources:
  - https://github.com/bmscomp/kates
maintainers:
  - name: bmscomp
    url: https://github.com/bmscomp
keywords:
  - kafka
  - mirrormaker2
  - mirror-maker
  - replication
  - disaster-recovery
  - migration
  - strimzi
icon: https://raw.githubusercontent.com/bmscomp/kates/main/docs/icon.png
annotations:
  artifacthub.io/category: streaming-messaging
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: changed
      description: The Grafana dashboard is rebuilt as one canonical board — a six-stat header (is it up, is it lagging, is it erroring), then task states, replication, offset translation, errors and dead letters, the replication SLO, workers, and two collapsed sections (the client path, and one row per source)
    - kind: added
      description: Panels for what the chart already alerted on and never showed — errors logged per connector, records errored/failed/skipped, retries and dead-letter writes, last error per connector, checkpoint emission rate, offset commit success, polled vs written, records in flight, GC time, time since last rebalance, connector/task assignment and startup failures
    - kind: added
      description: A collapsed "path a record takes" section reading the underlying clients — the replication consumer's fetch rate and the connector producers' send, error, retry, latency and buffer — which is what says whether a slow mirror is slow at the source or at the target
    - kind: added
      description: Every panel's grid position is computed from a cursor rather than written down, and CI now proves the layout — no overlapping panels, rows in order, every panel with a description and a query whose expr is not empty — across five renders including both ways the SLO section can be absent
    - kind: added
      description: A dashboard-level link to the runbook, and threshold lines drawn from alerts.thresholds on the lag, error-rate and rebalance panels
    - kind: added
      description: SLI recording rules per source (mm2:replication_latency_ms:max, mm2:checkpoint_latency_ms:max, mm2:records_replicated:rate5m, mm2:tasks_running:ratio) and a replication SLO — alerts.slo.{target,burnRate} over thresholds.replicationLatencyMs — with the multi-window burn-rate alert MirrorMaker2ReplicationSLOBurning
    - kind: added
      description: A "Replication SLO" dashboard row reading the recorded series, rendered when the PrometheusRule that records them is installed
    - kind: added
      description: scripts/metric-contract/mirror-maker2.yaml — the MBean catalogue the exporter rules are checked against, so CI proves every series the alerts, recording rules and dashboard read can actually be produced (and a live scrape job diffs the catalogue against a real worker)
    - kind: fixed
      description: Every `connector` and `client_id` label carried literal double quotes (Kafka quotes an ObjectName value containing `>`, and the exporter copies the capture verbatim), so no alert selecting connector=~"<alias>->.*" could match — TaskFailed, NoRecordsReplicated, CheckpointStalled, OffsetSyncStale and HighErrorRate were dead on every release. The rules now capture inside the quotes
    - kind: fixed
      description: The exporter's 1.x line strips a trailing `_total` from anything not published as a COUNTER, so `source-record-write-total` and `completed-rebalances-total` were exposed without the suffix the alerts and panels read; the cumulative attributes now have COUNTER rules and keep it. NoRecordsReplicated, whose `or vector(0)` fallback read the missing series as "no records", had been firing permanently
    - kind: fixed
      description: The "Bytes replicated /s" panel took rate() of byte-rate, which is already a rate, and so plotted the rate of a rate; it reads the series as is now
