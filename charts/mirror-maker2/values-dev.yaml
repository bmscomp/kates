# dev overlay — single worker, small heap, verbose logs, no monitoring CRDs.
replicas: 1

# ── Images ──────────────────────────────────────────────────────────────────
# The worker image stays empty on purpose. Strimzi derives it from its own
# image map for `version`, which is the one source that cannot disagree with
# the operator actually reconciling this CR; writing
# quay.io/strimzi/kafka:<strimzi>-kafka-<kafka> here would add a third place
# for the version to drift and would be wrong the first time either version
# moved. `kates versions` prints what the operator will pick.
#
# To run a locally built worker on kind — a patched Connect image, a private
# build of the Kafka distribution — load it onto the node first, then pin it:
#
#   docker build -t mm2:local . && kind load docker-image mm2:local --name panda
#   helm upgrade --install mm2 charts/mirror-maker2 \
#     -f charts/mirror-maker2/values-dev.yaml --set image=mm2:local
#
# That needs the Cluster Operator started with STRIMZI_IMAGE_PULL_POLICY=
# IfNotPresent (or Never); the KafkaMirrorMaker2 CR has no per-cluster pull
# policy of its own, so a node-local tag under the default policy is an
# ImagePullBackOff, not a local image.
image: ""

# Never re-pull the helper images on a laptop: on kind they are already on the
# node, and a pull on every preflight or `helm test` run is a network
# round-trip that only costs time and can fail offline. Applies to the
# preflight Job, secret-sync and the test pods — not the workers.
imagePullPolicy: IfNotPresent

target:
  config:
    config.storage.replication.factor: 1
    offset.storage.replication.factor: 1
    status.storage.replication.factor: 1

mirrors:
  - source:
      alias: source
      clusterName: "krafter"
      namespace: "kafka"
      authentication:
        type: scram-sha-512
        username: "kates-mm2"
        secretName: "kates-mm2"
        secretKey: "password"
    topicsPattern: ".*"
    groupsPattern: ".*"
    sourceConnector:
      tasksMax: 1
      config:
        replication.factor: 1
        offset-syncs.topic.replication.factor: 1
    checkpointConnector:
      tasksMax: 1
      config:
        checkpoints.topic.replication.factor: 1
        sync.group.offsets.enabled: "true"

jvmOptions:
  -Xms: 256m
  -Xmx: 512m

resources:
  requests: { memory: 512Mi, cpu: 250m }
  limits: { memory: 1Gi, cpu: 1000m }

podMonitors:
  enabled: false
metrics:
  enabled: false
