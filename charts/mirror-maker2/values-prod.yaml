# Production overlay — HA workers, RF3 durability, monitoring on. Set the REAL
# source bootstrap + credentials for a genuine cross-cluster mirror (the
# defaults are an in-repo loopback).
#
# TLS is NOT forced on here: the repo's kafka-cluster 9093 listener is mTLS
# (authentication.type: tls), which needs a tls-type KafkaUser (user.crt/key),
# not the SCRAM kates-mm2 user. To run over TLS, set on target AND each source:
#   tls: { enabled: true, trustedCertificateSecret: <cluster>-cluster-ca-cert }
#   authentication: { type: tls, secretName: <tls-kafka-user> }
# then narrow networkPolicy.kafka.ports to [9093]. Until then, keep SCRAM/9092.
replicas: 3

# ── Images ──────────────────────────────────────────────────────────────────
# Pin by DIGEST in production, not by tag.
#
# A tag is a pointer someone can move. Re-point
# quay.io/strimzi/kafka:1.1.0-kafka-4.3.0 and the next rolling restart changes
# the Kafka client version underneath a running mirror — which is the one
# variable every compatibility rail in this chart exists to hold still. A
# `@sha256:` digest is the content, so a restart cannot change it and the
# rendered CR records exactly what ran.
#
# Left empty here because a digest is specific to the image you have verified;
# a placeholder digest in a shared file is worse than none. Resolve and pin:
#
#   docker buildx imagetools inspect quay.io/strimzi/kafka:1.1.0-kafka-4.3.0 \
#     --format '{{ "{{" }}.Manifest.Digest{{ "}}" }}'
#   # then, in your own values:
#   image: "quay.io/strimzi/kafka@sha256:<digest>"
#
# The same applies to the helper images below. `:latest` on any of them is
# refused at render time.
image: ""

# preflight.image must be the SAME Kafka line as the workers, or the
# handshake it performs proves the wrong thing. Empty derives it from
# `version`, which keeps that true automatically; pin it to a digest only
# alongside the worker's.
preflight:
  enabled: true
  failOnError: true

# With digest-pinned images there is nothing to re-pull: the content is
# addressed by hash. IfNotPresent keeps every helper pod start independent of
# the registry, so a registry outage cannot stop a preflight or a cutover
# verification. (Use Always only if you pin by mutable tag, which the block
# above argues against.)
imagePullPolicy: IfNotPresent

# Private registry or pull-through mirror. The workers honour this through the
# CR's template.pod.imagePullSecrets; the chart's own pods take it directly.
imagePullSecrets: []
# - name: registry-credentials

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: DoNotSchedule

podAntiAffinity:
  enabled: true
  topologyKey: kubernetes.io/hostname

rack:
  enabled: true
  topologyKey: topology.kubernetes.io/zone

jvmOptions:
  -Xms: 2048m
  -Xmx: 2048m
  gcLoggingEnabled: true

resources:
  requests: { memory: 4Gi, cpu: 2000m }
  limits: { memory: 6Gi, cpu: 4000m }

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

priorityClassName: "system-cluster-critical"

# Metrics + PodMonitor (capability-guarded; needs the Prometheus Operator CRDs)
metrics:
  enabled: true
podMonitors:
  enabled: true
  labels:
    release: kafka

networkPolicy:
  enabled: true
  # Pin DNS egress to kube-dns on strict clusters
  dns:
    namespaceSelector:
      kubernetes.io/metadata.name: kube-system
    podSelector:
      k8s-app: kube-dns
  # Allow both the plaintext (9092/SCRAM) and TLS (9093) broker ports so egress
  # works whichever auth mode is configured. Narrow to [9093] once TLS is on.
  kafka:
    ports: [9092, 9093]
