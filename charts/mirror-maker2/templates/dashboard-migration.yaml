{{- if (.Values.dashboard.migration).enabled }}
{{- $name := include "mirror-maker2.fullname" . }}
{{- $ns := include "mirror-maker2.namespace" . }}
{{- $identity := include "mirror-maker2.isIdentityPolicy" . }}
{{- /*
THE OTHER BOARD, and like the first one it lives in dashboards/, not here:
dashboards/mirror-maker2-migration/, built by scripts/gen-dashboards.py, with
its own README. mirror-maker2.json is for a mirror that RUNS — a DR leg, a
fan-in, something you watch for months. This one is for the hours a migration
takes, and it asks a different question on every panel: not "is the mirror
healthy" but "can I cut over yet, and if not, what is left".

WHICH VARIANT. One condition changes what the board can honestly say rather
than what it selects: under an identity policy the replicated topics keep
their source names, so the Topics section's row title and table description
are different text. Everything else is identical, so there are two files.

WHAT IS INJECTED. uid, title, links and the hidden `$namespace` constant —
the same four as the mirror board, for the same reasons, and the uid gets the
same digest suffix because the old scheme truncated the release name to 26
characters and two releases sharing that prefix overwrote each other's board.

WHAT IS FROZEN. dashboard.migration.drainedBelowMs and .translationFreshMs are
baked into the generated file. drainedBelowMs is not only a threshold colour:
it sits inside the go/no-go panel's `< bool 5000` comparison, where a Grafana
variable would not parse as PromQL — and the promtool gate in
ci-mirror-maker2.yml would say so. Changing either value means changing
dashboards/mirror-maker2-migration/board.py and regenerating; the board's
README says so, and a release that sets them in values no longer moves the
board. That is the one thing this port gives up, deliberately.

THE PANEL THE CI EXTRACTS. `Safe to cut over?` is pulled out of the RENDERED
ConfigMap by its exact title and held to five promtool cases whose input
series are all namespace="kafka". Its expression now reads
namespace="$namespace" like every other panel's, and the extraction step
interpolates the board's own `constant` variables before handing the query to
promtool — which is what Grafana does when it draws the panel. Renaming that
panel still turns the test into one that silently checks nothing.
*/}}
{{- $file := printf "files/dashboards/mirror-maker2-migration%s.json"
      (ternary "-identity" "" (not (empty $identity))) }}
{{- $raw := .Files.Get $file }}
{{- if not $raw }}
{{- fail (printf "mirror-maker2: %s is missing from the chart. It is generated from dashboards/mirror-maker2-migration/ — run scripts/gen-dashboards.py." $file) }}
{{- end }}
{{- $board := fromJson $raw }}
{{- $_ := set $board "uid" (printf "kates-mm2-mig-%s-%s" ($name | trunc 17 | trimSuffix "-") (sha256sum $name | trunc 8)) }}
{{- $_ := set $board "title" (printf "Kafka MirrorMaker 2 — migration — %s" $name) }}
{{- $_ := set $board "links" (list (dict
      "title" "Cutover checklist (runbook)"
      "type" "link"
      "icon" "doc"
      "url" (printf "%s#cutover-checklist" .Values.alerts.runbookBaseUrl)
      "targetBlank" true)) }}
{{- range $var := (index $board "templating" "list") }}
{{- if eq $var.name "namespace" }}
{{- $_ := set $var "query" $ns }}
{{- $_ := set $var "current" (dict "text" $ns "value" $ns) }}
{{- end }}
{{- end }}
{{ include "kafka-common.dashboardConfigMap" (dict
      "name" (printf "%s-dashboard-migration" $name)
      "namespace" $ns
      "labels" (include "mirror-maker2.labels" .)
      "label" .Values.dashboard.label
      "labelValue" .Values.dashboard.labelValue
      "folder" .Values.dashboard.folder
      "file" "mirror-maker2-migration.json"
      "json" (toPrettyJson $board)) }}
{{- end }}
