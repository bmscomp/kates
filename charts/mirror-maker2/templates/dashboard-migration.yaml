{{- if (.Values.dashboard.migration).enabled }}
{{- $name := include "mirror-maker2.fullname" . }}
{{- $ns := include "mirror-maker2.namespace" . }}
{{- $identity := include "mirror-maker2.isIdentityPolicy" . }}
{{- $mig := .Values.dashboard.migration }}
{{- $drained := $mig.drainedBelowMs }}
{{- $fresh := $mig.translationFreshMs }}
{{- /*
THE OTHER BOARD. mirror-maker2.json is for a mirror that RUNS — a DR leg, a
fan-in, something you watch for months. This one is for the hours a migration
takes, and it asks a different question on every panel: not "is the mirror
healthy" but "can I cut over yet, and if not, what is left".

A cutover is the moment the migration stops being reversible in any cheap
sense. The runbook's checklist has three conditions before applying
values-cutover.yaml:

  1. replication lag is zero for every mirrored topic,
  2. producers have stopped and the source's end offsets are static,
  3. the mirror has had a full refresh interval to drain what was in flight.

This board can see 1 and 3. It CANNOT see 2 — nothing the MirrorMaker workers
export says whether anything is still producing to the source; that needs the
source broker's own metrics, and on a migration the source is usually the old
cluster nobody instrumented. So the go/no-go panel says DRAINED for the
conditions it can check, its description names the one it cannot, and it reads
No data rather than DRAINED when the workers are not reporting at all. A board
that implied otherwise would be worse than no board —
scripts/metric-contract/tests/mirror-maker2.cutover-gate-test.yaml holds that
panel's query to all five cases.

WHAT `stopped` LOOKS LIKE HERE. The cutover primitive is
`cutover.sourceConnectorState: stopped`, and `stopped` (unlike `paused`)
releases the connector's tasks — which is the whole point, since a worker
restart cannot then quietly resume replication behind producers that have
already moved. In metrics that reads as the source connector's running task
count going to zero while the checkpoint connector's stays where it was, which
is exactly what the Cutover section plots.

Conventions are the main board's: every panel after the first emits its own
leading comma, and `$y` is a cursor that each section advances past itself. The
same CI gate checks both boards for overlaps, descriptions and queries, and the
same metric contract proves every series below is one the exporter rules can
produce.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-dashboard-migration
  namespace: {{ $ns }}
  labels:
    {{- include "mirror-maker2.labels" . | nindent 4 }}
    {{ .Values.dashboard.label }}: {{ .Values.dashboard.labelValue | quote }}
  annotations:
    grafana_folder: {{ .Values.dashboard.folder | quote }}
data:
  mirror-maker2-migration.json: |
    {
      "title": "Kafka MirrorMaker 2 — migration — {{ $name }}",
      "uid": "kates-mm2-mig-{{ $name | trunc 26 | trimSuffix "-" }}",
      "tags": ["kafka", "mirrormaker2", "migration", "cutover", "kates"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "links": [
        {
          "title": "Cutover checklist (runbook)",
          "type": "link",
          "icon": "doc",
          "url": "{{ .Values.alerts.runbookBaseUrl }}#cutover-checklist",
          "targetBlank": true
        }
      ],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "constant",
            "query": "{{ $ns }}",
            "current": { "text": "{{ $ns }}", "value": "{{ $ns }}" },
            "hide": 2
          }
        ]
      },
      "panels": [
{{- $y := 0 }}
{{- /* ── 1. Go / no-go ──────────────────────────────────────────────── */}}
        {
          "type": "row",
          "title": "Can I cut over yet?",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": {{ $y }} }
        },
        {
          "type": "stat",
          "title": "Safe to cut over?",
          "description": "DRAINED when all three of: replication lag below {{ $drained }}ms, nothing in flight, and no failed tasks. The first factor of the query is the workers' own task count with no `or vector(0)` fallback, so a release that is reporting NOTHING reads as No data rather than as drained — every other factor defaults to the healthy value when its series is absent, and without that guard a dead scrape would show green. It also does NOT know whether producers have stopped writing to the source: no MirrorMaker metric says that, and confirming the source's end offsets are static (twice, 60 seconds apart) is still step 1 of the runbook's checklist. DRAINED means the mirror has caught up with what it was given, not that the source is quiet.",
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "(sum(kafka_connect_worker_metrics_task_count{namespace=\"{{ $ns }}\"}) >= bool 0) * ((max(kafka_connect_mirror_source_connector_replication_latency_ms_max{namespace=\"{{ $ns }}\"} >= 0) or vector(0)) < bool {{ $drained }}) * ((sum(kafka_connect_source_task_metrics_source_record_active_count{namespace=\"{{ $ns }}\"}) or vector(0)) == bool 0) * ((sum(kafka_connect_worker_metrics_connector_failed_task_count{namespace=\"{{ $ns }}\"}) or vector(0)) == bool 0)",
              "legendFormat": "ready"
            }
          ],
          "options": { "textMode": "value", "graphMode": "none", "colorMode": "background" },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": { "text": "NOT YET", "color": "red", "index": 0 },
                    "1": { "text": "DRAINED", "color": "green", "index": 1 }
                  }
                }
              ]
            }
          }
        },
        {
          "type": "stat",
          "title": "Replication lag",
          "description": "The newest record's end-to-end latency, across every mirrored topic. Green below {{ $drained }}ms, the value the go/no-go panel uses. Zero is what the checklist asks for; this is the number that says how close you are.",
          "gridPos": { "h": 5, "w": 4, "x": 8, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "max(kafka_connect_mirror_source_connector_replication_latency_ms_max{namespace=\"{{ $ns }}\"} >= 0) or vector(0)",
              "legendFormat": "lag"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": {{ $drained }} }
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "Records in flight",
          "description": "Polled from the source and not yet acknowledged by the target. This is the 'one full refresh interval to drain what was in flight' of the checklist, as a number rather than a wait.",
          "gridPos": { "h": 5, "w": 4, "x": 12, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "sum(kafka_connect_source_task_metrics_source_record_active_count{namespace=\"{{ $ns }}\"}) or vector(0)",
              "legendFormat": "in flight"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "Catch-up ETA",
          "description": "How long until the fetchers reach the end of the source's log, at the rate the record age has been falling over the last ten minutes. Negative means it is getting further behind, not closer — the mirror is losing to the producers, and no amount of waiting will drain it.",
          "gridPos": { "h": 5, "w": 4, "x": 16, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "(max(kafka_connect_mirror_source_connector_record_age_ms_max{namespace=\"{{ $ns }}\"} >= 0) / -deriv(max(kafka_connect_mirror_source_connector_record_age_ms_max{namespace=\"{{ $ns }}\"} >= 0)[10m:])) / 1000",
              "legendFormat": "eta"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 0 } }
        },
        {
          "type": "stat",
          "title": "Failed tasks",
          "description": "Any failed task means part of the mirror is not replicating, and the partitions that task owned are behind by an unknown amount. A cutover on top of this loses those records.",
          "gridPos": { "h": 5, "w": 4, "x": 20, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "sum(kafka_connect_worker_metrics_connector_failed_task_count{namespace=\"{{ $ns }}\"}) or vector(0)",
              "legendFormat": "failed"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          }
        }
{{- $y = add $y 6 }}
{{- /* ── 2. Draining ────────────────────────────────────────────────── */}}
        ,{
          "type": "row",
          "title": "Draining",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": {{ $y }} }
        },
        {
          "type": "timeseries",
          "title": "Replication lag, per topic",
          "description": "The drain, topic by topic. The line is {{ $drained }}ms. A topic that flattens above the line while the others fall is the one holding the cutover up — usually a partition whose task died, or a topic still being produced to.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "max by (topic) (kafka_connect_mirror_source_connector_replication_latency_ms_max{namespace=\"{{ $ns }}\"} >= 0)",
              "legendFormat": "{{ "{{" }}topic{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": {{ $drained }} }
                ]
              },
              "custom": { "thresholdsStyle": { "mode": "line" } }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Record age at the source",
          "description": "How far behind the source's log the fetchers are reading. This is the series the catch-up ETA extrapolates: a straight line down is a healthy drain, a flat line at the top is a mirror that is keeping pace with production rather than catching up.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "max by (topic) (kafka_connect_mirror_source_connector_record_age_ms_max{namespace=\"{{ $ns }}\"} >= 0)",
              "legendFormat": "{{ "{{" }}topic{{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ms" } }
        },
        {
          "type": "timeseries",
          "title": "Records crossing /s",
          "description": "The drain rate, per connector. Once producers have stopped this should fall to zero and stay there — and staying at zero for a full refresh interval, with lag at zero, is what 'drained' means. It falling to zero while lag is still high means something stopped, not that it finished.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": {{ add $y 9 }} },
          "targets": [
            {
              "expr": "sum by (connector) (rate(kafka_connect_source_task_metrics_source_record_write_total{namespace=\"{{ $ns }}\"}[1m]))",
              "legendFormat": "{{ "{{" }}connector{{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "type": "timeseries",
          "title": "Records in flight",
          "description": "The mirror's own backlog over the window. It has to reach zero and stay there before a cutover: records in flight at the moment the source connector stops are records that were read from the source and never written to the target.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": {{ add $y 9 }} },
          "targets": [
            {
              "expr": "sum by (connector) (kafka_connect_source_task_metrics_source_record_active_count{namespace=\"{{ $ns }}\"})",
              "legendFormat": "{{ "{{" }}connector{{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        }
{{- $y = add $y 17 }}
{{- /* ── 3. Consumer groups ─────────────────────────────────────────── */}}
        ,{
          "type": "row",
          "title": "Consumer groups — will they resume in the right place?",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": {{ $y }} }
        },
        {
          "type": "table",
          "title": "Translated positions, by group",
          "description": "Every consumer group MirrorMaker has translated a position for, and how old that position is. A group missing from this table has no position on the target: move it and it starts from its auto.offset.reset, which on a migration means replaying the topic or skipping everything already replicated. Amber past {{ $fresh }}ms.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "max by (source, group) (kafka_connect_mirror_checkpoint_connector_checkpoint_latency_ms_max{namespace=\"{{ $ns }}\"})",
              "instant": true,
              "format": "table",
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true },
                "renameByName": {
                  "source": "Source",
                  "group": "Consumer group",
                  "Value": "Translation age"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": { "custom": { "align": "auto" } },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Translation age" },
                "properties": [
                  { "id": "unit", "value": "ms" },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "green", "value": null },
                        { "color": "yellow", "value": {{ $fresh }} }
                      ]
                    }
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } }
                ]
              }
            ]
          }
        },
        {
          "type": "timeseries",
          "title": "Translation age over the window",
          "description": "The same numbers as a trend. Flat lines while records are still crossing mean checkpoints are being written and not moving — a failover or a cutover then resumes those consumers where they were when the line went flat.",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "max by (group) (kafka_connect_mirror_checkpoint_connector_checkpoint_latency_ms_max{namespace=\"{{ $ns }}\"})",
              "legendFormat": "{{ "{{" }}group{{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ms" } }
        },
        {
          "type": "timeseries",
          "title": "Checkpoints emitted /s",
          "description": "The checkpoint connector's write rate. It keeps running through a cutover on purpose — consumers move one at a time and every one that has not moved still needs its position translated. Zero here during a cutover is the classic mistake: all the data on the target, and no consumer knowing where to start.",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "sum(rate(kafka_connect_source_task_metrics_source_record_write_total{namespace=\"{{ $ns }}\",connector=~\".*MirrorCheckpointConnector\"}[1m])) or vector(0)",
              "legendFormat": "checkpoints/s"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        }
{{- $y = add $y 9 }}
{{- /* ── 4. Topics ──────────────────────────────────────────────────── */}}
        ,{
          "type": "row",
          "title": "Topics — what is crossing{{ if $identity }} (identity policy: target names match the source){{ end }}",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": {{ $y }} }
        },
        {
          "type": "table",
          "title": "Per replicated topic",
          "description": "Lag and record age side by side for every topic the mirror writes. The table is the cutover's punch list: a topic is done when both columns are at zero and stay there. Topic names here are the REPLICATED names — {{ if $identity }}under this identity policy they are the source's own names{{ else }}under a prefixing policy they start with the source alias{{ end }}.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "max by (topic) (kafka_connect_mirror_source_connector_replication_latency_ms_max{namespace=\"{{ $ns }}\"} >= 0)",
              "instant": true,
              "format": "table",
              "refId": "A"
            },
            {
              "expr": "max by (topic) (kafka_connect_mirror_source_connector_record_age_ms_max{namespace=\"{{ $ns }}\"} >= 0)",
              "instant": true,
              "format": "table",
              "refId": "B"
            },
            {
              "expr": "sum by (topic) (kafka_connect_mirror_source_connector_record_rate{namespace=\"{{ $ns }}\"})",
              "instant": true,
              "format": "table",
              "refId": "C"
            }
          ],
          "transformations": [
            { "id": "merge", "options": {} },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "Time 1": true, "Time 2": true, "Time 3": true },
                "renameByName": {
                  "topic": "Topic",
                  "Value #A": "Lag",
                  "Value #B": "Record age",
                  "Value #C": "Records /s"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": { "custom": { "align": "auto" } },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Lag" },
                "properties": [
                  { "id": "unit", "value": "ms" },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "green", "value": null },
                        { "color": "red", "value": {{ $drained }} }
                      ]
                    }
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Record age" },
                "properties": [{ "id": "unit", "value": "ms" }]
              }
            ]
          }
        },
        {
          "type": "timeseries",
          "title": "Bytes crossing /s, per topic",
          "description": "byte-rate is already a rate, so it is read as is. Useful for sizing the window rather than for the go/no-go: a topic moving megabytes a second will take longer to drain than the lag number alone suggests.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "sum by (topic) (kafka_connect_mirror_source_connector_byte_rate{namespace=\"{{ $ns }}\"})",
              "legendFormat": "{{ "{{" }}topic{{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "Bps" } }
        }
{{- $y = add $y 9 }}
{{- /* ── 5. Cutover state ───────────────────────────────────────────── */}}
        ,{
          "type": "row",
          "title": "Cutover state",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": {{ $y }} }
        },
        {
          "type": "stat",
          "title": "Source connector",
          "description": "RUNNING until the cutover overlay is applied, STOPPED after. `stopped` releases the connector's tasks — which is why this reads zero rather than merely idle — so a worker restart cannot resume replication behind producers that have already moved to the target.",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "sum(kafka_connect_worker_metrics_connector_running_task_count{namespace=\"{{ $ns }}\",connector=~\".*MirrorSourceConnector\"}) or vector(0)",
              "legendFormat": "source"
            }
          ],
          "options": { "textMode": "value", "graphMode": "none", "colorMode": "background" },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "STOPPED", "color": "blue", "index": 0 } } },
                { "type": "range", "options": { "from": 0.5, "to": 100000, "result": { "text": "RUNNING", "color": "green", "index": 1 } } }
              ]
            }
          }
        },
        {
          "type": "stat",
          "title": "Checkpoint connector",
          "description": "Must stay RUNNING through the cutover and until the last consumer has moved. Stopping both connectors together is the classic cutover mistake: every record is on the target and no consumer knows where to start reading it.",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "sum(kafka_connect_worker_metrics_connector_running_task_count{namespace=\"{{ $ns }}\",connector=~\".*MirrorCheckpointConnector\"}) or vector(0)",
              "legendFormat": "checkpoint"
            }
          ],
          "options": { "textMode": "value", "graphMode": "none", "colorMode": "background" },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "STOPPED", "color": "red", "index": 0 } } },
                { "type": "range", "options": { "from": 0.5, "to": 100000, "result": { "text": "RUNNING", "color": "green", "index": 1 } } }
              ]
            }
          }
        },
        {
          "type": "stat",
          "title": "Still replicating /s",
          "description": "Records the SOURCE connector is writing, now. After the cutover this must be zero and stay zero — a non-zero reading here means the freeze did not take, and records are still arriving behind whatever your new producers are appending to the target.",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "sum(rate(kafka_connect_source_task_metrics_source_record_write_total{namespace=\"{{ $ns }}\",connector=~\".*MirrorSourceConnector\"}[1m])) or vector(0)",
              "legendFormat": "records/s"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "type": "stat",
          "title": "Errors /s",
          "description": "Errors logged by any task in the window. A migration that starts erroring mid-drain is one where the lag number stops meaning what you think it means — records may be being skipped rather than replicated.",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "sum(rate(kafka_connect_task_error_metrics_total_errors_logged{namespace=\"{{ $ns }}\"}[5m])) or vector(0)",
              "legendFormat": "errors/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0.001 }
                ]
              }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "The freeze, per connector",
          "description": "The picture a cutover should make: the source connector's line drops to zero and stays there, the checkpoint connector's keeps going. Both at zero means offset translation stopped too, and every consumer that has not moved yet is stranded.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": {{ add $y 6 }} },
          "targets": [
            {
              "expr": "sum by (connector) (rate(kafka_connect_source_task_metrics_source_record_write_total{namespace=\"{{ $ns }}\"}[1m]))",
              "legendFormat": "{{ "{{" }}connector{{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        }
      ]
    }
{{- end }}
