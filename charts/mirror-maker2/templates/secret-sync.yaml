{{- /*
Copy each source/target credential (and CA cert) Secret from its own namespace
into this release's namespace, so MM2's per-cluster passwordSecret/tls refs
resolve. A post-install/post-upgrade hook Job, re-run each upgrade to pick up
rotation. RBAC is scoped by name in the source namespaces and by name in the
destination. No-op when secretSync.secrets is empty.

Each entry may carry `as`, the name the copy is created under. That is what a
migration between two Strimzi clusters needs: both ends have a `kates-mm2`
KafkaUser, so both credential Secrets are called `kates-mm2` in their own
namespaces, and the source's copy has to land here under another name
(`kates-mm2-<source>`), which the mirror's source.authentication.secretName
then references. Without `as` the copy keeps its name. An entry whose source
namespace AND name equal the destination's is a no-op and is skipped.

WHY POST-install, with ORDINARY RBAC — this was tried the other way. A
pre-install Job would let the preflight probe mount synced credentials on a
fresh install, but a pre-install Job needs its ServiceAccount and Roles to be
pre-install hooks too (ordinary resources are created only after the hook
phase), and hook resources are not part of the release: `helm uninstall`
never deletes them. That leaked a Role and RoleBinding granting `get/watch`
on named Secrets into every source namespace, permanently, bound to a
ServiceAccount that no longer existed. Tracked RBAC that is cleaned up on
uninstall is worth more than a credential check on the very first install —
so instead, the preflight probe treats a not-yet-synced credential as
"reachability and protocol verified, credentials not", and says so. The MM2
CR simply references the Secrets and the operator retries until they appear.
*/ -}}
{{- if .Values.secretSync.enabled }}
{{- include "kafka-common.secretSync" (dict
      "fullname" (include "mirror-maker2.fullname" .)
      "namespace" (include "mirror-maker2.namespace" .)
      "labels" (include "mirror-maker2.labels" .)
      "secrets" .Values.secretSync.secrets
      "image" (.Values.secretSync.image | default .Values.testImages.kubectl)
      "pullPolicy" .Values.imagePullPolicy
      "timeoutSeconds" .Values.secretSync.timeoutSeconds
      "watch" .Values.secretSync.watch
      "schedule" .Values.secretSync.schedule) }}
{{- end }}
