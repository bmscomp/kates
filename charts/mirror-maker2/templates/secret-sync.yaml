{{- /*
Copy each source/target credential (and CA cert) Secret from its own namespace
into this release's namespace, so MM2's per-cluster passwordSecret/tls refs
resolve. A post-install/post-upgrade hook Job, re-run each upgrade to pick up
rotation. RBAC is scoped by name in the source namespaces and by name in the
destination. No-op when secretSync.secrets is empty.

Each entry may carry `as`, the name the copy is created under. That is what a
migration between two Strimzi clusters needs: both ends have a `kates-mm2`
KafkaUser, so both credential Secrets are called `kates-mm2` in their own
namespaces, and the source's copy has to land here under another name
(`kates-mm2-<source>`), which the mirror's source.authentication.secretName
then references. Without `as` the copy keeps its name. An entry whose source
namespace AND name equal the destination's is a no-op and is skipped.

WHY POST-install, with ORDINARY RBAC — this was tried the other way. A
pre-install Job would let the preflight probe mount synced credentials on a
fresh install, but a pre-install Job needs its ServiceAccount and Roles to be
pre-install hooks too (ordinary resources are created only after the hook
phase), and hook resources are not part of the release: `helm uninstall`
never deletes them. That leaked a Role and RoleBinding granting `get/watch`
on named Secrets into every source namespace, permanently, bound to a
ServiceAccount that no longer existed. Tracked RBAC that is cleaned up on
uninstall is worth more than a credential check on the very first install —
so instead, the preflight probe treats a not-yet-synced credential as
"reachability and protocol verified, credentials not", and says so. The MM2
CR simply references the Secrets and the operator retries until they appear.
*/ -}}
{{- $dstNs := include "mirror-maker2.namespace" . }}
{{- /*
  Normalise every entry to {name, fromNamespace, as} and skip the ones that
  are already here under the target name — nothing to copy.
*/}}
{{- $secrets := list }}
{{- range .Values.secretSync.secrets }}
{{- $as := .as | default .name }}
{{- if not (and (eq .fromNamespace $dstNs) (eq $as .name)) }}
{{- $secrets = append $secrets (dict "name" .name "fromNamespace" .fromNamespace "as" $as) }}
{{- end }}
{{- end }}
{{- if and .Values.secretSync.enabled $secrets }}
{{- $fullname := include "mirror-maker2.fullname" . }}
{{- $syncImage := .Values.secretSync.image | default .Values.testImages.kubectl }}
{{- /* Target names: what the write Role must allow get/update/patch on. */}}
{{- $names := list }}{{- range $secrets }}{{- $names = append $names .as }}{{- end }}
{{- $srcNamespaces := list }}{{- range $secrets }}{{- $srcNamespaces = append $srcNamespaces .fromNamespace }}{{- end }}
{{- $srcNamespaces = $srcNamespaces | uniq }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-secret-sync
  namespace: {{ $dstNs }}
  labels:
    {{- include "mirror-maker2.labels" . | nindent 4 }}
{{- /* Read Role per distinct source namespace, scoped to the names from that ns */}}
{{- range $srcNs := $srcNamespaces }}
{{- $nsNames := list }}
{{- range $secrets }}{{- if eq .fromNamespace $srcNs }}{{- $nsNames = append $nsNames .name }}{{- end }}{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-secret-sync-read
  namespace: {{ $srcNs }}
  labels:
    {{- include "mirror-maker2.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: {{ $nsNames | uniq | toJson }}
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-secret-sync-read
  namespace: {{ $srcNs }}
  labels:
    {{- include "mirror-maker2.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-secret-sync-read
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-secret-sync
    namespace: {{ $dstNs }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-secret-sync-write
  namespace: {{ $dstNs }}
  labels:
    {{- include "mirror-maker2.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: {{ $names | uniq | toJson }}
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-secret-sync-write
  namespace: {{ $dstNs }}
  labels:
    {{- include "mirror-maker2.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-secret-sync-write
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-secret-sync
    namespace: {{ $dstNs }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-secret-sync
  namespace: {{ $dstNs }}
  labels:
    {{- include "mirror-maker2.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ .Values.secretSync.timeoutSeconds | default 300 }}
  template:
    metadata:
      labels:
        {{- include "mirror-maker2.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $fullname }}-secret-sync
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          # Needs kubectl + jq + sh. Defaults to the tester image; override
          # with secretSync.image for a dedicated runtime image.
          image: {{ $syncImage }}
          {{- include "mirror-maker2.imagePullPolicy" $ | nindent 10 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          env:
            - name: DST_NS
              value: {{ $dstNs | quote }}
            # Space-separated "<srcNamespace>/<name>/<targetName>" triples.
            # Namespace and Secret names cannot contain "/", so the split is
            # unambiguous.
            - name: PAIRS
              value: {{ range $i, $s := $secrets }}{{ if $i }} {{ end }}{{ $s.fromNamespace }}/{{ $s.name }}/{{ $s.as }}{{ end }}
          command:
            - /bin/sh
            - -ec
            - |
              for pair in ${PAIRS}; do
                SRC_NS="${pair%%/*}"; rest="${pair#*/}"
                NAME="${rest%%/*}"; DST_NAME="${rest#*/}"
                echo "Waiting for ${SRC_NS}/${NAME}..."
                i=0
                until kubectl -n "${SRC_NS}" get secret "${NAME}" >/dev/null 2>&1; do
                  i=$((i+1)); [ "$i" -ge 48 ] && { echo "Timed out on ${SRC_NS}/${NAME}" >&2; exit 1; }
                  sleep 5
                done
                echo "Copying ${SRC_NS}/${NAME} -> ${DST_NS}/${DST_NAME}"
                kubectl -n "${SRC_NS}" get secret "${NAME}" -o json \
                  | jq --arg ns "${DST_NS}" --arg name "${DST_NAME}" --arg src "${SRC_NS}/${NAME}" '
                      {apiVersion:"v1", kind:"Secret", type:.type, data:.data,
                       metadata:{name:$name, namespace:$ns,
                                 labels:(.metadata.labels // {}),
                                 annotations:{"kates.io/synced-from":$src}}}' \
                  | kubectl apply -f -
              done
              echo "All secrets synced."
{{- if .Values.secretSync.watch }}
---
{{- /*
Rotation.

The Job above runs on install and upgrade, so a credential rotated in between
does not reach the workers until someone runs `helm upgrade` — and the symptom
is an authentication failure inside a connector, hours later. This CronJob
re-copies on a schedule.

Opt-in on purpose: it is a STANDING grant to read Secrets in another
namespace, held by a pod that runs unattended. The Job's grant lasts for one
hook; this one lasts as long as the release. If the cluster already runs
kubernetes-reflector, prefer it and leave this off.
*/}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $fullname }}-secret-sync
  namespace: {{ $dstNs }}
  labels:
    {{- include "mirror-maker2.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.secretSync.schedule | default "*/15 * * * *" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: {{ .Values.secretSync.timeoutSeconds | default 300 }}
      template:
        metadata:
          labels:
            {{- include "mirror-maker2.labels" . | nindent 12 }}
        spec:
          serviceAccountName: {{ $fullname }}-secret-sync
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              # Needs kubectl + jq + sh. Defaults to the tester image; override
              # with secretSync.image for a dedicated runtime image.
              image: {{ $syncImage }}
              {{- include "mirror-maker2.imagePullPolicy" $ | nindent 14 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 100m, memory: 64Mi }
              env:
                - name: DST_NS
                  value: {{ $dstNs | quote }}
                # Space-separated "<srcNamespace>/<name>/<targetName>" triples.
                # Namespace and Secret names cannot contain "/", so the split is
                # unambiguous.
                - name: PAIRS
                  value: {{ range $i, $s := $secrets }}{{ if $i }} {{ end }}{{ $s.fromNamespace }}/{{ $s.name }}/{{ $s.as }}{{ end }}
              command:
                - /bin/sh
                - -ec
                - |
                  for pair in ${PAIRS}; do
                    SRC_NS="${pair%%/*}"; rest="${pair#*/}"
                    NAME="${rest%%/*}"; DST_NAME="${rest#*/}"
                    echo "Waiting for ${SRC_NS}/${NAME}..."
                    i=0
                    until kubectl -n "${SRC_NS}" get secret "${NAME}" >/dev/null 2>&1; do
                      i=$((i+1)); [ "$i" -ge 48 ] && { echo "Timed out on ${SRC_NS}/${NAME}" >&2; exit 1; }
                      sleep 5
                    done
                    echo "Copying ${SRC_NS}/${NAME} -> ${DST_NS}/${DST_NAME}"
                    kubectl -n "${SRC_NS}" get secret "${NAME}" -o json \
                      | jq --arg ns "${DST_NS}" --arg name "${DST_NAME}" --arg src "${SRC_NS}/${NAME}" '
                          {apiVersion:"v1", kind:"Secret", type:.type, data:.data,
                           metadata:{name:$name, namespace:$ns,
                                     labels:(.metadata.labels // {}),
                                     annotations:{"kates.io/synced-from":$src}}}' \
                      | kubectl apply -f -
                  done
                  echo "All secrets synced."
{{- end }}
{{- end }}
