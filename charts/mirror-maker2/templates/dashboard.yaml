{{- if .Values.dashboard.enabled }}
{{- $name := include "mirror-maker2.fullname" . }}
{{- $ns := include "mirror-maker2.namespace" . }}
{{- $identity := include "mirror-maker2.isIdentityPolicy" . }}
{{- /* The SLO section reads the recorded mm2:* series, which exist only when
       the PrometheusRule that records them is installed. */}}
{{- $slo := and .Values.alerts.enabled .Values.alerts.slo.enabled }}
{{- /*
THE BOARD ITSELF LIVES IN dashboards/mirror-maker2/, NOT HERE.

It is built from `board.py` by scripts/gen-dashboards.py, which writes the
generated JSON both to dashboards/mirror-maker2/dashboard.json and to the copy
below — Helm cannot read a file outside its own chart directory, so the chart
gets its own copy and `gen-dashboards.py --check` fails when the two drift.
dashboards/mirror-maker2/README.md is the board's documentation.

This file is now only the delivery: which variant, and the four things a
RELEASE knows that a generated file cannot.

WHICH VARIANT. Two conditions change the panel list rather than a label
value, so the generator builds every combination and this picks one:

  $slo       38 panels with the Replication SLO row, 34 without, and every
             row below it shifts. Grafana has no "hide this row if the
             series is absent".
  $identity  under an identity policy the replicated topic keeps its source
             name, so the per-source lag panel has no prefix to match: a
             different expression AND a different description.

WHAT IS INJECTED, and why each one cannot be in the file.

  uid      Grafana keys a board by uid and allows 40 characters. The old
           scheme truncated the release name to 30, so two releases sharing
           a 30-character prefix silently overwrote each other's board.
           connect-cluster fixed exactly this with a digest suffix; this is
           that scheme: a readable prefix plus 8 characters of sha256 over
           the WHOLE name, which cannot collide by truncation.
  title    one Grafana, several releases, and "Kafka MirrorMaker 2" twice in
           the list tells nobody which is which.
  links    alerts.runbookBaseUrl is repointed by forks that vendor the
           runbook elsewhere; freezing it in the file would quietly break
           the header link for them.
  the constants  $namespace, $cluster and $pods are hidden `constant`
           template variables. The panels name the variable and never a
           literal, which is what lets one generated file serve every
           release; the values come from here. $source is the same idea for
           the per-source row, which `repeat`s over it — one row is written
           and Grafana draws one per mirror, in place of the `range
           .Values.mirrors` this template used to run at render time.

Thresholds are NOT injected. `alerts.thresholds` and the SLO error budget are
frozen into the generated file, because a Grafana threshold is not templatable
and the one that sits inside a PromQL comparison would not parse as `$`.
dashboards/mirror-maker2/README.md lists every frozen number.

The metric names are the JMX exporter's (metrics-configmap.yml), and every one
of them is checked against the rules that produce it by
`scripts/check-metric-contract.sh mirror-maker2`, which reads them out of the
rendered ConfigMap below. Under metrics.type=strimziMetricsReporter the
reporter names the same numbers differently and these panels read empty;
unlike the alerts, the dashboard does NOT refuse to render there, because an
empty panel is visible to the person looking at it whereas an alert that
cannot fire is silent by construction.
*/}}
{{- $file := printf "files/dashboards/mirror-maker2%s%s.json"
      (ternary "-identity" "" (not (empty $identity)))
      (ternary "" "-no-slo" (not (not $slo))) }}
{{- $raw := .Files.Get $file }}
{{- if not $raw }}
{{- fail (printf "mirror-maker2: %s is missing from the chart. It is generated from dashboards/mirror-maker2/ — run scripts/gen-dashboards.py." $file) }}
{{- end }}
{{- $board := fromJson $raw }}
{{- $_ := set $board "uid" (printf "kates-mm2-%s-%s" ($name | trunc 21 | trimSuffix "-") (sha256sum $name | trunc 8)) }}
{{- $_ := set $board "title" (printf "Kafka MirrorMaker 2 — %s" $name) }}
{{- $_ := set $board "links" (list (dict
      "title" "MirrorMaker 2 runbook"
      "type" "link"
      "icon" "doc"
      "url" .Values.alerts.runbookBaseUrl
      "targetBlank" true)) }}
{{- $constants := dict "namespace" $ns "cluster" $name "pods" (printf "%s-mirrormaker2-.*" $name) }}
{{- $aliases := list }}
{{- range .Values.mirrors }}
{{- $aliases = append $aliases (.source.alias | default "source") }}
{{- end }}
{{- range $var := (index $board "templating" "list") }}
{{- if hasKey $constants $var.name }}
{{- $value := index $constants $var.name }}
{{- $_ := set $var "query" $value }}
{{- $_ := set $var "current" (dict "text" $value "value" $value) }}
{{- else if eq $var.name "source" }}
{{- $options := list }}
{{- range $alias := $aliases }}
{{- $options = append $options (dict "text" $alias "value" $alias "selected" true) }}
{{- end }}
{{- $_ := set $var "query" (join "," $aliases) }}
{{- $_ := set $var "options" $options }}
{{- $_ := set $var "current" (dict "text" $aliases "value" $aliases "selected" true) }}
{{- end }}
{{- end }}
{{ include "kafka-common.dashboardConfigMap" (dict
      "name" (printf "%s-dashboard" $name)
      "namespace" $ns
      "labels" (include "mirror-maker2.labels" .)
      "label" .Values.dashboard.label
      "labelValue" .Values.dashboard.labelValue
      "folder" .Values.dashboard.folder
      "file" "mirror-maker2.json"
      "json" (toPrettyJson $board)) }}
{{- end }}
