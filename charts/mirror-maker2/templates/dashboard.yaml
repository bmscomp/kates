{{- if .Values.dashboard.enabled }}
{{- $name := include "mirror-maker2.fullname" . }}
{{- $ns := include "mirror-maker2.namespace" . }}
{{- $identity := include "mirror-maker2.isIdentityPolicy" . }}
{{- $sep := (.Values.replicationPolicy).separator | default "." }}
{{- $th := .Values.alerts.thresholds }}
{{- /* The SLO section reads the recorded mm2:* series, which exist only when
       the PrometheusRule that records them is installed. */}}
{{- $slo := and .Values.alerts.enabled .Values.alerts.slo.enabled }}
{{- $pods := printf "%s-mirrormaker2-.*" $name }}
{{- /*
ONE BOARD, READ TOP TO BOTTOM. The sections answer, in order, the questions an
operator asks in an incident:

  1. Health          is it up, is it lagging, is it erroring — six numbers
  2. Task states     which connector lost a task (a partially failed connector
                     still reports RUNNING on the CR)
  3. Replication     is data moving, how far behind, how much of it
  4. Offset translation  will consumers have somewhere to resume from
  5. Errors          what is being dropped, retried, dead-lettered
  6. Replication SLO how much of the budget today has cost (when recorded)
  7. Workers         the JVM and the rebalances under all of it
  8. The path a record takes   source fetch → target produce, collapsed
  9. Source: <alias>  per-leg detail, collapsed, one row per mirror

Everything above the fold is release-wide; a fan-in release reads its legs in
the per-source rows and in the `connector` legend, which carries the alias.

THREE MECHANICS THIS FILE DEPENDS ON.

1. LEADING COMMAS. The `.data` value must be valid JSON, and Grafana's sidecar
   reports a parse failure nowhere the operator will see — the dashboard simply
   never appears. Every panel after the first therefore emits its OWN leading
   comma, so a section that renders conditionally (the SLO row) or a repeated
   one (per source) can be added or dropped without moving a comma anywhere
   else. The first panel in the array, and only it, has none.

2. THE Y CURSOR. `$y` is the next free row of the 24-column grid. Each section
   places its header at `$y`, its panels at `$y + 1` (and a second band at
   `$y + 9` where it has one), then advances `$y` past itself. Nothing is
   hand-numbered, so inserting a section cannot silently overlap the next one —
   the failure this replaces was a board whose Workers row sat at a literal
   `41` while the row above it had grown.

3. BACKSLASHES CROSS THREE LAYERS. A PromQL regex needs a literal dot, JSON
   needs the backslash doubled, and a YAML block scalar passes both through
   untouched — so the alias prefix is written as a character class,
   `topic=~\"<alias>[.].*\"`, which needs no backslash at any layer.

The metric names are the JMX exporter's (metrics-configmap.yml), and every one
of them is checked against the rules that produce it by
`scripts/check-metric-contract.sh mirror-maker2`. Under
metrics.type=strimziMetricsReporter the reporter names the same numbers
differently and these panels read empty; unlike the alerts, the dashboard does
NOT refuse to render there, because an empty panel is visible to the person
looking at it whereas an alert that cannot fire is silent by construction.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-dashboard
  namespace: {{ $ns }}
  labels:
    {{- include "mirror-maker2.labels" . | nindent 4 }}
    {{ .Values.dashboard.label }}: {{ .Values.dashboard.labelValue | quote }}
  annotations:
    grafana_folder: {{ .Values.dashboard.folder | quote }}
data:
  mirror-maker2.json: |
    {
      "title": "Kafka MirrorMaker 2 — {{ $name }}",
      "uid": "kates-mm2-{{ $name | trunc 30 | trimSuffix "-" }}",
      "tags": ["kafka", "mirrormaker2", "replication", "kates"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "links": [
        {
          "title": "MirrorMaker 2 runbook",
          "type": "link",
          "icon": "doc",
          "url": "{{ .Values.alerts.runbookBaseUrl }}",
          "targetBlank": true
        }
      ],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "constant",
            "query": "{{ $ns }}",
            "current": { "text": "{{ $ns }}", "value": "{{ $ns }}" },
            "hide": 2
          }
        ]
      },
      "panels": [
{{- $y := 0 }}
{{- /* ── 1. Health ──────────────────────────────────────────────────────
       Six stats, in the order the plan asks every component's board to
       answer: is it up, is it lagging, is it erroring. */}}
        {
          "type": "row",
          "title": "Is it up, is it lagging, is it erroring",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": {{ $y }} }
        },
        {
          "type": "stat",
          "title": "Workers reporting",
          "description": "Pods whose metrics endpoint answered the last scrape. Counted from a series every worker always has, rather than from `up`, because `up` carries the job label the PodMonitor happens to generate and this does not.",
          "gridPos": { "h": 5, "w": 4, "x": 0, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "count(kafka_connect_worker_metrics_task_count{namespace=\"{{ $ns }}\"})",
              "legendFormat": "workers"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "Tasks running",
          "description": "Running tasks over total, across every connector of this release. Anything below 1 for longer than a rebalance is a task that died — the table below says which connector.",
          "gridPos": { "h": 5, "w": 4, "x": 4, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "sum(kafka_connect_worker_metrics_connector_running_task_count{namespace=\"{{ $ns }}\"}) / sum(kafka_connect_worker_metrics_connector_total_task_count{namespace=\"{{ $ns }}\"})",
              "legendFormat": "running"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "Records replicated /s",
          "description": "The one number that says the mirror is alive. Zero here with the connectors RUNNING is the signature of a missing source-side ACL: the connector cannot read, and says so nowhere the CR can see.",
          "gridPos": { "h": 5, "w": 4, "x": 8, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "sum(rate(kafka_connect_source_task_metrics_source_record_write_total{namespace=\"{{ $ns }}\"}[5m]))",
              "legendFormat": "records/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 0.001 }
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "Replication lag (max)",
          "description": "End-to-end latency, source append to target write. This is the number a cutover decision rests on: records written to the source within this window are not yet on the target.",
          "gridPos": { "h": 5, "w": 4, "x": 12, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "max(kafka_connect_mirror_source_connector_replication_latency_ms_max{namespace=\"{{ $ns }}\"})",
              "legendFormat": "lag"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": {{ div $th.replicationLatencyMs 6 }} },
                  { "color": "red", "value": {{ $th.replicationLatencyMs }} }
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "Offset translation age (max)",
          "description": "How old the newest translated consumer position is. The other clock: data can be current while the positions consumers would resume from are hours behind, and a failover then replays everything since.",
          "gridPos": { "h": 5, "w": 4, "x": 16, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "max(kafka_connect_mirror_checkpoint_connector_checkpoint_latency_ms_max{namespace=\"{{ $ns }}\"})",
              "legendFormat": "translation age"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": {{ $th.replicationLatencyMs }} },
                  { "color": "red", "value": {{ mul $th.replicationLatencyMs 5 }} }
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "Errors /s",
          "description": "Errors logged by the tasks of every connector in this release. Red is the MirrorMaker2HighErrorRate threshold. A mirror can absorb an error on every record and keep reporting RUNNING.",
          "gridPos": { "h": 5, "w": 4, "x": 20, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "sum(rate(kafka_connect_task_error_metrics_total_errors_logged{namespace=\"{{ $ns }}\"}[5m]))",
              "legendFormat": "errors/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": {{ $th.errorRatePerSecond }} }
                ]
              }
            }
          }
        }
{{- $y = add $y 6 }}
{{- /* ── 2. Task states ─────────────────────────────────────────────── */}}
        ,{
          "type": "row",
          "title": "Connector task states",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": {{ $y }} }
        },
        {
          "type": "table",
          "title": "Tasks by connector and state",
          "description": "The panel that makes a PARTIALLY failed connector visible. A MirrorSourceConnector with 3 tasks, 2 running and 1 failed, reports RUNNING on the CR and keeps replicating most partitions — the ones the dead task owned simply stop, silently. One row per connector, and the connector name carries the source alias, so a fan-in release shows which leg lost a task.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "sum by (connector) (kafka_connect_worker_metrics_connector_running_task_count{namespace=\"{{ $ns }}\"})",
              "legendFormat": "running",
              "instant": true,
              "format": "table",
              "refId": "A"
            },
            {
              "expr": "sum by (connector) (kafka_connect_worker_metrics_connector_failed_task_count{namespace=\"{{ $ns }}\"})",
              "legendFormat": "failed",
              "instant": true,
              "format": "table",
              "refId": "B"
            },
            {
              "expr": "sum by (connector) (kafka_connect_worker_metrics_connector_paused_task_count{namespace=\"{{ $ns }}\"})",
              "legendFormat": "paused",
              "instant": true,
              "format": "table",
              "refId": "C"
            },
            {
              "expr": "sum by (connector) (kafka_connect_worker_metrics_connector_unassigned_task_count{namespace=\"{{ $ns }}\"})",
              "legendFormat": "unassigned",
              "instant": true,
              "format": "table",
              "refId": "D"
            },
            {
              "expr": "sum by (connector) (kafka_connect_worker_metrics_connector_restarting_task_count{namespace=\"{{ $ns }}\"})",
              "legendFormat": "restarting",
              "instant": true,
              "format": "table",
              "refId": "E"
            },
            {
              "expr": "sum by (connector) (kafka_connect_worker_metrics_connector_total_task_count{namespace=\"{{ $ns }}\"})",
              "legendFormat": "total",
              "instant": true,
              "format": "table",
              "refId": "F"
            }
          ],
          "transformations": [
            { "id": "merge", "options": {} },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "Time 1": true, "Time 2": true, "Time 3": true, "Time 4": true, "Time 5": true, "Time 6": true },
                "renameByName": {
                  "connector": "Connector",
                  "Value #A": "Running",
                  "Value #B": "Failed",
                  "Value #C": "Paused",
                  "Value #D": "Unassigned",
                  "Value #E": "Restarting",
                  "Value #F": "Total"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": { "custom": { "align": "auto" } },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Failed" },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "green", "value": null },
                        { "color": "red", "value": 1 }
                      ]
                    }
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Unassigned" },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "green", "value": null },
                        { "color": "yellow", "value": 1 }
                      ]
                    }
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } }
                ]
              }
            ]
          }
        }
{{- $y = add $y 9 }}
{{- /* ── 3. Replication ─────────────────────────────────────────────── */}}
        ,{
          "type": "row",
          "title": "Replication",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": {{ $y }} }
        },
        {
          "type": "timeseries",
          "title": "Records written to target",
          "description": "Per connector, so a fan-in release shows each leg. The checkpoint connector appears here too — its records are the checkpoints themselves, which is how the offset-translation section below can tell 'stopped emitting' from 'emitting the same position'.",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "sum by (connector) (rate(kafka_connect_source_task_metrics_source_record_write_total{namespace=\"{{ $ns }}\"}[5m]))",
              "legendFormat": "{{ "{{" }}connector{{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "type": "timeseries",
          "title": "Replication lag by topic",
          "description": "End-to-end latency per replicated topic. The red line is the MirrorMaker2ReplicationLagHigh threshold. Watch this go to zero before a cutover, not merely low.",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "max by (topic) (kafka_connect_mirror_source_connector_replication_latency_ms_max{namespace=\"{{ $ns }}\"})",
              "legendFormat": "{{ "{{" }}topic{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": {{ $th.replicationLatencyMs }} }
                ]
              },
              "custom": { "thresholdsStyle": { "mode": "line" } }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Record age at source",
          "description": "How far behind the source's log the fetchers are reading, before anything is written to the target. Rising here with flat replication lag means the source is producing faster than the mirror reads it; the two rising together is a target-side problem.",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "max by (topic) (kafka_connect_mirror_source_connector_record_age_ms_max{namespace=\"{{ $ns }}\"})",
              "legendFormat": "{{ "{{" }}topic{{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ms" } }
        },
        {
          "type": "timeseries",
          "title": "Bytes replicated /s",
          "description": "byte-rate is already a rate (bytes per second over Kafka's own window), so it is read as is; rate() over it would be the rate of a rate.",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": {{ add $y 9 }} },
          "targets": [
            {
              "expr": "sum by (topic) (kafka_connect_mirror_source_connector_byte_rate{namespace=\"{{ $ns }}\"})",
              "legendFormat": "{{ "{{" }}topic{{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "Bps" } }
        },
        {
          "type": "timeseries",
          "title": "Polled vs written",
          "description": "What the tasks read from the source against what they wrote to the target. A persistent gap is records being filtered, transformed away or dropped — not a backlog, which shows up in the panel to the right.",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": {{ add $y 9 }} },
          "targets": [
            {
              "expr": "sum(kafka_connect_source_task_metrics_source_record_poll_rate{namespace=\"{{ $ns }}\"})",
              "legendFormat": "polled"
            },
            {
              "expr": "sum(kafka_connect_source_task_metrics_source_record_write_rate{namespace=\"{{ $ns }}\"})",
              "legendFormat": "written"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "type": "timeseries",
          "title": "Records in flight",
          "description": "Records polled from the source and not yet acknowledged by the target, per connector. This is the mirror's own backlog: it grows when the target's produce path is the bottleneck, which the collapsed clients section reads directly.",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": {{ add $y 9 }} },
          "targets": [
            {
              "expr": "sum by (connector) (kafka_connect_source_task_metrics_source_record_active_count{namespace=\"{{ $ns }}\"})",
              "legendFormat": "{{ "{{" }}connector{{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        }
{{- $y = add $y 17 }}
{{- /* ── 4. Offset translation ──────────────────────────────────────── */}}
        ,{
          "type": "row",
          "title": "Offset translation — what a failover would resume from",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": {{ $y }} }
        },
        {
          "type": "timeseries",
          "title": "Translation age by source and group",
          "description": "How old each consumer group's translated position is. Flat while records are flowing is the failure MirrorMaker2OffsetSyncStale fires on: checkpoints are being written but not moving, so a failover resumes consumers where they were hours ago.",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "max by (source, group) (kafka_connect_mirror_checkpoint_connector_checkpoint_latency_ms_max{namespace=\"{{ $ns }}\"})",
              "legendFormat": "{{ "{{" }}source{{ "}}" }} / {{ "{{" }}group{{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ms" } }
        },
        {
          "type": "timeseries",
          "title": "Checkpoints emitted /s",
          "description": "The checkpoint connector's own write rate. Zero here while the source connector is still writing is MirrorMaker2CheckpointStalled — consumers will have the data on the target and no position to resume from, which is what turns a clean cutover into a full replay.",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "sum by (connector) (rate(kafka_connect_source_task_metrics_source_record_write_total{namespace=\"{{ $ns }}\",connector=~\".*MirrorCheckpointConnector\"}[5m]))",
              "legendFormat": "{{ "{{" }}connector{{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "type": "timeseries",
          "title": "Offset commit success",
          "description": "Each task's own offset commits — the mirror's record of where IT has got to, which is separate from the translated consumer positions above. Sustained below 1 means the task will redo work after a restart.",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "min by (connector) (kafka_connect_connector_task_metrics_offset_commit_success_percentage{namespace=\"{{ $ns }}\"})",
              "legendFormat": "{{ "{{" }}connector{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1
            }
          }
        }
{{- $y = add $y 9 }}
{{- /* ── 5. Errors ──────────────────────────────────────────────────── */}}
        ,{
          "type": "row",
          "title": "Errors, retries and dead letters",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": {{ $y }} }
        },
        {
          "type": "timeseries",
          "title": "Errors logged /s",
          "description": "Per connector, with the MirrorMaker2HighErrorRate threshold drawn. This is the series the alert reads and, until this board had a panel for it, the only place it existed was the alert.",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "sum by (connector) (rate(kafka_connect_task_error_metrics_total_errors_logged{namespace=\"{{ $ns }}\"}[5m]))",
              "legendFormat": "{{ "{{" }}connector{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": {{ $th.errorRatePerSecond }} }
                ]
              },
              "custom": { "thresholdsStyle": { "mode": "line" } }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Records errored, failed, skipped /s",
          "description": "What the errors did to the records. Skipped means tolerated and dropped — the mirror stays RUNNING and the target is quietly missing those records, which is the one error mode a lag panel cannot show.",
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "sum(rate(kafka_connect_task_error_metrics_total_record_errors{namespace=\"{{ $ns }}\"}[5m]))",
              "legendFormat": "errors"
            },
            {
              "expr": "sum(rate(kafka_connect_task_error_metrics_total_record_failures{namespace=\"{{ $ns }}\"}[5m]))",
              "legendFormat": "failures"
            },
            {
              "expr": "sum(rate(kafka_connect_task_error_metrics_total_records_skipped{namespace=\"{{ $ns }}\"}[5m]))",
              "legendFormat": "skipped"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "type": "timeseries",
          "title": "Retries and dead letters /s",
          "description": "Retries are the mirror absorbing a transient failure; dead-letter writes are it giving up on a record. A rising DLQ produce-failure line means even the dead-letter path is not working, and those records are gone.",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "sum(rate(kafka_connect_task_error_metrics_total_retries{namespace=\"{{ $ns }}\"}[5m]))",
              "legendFormat": "retries"
            },
            {
              "expr": "sum(rate(kafka_connect_task_error_metrics_deadletterqueue_produce_requests{namespace=\"{{ $ns }}\"}[5m]))",
              "legendFormat": "dead-letter writes"
            },
            {
              "expr": "sum(rate(kafka_connect_task_error_metrics_deadletterqueue_produce_failures{namespace=\"{{ $ns }}\"}[5m]))",
              "legendFormat": "dead-letter write failures"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "type": "stat",
          "title": "Last error",
          "description": "When each connector last logged an error. `!= 0` is deliberate: a task that has never errored reports the timestamp as zero, and without the filter this panel would say every healthy connector last failed in 1970.",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "max by (connector) (kafka_connect_task_error_metrics_last_error_timestamp{namespace=\"{{ $ns }}\"} != 0)",
              "legendFormat": "{{ "{{" }}connector{{ "}}" }}"
            }
          ],
          "options": {
            "textMode": "value_and_name",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "fieldConfig": { "defaults": { "unit": "dateTimeFromNow" } }
        }
{{- $y = add $y 9 }}
{{- if $slo }}
{{- /* ── 6. Replication SLO (only where the recording rules exist) ───── */}}
{{- $budget := printf "%g" (mulf .Values.alerts.slo.burnRate (subf 1.0 .Values.alerts.slo.target)) }}
        ,{
          "type": "row",
          "title": "Replication SLO",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": {{ $y }} }
        },
        {
          "type": "timeseries",
          "title": "Time over the latency objective",
          "description": "The recorded error ratios: the fraction of the last hour, and of the last five minutes, that replication latency spent above {{ $th.replicationLatencyMs }}ms. MirrorMaker2ReplicationSLOBurning fires when BOTH are above the red line, so the problem has to be sustained and still happening.",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "mm2:slo_replication_latency:error_ratio_rate1h{namespace=\"{{ $ns }}\",cluster=\"{{ $name }}\"}",
              "legendFormat": "1h — {{ "{{" }}source{{ "}}" }}"
            },
            {
              "expr": "mm2:slo_replication_latency:error_ratio_rate5m{namespace=\"{{ $ns }}\",cluster=\"{{ $name }}\"}",
              "legendFormat": "5m — {{ "{{" }}source{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": {{ $budget }} }
                ]
              },
              "custom": { "thresholdsStyle": { "mode": "line" } }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Tasks running (recorded)",
          "description": "mm2:tasks_running:ratio, per source rather than per connector: the SLI a status page should read, since it needs no knowledge of the exporter's names.",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "mm2:tasks_running:ratio{namespace=\"{{ $ns }}\",cluster=\"{{ $name }}\"}",
              "legendFormat": "{{ "{{" }}source{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "percentunit", "min": 0, "max": 1 }
          }
        },
        {
          "type": "timeseries",
          "title": "Replication and translation (recorded)",
          "description": "mm2:replication_latency_ms:max and mm2:checkpoint_latency_ms:max, per source. The same two clocks as the header stats, in the form the burn-rate rule and any external consumer read them.",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "mm2:replication_latency_ms:max{namespace=\"{{ $ns }}\",cluster=\"{{ $name }}\"}",
              "legendFormat": "lag — {{ "{{" }}source{{ "}}" }}"
            },
            {
              "expr": "mm2:checkpoint_latency_ms:max{namespace=\"{{ $ns }}\",cluster=\"{{ $name }}\"}",
              "legendFormat": "translation — {{ "{{" }}source{{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ms" } }
        }
{{- $y = add $y 9 }}
{{- end }}
{{- /* ── 7. Workers ─────────────────────────────────────────────────── */}}
        ,{
          "type": "row",
          "title": "Workers",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": {{ $y }} }
        },
        {
          "type": "timeseries",
          "title": "JVM heap used",
          "description": "Both spellings: the JMX exporter agent renamed jvm_memory_bytes_used to jvm_memory_used_bytes in its 1.x line, and which one a worker image ships is not something a panel should have to know. A mirror under memory pressure slows down long before it crashes, so this shows up as lag rather than as an error.",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "sum by (pod) ((jvm_memory_used_bytes{area=\"heap\",namespace=\"{{ $ns }}\",pod=~\"{{ $pods }}\"} or jvm_memory_bytes_used{area=\"heap\",namespace=\"{{ $ns }}\",pod=~\"{{ $pods }}\"}))",
              "legendFormat": "{{ "{{" }}pod{{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "type": "timeseries",
          "title": "GC time /s",
          "description": "Seconds spent collecting per second, per collector. Approaching 1 means the worker is spending its life in GC, which reads downstream as replication lag with no failed tasks.",
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "sum by (pod, gc) (rate(jvm_gc_collection_seconds_sum{namespace=\"{{ $ns }}\",pod=~\"{{ $pods }}\"}[5m]))",
              "legendFormat": "{{ "{{" }}pod{{ "}}" }} / {{ "{{" }}gc{{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percentunit" } }
        },
        {
          "type": "timeseries",
          "title": "Rebalances /s",
          "description": "Tasks do not replicate during a rebalance, so a storm reads as intermittent lag with no failed tasks. The red line is the MirrorMaker2RebalanceStorm threshold; every mirror in the release is affected at once, which is why this is not per source.",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "sum(rate(kafka_connect_worker_rebalance_metrics_completed_rebalances_total{namespace=\"{{ $ns }}\"}[5m]))",
              "legendFormat": "rebalances/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": {{ $th.rebalancesPerSecond }} }
                ]
              },
              "custom": { "thresholdsStyle": { "mode": "line" } }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Time since last rebalance",
          "description": "A sawtooth here is the same storm as the panel to its left, seen from the other side: each drop to zero is a rebalance, and the height of the teeth is how long the workers managed to stay still.",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": {{ add $y 1 }} },
          "targets": [
            {
              "expr": "min(kafka_connect_worker_rebalance_metrics_time_since_last_rebalance_ms{namespace=\"{{ $ns }}\"})",
              "legendFormat": "since last rebalance"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ms" } }
        },
        {
          "type": "timeseries",
          "title": "Connectors and tasks assigned",
          "description": "What the workers believe they are running. A step down here without a corresponding step in the task-state table is an assignment the cluster lost rather than a task that failed.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": {{ add $y 9 }} },
          "targets": [
            {
              "expr": "sum(kafka_connect_worker_metrics_connector_count{namespace=\"{{ $ns }}\"})",
              "legendFormat": "connectors"
            },
            {
              "expr": "sum(kafka_connect_worker_metrics_task_count{namespace=\"{{ $ns }}\"})",
              "legendFormat": "tasks"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "type": "timeseries",
          "title": "Startup failures",
          "description": "Connectors and tasks that failed to start, as a rate. A worker that crash-loops on startup never reaches the task-state table at all, and this is where that shows.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": {{ add $y 9 }} },
          "targets": [
            {
              "expr": "sum(rate(kafka_connect_worker_metrics_connector_startup_failure_total{namespace=\"{{ $ns }}\"}[5m]))",
              "legendFormat": "connector startup failures/s"
            },
            {
              "expr": "sum(rate(kafka_connect_worker_metrics_task_startup_failure_total{namespace=\"{{ $ns }}\"}[5m]))",
              "legendFormat": "task startup failures/s"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        }
{{- $y = add $y 17 }}
{{- /* ── 8. The clients under the tasks, collapsed ────────────────────
       Collapsed because it answers a second question — WHERE the mirror is
       slow — which only matters once the sections above say that it is.
       Nested panels carry their own gridPos; Grafana rewrites them when the
       row is expanded.

       The client ids are not guessable: MirrorMaker builds its own consumer
       rather than using Connect's, so the source-side client is
       `<source>-><target>|<connector>|replication-consumer` while the
       target-side one is the ordinary `connector-producer-<connector>-<task>`.
       Both patterns were read off a live worker. */}}
        ,{
          "type": "row",
          "title": "The path a record takes — source fetch, target produce",
          "collapsed": true,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": {{ $y }} },
          "panels": [
            {
              "type": "timeseries",
              "title": "Read from source /s",
              "description": "The replication consumer's own fetch rate. Compare with 'Records written to target': reading fast and writing slowly puts the bottleneck on the target.",
              "gridPos": { "h": 8, "w": 6, "x": 0, "y": {{ add $y 1 }} },
              "targets": [
                {
                  "expr": "sum by (topic) (kafka_consumer_fetch_manager_records_consumed_rate{namespace=\"{{ $ns }}\",client_id=~\".*replication-consumer\"})",
                  "legendFormat": "{{ "{{" }}topic{{ "}}" }}"
                }
              ],
              "fieldConfig": { "defaults": { "unit": "reqps" } }
            },
            {
              "type": "timeseries",
              "title": "Read from source (bytes/s)",
              "description": "The same fetch in bytes. A byte rate at the source's quota ceiling with a flat record rate is throttling rather than a stuck mirror.",
              "gridPos": { "h": 8, "w": 6, "x": 6, "y": {{ add $y 1 }} },
              "targets": [
                {
                  "expr": "sum by (topic) (kafka_consumer_fetch_manager_bytes_consumed_rate{namespace=\"{{ $ns }}\",client_id=~\".*replication-consumer\"})",
                  "legendFormat": "{{ "{{" }}topic{{ "}}" }}"
                }
              ],
              "fieldConfig": { "defaults": { "unit": "Bps" } }
            },
            {
              "type": "timeseries",
              "title": "Produce to target /s",
              "description": "Send rate against error and retry rates, for the connectors' producers. Errors and retries rising together while the send rate holds is the target rejecting or throttling writes.",
              "gridPos": { "h": 8, "w": 6, "x": 12, "y": {{ add $y 1 }} },
              "targets": [
                {
                  "expr": "sum(kafka_producer_record_send_rate{namespace=\"{{ $ns }}\",client_id=~\"connector-producer-.*\"})",
                  "legendFormat": "sent"
                },
                {
                  "expr": "sum(kafka_producer_record_error_rate{namespace=\"{{ $ns }}\",client_id=~\"connector-producer-.*\"})",
                  "legendFormat": "errors"
                },
                {
                  "expr": "sum(kafka_producer_record_retry_rate{namespace=\"{{ $ns }}\",client_id=~\"connector-producer-.*\"})",
                  "legendFormat": "retries"
                }
              ],
              "fieldConfig": { "defaults": { "unit": "reqps" } }
            },
            {
              "type": "timeseries",
              "title": "Produce latency and buffer",
              "description": "Request latency to the target, and how much producer buffer is left. Buffer heading for zero is back-pressure: the tasks will block, 'Records in flight' will climb, and replication lag will follow.",
              "gridPos": { "h": 8, "w": 6, "x": 18, "y": {{ add $y 1 }} },
              "targets": [
                {
                  "expr": "max(kafka_producer_request_latency_avg{namespace=\"{{ $ns }}\",client_id=~\"connector-producer-.*\"})",
                  "legendFormat": "request latency avg (ms)"
                },
                {
                  "expr": "max(kafka_producer_request_latency_max{namespace=\"{{ $ns }}\",client_id=~\"connector-producer-.*\"})",
                  "legendFormat": "request latency max (ms)"
                },
                {
                  "expr": "min(kafka_producer_buffer_available_bytes{namespace=\"{{ $ns }}\",client_id=~\"connector-producer-.*\"}) / 1048576",
                  "legendFormat": "buffer available (MiB)"
                }
              ],
              "fieldConfig": { "defaults": { "unit": "short" } }
            }
          ]
        }
{{- $y = add $y 1 }}
{{- /*
── 9. Per-source rows, collapsed ─────────────────────────────────────────
One row per `mirrors[]` entry, so a fan-in release reads each leg separately
rather than as a sum that hides the dead one. Each fragment leads with its own
comma, like every panel above.

HOW A SOURCE IS SELECTED, three different ways, because the beans differ:
  - worker, task and error metrics carry the CONNECTOR name, which starts
    with `<alias>->`;
  - the checkpoint bean carries `source` unconditionally;
  - the source bean carries only the REPLICATED topic name, which starts with
    the alias under a prefixing policy and says nothing at all under an
    identity one — hence the fallback in the lag panel.
*/}}
{{- range $i, $m := .Values.mirrors }}
{{- $alias := $m.source.alias | default "source" }}
        ,{
          "type": "row",
          "title": "Source: {{ $alias }}",
          "collapsed": true,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": {{ add $y $i }} },
          "panels": [
            {
              "type": "timeseries",
              "title": "{{ $alias }} — records /s",
              "description": "Throughput for this leg only, both its connectors.",
              "gridPos": { "h": 8, "w": 6, "x": 0, "y": {{ add $y $i 1 }} },
              "targets": [
                {
                  "expr": "sum by (connector) (rate(kafka_connect_source_task_metrics_source_record_write_total{namespace=\"{{ $ns }}\",connector=~\"{{ $alias }}->.*\"}[5m]))",
                  "legendFormat": "{{ "{{" }}connector{{ "}}" }}"
                }
              ],
              "fieldConfig": { "defaults": { "unit": "reqps" } }
            },
            {
              "type": "timeseries",
              "title": "{{ $alias }} — replication lag",
              {{- if $identity }}
              "description": "Under an identity policy the replicated topic keeps its source name, so the mirror bean carries no per-source dimension and this panel shows every topic in the release. Set add.source.alias.to.metrics on the connector to get a real source label back.",
              {{- else }}
              "description": "Selected by the replicated topic prefix: under a prefixing policy the alias IS the first segment of the target topic name.",
              {{- end }}
              "gridPos": { "h": 8, "w": 6, "x": 6, "y": {{ add $y $i 1 }} },
              "targets": [
                {
                  {{- if $identity }}
                  "expr": "max by (topic) (kafka_connect_mirror_source_connector_replication_latency_ms_max{namespace=\"{{ $ns }}\"})",
                  {{- else }}
                  "expr": "max by (topic) (kafka_connect_mirror_source_connector_replication_latency_ms_max{namespace=\"{{ $ns }}\",topic=~\"{{ $alias }}[{{ $sep }}].*\"})",
                  {{- end }}
                  "legendFormat": "{{ "{{" }}topic{{ "}}" }}"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "ms",
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": {{ $th.replicationLatencyMs }} }
                    ]
                  },
                  "custom": { "thresholdsStyle": { "mode": "line" } }
                }
              }
            },
            {
              "type": "timeseries",
              "title": "{{ $alias }} — offset translation age",
              "description": "Checkpoint latency per consumer group for this source. The checkpoint bean is tagged with the alias unconditionally, so this one needs no prefix guess.",
              "gridPos": { "h": 8, "w": 6, "x": 12, "y": {{ add $y $i 1 }} },
              "targets": [
                {
                  "expr": "max by (group) (kafka_connect_mirror_checkpoint_connector_checkpoint_latency_ms_max{namespace=\"{{ $ns }}\",source=\"{{ $alias }}\"})",
                  "legendFormat": "{{ "{{" }}group{{ "}}" }}"
                }
              ],
              "fieldConfig": { "defaults": { "unit": "ms" } }
            },
            {
              "type": "timeseries",
              "title": "{{ $alias }} — errors /s",
              "description": "Errors logged by this leg's tasks. On a fan-in release this is the panel that says whether an error rate belongs to the source you are looking at or to one of its neighbours.",
              "gridPos": { "h": 8, "w": 6, "x": 18, "y": {{ add $y $i 1 }} },
              "targets": [
                {
                  "expr": "sum by (connector) (rate(kafka_connect_task_error_metrics_total_errors_logged{namespace=\"{{ $ns }}\",connector=~\"{{ $alias }}->.*\"}[5m]))",
                  "legendFormat": "{{ "{{" }}connector{{ "}}" }}"
                }
              ],
              "fieldConfig": { "defaults": { "unit": "reqps" } }
            }
          ]
        }
{{- end }}
      ]
    }
{{- end }}
