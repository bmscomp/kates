{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mirror-maker2.fullname" . }}
  namespace: {{ include "mirror-maker2.namespace" . }}
  labels:
    {{- include "mirror-maker2.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mirror-maker2.podSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if $np.workerToWorker }}
    # Worker-to-worker Connect REST (leader forwarding) on 8083
    - from:
        - podSelector:
            matchLabels:
              {{- include "mirror-maker2.podSelectorLabels" . | nindent 14 }}
      ports:
        - port: 8083
          protocol: TCP
    {{- end }}
    {{- if ($np.operator).enabled | default true }}
    # The Strimzi Cluster Operator creates, polls and restarts the mirror
    # connectors over the Connect REST API — this port, from that namespace.
    # Strimzi usually generates an equivalent policy of its own, and ingress
    # rules are a union, so this is redundant on a default operator. It is
    # NOT redundant with STRIMZI_NETWORK_POLICY_GENERATION=false, which is
    # common in exactly the clusters that turn networkPolicy.enabled on: the
    # operator is then locked out, no connector is ever created, and
    # .status.connectors stays empty while the CR reports Ready.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.strimziOperatorNamespace | default "strimzi-operator" }}
          podSelector:
            matchLabels:
              strimzi.io/kind: cluster-operator
      ports:
        - port: 8083
          protocol: TCP
    {{- end }}
    {{- if $np.monitoring }}
    # Metrics scrape
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoring.namespace }}
      ports:
        - port: {{ $np.monitoring.port }}
          protocol: TCP
    {{- end }}
    {{- with $np.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # DNS
    - to:
        {{- if or $np.dns.namespaceSelector $np.dns.podSelector }}
        - {{- if $np.dns.namespaceSelector }}
          namespaceSelector:
            matchLabels:
              {{- toYaml $np.dns.namespaceSelector | nindent 14 }}
          {{- end }}
          {{- if $np.dns.podSelector }}
          podSelector:
            matchLabels:
              {{- toYaml $np.dns.podSelector | nindent 14 }}
          {{- end }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if $np.kafka.perSource }}
    {{- /* One rule per destination instead of 0.0.0.0/0. An in-cluster source
           or target is reachable by its namespace, so the policy names the
           namespace rather than the internet; an external one contributes the
           CIDR its entry declares. A source with neither is a render-time
           failure, because silently falling back to "anywhere" would defeat
           the point of turning this on. */}}
    # Target cluster
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.target.namespace | default (include "mirror-maker2.namespace" $) }}
      ports:
        {{- range $np.kafka.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- range $.Values.mirrors }}
    {{- $alias := .source.alias | default "source" }}
    # Source: {{ $alias }}
    - to:
        {{- if and .source.clusterName .source.namespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .source.namespace }}
        {{- else if (.source.egressCIDR) }}
        - ipBlock:
            cidr: {{ .source.egressCIDR }}
        {{- else }}
        {{- fail (printf "mirror-maker2: networkPolicy.kafka.perSource is on, but source %q is neither in-cluster (clusterName + namespace) nor given an egressCIDR. Per-source egress cannot be derived for it — add source.egressCIDR, or turn perSource off to allow 0.0.0.0/0." $alias) }}
        {{- end }}
      ports:
        {{- range $np.kafka.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- else }}
    # Kafka brokers — source AND target, arbitrary IPs
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        {{- range $np.kafka.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- if $np.workerToWorker }}
    # Worker-to-worker egress (8083)
    - to:
        - podSelector:
            matchLabels:
              {{- include "mirror-maker2.podSelectorLabels" . | nindent 14 }}
      ports:
        - port: 8083
          protocol: TCP
    {{- end }}
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
