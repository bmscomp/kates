{{- if .Values.preflight.enabled }}
{{- $fullname := include "mirror-maker2.fullname" . }}
{{- $ns := include "mirror-maker2.namespace" . }}
{{- $pf := .Values.preflight }}
{{- $image := $pf.image | default (printf "quay.io/strimzi/kafka:%s-kafka-%s" (.Values.strimziVersion | default "1.1.0") .Values.version) }}
{{- /*
Preflight: probe every source with the SAME client the workers will use.

WHY THIS EXISTS: a KafkaMirrorMaker2 reports Ready as soon as its Connect
workers are up — before a single record crosses, and it stays Ready while the
MirrorSourceConnector cannot reach the source at all. Everything this probe
can distinguish — an unresolvable name, an unreachable port, a TLS mismatch,
rejected credentials, a broker below the protocol floor — fails that way at
runtime: silently, and only visible in a connector log nobody is tailing an
hour later.

Running the check from the workers' own Kafka line matters. A probe with a
different client version would prove something true about that client and
nothing about this deployment — which is the exact mistake KIP-896 punishes.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-preflight
  namespace: {{ $ns }}
  labels:
    {{- include "mirror-maker2.componentLabels" (dict "component" "preflight" "ctx" .) | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    {{- /* NOT hook-succeeded: the log of a successful probe is the evidence,
           and NOTES.txt tells you to read it. Deleting the Job on success
           throws away the one artefact anyone wants. It is replaced on the
           next install/upgrade instead. */}}
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ $pf.backoffLimit | default 0 }}
  activeDeadlineSeconds: {{ $pf.timeoutSeconds | default 180 }}
  template:
    metadata:
      labels:
        {{- include "mirror-maker2.componentLabels" (dict "component" "preflight" "ctx" .) | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- /* Deliberately NOT the chart's ServiceAccount. That SA is an ordinary
             resource, created in the main manifest phase — i.e. AFTER every
             pre-install hook — so naming it here made the Job unschedulable on
             a fresh install ("serviceaccounts not found"), failing the install
             on the very check meant to protect it. This probe talks to Kafka,
             never to the API server, so `default` with no token is correct. */}}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: preflight
          image: {{ $image | quote }}
          {{- include "mirror-maker2.imagePullPolicy" $ | nindent 10 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: LOG_DIR
              value: /tmp
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              FAILED=0
              WORK=/tmp/preflight
              mkdir -p "$WORK"
              {{- /* The probe function, shared with connect-cluster. */}}

              {{ include "kafka-common.preflight.probe" (dict "noun" "source" "version" .Values.version) | nindent 14 | trim }}

              echo "MirrorMaker 2 preflight — client {{ $image }}"
              {{- range .Values.mirrors }}
              {{- $alias := .source.alias | default "source" }}
              {{- $auth := .source.authentication | default dict }}
              {{- $tlsOn := and .source.tls .source.tls.enabled }}
              {{- $t := $auth.type | default "" }}
              {{- $bs := include "mirror-maker2.bootstrap" (dict "c" .source "ctx" $) }}
              {{- $sasl := or (eq $t "plain") (eq $t "scram-sha-512") (eq $t "scram-sha-256") }}
              {{- $mech := ternary "PLAIN" (upper $t) (eq $t "plain") }}
              {{- if eq $t "custom" }}
              probe {{ $alias | quote }} {{ $bs | quote }} {{ ternary "custom-tls" "custom" (eq (include "kafka-common.enabled" (list (.source.tls | default dict).enabled false)) "true") | quote }} "" "" ""
              {{- else if and $tlsOn $sasl }}
              probe {{ $alias | quote }} {{ $bs | quote }} "sasl-tls" {{ $mech | quote }} {{ $auth.username | quote }} {{ printf "/etc/mm2-preflight/%s" $alias | quote }}
              {{- else if or $tlsOn (eq $t "tls") }}
              probe {{ $alias | quote }} {{ $bs | quote }} "tls" "" "" ""
              {{- else if $sasl }}
              probe {{ $alias | quote }} {{ $bs | quote }} "sasl" {{ $mech | quote }} {{ $auth.username | quote }} {{ printf "/etc/mm2-preflight/%s" $alias | quote }}
              {{- else }}
              probe {{ $alias | quote }} {{ $bs | quote }} "plaintext" "" "" ""
              {{- end }}
              {{- end }}

              echo ""
              if [ "$FAILED" -gt 0 ]; then
                echo "❌ preflight: $FAILED source(s) failed"
                {{- if $pf.failOnError }}
                exit 1
                {{- else }}
                echo "   preflight.failOnError is false — continuing anyway"
                {{- end }}
              else
                echo "✅ preflight: every source is reachable by a {{ .Values.version }} client"
              fi
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 768Mi, cpu: 1000m }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- range .Values.mirrors }}
            {{- $alias := .source.alias | default "source" }}
            {{- $auth := .source.authentication | default dict }}
            {{- $t := $auth.type | default "" }}
            {{- if or (eq $t "plain") (eq $t "scram-sha-512") (eq $t "scram-sha-256") }}
            - name: {{ printf "cred-%s" $alias | trunc 63 | trimSuffix "-" }}
              mountPath: {{ printf "/etc/mm2-preflight/%s" $alias | quote }}
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- range .Values.mirrors }}
        {{- $alias := .source.alias | default "source" }}
        {{- $auth := .source.authentication | default dict }}
        {{- $t := $auth.type | default "" }}
        {{- if or (eq $t "plain") (eq $t "scram-sha-512") (eq $t "scram-sha-256") }}
        - name: {{ printf "cred-%s" $alias | trunc 63 | trimSuffix "-" }}
          secret:
            secretName: {{ $auth.secretName | default $auth.username | quote }}
            # optional: a Secret that secretSync has not copied yet must not
            # leave this pod in ContainerCreating until the Job deadline. The
            # probe notices the missing file and says what it could not check.
            optional: true
            items:
              - key: {{ $auth.secretKey | default "password" }}
                path: password
        {{- end }}
        {{- end }}
{{- end }}
