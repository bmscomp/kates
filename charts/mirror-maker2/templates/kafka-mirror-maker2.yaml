{{- include "mirror-maker2.validate" . }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaMirrorMaker2
metadata:
  name: {{ include "mirror-maker2.fullname" . }}
  namespace: {{ include "mirror-maker2.namespace" . }}
  labels:
    {{- include "mirror-maker2.labels" . | nindent 4 }}
  annotations:
    {{- if not (eq (toString .Values.keepOnDelete) "false") }}
    helm.sh/resource-policy: keep
    {{- end }}
    strimzi.io/use-connector-resources: "false"
spec:
  version: {{ .Values.version | quote }}
  {{- if .Values.image }}
  image: {{ .Values.image | quote }}
  {{- end }}
  {{- /* replicas is REQUIRED by the v1 CRD (no default), so it cannot simply
         be omitted when the HPA owns scaling. On INSTALL it is seeded from
         minReplicas. On UPGRADE it is read back from the live CR with
         `lookup`, because re-rendering minReplicas would patch a scaled-out
         mirror back down every time anyone ran `helm upgrade`, and the HPA
         would have to climb back up from there. `lookup` returns nothing under
         `helm template` and on a fresh install, in which case the seed is used. */}}
  {{- $replicas := .Values.replicas }}
  {{- if .Values.autoscaling.enabled }}
  {{- $replicas = .Values.autoscaling.minReplicas | default 2 }}
  {{- $live := lookup "kafka.strimzi.io/v1" "KafkaMirrorMaker2" (include "mirror-maker2.namespace" .) (include "mirror-maker2.fullname" .) }}
  {{- if and $live $live.spec $live.spec.replicas }}
  {{- $replicas = $live.spec.replicas }}
  {{- end }}
  {{- end }}
  replicas: {{ $replicas }}
  {{- $t := .Values.target }}
  {{- $gid := $t.groupId | default "mirror-maker2" }}
  target:
    alias: {{ $t.alias | default "target" | quote }}
    bootstrapServers: {{ include "mirror-maker2.bootstrap" (dict "c" $t "ctx" $) | quote }}
    groupId: {{ $gid | quote }}
    configStorageTopic: {{ $t.configStorageTopic | default (printf "%s-configs" $gid) | quote }}
    offsetStorageTopic: {{ $t.offsetStorageTopic | default (printf "%s-offsets" $gid) | quote }}
    statusStorageTopic: {{ $t.statusStorageTopic | default (printf "%s-status" $gid) | quote }}
    {{- with include "mirror-maker2.clusterTlsAuth" (dict "c" $t) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- /* exactly.once.source.support is a WORKER property and belongs here,
           not on a connector; the source consumer's read_committed half is
           set on each mirror's source cluster config. */}}
    {{- with include "mirror-maker2.targetConfig" $ }}
    config:
      {{- . | nindent 6 }}
    {{- end }}
  mirrors:
    {{- range .Values.mirrors }}
    {{- $mirror := . }}
    - source:
        alias: {{ .source.alias | default "source" | quote }}
        bootstrapServers: {{ include "mirror-maker2.bootstrap" (dict "c" .source "ctx" $) | quote }}
        {{- /* `with` rather than a bare include: an unauthenticated source
               renders nothing here, and a bare nindent would leave a stray
               blank line in the middle of the CR. */}}
        {{- with include "mirror-maker2.clusterTlsAuth" (dict "c" .source) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with include "mirror-maker2.sourceConfig" (dict "m" $mirror "ctx" $) }}
        config:
          {{- . | nindent 10 }}
        {{- end }}
      topicsPattern: {{ include "mirror-maker2.pattern" (dict "list" .topics "pattern" .topicsPattern "default" ".*") | quote }}
      {{- /* Computed, not passed through: under an identity policy the mirror
             can match its own output, and the stock MM2 exclusions do not
             cover that. See mirror-maker2.topicsExcludePattern. */}}
      {{- with include "mirror-maker2.topicsExcludePattern" (dict "m" . "ctx" $) }}
      topicsExcludePattern: {{ . | quote }}
      {{- end }}
      groupsPattern: {{ include "mirror-maker2.pattern" (dict "list" .groups "pattern" .groupsPattern "default" ".*") | quote }}
      {{- with .groupsExcludePattern }}
      groupsExcludePattern: {{ . | quote }}
      {{- end }}
      {{- $autoRestart := $.Values.autoRestart }}
      {{- $cutover := $.Values.cutover | default dict }}
      {{- with .sourceConnector }}
      sourceConnector:
        {{- with .version }}
        version: {{ . | quote }}
        {{- end }}
        {{- with .tasksMax }}
        tasksMax: {{ . }}
        {{- end }}
        {{- /* running | paused | stopped — the cutover primitive. `stopped`
               also releases the connector's tasks, which is what you want when
               producers have moved and the mirror must not resume. The
               chart-level cutover block wins, because it is what a values
               overlay can reach (Helm replaces lists, but merges maps). */}}
        {{- with (ternary $cutover.sourceConnectorState .state $cutover.enabled) }}
        state: {{ . }}
        {{- end }}
        {{- with (.autoRestart | default $autoRestart) }}
        {{- if .enabled }}
        autoRestart:
          enabled: true
          {{- with .maxRestarts }}
          maxRestarts: {{ . }}
          {{- end }}
        {{- end }}
        {{- end }}
        {{- with .listOffsets }}
        listOffsets:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .alterOffsets }}
        alterOffsets:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with include "mirror-maker2.connectorConfig" (dict "cfg" .config "ctx" $ "m" $mirror) }}
        config:
          {{- . | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- with .checkpointConnector }}
      checkpointConnector:
        {{- with .version }}
        version: {{ . | quote }}
        {{- end }}
        {{- with .tasksMax }}
        tasksMax: {{ . }}
        {{- end }}
        {{- /* Kept RUNNING through a cutover on purpose: consumers migrate one
               at a time, and each one that has not moved still needs its
               committed offset translated onto the target. */}}
        {{- with (ternary $cutover.checkpointConnectorState .state $cutover.enabled) }}
        state: {{ . }}
        {{- end }}
        {{- with (.autoRestart | default $autoRestart) }}
        {{- if .enabled }}
        autoRestart:
          enabled: true
          {{- with .maxRestarts }}
          maxRestarts: {{ . }}
          {{- end }}
        {{- end }}
        {{- end }}
        {{- with .listOffsets }}
        listOffsets:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .alterOffsets }}
        alterOffsets:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with include "mirror-maker2.connectorConfig" (dict "cfg" .config "ctx" $ "m" $mirror) }}
        config:
          {{- . | nindent 10 }}
        {{- end }}
      {{- end }}
    {{- end }}
  resources:
    {{- toYaml .Values.resources | nindent 4 }}
  jvmOptions:
    {{- toYaml .Values.jvmOptions | nindent 4 }}
  {{- with .Values.livenessProbe }}
  livenessProbe:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.readinessProbe }}
  readinessProbe:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- /* Two shapes. `inline` passes {type, loggers} through as the CRD
         expects. `external` points the CR at the ConfigMap this chart renders
         from logging.rootLevel / mirrorLevel / extraLoggers (see
         logging-configmap.yaml) unless the user supplied their own valueFrom.
         Dumping .Values.logging verbatim used to push those chart-only keys
         into spec.logging, where the API server pruned them and Strimzi then
         rejected an `external` block with no valueFrom. */}}
  {{- with .Values.logging }}
  {{- if eq (.type | default "") "external" }}
  logging:
    type: external
    valueFrom:
      {{- if .valueFrom }}
      {{- toYaml .valueFrom | nindent 6 }}
      {{- else }}
      configMapKeyRef:
        name: {{ include "mirror-maker2.fullname" $ }}-logging
        key: log4j2.properties
      {{- end }}
  {{- else if .type }}
  logging:
    type: {{ .type }}
    {{- with .loggers }}
    loggers:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- with .Values.tracing }}
  tracing:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.rack.enabled }}
  rack:
    topologyKey: {{ .Values.rack.topologyKey }}
  {{- /* The operator runs an init container to read the node's topology
         label; on a mirrored or air-gapped registry it needs naming. */}}
  {{- with .Values.rack.clientRackInitImage }}
  clientRackInitImage: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.jmxOptions }}
  jmxOptions:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.metrics.enabled }}
  metricsConfig:
    {{- if eq (.Values.metrics.type | default "jmxPrometheusExporter") "strimziMetricsReporter" }}
    {{- /* The operator's native path: the broker-side reporter publishes
           Prometheus metrics directly, so no exporter sidecar and no JMX
           scrape. The allow-list is a values key rather than a ConfigMap
           because it is a list of regexes, not a file. */}}
    type: strimziMetricsReporter
    values:
      allowList:
        {{- toYaml (.Values.metrics.allowList | default (list "kafka_connect.*" "kafka_producer.*" "kafka_consumer.*")) | nindent 8 }}
    {{- else }}
    type: jmxPrometheusExporter
    valueFrom:
      configMapKeyRef:
        name: {{ include "mirror-maker2.fullname" . }}-metrics
        key: metrics-config.yml
    {{- end }}
  {{- end }}
  template:
    {{- /* Gate on the replica count that will actually run: under the HPA
           that is at least minReplicas, whatever `replicas` says. */}}
    {{- $effective := ternary (.Values.autoscaling.minReplicas | default 2) .Values.replicas .Values.autoscaling.enabled }}
    {{- if and .Values.podDisruptionBudget.enabled (gt (int $effective) 1) }}
    # Strimzi manages the PDB for its own pods; setting maxUnavailable here
    # avoids a second, overlapping standalone PDB fighting the operator's.
    podDisruptionBudget:
      maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
    {{- end }}
    pod:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      # nodeSelector is set via affinity below to co-exist with pod anti-affinity
      {{- end }}
      {{- if or .Values.podAntiAffinity.enabled .Values.nodeSelector }}
      affinity:
        {{- if .Values.podAntiAffinity.enabled }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "mirror-maker2.podSelectorLabels" . | nindent 20 }}
                topologyKey: {{ .Values.podAntiAffinity.topologyKey }}
        {{- end }}
        {{- with .Values.nodeSelector }}
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  {{- range $k, $v := . }}
                  - key: {{ $k }}
                    operator: In
                    values: [{{ $v | quote }}]
                  {{- end }}
        {{- end }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "mirror-maker2.podSelectorLabels" . | nindent 14 }}
      {{- end }}
    {{- /* Env and security context for the worker container itself: proxy
           settings, KAFKA_OPTS, a JVM agent. Strimzi owns the rest of the
           container, so this is the whole surface. */}}
    {{- with .Values.connectContainer }}
    connectContainer:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- /* The remaining spec.template sub-objects (apiService, headlessService,
           podSet, serviceAccount, clusterRoleBinding, jmxSecret, initContainer)
           as one passthrough rather than seven values nobody would set twice. */}}
    {{- with .Values.templateExtra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
