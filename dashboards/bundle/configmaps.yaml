          "description": "The fraction of the last five minutes the broker's request handler threads spent idle, per broker. Below 0.30 for 10 minutes is KafkaRequestHandlerSaturated and the line is drawn there. This is the single best saturation signal a Kafka broker has: at zero, every handler thread is busy and every new request queues.\n\n**Read where this expression comes from.** The obvious series is `\u2026requesthandleravgidle_percent`, which the exporter builds from the meter's `MeanRate` \u2014 a LIFETIME mean since the broker started. It flattens: a broker that has been up for a week and has been saturated for an hour still reads a comfortable number. `\u2026requesthandleravgidlepercent_count_total` is the same meter's `Count`, and its unit IS NOT A COUNT \u2014 Kafka accumulates idle NANOSECONDS into it. So `rate(...[5m])` gives idle nanoseconds per second, and dividing by 1e9 gives the idle fraction over the window, which moves when the broker does. The alert uses exactly this form.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false,
                "thresholdsStyle": {
                  "mode": "line"
                }
