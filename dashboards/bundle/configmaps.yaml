---
apiVersion: v1
kind: ConfigMap
metadata:
  # No namespace on purpose — `kubectl apply -n <ns>` picks it, and it
  # has to be a namespace the sidecar searches (see README.md).
  name: kates-dashboard-mirror-maker2-migration
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: kates-dashboards
    app.kubernetes.io/part-of: kates
    app.kubernetes.io/managed-by: gen-dashboards.py
  annotations:
    grafana_folder: "Kates"
data:
  mirror-maker2-migration.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "links": [
        {
          "icon": "doc",
          "targetBlank": true,
          "title": "Cutover checklist (runbook)",
          "type": "link",
          "url": "https://github.com/bmscomp/kates/blob/main/docs/mirror-maker2-runbook.md#cutover-checklist"
        }
      ],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "Can I cut over yet?",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "DRAINED when all three of: replication lag below 5000ms, nothing in flight, and no failed tasks. The first factor of the query is the workers' own task count with no `or vector(0)` fallback, so a release that is reporting NOTHING reads as No data rather than as drained \u2014 every other factor defaults to the healthy value when its series is absent, and without that guard a dead scrape would show green. It also does NOT know whether producers have stopped writing to the source: no MirrorMaker metric says that, and confirming the source's end offsets are static (twice, 60 seconds apart) is still step 1 of the runbook's checklist. DRAINED means the mirror has caught up with what it was given, not that the source is quiet.",
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "red",
                      "index": 0,
                      "text": "NOT YET"
                    },
                    "1": {
                      "color": "green",
                      "index": 1,
                      "text": "DRAINED"
                    }
                  },
                  "type": "value"
                },
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 1,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ]
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "(sum(kafka_connect_worker_metrics_task_count{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}) >= bool 0) * ((max(kafka_connect_mirror_source_connector_replication_latency_ms_max{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"} >= 0) or vector(0)) < bool 5000) * ((sum(kafka_connect_source_task_metrics_source_record_active_count{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}) or vector(0)) == bool 0) * ((sum(kafka_connect_worker_metrics_connector_failed_task_count{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}) or vector(0)) == bool 0)",
              "legendFormat": "ready",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Safe to cut over?",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The newest record's end-to-end latency, across every mirrored topic. Green below 5000ms, the value the go/no-go panel uses. Zero is what the checklist asks for; this is the number that says how close you are.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 5000
                  }
                ]
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "(max(kafka_connect_mirror_source_connector_replication_latency_ms_max{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"} >= 0)) or (sum(kafka_connect_worker_rebalance_metrics_completed_rebalances_total{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}) * 0)",
              "legendFormat": "lag",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Replication lag",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Polled from the source and not yet acknowledged by the target. This is the 'one full refresh interval to drain what was in flight' of the checklist, as a number rather than a wait.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "(sum(kafka_connect_source_task_metrics_source_record_active_count{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"})) or (sum(kafka_connect_worker_rebalance_metrics_completed_rebalances_total{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}) * 0)",
              "legendFormat": "in flight",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Records in flight",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "How long until the fetchers reach the end of the source's log, at the rate the record age has been falling over the last ten minutes. Negative means it is getting further behind, not closer \u2014 the mirror is losing to the producers, and no amount of waiting will drain it.",
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "(max(kafka_connect_mirror_source_connector_record_age_ms_max{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"} >= 0) / -deriv(max(kafka_connect_mirror_source_connector_record_age_ms_max{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"} >= 0)[10m:])) / 1000",
              "legendFormat": "eta",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Catch-up ETA",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Any failed task means part of the mirror is not replicating, and the partitions that task owned are behind by an unknown amount. A cutover on top of this loses those records.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "id": 6,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "(sum(kafka_connect_worker_metrics_connector_failed_task_count{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"})) or (sum(kafka_connect_worker_rebalance_metrics_completed_rebalances_total{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}) * 0)",
              "legendFormat": "failed",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Failed tasks",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "id": 7,
          "panels": [],
          "title": "Draining",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The drain, topic by topic. The line is 5000ms. A topic that flattens above the line while the others fall is the one holding the cutover up \u2014 usually a partition whose task died, or a topic still being produced to.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false,
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 5000
                  }
                ]
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 7
          },
          "id": 8,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
