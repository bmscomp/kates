              "editorMode": "code",
              "expr": "label_replace(sum by (kubernetes_pod_name) (jvm_memory_used_bytes{area=\"heap\", namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\"} or jvm_memory_bytes_used{area=\"heap\", namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\"}), \"kind\", \"heap used\", \"\", \"\") or label_replace(sum by (kubernetes_pod_name) (jvm_memory_committed_bytes{area=\"heap\", namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\"} or jvm_memory_bytes_committed{area=\"heap\", namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\"}), \"kind\", \"heap committed\", \"\", \"\") or label_replace(sum by (kubernetes_pod_name) (jvm_memory_used_bytes{area=\"nonheap\", namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\"} or jvm_memory_bytes_used{area=\"nonheap\", namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\"}), \"kind\", \"non-heap used\", \"\", \"\")",
