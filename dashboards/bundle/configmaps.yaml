---
apiVersion: v1
kind: ConfigMap
metadata:
  # No namespace on purpose — `kubectl apply -n <ns>` picks it, and it
  # has to be a namespace the sidecar searches (see README.md).
  name: kates-dashboard-kates-benchmark
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: kates-dashboards
    app.kubernetes.io/part-of: kates
    app.kubernetes.io/managed-by: gen-dashboards.py
  annotations:
    grafana_folder: "Kates"
data:
  kates-benchmark.json: |-
    {
      "annotations": {
        "list": []
      },
      "description": "One benchmark run while it is running: throughput, the latency percentiles the backend measured, records and errors per phase, and which SLA constraint is breaking. Empty between runs by design \u2014 the history is on Kates \u2014 Trend & Regression.",
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
