          "description": "Connectors and tasks that failed to start in the last 15 minutes, counted apart. These are worker-scope counters, so a failure here happened before the connector or task ever reached the status table: a bad plugin path, a class the worker cannot load, a configuration the connector rejected in `start()`. A worker crash-looping on startup never appears in the task panels at all, and this is where it shows. `increase()` over 15 minutes rather than a rate, because these are rare events and a per-second rate of a rare event is unreadable.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 57
          },
          "id": 31,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "label_replace(sum(increase(kafka_connect_worker_metrics_connector_startup_failure_total{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}[15m])), \"kind\", \"connector\", \"\", \"\") or label_replace(sum(increase(kafka_connect_worker_metrics_task_startup_failure_total{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}[15m])), \"kind\", \"task\", \"\", \"\")",
              "legendFormat": "{{kind}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Startup failures (15m)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "1 while the worker is rebalancing, 0 otherwise. This is the series KafkaConnectRebalanceTooLong fires on \u2014 `max(...) == 1` held for 5 minutes \u2014 and until this board had a panel for it, the only place it existed was inside that alert, so the page had nowhere to look. A line stuck at 1 is a rebalance that never converged, usually a worker that cannot complete the join, and it takes the *whole group's* tasks out of service rather than that worker's share of them.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "max": 1,
              "min": 0,
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 65
          },
          "id": 32,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "kafka_connect_worker_rebalance_metrics_rebalancing{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}",
              "legendFormat": "{{pod}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Rebalance in progress",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "How long each worker has been stable. A healthy group draws one line climbing steadily; a sawtooth is the storm above seen from the other side, where the height of each tooth is how long the group managed to stay still between rebalances. This is the panel for a connector whose throughput is fine on average and terrible in bursts. Kafka resets the attribute to zero at every rebalance, so never `rate()` it \u2014 the drops are the signal, not counter resets to be corrected away.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 65
          },
          "id": 33,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "kafka_connect_worker_rebalance_metrics_time_since_last_rebalance_ms{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}",
              "legendFormat": "{{pod}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Time since last rebalance",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Worker heap, under both spellings of the name: the JMX exporter agent renamed `jvm_memory_bytes_used` to `jvm_memory_used_bytes` in its 1.x line, and which one a given worker image ships is not something a panel should have to know, so `or` takes whichever exists. Connect workers under memory pressure rarely crash \u2014 they slow down, and it surfaces as lag, or as rebalances caused by GC pauses long enough to miss a heartbeat.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 73
          },
          "id": 34,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (pod) (jvm_memory_used_bytes{area=\"heap\", namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"} or jvm_memory_bytes_used{area=\"heap\", namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"})",
              "legendFormat": "{{pod}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Heap used",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The same heap against the JVM's maximum, which is the form KafkaConnectWorkerHeapHigh uses (`alerts.thresholds.heapUsagePercent`). Both halves of the division carry the `or` over the two exporter spellings, so the ratio cannot end up with a 1.x numerator over an 0.x denominator and render nothing at all \u2014 which is the failure mode that writing only one spelling produces, and it looks exactly like an idle cluster.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 73
          },
          "id": 35,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (pod) (jvm_memory_used_bytes{area=\"heap\", namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"} or jvm_memory_bytes_used{area=\"heap\", namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}) / sum by (pod) (jvm_memory_max_bytes{area=\"heap\", namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"} or jvm_memory_bytes_max{area=\"heap\", namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"})",
              "legendFormat": "{{pod}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Heap used / max",
          "type": "timeseries"
        },
        {
          "collapsed": true,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 81
          },
          "id": 36,
          "panels": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "description": "The producers underneath the tasks \u2014 one per source connector task, plus the workers' own producers for the internal offset, config and status topics. `record-send-rate` is a Kafka rate already, read as it is rather than through `rate()`. Grouped by `clientid` and not by connector because these are client beans: Connect names the client `connector-producer-<connector>-<task>`, so the connector is inside the string but is not a label.",
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "fillOpacity": 10,
                    "lineWidth": 1,
                    "showPoints": "never",
                    "spanNulls": false
                  },
                  "unit": "short"
                },
                "overrides": []
              },
              "gridPos": {
                "h": 8,
                "w": 8,
                "x": 0,
                "y": 82
              },
              "id": 37,
              "options": {
                "legend": {
                  "calcs": [],
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "editorMode": "code",
                  "expr": "sum by (clientid) (kafka_producer_producer_record_send_rate{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"})",
                  "legendFormat": "{{clientid}}",
                  "range": true,
                  "refId": "A"
                }
              ],
              "title": "Producer records sent /s",
              "type": "timeseries"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "description": "Send errors and retries for those same producers. A retry is the client absorbing a transient failure; an error is what it gave up on, and a record that errors here never reached Kafka at all. Both climbing while the send rate holds steady is Kafka rejecting or throttling the writes \u2014 a broker-side answer, not a connector one. Two Kafka-computed rates, drawn apart with `label_replace`.",
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "fillOpacity": 10,
                    "lineWidth": 1,
                    "showPoints": "never",
                    "spanNulls": false
                  },
                  "unit": "short"
                },
                "overrides": []
              },
              "gridPos": {
                "h": 8,
                "w": 8,
                "x": 8,
                "y": 82
              },
              "id": 38,
              "options": {
                "legend": {
                  "calcs": [],
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "editorMode": "code",
                  "expr": "label_replace(sum by (clientid) (kafka_producer_producer_record_error_rate{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}), \"kind\", \"error\", \"\", \"\") or label_replace(sum by (clientid) (kafka_producer_producer_record_retry_rate{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}), \"kind\", \"retry\", \"\", \"\")",
                  "legendFormat": "{{clientid}} {{kind}}",
                  "range": true,
                  "refId": "A"
                }
              ],
              "title": "Producer errors and retries /s",
              "type": "timeseries"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "description": "Mean round trip to the broker for the tasks' producers. This is the first thing to look at when 'Source records in flight' is climbing with no errors anywhere: the tasks are polling fine and the produce path is the queue. Already an average over Kafka's window; `max by (clientid)` picks the worst client rather than averaging averages together.",
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "fillOpacity": 10,
                    "lineWidth": 1,
                    "showPoints": "never",
                    "spanNulls": false
                  },
                  "unit": "ms"
                },
                "overrides": []
              },
              "gridPos": {
                "h": 8,
                "w": 8,
                "x": 16,
                "y": 82
              },
              "id": 39,
              "options": {
                "legend": {
                  "calcs": [],
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "editorMode": "code",
                  "expr": "max by (clientid) (kafka_producer_producer_request_latency_avg{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"})",
                  "legendFormat": "{{clientid}}",
                  "range": true,
                  "refId": "A"
                }
              ],
              "title": "Producer request latency (avg)",
              "type": "timeseries"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "description": "The consumers underneath the sink tasks, and the workers' own consumers of the internal topics. Another Kafka-computed rate, read as it is. Compare it with 'Sink records put /s': consuming quickly and putting slowly is a slow destination, and the records caught in between are what the next panel measures.",
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "fillOpacity": 10,
                    "lineWidth": 1,
                    "showPoints": "never",
                    "spanNulls": false
                  },
                  "unit": "short"
                },
                "overrides": []
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 90
              },
              "id": 40,
              "options": {
                "legend": {
                  "calcs": [],
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "editorMode": "code",
                  "expr": "sum by (clientid) (kafka_consumer_consumer_fetch_manager_records_consumed_rate{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"})",
                  "legendFormat": "{{clientid}}",
                  "range": true,
                  "refId": "A"
                }
              ],
              "title": "Consumer records /s",
              "type": "timeseries"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "description": "The real backlog: for each client, the largest number of records any of its partitions still holds beyond the position that consumer has reached. This \u2014 rather than 'Sink lag (max records behind)' in the Throughput section \u2014 is the panel that answers 'how far behind is this sink', and it is the same quantity KafkaConnectSinkLag alerts on, measured by the client instead of by the Kafka Exporter. It also covers the workers' own consumers of the internal config and status topics, which belong to no connector and so appear in none of the sink panels: a worker lagging on the status topic is a worker running on a stale view of the group.",
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "fillOpacity": 10,
                    "lineWidth": 1,
                    "showPoints": "never",
                    "spanNulls": false
                  },
                  "unit": "short"
                },
                "overrides": []
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 90
              },
              "id": 41,
              "options": {
                "legend": {
                  "calcs": [],
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "editorMode": "code",
                  "expr": "max by (clientid) (kafka_consumer_consumer_fetch_manager_records_lag_max{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"})",
                  "legendFormat": "{{clientid}}",
                  "range": true,
                  "refId": "A"
                }
              ],
              "title": "Consumer lag (max)",
              "type": "timeseries"
            }
          ],
          "title": "Client path",
          "type": "row"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "kafka",
        "connect",
        "strimzi",
        "kates"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "text": "default",
              "value": "default"
            },
            "hide": 0,
            "label": "Data source",
            "name": "datasource",
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          },
          {
            "current": {},
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(kafka_connect_worker_rebalance_metrics_completed_rebalances_total, namespace)",
            "hide": 0,
            "includeAll": false,
            "label": "Namespace",
            "multi": false,
            "name": "namespace",
            "options": [],
            "query": {
              "query": "label_values(kafka_connect_worker_rebalance_metrics_completed_rebalances_total, namespace)",
              "refId": "namespace-variable-query"
            },
            "refresh": 2,
            "sort": 1,
            "type": "query"
          },
          {
            "current": {},
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(kafka_connect_worker_rebalance_metrics_completed_rebalances_total{namespace=\"$namespace\"}, strimzi_io_cluster)",
            "hide": 0,
            "includeAll": false,
            "label": "Connect cluster",
            "multi": false,
            "name": "cluster",
            "options": [],
            "query": {
              "query": "label_values(kafka_connect_worker_rebalance_metrics_completed_rebalances_total{namespace=\"$namespace\"}, strimzi_io_cluster)",
              "refId": "cluster-variable-query"
            },
            "refresh": 2,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Kafka Connect",
      "uid": "kates-connect",
      "version": 1
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  # No namespace on purpose — `kubectl apply -n <ns>` picks it, and it
  # has to be a namespace the sidecar searches (see README.md).
  name: kates-dashboard-kafka-kraft
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: kates-dashboards
    app.kubernetes.io/part-of: kates
    app.kubernetes.io/managed-by: gen-dashboards.py
  annotations:
    grafana_folder: "Kates"
data:
  kafka-kraft.json: |-
    {
      "annotations": {
        "list": []
      },
      "description": "The KRaft half of a Kafka cluster: whether the controller quorum is healthy, whether metadata is committing, whether every broker has applied it, and what is failing to replicate, serve or store the data underneath. Broker health, quorum identity, Cruise Control and consumer lag are the Strimzi operator's own boards.",
      "editable": true,
      "graphTooltip": 1,
      "links": [
        {
          "asDropdown": true,
          "tags": [
            "Strimzi"
          ],
          "title": "Broker health, quorum identity, Cruise Control, consumer lag",
          "type": "dashboards"
        },
        {
          "asDropdown": true,
          "tags": [
            "performance"
          ],
          "title": "Performance & load testing",
          "type": "dashboards"
        },
        {
          "icon": "doc",
          "targetBlank": true,
          "title": "Kafka cluster runbook",
          "type": "link",
          "url": "https://github.com/bmscomp/kates/blob/main/docs/kafka-cluster-runbook.md"
        }
      ],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "How many nodes claim to be the active controller right now. The answer is 1 on a healthy cluster and the alert KafkaActiveControllerCount fires on anything else after 3 minutes. Zero means the quorum has no leader: no topic is created, no leader is elected, no broker is fenced or unfenced, and every existing leader keeps serving \u2014 which is why a cluster with no controller can look entirely healthy from a client. Two means a split brain that KRaft's epoch fencing should make impossible, so it is nearly always two clusters' series sharing one `$cluster` value rather than a real double election.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 2
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(kafka_controller_kafkacontroller_activecontrollercount{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\"})",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Active controllers",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The controller quorum's current term. KRaft bumps it by one at every leader election, so the number itself means nothing and its rate of change means everything: a flat epoch is a stable quorum. `max` rather than `sum` because every voter reports the epoch it believes in, and during an election they disagree.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
