                    "uid": "${datasource}"
                  },
                  "editorMode": "code",
                  "expr": "max(kafka_producer_request_latency_avg{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\",client_id=~\"connector-producer-.*\"})",
                  "legendFormat": "request latency avg (ms)",
                  "range": true,
                  "refId": "A"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "editorMode": "code",
                  "expr": "max(kafka_producer_request_latency_max{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\",client_id=~\"connector-producer-.*\"})",
                  "legendFormat": "request latency max (ms)",
                  "range": true,
                  "refId": "B"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "editorMode": "code",
                  "expr": "min(kafka_producer_buffer_available_bytes{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\",client_id=~\"connector-producer-.*\"}) / 1048576",
                  "legendFormat": "buffer available (MiB)",
                  "range": true,
                  "refId": "C"
                }
              ],
              "title": "Produce latency and buffer",
              "type": "timeseries"
            }
          ],
          "title": "The path a record takes \u2014 source fetch, target produce",
          "type": "row"
        },
        {
          "collapsed": true,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 77
          },
          "id": 42,
          "panels": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "description": "Throughput for this leg only, both its connectors.",
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "fillOpacity": 10,
                    "lineWidth": 1,
                    "showPoints": "never",
                    "spanNulls": false
                  },
                  "unit": "reqps"
                },
                "overrides": []
              },
              "gridPos": {
                "h": 8,
                "w": 6,
                "x": 0,
                "y": 78
              },
              "id": 43,
              "options": {
                "legend": {
                  "calcs": [],
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "editorMode": "code",
                  "expr": "sum by (connector) (rate(kafka_connect_source_task_metrics_source_record_write_total{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\",connector=~\"$source->.*\"}[5m]))",
                  "legendFormat": "{{connector}}",
                  "range": true,
                  "refId": "A"
                }
              ],
              "title": "$source \u2014 records /s",
              "type": "timeseries"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "description": "Selected by the replicated topic prefix: under a prefixing policy the alias IS the first segment of the target topic name. Under an identity replication policy the replicated topic keeps its source name, there is no prefix to match, and this panel stays empty \u2014 set add.source.alias.to.metrics on the connector to get a real source label back.",
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "thresholds"
                  },
                  "custom": {
                    "drawStyle": "line",
                    "fillOpacity": 10,
                    "lineWidth": 1,
                    "showPoints": "never",
                    "spanNulls": false,
                    "thresholdsStyle": {
                      "mode": "line"
                    }
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      },
                      {
                        "color": "red",
                        "value": 60000
                      }
                    ]
                  },
                  "unit": "ms"
                },
                "overrides": []
              },
              "gridPos": {
                "h": 8,
                "w": 6,
                "x": 6,
                "y": 78
              },
              "id": 44,
              "options": {
                "legend": {
                  "calcs": [],
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "editorMode": "code",
                  "expr": "max by (topic) (kafka_connect_mirror_source_connector_replication_latency_ms_max{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\",topic=~\"$source[.].*\"})",
                  "legendFormat": "{{topic}}",
                  "range": true,
                  "refId": "A"
                }
              ],
              "title": "$source \u2014 replication lag",
              "type": "timeseries"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "description": "Checkpoint latency per consumer group for this source. The checkpoint bean is tagged with the alias unconditionally, so this one needs no prefix guess.",
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "fillOpacity": 10,
                    "lineWidth": 1,
                    "showPoints": "never",
                    "spanNulls": false
                  },
                  "unit": "ms"
                },
                "overrides": []
              },
              "gridPos": {
                "h": 8,
                "w": 6,
                "x": 12,
                "y": 78
              },
              "id": 45,
              "options": {
                "legend": {
                  "calcs": [],
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "editorMode": "code",
                  "expr": "max by (group) (kafka_connect_mirror_checkpoint_connector_checkpoint_latency_ms_max{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\",source=\"$source\"})",
                  "legendFormat": "{{group}}",
                  "range": true,
                  "refId": "A"
                }
              ],
              "title": "$source \u2014 offset translation age",
              "type": "timeseries"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "description": "Errors logged by this leg's tasks. On a fan-in release this is the panel that says whether an error rate belongs to the source you are looking at or to one of its neighbours.",
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "fillOpacity": 10,
                    "lineWidth": 1,
                    "showPoints": "never",
                    "spanNulls": false
                  },
                  "unit": "reqps"
                },
                "overrides": []
              },
              "gridPos": {
                "h": 8,
                "w": 6,
                "x": 18,
                "y": 78
              },
              "id": 46,
              "options": {
                "legend": {
                  "calcs": [],
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "editorMode": "code",
                  "expr": "sum by (connector) (rate(kafka_connect_task_error_metrics_total_errors_logged{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\",connector=~\"$source->.*\"}[5m]))",
                  "legendFormat": "{{connector}}",
                  "range": true,
                  "refId": "A"
                }
              ],
              "title": "$source \u2014 errors /s",
              "type": "timeseries"
            }
          ],
          "repeat": "source",
          "title": "Source: $source",
          "type": "row"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "kafka",
        "mirrormaker2",
        "replication",
        "kates"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "text": "default",
              "value": "default"
            },
            "hide": 0,
