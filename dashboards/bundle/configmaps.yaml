              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (topic) (rate(kafka_server_brokertopicmetrics_messagesin_total{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\", topic=~\"$topic\", topic!=\"\"}[5m]))",
              "legendFormat": "{{topic}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Messages in /s by topic",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The highest offset written to each partition, per replica. The single most useful panel during a run: the SLOPE is the per-partition write rate, and parallel lines mean the producer's partitioner is spreading the load. One partition climbing faster than the rest is a key skew \u2014 the classic cause of a load test that cannot reach its target no matter how many brokers are added, because one partition's leader is doing all the work. Every replica of a partition draws its own line, and followers trailing visibly behind their leader is replication lag made visible.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 130
          },
          "id": 42,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "kafka_log_log_logendoffset{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\", topic=~\"$topic\"}",
              "legendFormat": "{{topic}} p{{partition}} {{kubernetes_pod_name}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Log end offset per partition",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Bytes per partition per replica. It should track the offset panel; where it does not, records are of uneven size or compression is working differently across partitions. The line that matters during a long run is the one that STOPS growing while its offsets keep climbing: that is retention deleting from the head as fast as the producer appends to the tail, and it means the test is no longer measuring what it thinks it is.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 138
          },
          "id": 43,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "kafka_log_log_size{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\", topic=~\"$topic\"}",
              "legendFormat": "{{topic}} p{{partition}} {{kubernetes_pod_name}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Partition size on disk",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "How many segment files each partition is made of. It steps by one every `segment.bytes` or `segment.ms`, so the step rate is another read of the write rate \u2014 and the absolute number is a cost: every segment is an open file descriptor and an index in memory on the broker. A partition whose segment count only ever grows has retention that is not deleting, and it will end at the file-descriptor panel in the Resource usage section.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 138
          },
          "id": 44,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "kafka_log_log_numlogsegments{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\", topic=~\"$topic\"}",
              "legendFormat": "{{topic}} p{{partition}} {{kubernetes_pod_name}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Log segments per partition",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The oldest offset still on disk. Flat means nothing has been deleted yet; a line that starts climbing is retention taking effect, and the gap between it and the log end offset is how many records the partition actually still holds. It is the panel that explains a consumer benchmark suddenly reporting OFFSET_OUT_OF_RANGE: a consumer that fell behind the start offset has had its history deleted underneath it, which in a long soak test is a result rather than a fault.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 146
          },
          "id": 45,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "kafka_log_log_logstartoffset{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\", topic=~\"$topic\"}",
              "legendFormat": "{{topic}} p{{partition}} {{kubernetes_pod_name}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Log start offset per partition",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "A snapshot of the selected topics: one row per partition per broker, with the bytes that broker holds for it. Read it for placement rather than for volume \u2014 the row count per partition is its replication factor, a partition missing a row is a replica that is not there, and rows of visibly different sizes for the same partition are replicas that have not converged. It is the same instant view `kafka-perf-test`, `kafka-performance` and `kafka-working` each carried their own copy of.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 146
          },
          "id": 46,
          "options": {
            "footer": {
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max by (topic, partition, kubernetes_pod_name) (kafka_log_log_size{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\", topic=~\"$topic\"})",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Partition detail",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                }
              }
            }
          ],
          "type": "table"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": [
        "kafka",
        "performance",
        "benchmark",
        "kates"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "text": "default",
              "value": "default"
            },
            "hide": 0,
            "label": "Data source",
            "name": "datasource",
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          },
          {
            "current": {},
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(kafka_server_replicamanager_leadercount, namespace)",
            "hide": 0,
            "includeAll": false,
            "label": "Namespace",
            "multi": false,
            "name": "namespace",
            "options": [],
            "query": {
              "query": "label_values(kafka_server_replicamanager_leadercount, namespace)",
              "refId": "namespace-variable-query"
            },
            "refresh": 2,
            "sort": 1,
            "type": "query"
          },
          {
            "current": {},
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(kafka_server_replicamanager_leadercount{namespace=\"$namespace\"}, strimzi_io_cluster)",
            "hide": 0,
            "includeAll": false,
            "label": "Kafka cluster",
            "multi": false,
            "name": "cluster",
            "options": [],
            "query": {
              "query": "label_values(kafka_server_replicamanager_leadercount{namespace=\"$namespace\"}, strimzi_io_cluster)",
              "refId": "cluster-variable-query"
            },
            "refresh": 2,
            "sort": 1,
            "type": "query"
          },
          {
            "allValue": ".+",
            "current": {},
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(kafka_log_log_size{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}, topic)",
            "hide": 0,
            "includeAll": true,
            "label": "Topic",
            "multi": true,
            "name": "topic",
            "options": [],
            "query": {
              "query": "label_values(kafka_log_log_size{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}, topic)",
              "refId": "topic-variable-query"
            },
            "refresh": 2,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Kafka \u2014 Performance & Load Testing",
      "uid": "kates-kafka-performance",
      "version": 1
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  # No namespace on purpose — `kubectl apply -n <ns>` picks it, and it
  # has to be a namespace the sidecar searches (see README.md).
  name: kates-dashboard-kates-application
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: kates-dashboards
    app.kubernetes.io/part-of: kates
    app.kubernetes.io/managed-by: gen-dashboards.py
  annotations:
    grafana_folder: "Kates"
data:
  kates-application.json: |-
    {
      "annotations": {
        "list": []
      },
      "description": "The Quarkus process behind the benchmark API: HTTP traffic and errors, JVM heap and GC, the Agroal connection pool, and what the kubelet sees of the container.",
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "How many Kates pods kube-state-metrics reports with the `Ready` condition true. This is the *Kubernetes* view: a pod is Ready when its readiness probe passes, which for this application means `/q/health/ready` answered. Below the Deployment's replica count means a rollout is in progress or a pod is failing its probe. Needs kube-state-metrics; without it this panel is the only one in the header that reads *No data* while the application is perfectly healthy. Red at zero: no pod Ready is the outage, not the resting state.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(kube_pod_status_ready{namespace=\"$namespace\", pod=~\"$pod\", condition=\"true\"}) or vector(0)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Pods ready",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Containers in these pods that restarted in the last five minutes, summed. Any non-zero value is worth reading the logs over: this application has no crash-and-retry design, so a restart is an OOM kill, a liveness probe that timed out, or a node event. `increase()` over a counter that resets when the pod is replaced undercounts across a rollout, which is the correct direction to be wrong in \u2014 it will not invent restarts that did not happen. kube-state-metrics. The zero fallback is anchored to kube-state's own readiness series for the same pods, not to `process_uptime_seconds`: restarts are measured from outside the JVM and must still read while the JVM is down. What it rules out is the other case \u2014 kube-state absent, or `$pod` matching nothing, drawing a green zero.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "(sum(increase(kube_pod_container_status_restarts_total{namespace=\"$namespace\", pod=~\"$pod\"}[5m]))) or (sum(kube_pod_status_ready{namespace=\"$namespace\", pod=~\"$pod\"}) * 0)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Container restarts (5m)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "How long the longest-running JVM in the selection has been up, from Micrometer's own uptime binder. The JVM's, not the pod's: the board used to read `time() - min(kube_pod_start_time)`, which counts from the moment the kubelet started the container and so includes the JVM's startup. This value also survives having no kube-state-metrics at all. A number that keeps resetting to a few minutes is the restart loop the panel to the left counts.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max(process_uptime_seconds{namespace=\"$namespace\", job=\"$job\"})",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Uptime (oldest process)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The same Ready condition for the pods the `$db_pod` variable selected \u2014 by default anything in the namespace with `postgres` in its name, which is what charts/kates calls its bundled PostgreSQL. Zero here with the pool panels below showing no available connections is a database outage; zero here with a healthy pool means the application is talking to a database outside the cluster and this panel has nothing to see. kube-state-metrics.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(kube_pod_status_ready{namespace=\"$namespace\", pod=~\"$db_pod\", condition=\"true\"}) or vector(0)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Database pods ready",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "id": 5,
          "panels": [],
          "title": "HTTP",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Requests per second reaching the Quarkus HTTP layer, split by method. `http_server_requests_seconds_count` is the count half of Micrometer's HTTP server timer, so `rate()` over it is a request rate \u2014 it is not a duration despite the `_seconds` in the name, which is the timer's base unit leaking into every one of its series. The binder is on because `quarkus.micrometer.binder.http-server.enabled=true`; with it off this whole row is empty.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 5
          },
          "id": 6,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (method) (rate(http_server_requests_seconds_count{namespace=\"$namespace\", job=\"$job\"}[1m]))",
              "legendFormat": "{{method}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Request rate by method",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The same counter filtered to failing responses and split by status. Read the two classes apart: 4xx is a client sending something this API rejected \u2014 a malformed test spec, a run id that does not exist \u2014 and is not an outage, while 5xx is this process failing and every one of them has a stack trace in the logs. A 5xx rate that tracks the request rate is a broken deployment; a 5xx rate that tracks the benchmark load is the engine exhausting something.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 5
          },
          "id": 7,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (status) (rate(http_server_requests_seconds_count{namespace=\"$namespace\", job=\"$job\", status=~\"4..|5..\"}[1m]))",
              "legendFormat": "{{status}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Error rate, 4xx and 5xx",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "p50, p95 and p99 of server-side request duration, computed from the timer's histogram buckets. This one *is* `histogram_quantile` territory and the only place on any Kates board that it is: `http_server_requests_seconds_bucket` is a real cumulative histogram with an `le` label, unlike the benchmark engine's latency series, which are pre-computed percentile gauges carrying a `quantile` label and must be selected, never re-aggregated. Summing by `le` before the quantile is what makes the result a percentile across all pods rather than a mean of per-pod percentiles.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 5
          },
          "id": 8,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"$namespace\", job=\"$job\"}[1m])))",
              "legendFormat": "p50",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"$namespace\", job=\"$job\"}[1m])))",
              "legendFormat": "p95",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"$namespace\", job=\"$job\"}[1m])))",
              "legendFormat": "p99",
              "range": true,
              "refId": "C"
            }
          ],
          "title": "Request latency percentiles",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 13
          },
          "id": 9,
          "panels": [],
          "title": "JVM \u2014 Micrometer's names, not the JMX agent's",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The three heap numbers, summed over the pools inside the heap area. Used climbing towards committed is normal; committed climbing towards max and staying there, with GC pause time rising beside it, is the shape of a heap that is too small for the workload \u2014 which for this process usually means a benchmark run holding more in flight than the container was sized for. `max` reads -1 for a pool with no configured maximum, which is why it is drawn rather than used as a denominator.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 14
          },
          "id": 10,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(jvm_memory_used_bytes{namespace=\"$namespace\", job=\"$job\", area=\"heap\"})",
              "legendFormat": "used",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(jvm_memory_committed_bytes{namespace=\"$namespace\", job=\"$job\", area=\"heap\"})",
              "legendFormat": "committed",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(jvm_memory_max_bytes{namespace=\"$namespace\", job=\"$job\", area=\"heap\"})",
              "legendFormat": "max",
              "range": true,
              "refId": "C"
            }
          ],
          "title": "Heap used, committed and max",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Seconds of garbage-collection pause per second, split by the collector's cause and action, plus the longest single pause. The rate is the one to watch \u2014 0.1 means a tenth of every second is spent stopped \u2014 and it is what turns up as HTTP p99 latency in the row above without any corresponding rise in p50. The `_max` series is a Micrometer gauge of the worst pause in its window, not a counter: never `rate()` it.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 14
          },
          "id": 11,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (cause, action) (rate(jvm_gc_pause_seconds_sum{namespace=\"$namespace\", job=\"$job\"}[1m]))",
              "legendFormat": "{{cause}} / {{action}}",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max(jvm_gc_pause_seconds_max{namespace=\"$namespace\", job=\"$job\"})",
              "legendFormat": "longest pause",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "GC pause",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Live, daemon and peak thread counts. The benchmark engine starts worker threads per task, so this climbs with concurrent runs by design; what is not by design is live staying high after the runs finish, which is a leaked executor and eventually an OOM. Peak never falls, so the gap between peak and live is the high-water mark of everything that has run since startup.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 14
          },
          "id": 12,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(jvm_threads_live_threads{namespace=\"$namespace\", job=\"$job\"})",
              "legendFormat": "live",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(jvm_threads_daemon_threads{namespace=\"$namespace\", job=\"$job\"})",
              "legendFormat": "daemon",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(jvm_threads_peak_threads{namespace=\"$namespace\", job=\"$job\"})",
              "legendFormat": "peak",
              "range": true,
              "refId": "C"
            }
          ],
          "title": "Threads",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "id": 13,
          "panels": [],
          "title": "Database \u2014 the Agroal pool",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The Agroal pool, by state: active (checked out), available (idle in the pool) and the maximum simultaneously active since startup. Active pinned at the pool size with `awaiting` above zero is a pool that is too small or a query that is too slow \u2014 the next two panels say which. All four are Micrometer gauges Quarkus registers per datasource, so the `datasource` label separates them if this application ever gains a second one.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 23
          },
          "id": 14,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(agroal_active_count{namespace=\"$namespace\", job=\"$job\"})",
              "legendFormat": "active",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(agroal_available_count{namespace=\"$namespace\", job=\"$job\"})",
              "legendFormat": "available",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(agroal_max_used_count{namespace=\"$namespace\", job=\"$job\"})",
              "legendFormat": "max used",
              "range": true,
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(agroal_awaiting_count{namespace=\"$namespace\", job=\"$job\"})",
              "legendFormat": "awaiting",
              "range": true,
              "refId": "D"
            }
          ],
          "title": "Pool connections",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "How often the application takes a connection out of the pool. `agroal_acquire_count` is a *gauge* holding a cumulative total, not a Prometheus counter \u2014 Quarkus registers it with `Gauge.builder`, so it carries no `_total` suffix and Prometheus does not type it as a counter. `rate()` over it still gives the right answer because the underlying value only ever increases, but it will not be corrected for a restart the way a real counter is: expect one spike per pod restart.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 23
          },
          "id": 15,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(rate(agroal_acquire_count{namespace=\"$namespace\", job=\"$job\"}[1m]))",
              "legendFormat": "acquisitions/s",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Acquisitions per second",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "How long a request spent blocked waiting for the pool, average and worst case, in milliseconds. This is the panel that distinguishes a pool that is too small from a database that is too slow: waiting time rising while `Pool connections` shows active pinned at the ceiling is contention for the pool, and raising the pool size fixes it. Both series are Micrometer gauges that Quarkus registers with a `milliseconds` base unit, which is where the suffix comes from \u2014 the board this replaced read `agroal_blocking_time_total_seconds` divided by `agroal_blocking_time_count`, and neither of those names has ever existed.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 23
          },
          "id": 16,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max(agroal_blocking_time_average_milliseconds{namespace=\"$namespace\", job=\"$job\"})",
              "legendFormat": "average",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max(agroal_blocking_time_max_milliseconds{namespace=\"$namespace\", job=\"$job\"})",
              "legendFormat": "worst",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Time waiting for a connection",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 31
          },
          "id": 17,
          "panels": [],
          "title": "Container resources \u2014 cAdvisor",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "CPU seconds consumed per second, per container, which is cores. cAdvisor, via the kubelet \u2014 a different source from everything above it on this board, and one that is absent on a cluster whose kubelet metrics are not scraped. Compare it with the container's CPU limit rather than with the node's size: a process throttled at its limit shows up here as a flat line at exactly the limit and in the JVM row as rising GC pause.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 32
          },
          "id": 18,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (pod, container) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", pod=~\"$pod\", container!=\"\", container!=\"POD\"}[5m]))",
              "legendFormat": "{{pod}} / {{container}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "CPU cores used",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Resident set size and working set, per container, as the kubelet sees them. Working set is the number the OOM killer acts on, so it \u2014 not RSS and not the JVM heap \u2014 is what to compare against the memory limit. A JVM whose heap is comfortable and whose working set is at the limit is spending the difference on metaspace, thread stacks, direct buffers and the Kafka clients' own allocations, none of which the heap panel above can see. cAdvisor.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 32
          },
          "id": 19,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (pod) (container_memory_rss{namespace=\"$namespace\", pod=~\"$pod\", container!=\"\", container!=\"POD\"})",
              "legendFormat": "RSS {{pod}}",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"$namespace\", pod=~\"$pod\", container!=\"\", container!=\"POD\"})",
              "legendFormat": "working set {{pod}}",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Container memory",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "kates",
        "application",
        "health",
        "quarkus"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "text": "default",
