              "id": 17,
              "options": {
                "content": "**These panels fill only for a run that verified integrity.**\n\nThey read the `kafka:chaos:*` recording rules in `charts/monitoring/templates/prometheus-chaos-rules.yaml`, which record the `kates_integrity_result_*` series the Kates application publishes from `IntegrityResult` \u2014 one set per run, tagged `run_id` and `test_type`. A plain load test never runs the verifier, so it publishes none of them and this row stays blank. That is the expected state, not a fault.\n\nSo: **blank during an ordinary run** means integrity was not verified. **Blank during a chaos run** means either the verifier has not finished yet \u2014 it publishes from the first poll after it completes \u2014 or the Kates ServiceMonitor is not being scraped, which `dashboards/METRICS.md` and tutorial 13 both cover.\n\nThe four SLA alerts on these same series \u2014 `KafkaRTOExceedsSLA`, `KafkaRPOExceedsSLA`, `KafkaDataLossDetected`, `KafkaE2ELatencySpike` \u2014 fire off the recording rules, so they are live exactly when this row is.\n\nThe values are in **seconds**. `IntegrityResult` holds them as `Duration` and exposes milliseconds; the publisher divides, because a millisecond value under a `_seconds` name would make `KafkaRTOExceedsSLA` \u2014 which fires above 30 seconds \u2014 fire on every run that took longer than 30ms to recover.",
