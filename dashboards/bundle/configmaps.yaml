          "description": "Broker heap in use, how much the JVM has committed from the operating system, and everything the JVM holds that is not heap. Every term carries `or` over the two exporter spellings \u2014 the JMX exporter agent renamed `jvm_memory_bytes_used` to `jvm_memory_used_bytes` in its 1.x line, and which one a given image ships is not something a panel should have to know. `kafka-working` read `java_lang_memory_heapmemoryusage_used`, the raw MBean spelling, which the agent never publishes under that name. Used climbing to meet committed and staying there is a broker about to spend its time in GC rather than on requests \u2014 the next panel.\n\n`non-heap used` is metaspace, the code cache and the compressed class space. It is flat on a healthy broker and it is the line that moves when a plugin, an authorizer or an interceptor leaks classes \u2014 which a heap graph cannot show and `-Xmx` does not bound. `kafka-jvm-dashboard.json` was the only one of the nine deleted boards that plotted it; `kafka-perf-global`'s JVM row was heap-only and the Strimzi operator's `strimzi-kafka.json` sums `jvm_memory_used_bytes` across areas without breaking them out, so without this series the number is plotted nowhere. `Resident memory and heap` below shows the wider gap it sits inside.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
