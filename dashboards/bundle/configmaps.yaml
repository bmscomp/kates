# Every Kates Grafana board as a sidecar-labelled ConfigMap
#
# GENERATED by scripts/gen-dashboards.py from dashboards/<board>/dashboard.json.
# Do not edit: `scripts/gen-dashboards.py --check` fails when this file has drifted, and
# the next regeneration overwrites it. Edit the board's board.py.
#
#   kubectl apply -n <the namespace the sidecar searches> -f configmaps.yaml
#
# The sidecar watches for the label below (`grafana_dashboard: "1"` is
# kube-prometheus-stack's default) and files each board into the folder
# named by the grafana_folder annotation, which needs
# `sidecar.dashboards.folderAnnotation: grafana_folder` set on the
# Grafana. Without it the boards still load, into the default folder.
---
apiVersion: v1
kind: ConfigMap
metadata:
  # No namespace on purpose — `kubectl apply -n <ns>` picks it, and it
  # has to be a namespace the sidecar searches (see README.md).
  name: kates-dashboard-kafka-connect
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: kates-dashboards
    app.kubernetes.io/part-of: kates
    app.kubernetes.io/managed-by: gen-dashboards.py
  annotations:
    grafana_folder: "Kates"
data:
  kafka-connect.json: |-
    {
      "annotations": {
        "list": []
      },
      "description": "One Kafka Connect group: whether the workers are up, which connectors and tasks are running, how much data is moving, what is failing or being dead-lettered, and whether a restart will reprocess.",
      "editable": true,
      "graphTooltip": 1,
      "links": [
        {
          "targetBlank": true,
          "title": "Kafka Connect runbook",
          "type": "link",
          "url": "https://github.com/bmscomp/kates/blob/main/docs/connect-cluster-runbook.md"
        }
      ],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "How many worker pods answered Prometheus' last scrape. `up` is synthetic \u2014 Prometheus writes one per target \u2014 so this counts scrape targets, not Ready pods: a worker that is running but whose metrics port stopped answering reads as down here while the KafkaConnect still reports Ready. Below the release's replica count for 3 minutes is KafkaConnectWorkerDown. The `or vector(0)` is what makes an empty result draw a zero rather than *No data*, so a release with no workers left is visibly zero instead of visibly blank \u2014 and the thresholds are red at zero, because no worker up is the outage rather than the resting state.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(up{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}) or vector(0)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Workers up",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Connectors registered with the group, counted by name. `kafka_connect_connector_metrics` is a synthetic `1` the exporter emits once per connector *per attribute* \u2014 class, type, version and status are four series sharing that one name and differing only in which label they carry \u2014 so the `max by (connector)` is not an aggregation over workers, it is what collapses those four back into one connector. Every worker reports every connector, so this is a group-wide count.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "count(max by (connector) (kafka_connect_connector_metrics{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"})) or vector(0)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Connectors",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Connectors whose own status is `failed` \u2014 connector scope, which means the connector's `start()` or its configuration, not its data path. KafkaConnectConnectorFailed reads this. It is not the common failure: a connector normally stays RUNNING while its tasks die, which is the stat to the right. `status` is a label, so a connector that recovers stops publishing the `failed` series rather than publishing it as zero \u2014 the series goes stale and the count falls on its own. That is what the zero fallback is for, and why it is anchored to the workers' rebalance series: 'no failed connectors' and 'no workers being scraped' must not both draw a green zero.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "(count(max by (connector) (kafka_connect_connector_metrics{status=\"failed\", namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}))) or (sum(kafka_connect_worker_rebalance_metrics_completed_rebalances_total{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}) * 0)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Failed connectors",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Tasks in the `failed` state across every connector. Task scope, not connector scope, and that is the whole point: a connector with four tasks and one failure reports RUNNING on its CR and on the stat to the left, keeps replicating three quarters of its partitions, and appears only here. Each series is a synthetic `1` per (connector, task, status), so the sum is a count of tasks. KafkaConnectTaskFailed fires on it after 2 minutes. The zero fallback is anchored \u2014 see 'Failed connectors'.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "(sum(kafka_connect_connector_task_status{status=\"failed\", namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"})) or (sum(kafka_connect_worker_rebalance_metrics_completed_rebalances_total{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}) * 0)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Failed tasks",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Running tasks over declared tasks, group-wide \u2014 the SLI behind the `connect:tasks_running:ratio` recording rule and the task-availability SLO. Both counts are *per worker*: `connector-running-task-count` is what one worker runs, so the sums are over workers and the ratio only means anything while every worker is scraping. That is also its blind spot. A worker that disappears takes its tasks out of the numerator and the denominator at the same instant, so this can read 1.0 for the length of a rebalance while tasks are in fact unassigned. Read it beside 'Workers up'.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(kafka_connect_worker_metrics_connector_running_task_count{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}) / sum(kafka_connect_worker_metrics_connector_total_task_count{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"})",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Tasks running",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Errors the tasks logged, per second over five minutes. `total-errors-logged` is cumulative since the task started, but the exporter's COUNTER rules key off a `-total` *suffix* and this attribute wears its `total` at the front, so the series is published typed GAUGE while only ever going up. `rate()` is still the right function: Prometheus' type metadata does not change what `rate()` computes, and its reset handling is exactly what a task restart needs. Above `alerts.thresholds.errorRatePerSecond` is KafkaConnectErrorsLogged. The zero fallback is anchored \u2014 see 'Failed connectors'.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "id": 6,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "(sum(rate(kafka_connect_task_error_metrics_total_errors_logged{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}[5m]))) or (sum(kafka_connect_worker_rebalance_metrics_completed_rebalances_total{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}) * 0)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Record errors /s",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "id": 7,
          "panels": [],
          "title": "Connectors and tasks",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "One row per connector with the state the workers report: running, paused, stopped, failed, unassigned, restarting or destroyed. `status!=\"\"` is load-bearing. The exporter publishes class, type, version and status as four series of the same name, each carrying a different label, and an absent label matches `\"\"` in PromQL \u2014 without the filter this table would show four rows per connector, three of them with an empty status. `max` rather than `sum` because every worker in the group reports the same connector, and summing would count the workers.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 5
          },
          "id": 8,
          "options": {
            "footer": {
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max by (connector, status) (kafka_connect_connector_metrics{status!=\"\", namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"})",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Connector status",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "One row per task, and the only place a PARTIALLY failed connector is visible: the CR says Ready, the connector says RUNNING, and one of its four tasks has been dead since the last rebalance \u2014 the partitions that task owned simply stopped, silently. A task runs on exactly one worker, so each row sums a single series and reads 1; it is a `sum` rather than a `max` so that a task counted twice mid-reassignment shows as 2 instead of being hidden.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 5
          },
          "id": 9,
          "options": {
            "footer": {
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (connector, task, status) (kafka_connect_connector_task_status{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"})",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Task status",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "What the group coordinator assigned to each worker, from that worker's own view of the last rebalance. This is assignment, not health: it says where tasks were *sent*, while the task-status table says what they are *doing*. A worker sitting at zero after a rebalance while the others carry double is an assignment that did not spread \u2014 usually a connector whose `tasks.max` is below the worker count, or a worker that joined late. The bean is labelled by client id; `by (pod)` uses the scrape's own pod label, which is one per worker.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 5
          },
          "id": 10,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (pod) (kafka_connect_coordinator_metrics_assigned_tasks{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"})",
              "legendFormat": "{{pod}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Tasks per worker",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The fraction of Kafka's own sampling window each task spent running, and the fraction it spent paused. This is what separates 'running' from 'running *now*': the task-status table is a snapshot taken at scrape time, so a task that dies and restarts every twenty seconds reads RUNNING on most scrapes while its running ratio sits near 0.4. Paused is deliberate \u2014 a connector someone paused reads 0 running and 1 paused, and that is not an incident. Both are already normalised to 0\u20131 over Kafka's window; neither is a counter, so neither takes `rate()`.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "max": 1,
              "min": 0,
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "id": 11,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "label_replace(max by (connector, task) (kafka_connect_connector_task_metrics_running_ratio{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}), \"kind\", \"running\", \"\", \"\") or label_replace(max by (connector, task) (kafka_connect_connector_task_metrics_pause_ratio{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}), \"kind\", \"paused\", \"\", \"\")",
              "legendFormat": "{{connector}}/{{task}} {{kind}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Task running and paused ratio",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Topic partitions the sink tasks of each connector currently hold, summed over its tasks. It should equal the partition count of the topics the connector subscribes to. Anything less means a task is holding no assignment, which is how a sink quietly stops consuming part of its input while every task reports RUNNING and the throughput panels merely look lower than yesterday. It drops to zero for the length of every consumer-group rebalance, so read a dip against 'Rebalances /s' before treating it as a fault. Source connectors publish no such series and are simply absent here.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "id": 12,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (connector) (kafka_connect_sink_task_metrics_partition_count{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"})",
              "legendFormat": "{{connector}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Sink partitions assigned",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 21
          },
          "id": 13,
          "panels": [],
          "title": "Throughput",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Records the source tasks pulled out of the upstream system, per second, per connector. `source-record-poll-total` does end in `-total`, so the exporter types it a true COUNTER and `rate()` is unambiguously right. Compare it with the panel to its right: poll is what the connector read, write is what reached Kafka, and a standing gap between them is what the transforms removed. Flat at zero on a RUNNING source for `alerts.thresholds.sourceIdleMinutes` is KafkaConnectSourceIdle, which is opt-in because a source that polls nothing can be entirely normal.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
