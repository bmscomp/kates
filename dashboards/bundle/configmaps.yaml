          "description": "Which constraint is breaking, and how badly the run is judged for it. One line per (constraint, severity) at 1 while violated and 0 once it recovers \u2014 the zero matters, because a series that simply stops publishing leaves a gap that looks identical to a constraint that was never evaluated. `severity` comes from the SLA definition: CRITICAL constraints fail the run, WARNING ones are recorded and do not. Cross-check the offending metric against its panel above before concluding the threshold is wrong; a p99 constraint breaching while the p99 panel looks calm usually means one phase, not the run.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "decimals": 0,
              "max": 1,
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 32
          },
          "id": 17,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (metric, severity) (kates_benchmark_sla_violations{job=\"$job\", run_id=~\"$run_id\"})",
              "legendFormat": "{{metric}} ({{severity}})",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "SLA constraints breaching, by constraint",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": [
        "kates",
        "kafka",
        "benchmark",
        "live"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "text": "default",
              "value": "default"
            },
            "hide": 0,
            "label": "Data source",
            "name": "datasource",
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          },
          {
            "current": {},
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(kates_benchmark_active_runs, job)",
            "hide": 0,
            "includeAll": false,
            "label": "Scrape job",
            "multi": false,
            "name": "job",
            "options": [],
            "query": {
              "query": "label_values(kates_benchmark_active_runs, job)",
              "refId": "job-variable-query"
            },
            "refresh": 2,
            "sort": 1,
            "type": "query"
          },
          {
            "allValue": ".*",
            "current": {},
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(kates_benchmark_records_total{job=\"$job\"}, run_id)",
            "hide": 0,
            "includeAll": true,
            "label": "Run",
            "multi": false,
            "name": "run_id",
            "options": [],
            "query": {
              "query": "label_values(kates_benchmark_records_total{job=\"$job\"}, run_id)",
              "refId": "run_id-variable-query"
            },
            "refresh": 2,
            "sort": 1,
            "type": "query"
          },
          {
            "allValue": ".*",
            "current": {},
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(kates_benchmark_records_total{job=\"$job\"}, test_type)",
            "hide": 0,
            "includeAll": true,
            "label": "Test type",
            "multi": true,
            "name": "test_type",
            "options": [],
            "query": {
              "query": "label_values(kates_benchmark_records_total{job=\"$job\"}, test_type)",
              "refId": "test_type-variable-query"
            },
            "refresh": 2,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Kates \u2014 Benchmark (live)",
      "uid": "kates-benchmark-overview",
      "version": 1
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  # No namespace on purpose — `kubectl apply -n <ns>` picks it, and it
  # has to be a namespace the sidecar searches (see README.md).
  name: kates-dashboard-kates-chaos
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: kates-dashboards
    app.kubernetes.io/part-of: kates
    app.kubernetes.io/managed-by: gen-dashboards.py
  annotations:
    grafana_folder: "Kates"
data:
  kates-chaos.json: |-
    {
      "annotations": {
        "list": []
      },
      "description": "The Litmus experiment timeline with the Kafka cluster and the Kates benchmark run laid over it: what was injected, what the brokers did, and what the workload underneath actually experienced.",
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "ChaosEngine custom resources currently in the `initialized` state \u2014 a fault is being applied right now. This is the panel that decides how to read every other panel on the board: a broker restart with this above zero is the experiment working, and the same restart with this at zero is an incident. The same distinction drives `KafkaBrokerRestartUnexpected` in prometheus-chaos-rules.yaml. Needs kube-state-metrics with custom-resource metrics enabled for ChaosEngine. The zero fallback is anchored to the *unfiltered* ChaosEngine series rather than to this board's ANCHOR, and the distinction is the whole point: kube-state being up proves nothing here, because the failure this panel used to hide was kube-state running without the custom-resource collector configured. Anchoring on a ChaosEngine series of any status is what proves the collector works, so a cluster with engines but none initialized reads 0, and a cluster the collector cannot see reads No data.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "(count(kube_customresource_chaosengine_status_engine_status{namespace=\"$namespace\", status=\"initialized\"} == 1)) or (sum(kube_customresource_chaosengine_status_engine_status{namespace=\"$namespace\"}) * 0)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Chaos engines running",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Cumulative count of chaos experiments whose hypothesis held, from the Litmus chaos-exporter. Cumulative since the exporter started, so the useful reading is the change across a GameDay rather than the absolute number. Passed means Litmus' own probes were satisfied; it says nothing about what the Kates run underneath observed, which is the bottom row of this board.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(litmuschaos_passed_experiments) or vector(0)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Experiments passed",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The same counter for experiments whose hypothesis did not hold. A failure here is not necessarily a cluster problem: Litmus marks an experiment failed when it could not inject the fault at all, which is a chaos-tooling problem and means the resilience claim for that window is unsupported rather than disproved. `ChaosExperimentFailed` alerts on this. The zero fallback is anchored on the passed counter beside it: the chaos-exporter publishes both from startup, so if one is missing the exporter is not being scraped and neither tile should claim a number.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "(sum(litmuschaos_failed_experiments)) or (sum(litmuschaos_passed_experiments) * 0)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Experiments failed",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The mean of Litmus' per-experiment probe success percentage. Probes are the experiment's own assertions \u2014 an HTTP check, a command, a Prometheus query \u2014 so this is Litmus grading itself, and it is averaged across every experiment the exporter knows about, including ones that finished hours ago. Below 50% raises `ChaosProbeSuccessLow`. Treat it as a hint to open the Litmus UI, not as a measurement of the cluster.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 50
                  },
                  {
                    "color": "green",
                    "value": 90
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "avg(litmuschaos_probe_success_percentage) or vector(0)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Probe success rate",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "id": 5,
          "panels": [],
          "title": "Kafka under fault",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The `Ready` condition per pod, 1 or 0, from kube-state-metrics. During a pod-delete experiment this is the fault itself becoming visible, and the width of the trough is how long Kubernetes took to get the broker back \u2014 which is *not* RTO. RTO is how long the clients took to recover, and it is not measured anywhere in this repository; see the collapsed row at the bottom. A pod that never comes back raises `KafkaClusterNotReadyPostChaos`.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "decimals": 0,
              "max": 1,
              "min": 0,
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "id": 6,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (pod) (kube_pod_status_ready{namespace=\"$namespace\", pod=~\"$pod\"})",
              "legendFormat": "{{pod}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Broker pod readiness",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Container restarts in the last five minutes, per pod. Under an active experiment this is expected; outside one it is `KafkaBrokerRestartUnexpected`, which is the alert the whole chaos rule file is built around. `increase()` over a counter that resets when the pod is replaced undercounts across a delete-and-recreate \u2014 the right direction to be wrong in, since it cannot report restarts that did not happen.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "id": 7,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"$namespace\", pod=~\"$pod\"}[5m]))",
              "legendFormat": "{{pod}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Broker restarts",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "CPU seconds per second, per broker pod, from cAdvisor. The shape to look for is *after* the fault clears: a broker that comes back and then sits at a much higher CPU than its peers is replaying log segments or catching up as a follower, and it is not really recovered yet even though its readiness probe passes. `KafkaHighCPUPostChaos` fires on exactly that above 0.8 cores with no experiment running.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "id": 8,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", pod=~\"$pod\", container=\"kafka\"}[5m]))",
              "legendFormat": "{{pod}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Broker CPU cores",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Container memory usage per broker pod, cAdvisor. Included because a memory-hog experiment is one of the faults Litmus injects and because a broker recovering from a delete rebuilds its page cache, which shows up here as a slow climb back to the pre-fault level. A broker whose memory never returns to that level has not finished recovering, whatever readiness says.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "id": 9,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (pod) (container_memory_usage_bytes{namespace=\"$namespace\", pod=~\"$pod\", container=\"kafka\"})",
              "legendFormat": "{{pod}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Broker memory",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 21
          },
          "id": 10,
          "panels": [],
          "title": "Experiment history",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "How long each Litmus experiment ran, by chaos engine and chaos result \u2014 the chaos timeline this board is organised around. Line these steps up with the troughs in `Broker pod readiness` and the dips in the Kates row below: everything on this board is read relative to when the fault was being applied. This is the duration of the *injection*, not of the recovery.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "id": 11,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "litmuschaos_experiment_total_duration",
              "legendFormat": "{{chaosengine_name}} \u2014 {{chaosresult_name}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Experiment duration",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 30
          },
          "id": 12,
          "panels": [],
          "title": "Kates during chaos \u2014 the resilience evidence that works",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "What the Kates run underneath the experiment was actually achieving, records/second, per run. This is the resilience evidence: Litmus grades whether it injected the fault, and this panel grades whether the workload survived it. Throughput that dips and recovers is a cluster that failed over; throughput that goes to zero and stays there is one that did not. Empty means no benchmark was running during the window \u2014 a chaos experiment with no load under it proves nothing.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 31
          },
          "id": 13,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "kates_benchmark_throughput_rec_sec{job=\"$kates_job\"}",
              "legendFormat": "{{run_id}} ({{test_type}})",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Benchmark throughput during chaos",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The run's p99, selected from the pre-computed percentile gauges the engine publishes \u2014 a `quantile` label to select, never `histogram_quantile()`. The interesting number is how high the spike goes and how long it lasts, because that is what a client of the real system would have experienced. A latency spike with no throughput dip is a failover the producers rode out; both together is an outage.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
