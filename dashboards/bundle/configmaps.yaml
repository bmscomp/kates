apiVersion: v1
kind: ConfigMap
metadata:
  # No namespace on purpose — `kubectl apply -n <ns>` picks it, and it
  # has to be a namespace the sidecar searches (see README.md).
  name: kates-dashboard-kates-chaos-infra
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: kates-dashboards
    app.kubernetes.io/part-of: kates
    app.kubernetes.io/managed-by: gen-dashboards.py
  annotations:
    grafana_folder: "Kates"
data:
  kates-chaos-infra.json: |-
    {
      "annotations": {
        "list": []
      },
      "description": "Is the LitmusChaos execution plane installed, running and doing anything \u2014 the operator and exporter this chart deploys, and the experiment verdicts they report. What a fault did to Kafka and to the workload is the separate \"Kates \u2014 Chaos\" board.",
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "ChaosResults whose verdict is currently Pass, counted from `litmuschaos_experiment_verdict{chaosresult_verdict=\"Pass\"}`. The old board selected `verdict=\"Pass\"`; the label the chaos-exporter emits is `chaosresult_verdict`, so that panel matched every verdict rather than the passing ones. The `== 1` matters: the exporter sets the series to 0 for an Awaited verdict, and back to 0 once a verdict has been repeated for longer than its `TSDB_SCRAPE_INTERVAL`, so a count of the series and a count of the ones reading 1 are different numbers. Passed means Litmus' own probes were satisfied; what the Kafka cluster and the workload did is the `Kates \u2014 Chaos` board.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "count(litmuschaos_experiment_verdict{chaosresult_verdict=\"Pass\"} == 1) or vector(0)",
              "legendFormat": "Pass",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Chaos experiments \u2014 Pass",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The same count for a Fail verdict. A failure here is not necessarily a cluster problem: Litmus marks an experiment failed when it could not inject the fault at all, which makes the resilience claim for that window unsupported rather than disproved. The zero fallback is deliberate \u2014 with no failing ChaosResult the series does not exist, and *No data* on a red tile reads as a broken board rather than a clean run. It is anchored on the *unfiltered* verdict series, so the zero can only be drawn once there is at least one ChaosResult to read. A cluster where chaos has run and nothing failed reads 0; a cluster whose exporter nobody is scraping reads No data, which is the truth. A clean run and an unwatched one must not look alike on a tile whose whole job is to go red.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "(count(litmuschaos_experiment_verdict{chaosresult_verdict=\"Fail\"} == 1)) or (sum(litmuschaos_experiment_verdict) * 0)",
              "legendFormat": "Fail",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Chaos experiments \u2014 Fail",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Replicas of the Litmus chaos operator Deployment that are available, from kube-state-metrics rather than from Litmus \u2014 an operator that is down cannot report that it is down. Red at zero means no ChaosEngine will be acted on, whatever the CRs in the cluster say. The old board asked for pods matching `.*chaos-operator.*`; `chaos-operator` is the operator's *container* name, while the Deployment is named by litmus-core's `fullnameOverride` (`litmus`), so that panel could never match a pod and was a permanent, reassuring zero.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max(kube_deployment_status_replicas_available{namespace=\"$namespace\", deployment=\"$operator_deployment\"}) or vector(0)",
              "legendFormat": "Available",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Chaos operator",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "id": 4,
          "panels": [],
          "title": "Experiment history",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "How long each Litmus experiment ran, by chaos engine and chaos result. This is the duration of the *injection*, not of the recovery, and it is the timeline the `Kates \u2014 Chaos` board is read against. The panel this replaces was titled *Chaos Engine Duration (seconds)* and read `litmuschaos_engine_experiment_count`, which is neither a duration nor a series the chaos-exporter publishes under any name \u2014 the title was right and the expression was a guess. The exporter spells the real one `_total_duration`, with no unit suffix, even though the value is seconds.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "id": 5,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "litmuschaos_experiment_total_duration",
              "legendFormat": "{{chaosengine_name}} \u2014 {{chaosresult_name}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Experiment duration",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The three cluster-wide aggregates the exporter publishes, as cumulative lines: every run it has seen, and how those runs were graded. A step in `runs` with no step in either of the others is an experiment still awaited. The panel this replaces plotted `increase(litmuschaos_experiment_verdict[1h])` \u2014 `increase()` over a gauge that flips between 0 and 1 as verdicts are set and aged out, which produces a number with no meaning. These three are monotonic and are the exporter's own answer to *how much chaos has this cluster actually run*. The `cluster_scoped` family is the right one here because litmus-core deploys the exporter with an empty `WATCH_NAMESPACE`, which makes it aggregate over every namespace; the `namespace_scoped` family stays empty on this install. Cumulative since the exporter started, so read the change across a GameDay, not the absolute number.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "id": 6,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "litmuschaos_cluster_scoped_experiments_run_count",
              "legendFormat": "Runs",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "litmuschaos_cluster_scoped_passed_experiments",
              "legendFormat": "Passed",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "litmuschaos_cluster_scoped_failed_experiments",
              "legendFormat": "Failed",
              "range": true,
              "refId": "C"
            }
          ],
          "title": "Runs, passes and failures \u2014 cluster totals",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "id": 7,
          "panels": [],
          "title": "The execution plane",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Every Running pod in the namespace the execution plane is installed in \u2014 the Litmus operator and, when `litmus-core.exporter.enabled` is set, the chaos-exporter that publishes every `litmuschaos_*` series on this board. `$namespace` is `monitoring.grafanaDashboard.namespace`, which defaults to the release namespace; it is not the Kafka namespace the experiments target. An empty table means either nothing here is Running or kube-state-metrics is not installed, and those are very different problems.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 15
          },
          "id": 8,
          "options": {
            "footer": {
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "kube_pod_status_phase{namespace=\"$namespace\", phase=\"Running\"} == 1",
              "format": "table",
              "instant": true,
              "legendFormat": "{{pod}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Chaos infra pods \u2014 status",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true,
                  "container": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "namespace": true,
                  "service": true,
                  "uid": true
                }
              }
            }
          ],
          "type": "table"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "chaos",
        "litmus",
        "kates"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "text": "default",
              "value": "default"
            },
            "hide": 0,
            "label": "Data source",
            "name": "datasource",
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          },
          {
            "current": {
              "text": "litmus",
              "value": "litmus"
            },
            "hide": 2,
            "label": "Chaos infra namespace",
            "name": "namespace",
            "query": "litmus",
            "type": "constant"
          },
          {
            "current": {
              "text": "litmus",
              "value": "litmus"
            },
            "hide": 2,
            "label": "Chaos operator Deployment",
            "name": "operator_deployment",
            "query": "litmus",
            "type": "constant"
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Kates \u2014 Chaos infrastructure",
      "uid": "kates-chaos-overview",
      "version": 1
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  # No namespace on purpose — `kubectl apply -n <ns>` picks it, and it
  # has to be a namespace the sidecar searches (see README.md).
  name: kates-dashboard-kates-overview
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: kates-dashboards
    app.kubernetes.io/part-of: kates
    app.kubernetes.io/managed-by: gen-dashboards.py
  annotations:
    grafana_folder: "Kates"
data:
  kates-overview.json: |-
    {
      "annotations": {
        "list": []
      },
      "description": "What one Kates release knows about itself: uptime, active runs, the API's traffic and latency, the JVM, and the Agroal connection pool. Reads only series the application publishes, so it works with nothing installed beside it but a Grafana.",
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "How long this release's JVM has been up, from Micrometer's uptime binder (`quarkus.micrometer.binder.system=true`). Resetting repeatedly is a restart loop; this is the first thing to check when the API is intermittently unreachable and the Deployment looks healthy.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max(process_uptime_seconds{job=\"$job\"})",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Uptime",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Benchmark runs the engine currently holds. Bounded by `kates.engine.max-concurrent-tests`, so sitting at that ceiling means further submissions are being rejected with a concurrency error rather than queued. The board this replaces read `kates_active_runs`, which has never been registered; the meter is `kates.benchmark.active.runs`.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 5
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(kates_benchmark_active_runs{job=\"$job\"}) or vector(0)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Active test runs",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Every benchmark run this process has taken to a terminal state since startup, whatever the outcome. A counter that never resets, so the number itself only means something relative to the uptime beside it. The pass/fail split and the per-run detail are on Kates \u2014 Trend & Regression. The zero fallback is anchored to the process' uptime: a release that has completed nothing yet reads 0, and one nobody is scraping reads No data.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "(sum(kates_tests_completed_total{job=\"$job\"})) or (sum(process_uptime_seconds{job=\"$job\"}) * 0)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Tests completed",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Requests per second across every endpoint. `http_server_requests_seconds_count` is the count half of Micrometer's HTTP timer \u2014 `_seconds` is the timer's base unit and not this series' unit, which is requests. Near zero with runs active is normal: the engine polls the backends itself and nothing has to call the API for a run to proceed. That is why the zero fallback is anchored rather than bare \u2014 on this panel a true zero and a dead scrape look identical, and only the anchor tells them apart.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "(sum(rate(http_server_requests_seconds_count{job=\"$job\"}[5m]))) or (sum(process_uptime_seconds{job=\"$job\"}) * 0)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Request rate",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "id": 5,
          "panels": [],
          "title": "API",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Traffic split by method and matched URI template. Quarkus reports the *template* (`/api/runs/{id}`), not the resolved path, so the cardinality stays bounded no matter how many run ids exist \u2014 an endpoint appearing here with a literal id in it means something is serving a path the framework did not match, and that is worth fixing before it becomes a cardinality problem.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "id": 6,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (method, uri) (rate(http_server_requests_seconds_count{job=\"$job\"}[5m]))",
              "legendFormat": "{{method}} {{uri}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Request rate by endpoint",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "p50, p95 and p99 of server-side request duration in milliseconds, computed from the timer's histogram buckets. This is a real cumulative histogram with an `le` label, so `histogram_quantile()` is correct here \u2014 unlike the benchmark engine's latency series, which are pre-computed percentile gauges and must be selected by their `quantile` label instead. Summing by `le` before taking the quantile gives a percentile across the pods rather than a mean of per-pod percentiles.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "id": 7,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_requests_seconds_bucket{job=\"$job\"}[5m]))) * 1000",
              "legendFormat": "p50",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job=\"$job\"}[5m]))) * 1000",
              "legendFormat": "p95",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{job=\"$job\"}[5m]))) * 1000",
              "legendFormat": "p99",
              "range": true,
              "refId": "C"
            }
          ],
          "title": "Request latency percentiles",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "5xx responses per second, by status. Every one of these has a stack trace in the application log. Kept apart from 4xx deliberately: a rejected test spec is a client error and is not this process failing, and mixing the two is how a board teaches people to ignore its error panel.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "id": 8,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (status) (rate(http_server_requests_seconds_count{job=\"$job\", status=~\"5..\"}[5m]))",
              "legendFormat": "{{status}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Server errors",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Records per second reported by whatever runs are in flight, per run and test type. Empty between runs by design \u2014 these meters are tagged with `run_id` and unregistered when the run ends, because an unbounded label that is never cleaned up grows Prometheus without limit. The live detail is on Kates \u2014 Benchmark; this panel is here so one board can answer \"is it doing anything at all\".",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "id": 9,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "kates_benchmark_throughput_rec_sec{job=\"$job\"}",
              "legendFormat": "{{run_id}} ({{test_type}})",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Benchmark throughput",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 21
          },
          "id": 10,
          "panels": [],
          "title": "JVM",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Heap used and committed, and total non-heap \u2014 metaspace, code cache, compressed class space. Non-heap is here because the board this replaces plotted `process_resident_memory_bytes` beside the heap to catch memory the heap cannot see, and that series does not exist in a Quarkus Micrometer registry: it comes from the Prometheus Java client's default exports, which Quarkus never initialises. Non-heap is the part of that gap this application actually publishes; the rest (thread stacks, direct buffers, the Kafka clients' own allocations) needs cAdvisor and is on Kates \u2014 Application Health.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 22
          },
          "id": 11,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(jvm_memory_used_bytes{job=\"$job\", area=\"heap\"})",
              "legendFormat": "heap used",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(jvm_memory_committed_bytes{job=\"$job\", area=\"heap\"})",
              "legendFormat": "heap committed",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(jvm_memory_used_bytes{job=\"$job\", area=\"nonheap\"})",
              "legendFormat": "non-heap used",
              "range": true,
              "refId": "C"
            }
          ],
          "title": "JVM memory",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The process' share of the available CPU and the machine's overall share, both as Micrometer's system binder reports them: ratios in [0,1], not cores and not seconds. The board this replaces read `process_cpu_seconds_total`, a Prometheus simpleclient default export that Quarkus does not register. Process CPU near 1 means this JVM is saturating what it was given; system CPU near 1 with process CPU low means it is competing with something else on the node.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "max": 1,
              "min": 0,
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 22
          },
          "id": 12,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max(process_cpu_usage{job=\"$job\"})",
              "legendFormat": "process",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max(system_cpu_usage{job=\"$job\"})",
              "legendFormat": "system",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "CPU",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 30
          },
          "id": 13,
          "panels": [],
          "title": "Database \u2014 the Agroal pool",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The Agroal pool: connections checked out, idle in the pool, the high-water mark, and threads blocked waiting for one. Quarkus registers these as `agroal.active.count` and friends \u2014 there is no `pool` segment in any of them, which is what the `agroal_pool_*` names on the board this replaces were reading for. `awaiting` above zero is the signal: everything else can look busy without anything being wrong.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 31
          },
          "id": 14,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(agroal_active_count{job=\"$job\"})",
              "legendFormat": "active",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(agroal_available_count{job=\"$job\"})",
              "legendFormat": "available",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(agroal_max_used_count{job=\"$job\"})",
              "legendFormat": "max used",
              "range": true,
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(agroal_awaiting_count{job=\"$job\"})",
              "legendFormat": "awaiting",
              "range": true,
              "refId": "D"
            }
          ],
          "title": "Connection pool",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Average and worst time a request spent blocked on the pool, in milliseconds. Quarkus registers these gauges with a `milliseconds` base unit, which Micrometer appends to the name \u2014 hence the suffix, and hence the fact that `agroal_blocking_time_total_seconds` (read by the monitoring chart's own board until this refactor) matches nothing. Rising here with `active` pinned at the ceiling is pool contention; rising with spare capacity is a slow database.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 31
          },
          "id": 15,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max(agroal_blocking_time_average_milliseconds{job=\"$job\"})",
              "legendFormat": "average",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max(agroal_blocking_time_max_milliseconds{job=\"$job\"})",
              "legendFormat": "worst",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Time waiting for a connection",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "kates",
        "kafka",
        "benchmarking",
        "chaos"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "text": "default",
              "value": "default"
            },
            "hide": 0,
            "label": "Data source",
            "name": "datasource",
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          },
          {
            "current": {},
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(process_uptime_seconds, job)",
            "hide": 0,
            "includeAll": false,
            "label": "Release",
            "multi": false,
            "name": "job",
            "options": [],
            "query": {
              "query": "label_values(process_uptime_seconds, job)",
              "refId": "job-variable-query"
            },
            "refresh": 2,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "KATES \u2014 Overview",
      "uid": "kates-overview",
      "version": 1
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  # No namespace on purpose — `kubectl apply -n <ns>` picks it, and it
  # has to be a namespace the sidecar searches (see README.md).
  name: kates-dashboard-kates-trend
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: kates-dashboards
    app.kubernetes.io/part-of: kates
    app.kubernetes.io/managed-by: gen-dashboards.py
  annotations:
    grafana_folder: "Kates"
data:
  kates-trend.json: |-
    {
      "annotations": {
        "list": []
      },
      "description": "Benchmark results across runs: peak throughput and tail latency per run, the volume each run actually moved, and the platform counters that outlive any single run.",
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "Throughput trend",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The highest records/second each run reached, one line per run. `kates_benchmark_throughput_rec_sec` is a gauge the engine rewrites on every poll of every phase, so `max by (run_id, test_type)` collapses the phases of one run into that run's best moment. Runs of the same test type should land at comparable heights; one that lands visibly lower than the runs beside it is the regression this board exists to catch. Each line stops when the run does, because the meter is unregistered with the run.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "id": 2,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max by (run_id, test_type) (kates_benchmark_throughput_rec_sec{job=\"$job\", test_type=~\"$test_type\"})",
              "legendFormat": "{{run_id}} ({{test_type}})",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Peak throughput per run \u2014 records/s",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The same runs measured in bytes rather than records. Read it beside the panel to its left: the two move together while the record size is constant, and they diverge when it is not. A run whose records/s fell but whose MB/s held is not slower, it moved bigger records \u2014 which is a configuration difference, not a regression, and is the most common false alarm this board produces.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "MBs"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "id": 3,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max by (run_id, test_type) (kates_benchmark_throughput_mb_sec{job=\"$job\", test_type=~\"$test_type\"})",
              "legendFormat": "{{run_id}} ({{test_type}})",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Peak throughput per run \u2014 MB/s",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "id": 4,
          "panels": [],
          "title": "Latency trend",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The worst p99 each run recorded. These are pre-computed percentile gauges carrying a `quantile` label \u2014 the backend measures the percentiles and the engine publishes them \u2014 so the quantile is *selected*, never computed with `histogram_quantile()` and never averaged across runs. `max by (run_id)` takes the worst phase of each run, which is the number a regression shows up in first: throughput holds while the tail stretches.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 10
          },
          "id": 5,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max by (run_id) (kates_benchmark_latency_ms{job=\"$job\", test_type=~\"$test_type\", quantile=\"0.99\"})",
              "legendFormat": "p99 {{run_id}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "p99 latency per run",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The same for the thousandth percentile \u2014 the one in a thousand requests that went worst. p99.9 is where a GC pause, a broker failover or a single slow partition shows up while p99 still looks fine, so a run whose p99 matches its neighbours and whose p99.9 does not has a tail problem rather than a throughput problem. A backend that does not measure this quantile contributes nothing rather than a zero, so an empty panel here with a populated one to the left means the backend, not the cluster.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 10
          },
          "id": 6,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max by (run_id) (kates_benchmark_latency_ms{job=\"$job\", test_type=~\"$test_type\", quantile=\"0.999\"})",
              "legendFormat": "p99.9 {{run_id}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "p99.9 latency per run",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 18
          },
          "id": 7,
          "panels": [],
          "title": "Volume \u2014 read this before believing the two rows above",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The total each run carried, summed over its phases. `kates_benchmark_records_total` is a counter, so the line climbs through the run and stops at the run's total \u2014 the height of the step is the answer. Two runs of the same test type that end at different heights did not do the same work, and comparing their throughput or latency is comparing two different tests. Check this panel before believing either of the two above it.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 19
          },
          "id": 8,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (run_id, test_type) (kates_benchmark_records_total{job=\"$job\", test_type=~\"$test_type\"})",
              "legendFormat": "{{run_id}} ({{test_type}})",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Records moved per run",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 27
          },
          "id": 9,
          "panels": [],
          "title": "Platform totals \u2014 KatesMetrics, not run-scoped",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "KatesMetrics' own counter, incremented once per run as it reaches a terminal state and tagged with the outcome. Unlike everything above, this series persists after the run \u2014 it is not tagged with a run id, so there is nothing unbounded to clean up. A `failed` line that is consistently non-zero is a broken scenario or a broken cluster, and the run ids behind it are on `kates-benchmark` within its retention window.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 28
          },
          "id": 10,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (test_type, outcome) (rate(kates_tests_completed_total{job=\"$job\", test_type=~\"$test_type\"}[5m]))",
              "legendFormat": "{{test_type}} \u2014 {{outcome}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Tests completed per second, by outcome",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "How long a run takes, end to end, from Micrometer's `Timer` \u2014 so these quantiles are Micrometer's own, computed over the durations of completed runs rather than supplied by a backend. The `_seconds` is the timer's base unit. Duration climbing while throughput holds means the runs are simply being asked for more records; duration climbing while `Records moved per run` holds is the regression.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 28
          },
          "id": 11,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "kates_tests_duration_seconds{job=\"$job\", test_type=~\"$test_type\", quantile=\"0.5\"}",
              "legendFormat": "p50 {{test_type}}",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "kates_tests_duration_seconds{job=\"$job\", test_type=~\"$test_type\", quantile=\"0.95\"}",
              "legendFormat": "p95 {{test_type}}",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "kates_tests_duration_seconds{job=\"$job\", test_type=~\"$test_type\", quantile=\"0.99\"}",
              "legendFormat": "p99 {{test_type}}",
              "range": true,
              "refId": "C"
            }
          ],
          "title": "Test duration percentiles",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "One increment per SLA evaluation at report time, tagged pass or fail. This is the *verdict* \u2014 the aggregated judgement the report layer reaches once a run is over \u2014 and it is a different question from `kates_benchmark_sla_violations` on `kates-benchmark`, which says which individual constraint is being breached right now. A run can breach a warning constraint mid-flight and still pass overall. A rising `fail` line with flat throughput and latency usually means the SLA definition changed, not the system.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 28
          },
          "id": 12,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (test_type, result) (rate(kates_sla_evaluations_total{job=\"$job\", test_type=~\"$test_type\"}[5m]))",
              "legendFormat": "{{test_type}} \u2014 {{result}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "SLA evaluations per second, by result",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The platform-wide records counter, rated. This is the aggregate the installation has moved, not any one run's: it keeps climbing across runs and is never reset, which makes it the series to answer \"how much has this cluster actually been made to do this week\". Flat over a period the panels above show runs in means the runs produced nothing \u2014 every task failed at startup.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 36
          },
          "id": 13,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (test_type) (rate(kates_records_processed_total{job=\"$job\", test_type=~\"$test_type\"}[5m]))",
              "legendFormat": "{{test_type}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Records processed per second, all runs",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 44
          },
          "id": 14,
          "panels": [],
          "title": "Disruptions \u2014 the engine's own injections",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Chaos injections the engine itself ran \u2014 broker kills, network faults, the disruption types under `kates/\u2026/disruption`. Not filtered by `$test_type`: a disruption is tagged with its own type, not with the test type it ran under. An outcome other than success means the disruption did not take, so any resilience conclusion drawn from that run is unsupported. Litmus-driven experiments are a different mechanism and appear on `kates-chaos`, not here.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 45
          },
          "id": 15,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (disruption_type, outcome) (rate(kates_disruptions_completed_total{job=\"$job\"}[5m]))",
              "legendFormat": "{{disruption_type}} \u2014 {{outcome}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Disruptions completed per second, by outcome",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "How long each injection took, p50 and p95, from a Micrometer timer. This is the duration of the *injection*, not the recovery: it says how long the fault was being applied, not how long the cluster took to come back, which is RTO and which nothing in this repository currently exports \u2014 see `dashboards/kates-chaos/README.md`. A duration far longer than the disruption was configured for is an injection that hung, and the run under it was not testing what it claimed to.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 45
          },
          "id": 16,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "kates_disruptions_duration_seconds{job=\"$job\", quantile=\"0.5\"}",
              "legendFormat": "p50 {{disruption_type}}",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "kates_disruptions_duration_seconds{job=\"$job\", quantile=\"0.95\"}",
              "legendFormat": "p95 {{disruption_type}}",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Disruption duration percentiles",
          "type": "timeseries"
        }
      ],
      "refresh": "1m",
      "schemaVersion": 39,
      "tags": [
        "kates",
        "kafka",
        "benchmark",
        "trend"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "text": "default",
              "value": "default"
            },
            "hide": 0,
            "label": "Data source",
            "name": "datasource",
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          },
          {
            "current": {},
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(kates_tests_completed_total, job)",
            "hide": 0,
            "includeAll": false,
            "label": "Scrape job",
            "multi": false,
            "name": "job",
            "options": [],
            "query": {
              "query": "label_values(kates_tests_completed_total, job)",
              "refId": "job-variable-query"
            },
            "refresh": 2,
            "sort": 1,
            "type": "query"
          },
          {
            "allValue": ".*",
            "current": {},
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(kates_tests_completed_total{job=\"$job\"}, test_type)",
            "hide": 0,
            "includeAll": true,
            "label": "Test type",
            "multi": true,
            "name": "test_type",
            "options": [],
            "query": {
              "query": "label_values(kates_tests_completed_total{job=\"$job\"}, test_type)",
              "refId": "test_type-variable-query"
            },
            "refresh": 2,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Kates \u2014 Trend & Regression",
      "uid": "kates-trend-analysis",
      "version": 1
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  # No namespace on purpose — `kubectl apply -n <ns>` picks it, and it
  # has to be a namespace the sidecar searches (see README.md).
  name: kates-dashboard-kyverno-security
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: kates-dashboards
    app.kubernetes.io/part-of: kates
    app.kubernetes.io/managed-by: gen-dashboards.py
  annotations:
    grafana_folder: "Kates"
data:
  kyverno-security.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Every admission review Kyverno answered in the last hour, whatever the verdict. This is the load the webhook is carrying: it rises with deployments, not with violations.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#73BF69",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(increase(kyverno_admission_requests_total[1h]))",
              "legendFormat": "Total",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Admission Requests \u2014 Total",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "CREATE requests admitted in the last hour. Compared with the total beside it, this is how much of the traffic is new objects rather than updates \u2014 useful for reading the blocked count next to it.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#73BF69",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(increase(kyverno_admission_requests_total{resource_request_operation=\"CREATE\",request_allowed=\"true\"}[1h]))",
              "legendFormat": "Allowed",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Admission \u2014 Allowed",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Requests an Enforce policy refused. The zero fallback is deliberate: with every policy in Audit mode nothing is ever blocked, the series does not exist, and without it this panel would read No data \u2014 which looks like a broken board rather than a quiet one. It is anchored to the unfiltered request counter the two tiles to the left read, so the zero can only be drawn while Kyverno is answering and being scraped. A webhook nobody is scraping reads No data, not 'nothing was blocked'.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#73BF69",
                    "value": null
                  },
                  {
                    "color": "#FF6347",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "(sum(increase(kyverno_admission_requests_total{request_allowed=\"false\"}[1h]))) or (sum(kyverno_admission_requests_total) * 0)",
              "legendFormat": "Blocked",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Admission \u2014 Blocked",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Every rule evaluation, by verdict. In Audit mode a fail is a recorded violation rather than a refused request, so this slice grows while the blocked count beside it stays at zero \u2014 that gap is exactly what to expect before switching a policy to Enforce.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Pass"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "#73BF69",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Fail"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "#FF6347",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Warn"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "#FADE2A",
                      "mode": "fixed"
                    }
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "id": 4,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "right",
              "showLegend": true
            },
            "pieType": "donut",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(kyverno_policy_results_total{rule_result=\"pass\"})",
              "legendFormat": "Pass",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(kyverno_policy_results_total{rule_result=\"fail\"})",
              "legendFormat": "Fail",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(kyverno_policy_results_total{rule_result=\"warn\"})",
              "legendFormat": "Warn",
              "range": true,
              "refId": "C"
            }
          ],
          "title": "Policy Results \u2014 Pass vs Fail",
          "type": "piechart"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The tail the API server waits on. Every mutating and validating request to the cluster pays this, so amber at 0.5s is not cosmetic: a slow policy engine reads to everyone else as a slow cluster, and past the webhook timeout it reads as a failed deploy.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#73BF69",
                    "value": null
                  },
                  {
                    "color": "#FADE2A",
                    "value": 0.5
                  },
                  {
                    "color": "#FF6347",
                    "value": 1
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.99, sum(rate(kyverno_admission_review_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p99",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Admission Webhook Latency (p99)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Failures per policy, as a trend. A step up is a new workload meeting an old policy; a step down with no policy change is usually the workload that was failing being deleted rather than fixed. Grouped on `policy_name`: the board this replaces grouped on `policy`, which Kyverno does not emit, so every policy landed in one unlabelled series.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "id": 6,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (policy_name) (increase(kyverno_policy_results_total{rule_result=\"fail\"}[5m]))",
              "legendFormat": "{{ policy_name }}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Policy Violations Over Time",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Which rule, rather than which policy \u2014 the level at which a violation is actually fixed. The longest bar is the one worth reading first: it is either the rule the cluster genuinely violates most, or the rule that is wrong. Grouped on `rule_name`: the board this replaces grouped on `rule`, which Kyverno does not emit, so the ranking was a single bar.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "fillOpacity": 80
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "id": 7,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "orientation": "horizontal",
            "showValue": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (rule_name) (kyverno_policy_results_total{rule_result=\"fail\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "{{ rule_name }}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Violations by Rule",
          "type": "barchart"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "p50, p90 and p99 together. The shape matters more than any one line: p50 flat with p99 climbing is a few expensive policies or a few large objects, while all three rising together is the engine itself \u2014 CPU, or a policy that now matches everything.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "id": 8,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.50, sum(rate(kyverno_admission_review_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p50",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.90, sum(rate(kyverno_admission_review_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p90",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.99, sum(rate(kyverno_admission_review_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p99",
              "range": true,
              "refId": "C"
            }
          ],
          "title": "Admission Review Duration (histogram)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The Kyverno controllers themselves, from kube-state-metrics rather than from Kyverno \u2014 a webhook that is down cannot report that it is down. `namespace=\"kyverno\"` is Kyverno's own namespace, not this release's and not the one this ConfigMap is delivered to. An empty table means either no controller is Running or kube-state-metrics is not installed, and those are very different problems.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "id": 9,
          "options": {
            "footer": {
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "kube_pod_status_phase{namespace=\"kyverno\", phase=\"Running\"} == 1",
              "format": "table",
              "instant": true,
              "legendFormat": "{{ pod }}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Controller Pods \u2014 Status",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true,
                  "container": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "namespace": true,
                  "service": true,
                  "uid": true
                }
              }
            }
          ],
          "type": "table"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "kyverno",
        "security",
        "policy",
        "kates"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "text": "default",
              "value": "default"
            },
            "hide": 0,
            "label": "Data source",
            "name": "datasource",
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Kyverno Security Policies",
      "uid": "kyverno-security-overview",
      "version": 1
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  # No namespace on purpose — `kubectl apply -n <ns>` picks it, and it
  # has to be a namespace the sidecar searches (see README.md).
  name: kates-dashboard-mirror-maker2
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: kates-dashboards
    app.kubernetes.io/part-of: kates
    app.kubernetes.io/managed-by: gen-dashboards.py
  annotations:
    grafana_folder: "Kates"
data:
  mirror-maker2.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "links": [
        {
          "icon": "doc",
          "targetBlank": true,
          "title": "MirrorMaker 2 runbook",
          "type": "link",
          "url": "https://github.com/bmscomp/kates/blob/main/docs/mirror-maker2-runbook.md"
        }
      ],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "Is it up, is it lagging, is it erroring",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Pods whose metrics endpoint answered the last scrape. Counted from a series every worker always has, rather than from `up`, because `up` carries the job label the PodMonitor happens to generate and this does not.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "count(kafka_connect_worker_metrics_task_count{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"})",
              "legendFormat": "workers",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Workers reporting",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Running tasks over total, across every connector of this release. Anything below 1 for longer than a rebalance is a task that died \u2014 the table below says which connector.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(kafka_connect_worker_metrics_connector_running_task_count{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}) / sum(kafka_connect_worker_metrics_connector_total_task_count{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"})",
              "legendFormat": "running",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Tasks running",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The one number that says the mirror is alive. Zero here with the connectors RUNNING is the signature of a missing source-side ACL: the connector cannot read, and says so nowhere the CR can see.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.001
                  }
                ]
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(rate(kafka_connect_source_task_metrics_source_record_write_total{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}[5m]))",
              "legendFormat": "records/s",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Records replicated /s",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "End-to-end latency, source append to target write. This is the number a cutover decision rests on: records written to the source within this window are not yet on the target.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 10000
                  },
                  {
                    "color": "red",
                    "value": 60000
                  }
                ]
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max(kafka_connect_mirror_source_connector_replication_latency_ms_max{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"})",
              "legendFormat": "lag",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Replication lag (max)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "How old the newest translated consumer position is. The other clock: data can be current while the positions consumers would resume from are hours behind, and a failover then replays everything since.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 60000
                  },
                  {
                    "color": "red",
                    "value": 300000
                  }
                ]
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "id": 6,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max(kafka_connect_mirror_checkpoint_connector_checkpoint_latency_ms_max{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"})",
              "legendFormat": "translation age",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Offset translation age (max)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Errors logged by the tasks of every connector in this release. Red is the MirrorMaker2HighErrorRate threshold. A mirror can absorb an error on every record and keep reporting RUNNING.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "id": 7,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(rate(kafka_connect_task_error_metrics_total_errors_logged{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"}[5m]))",
              "legendFormat": "errors/s",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Errors /s",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "id": 8,
          "panels": [],
          "title": "Connector task states",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The panel that makes a PARTIALLY failed connector visible. A MirrorSourceConnector with 3 tasks, 2 running and 1 failed, reports RUNNING on the CR and keeps replicating most partitions \u2014 the ones the dead task owned simply stop, silently. One row per connector, and the connector name carries the source alias, so a fan-in release shows which leg lost a task.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Failed"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "red",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Unassigned"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "yellow",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 7
          },
          "id": 9,
          "options": {
            "footer": {
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (connector) (kafka_connect_worker_metrics_connector_running_task_count{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "running",
              "range": false,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
