---
apiVersion: v1
kind: ConfigMap
metadata:
  # No namespace on purpose — `kubectl apply -n <ns>` picks it, and it
  # has to be a namespace the sidecar searches (see README.md).
  name: kates-dashboard-kafka-performance
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: kates-dashboards
    app.kubernetes.io/part-of: kates
    app.kubernetes.io/managed-by: gen-dashboards.py
  annotations:
    grafana_folder: "Kates"
data:
  kafka-performance.json: |-
    {
      "annotations": {
        "list": []
      },
      "description": "What a Kafka cluster does under load: throughput per broker and per zone, where the replication path is straining, how saturated the brokers are, and a per-topic, per-partition view of the test topic while a run is in flight.",
      "editable": true,
      "graphTooltip": 1,
      "links": [
        {
          "asDropdown": true,
          "tags": [
            "kraft"
          ],
          "title": "KRaft operations",
          "type": "dashboards"
        },
        {
          "asDropdown": true,
          "tags": [
            "Strimzi"
          ],
          "title": "Broker health (Strimzi operator's boards)",
          "type": "dashboards"
        },
        {
          "icon": "doc",
          "targetBlank": true,
          "title": "Test types and what they measure",
          "type": "link",
          "url": "https://github.com/bmscomp/kates/blob/main/docs/book/05-test-types.md"
        }
      ],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Brokers publishing metrics right now, counted from a series every broker always has. During a load test this is the first thing to check when throughput drops: a broker that went away takes its share of the leadership with it, and the throughput panels show the remainder without saying why. Controller-only nodes are not counted \u2014 they lead no partitions and publish no ReplicaManager gauge. Red at zero, and deliberately so: on a panel counting things that must exist, zero is the outage and not the resting state. The bare `or vector(0)` is what draws that zero when every broker has stopped answering \u2014 the one place on this board where an absent series really does mean none.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "count(kafka_server_replicamanager_leadercount{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\"}) or vector(0)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Brokers",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Cluster-wide ingest, averaged over five minutes. **`topic=\"\"` is load-bearing**: `BrokerTopicMetrics` is registered once per topic AND once with no topic tag for the broker aggregate, and an absent label matches `\"\"` in PromQL \u2014 so summing the series without that matcher counts every byte twice and reports double the throughput the test actually achieved. The corrected series is `\u2026_bytesin_total`; the board this replaces read `\u2026_bytesinpersec`, which no exporter rule has ever produced, so this panel was empty on every cluster it ever ran on.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "Bps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(rate(kafka_server_brokertopicmetrics_bytesin_total{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\", topic=\"\"}[5m]))",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Bytes in /s",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Cluster-wide egress to clients over five minutes, on the same `topic=\"\"` aggregate. Replication traffic is NOT in it \u2014 that is `ReplicationBytesOutPerSec` and has its own panel in the Replication section \u2014 so on a three-replica topic the total bytes leaving the brokers is roughly this plus twice the ingest. Worth remembering when sizing a network.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "Bps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(rate(kafka_server_brokertopicmetrics_bytesout_total{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\", topic=\"\"}[5m]))",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Bytes out /s",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Records accepted per second cluster-wide. Read it against 'Bytes in /s': the ratio is the average record size on the wire, after batching and compression, and it is the number that explains why two runs at the same byte rate cost the brokers different amounts. A producer that raised its batch size moves bytes without moving messages; one that changed its payload moves messages without moving bytes.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(rate(kafka_server_brokertopicmetrics_messagesin_total{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\", topic=\"\"}[5m]))",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Messages in /s",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Partitions with a follower out of sync, cluster-wide. Under load this is the number that says whether the test result is trustworthy: a cluster that is shedding followers is not sustaining the throughput it appears to be sustaining, it is borrowing durability to fake it, and `acks=all` producers are about to start failing. KafkaUnderReplicatedPartitions fires above zero for 5 minutes. The zero fallback is anchored to the brokers' own leader count, because on this panel more than any other a green zero that means 'nothing is being scraped' would be read as 'the run is clean'.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "(sum(kafka_server_replicamanager_underreplicatedpartitions{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\"})) or (sum(kafka_server_replicamanager_leadercount{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\"}) * 0)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Under-replicated partitions",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The fraction of the last five minutes the request handler threads were idle, averaged over the brokers. This is the headroom number: it is what says whether a run that hit its target throughput did so with room to spare or at the ceiling. Below 0.30 is KafkaRequestHandlerSaturated. The Broker internals section explains why it is a windowed rate over a `_count_total` of NANOSECONDS rather than the `_percent` gauge.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 2,
              "mappings": [
                {
                  "options": {
                    "match": "null",
                    "result": {
                      "color": "text",
                      "index": 0,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.3
                  },
                  {
                    "color": "green",
                    "value": 0.6
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "id": 6,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "avg(rate(kafka_server_kafkarequesthandlerpool_requesthandleravgidlepercent_count_total{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\"}[5m])) / 1e9",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Request handler idle",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "id": 7,
          "panels": [],
          "title": "Throughput",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Ingest per broker. Under a steady producer load the lines should sit on top of each other; a broker consistently above the others is holding more of the leadership, which 'Leader count per broker' in the Replication section confirms, and a broker consistently below is one the producers are not reaching \u2014 a partition assignment that is not spread, or a client pinned to a subset of the brokers. Corrected series: `\u2026_bytesin_total`, a `PerSec` meter published as a counter, so `rate()`.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "Bps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "id": 8,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (kubernetes_pod_name) (rate(kafka_server_brokertopicmetrics_bytesin_total{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\", topic=\"\"}[5m]))",
              "legendFormat": "{{kubernetes_pod_name}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Bytes in /s per broker",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Egress to clients per broker, excluding replication. Fetches are served by the leader, so this follows leadership the same way ingest does \u2014 and a consumer group that has just rebalanced will visibly move the load from one broker to another. A broker whose egress collapses while its ingest holds is one whose consumers have stopped fetching from it, which during a test usually means the consumer side of the harness is the bottleneck, not the cluster.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "Bps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "id": 9,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (kubernetes_pod_name) (rate(kafka_server_brokertopicmetrics_bytesout_total{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\", topic=\"\"}[5m]))",
              "legendFormat": "{{kubernetes_pod_name}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Bytes out /s per broker",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Records per second per broker. It diverges from the byte panel whenever record sizes are uneven across partitions, which is what a keyed producer with a skewed key distribution does: one broker takes most of the messages while the byte rates look balanced, or the reverse. When the two panels disagree, the partitioning is the thing to look at.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "id": 10,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (kubernetes_pod_name) (rate(kafka_server_brokertopicmetrics_messagesin_total{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\", topic=\"\"}[5m]))",
              "legendFormat": "{{kubernetes_pod_name}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Messages in /s per broker",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The two totals on one plot \u2014 the single line a load test is reported against. The shape matters as much as the height: a flat ceiling is a limit somewhere (the Broker internals section says whether it is the brokers), a sawtooth is a producer backing off and recovering, and a slow decline over a long run is usually the log growing past the page cache so that fetches start reaching the disk.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "Bps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "id": 11,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "label_replace(sum(rate(kafka_server_brokertopicmetrics_bytesin_total{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\", topic=\"\"}[5m])), \"kind\", \"in\", \"\", \"\") or label_replace(sum(rate(kafka_server_brokertopicmetrics_bytesout_total{namespace=\"$namespace\", strimzi_io_cluster=\"$cluster\", strimzi_io_name=\"$cluster-kafka\", topic=\"\"}[5m])), \"kind\", \"out\", \"\", \"\")",
              "legendFormat": "{{kind}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Cluster throughput, in and out",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Ingest and egress summed per availability zone. The `zone` label reaches the series for the first time in this refactor \u2014 the node pools have always set the pod label and `kafka-common.strimziRelabelings` only carried `strimzi_io_*`, which is why every legacy legend that said `({{zone}})` rendered as `()`. On a three-AZ cluster the three ingest lines should match; egress skewed towards one zone is consumers reading across a zone boundary, which costs real money on a managed cloud and shows up in a bill long before it shows up in a latency graph. A cluster whose pods carry no `zone` label draws one unlabelled line.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "Bps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 21
          },
          "id": 12,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
