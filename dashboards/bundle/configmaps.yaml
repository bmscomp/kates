            "options": [],
            "query": {
              "query": "label_values(kafka_controller_kafkacontroller_activecontrollercount, namespace)",
              "refId": "namespace-variable-query"
            },
            "refresh": 2,
            "sort": 1,
            "type": "query"
          },
          {
            "current": {},
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(kafka_controller_kafkacontroller_activecontrollercount{namespace=\"$namespace\"}, strimzi_io_cluster)",
            "hide": 0,
            "includeAll": false,
            "label": "Kafka cluster",
            "multi": false,
            "name": "cluster",
            "options": [],
            "query": {
              "query": "label_values(kafka_controller_kafkacontroller_activecontrollercount{namespace=\"$namespace\"}, strimzi_io_cluster)",
              "refId": "cluster-variable-query"
            },
            "refresh": 2,
            "sort": 1,
