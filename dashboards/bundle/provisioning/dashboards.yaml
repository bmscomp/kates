# Grafana dashboard provider for the Kates boards
#
# GENERATED by scripts/gen-dashboards.py from dashboards/<board>/dashboard.json.
# Do not edit: `scripts/gen-dashboards.py --check` fails when this file has drifted, and
# the next regeneration overwrites it. Edit the board's board.py.
#
# Mount the directory holding THIS file at /etc/grafana/provisioning/dashboards
# and Grafana loads every board in kates/ at boot.
#
# `allowUiUpdates: false` is deliberate: these boards are generated, so
# an edit in the UI is lost at the next restart either way. Saying so
# here makes Grafana show the board as provisioned and refuse the save,
# which is a better answer than accepting it and dropping it later.
apiVersion: 1
providers:
  - name: kates
    orgId: 1
    folder: Kates
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/kates
      foldersFromFilesStructure: false
